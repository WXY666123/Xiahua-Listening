"level":0},{"text":"The exact date can only be booked 3. _______","list":true,"level":0},{"text":"The balloon can fly a maximum height of 4. _______ metres","list":true,"level":0},{"text":"There are no flights at 5. _______","list":true,"level":0},{"text":"The best time of year to go is in 6. _______","list":true,"level":0},{"text":"Flights may be cancelled because of bad weather, e.g. 7. _______","list":true,"level":0},{"text":"It is advised to wear a jacket and a 8. _______","list":true,"level":0},{"text":"There is no 9. _______ restriction for adults","list":true,"level":0},{"text":"Participants must be able to 10. _______ throughout the flight","list":true,"level":0}]}],"answerKey":{"text":{"q1":"125","q2":"certificate","q3":"online","q4":"1800/1,800","q5":"night","q6":"autumn","q7":"thunderstorm","q8":"helmet","q9":"age","q10":"stand"},"single":{},"multiple":{},"multipleMap":{},"matching":{},"map":{}},"transcriptLines":[{"time":"00:00:00,000 --> 00:00:10,480","html":"[Narrator]:Test 3.","cn":"[旁白]:测试3。","analysis":""},{"time":"00:00:10,480 --> 00:00:14,240","html":"This is the IELTS listening test.","cn":"这是雅思听力考试。","analysis":""},{"time":"00:00:14,240 --> 00:00:20,200","html":"You will hear a number of different recordings, and you will have to answer questions on what","cn":"你将听到几段不同的录音，你需要回答关于你所听到的内容的问题。","analysis":""},{"time":"00:00:20,200 --> 00:00:21,600","html":"you hear.","cn":"内容的问题。","analysis":""},{"time":"00:00:21,600 --> 00:00:27,680","html":"There will be time for you to read the instructions and questions, and you will have a chance to","cn":"你将有时间阅读说明和问题，并且你将有机会","analysis":""},{"time":"00:00:27,680 --> 00:00:29,680","html":"check your work.","cn":"检查你的答案。","analysis":""},{"time":"00:00:29,680 --> 00:00:33,360","html":"All the recordings will be played once only.","cn":"所有录音都只播放一次。","analysis":""},{"time":"00:00:33,360 --> 00:00:36,120","html":"The test is in four parts.","cn":"考试分为四个部分。","analysis":""},{"time":"00:00:36,120 --> 00:00:42,320","html":"At the end of the test, you will be given 10 minutes to transfer your answers to the","cn":"考试结束时，你将有10分钟的时间将答案转写到","analysis":""},{"time":"00:00:42,320 --> 00:00:44,080","html":"answer sheet.","cn":"答题卡上。","analysis":""},{"time":"00:00:44,080 --> 00:00:51,120","html":"Now turn to Part 1.","cn":"现在请翻到第一部分。","analysis":""},{"time":"00:00:51,120 --> 00:00:52,920","html":"Part 1.","cn":"第一部分。","analysis":""},{"time":"00:00:52,920 --> 00:00:59,560","html":"You will hear a woman phoning a travel agency about hot air balloon rides.","cn":"你将听到一位女士打电话给旅行社询问热气球旅行。","analysis":""},{"time":"00:00:59,560 --> 00:01:03,880","html":"First you have some time to look at questions 1 to 5.","cn":"首先，你将有一些时间查看问题1到5。","analysis":""},{"time":"00:01:29,560 --> 00:01:41,400","html":"Now listen carefully, and answer questions 1 to 5.","cn":"现在请仔细听，并回答问题1到5。","analysis":""},{"time":"00:01:41,400 --> 00:01:45,000","html":"[Jason]: Good morning, smart travel, Jason speaking.","cn":"[杰森]:早上好，智行旅行社，我是杰森。","analysis":""},{"time":"00:01:45,000 --> 00:01:46,680","html":"[Woman]: Hi, good morning.","cn":"[女士]:嗨，早上好。","analysis":""},{"time":"00:01:46,680 --> 00:01:52,000","html":"I saw your advert in today's paper about hot air balloon trips.","cn":"我看到了你们今天报纸上关于热气球旅行的广告。","analysis":""},{"time":"00:01:52,000 --> 00:01:54,440","html":"It sounds pretty exciting.","cn":"听起来挺令人兴奋的。","analysis":""},{"time":"00:01:54,440 --> 00:01:56,840","html":"And I wonder how much it costs.","cn":"我想知道费用是多少。","analysis":""},{"time":"00:01:56,840 --> 00:02:03,640","html":"[Jason]: Well, the price may vary depending on the location, number of participants, and add-ons.","cn":"[杰森]:嗯，价格可能因地点、参与人数和附加服务而异。","analysis":""},{"time":"00:02:03,640 --> 00:02:09,200","html":"A single ride may cost you <mark style=\"background-color: #fecaca;\">up to £280 per person<\/mark>.","cn":"单次乘坐可能每人花费<mark style=\"background-color: #fecaca;\">高达280英镑<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题1询问最低价格。这里的280英镑是单次乘坐的最高价格，是干扰项。"},{"time":"00:02:09,200 --> 00:02:12,600","html":"But if you choose group booking, there is a discount.","cn":"但如果您选择团体预订，会有折扣。","analysis":""},{"time":"00:02:12,600 --> 00:02:19,440","html":"And the <mark style=\"background-color: #bbf7d0;\">cheapest flight is £125 each<\/mark>, for a group booking of at least 10 people.","cn":"而<mark style=\"background-color: #bbf7d0;\">最便宜的航班是每人125英镑<\/mark>，适用于至少10人的团体预订。","analysis":"<strong>答案解析：<\/strong> 问题1的答案是“125”。原文明确指出“最便宜的航班是每人125英镑”，这与问题中“最低价格”相符。"},{"time":"00:02:19,440 --> 00:02:22,160","html":"[Woman]: Oh, that's not too bad.","cn":"[女士]:哦，那还不错。","analysis":""},{"time":"00:02:22,160 --> 00:02:24,840","html":"What do you mean by add-ons?","cn":"你说的附加服务是什么意思？","analysis":""},{"time":"00:02:24,840 --> 00:02:30,960","html":"[Jason]: They are optional items, like <mark style=\"background-color: #fecaca;\">taking photos for you during the ride, champagne, and sit<\/mark>","cn":"[杰森]:它们是可选项目，比如<mark style=\"background-color: #fecaca;\">飞行期间为您拍照、香槟以及坐下来<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题2询问免费赠送的物品。这里提到的拍照、香槟和早餐是可选的附加服务，并非免费赠送，是干扰项。"},{"time":"00:02:30,960 --> 00:02:33,760","html":"<mark style=\"background-color: #fecaca;\">down breakfast after the flight<\/mark>.","cn":"<mark style=\"background-color: #fecaca;\">的飞行后早餐<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题2询问免费赠送的物品。这里提到的拍照、香槟和早餐是可选的附加服务，并非免费赠送，是干扰项。"},{"time":"00:02:33,760 --> 00:02:39,240","html":"Upon completing the trip, we will provide each participant with a <mark style=\"background-color: #bbf7d0;\">certificate<\/mark>.","cn":"旅程结束后，我们将为每位参与者提供一份<mark style=\"background-color: #bbf7d0;\">证书<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题2的答案是“certificate”。原文提到“我们将为每位参与者提供一份证书”，并且紧接着说明“那是完全免费的”，这与问题中“免费”赠送的物品相符。"},{"time":"00:02:39,240 --> 00:02:42,000","html":"And that is entirely free of charge.","cn":"而且那是完全免费的。","analysis":""},{"time":"00:02:42,000 --> 00:02:44,320","html":"[Woman]: Can I book a ride over the phone?","cn":"[女士]:我可以电话预订吗？","analysis":""},{"time":"00:02:44,320 --> 00:02:47,160","html":"[Jason]: Yes, that's an option.","cn":"[杰森]:是的，那是一个选择。","analysis":""},{"time":"00:02:47,160 --> 00:02:51,440","html":"Reservations can be made one year ahead of your trip <mark style=\"background-color: #fecaca;\">by telephone<\/mark>.","cn":"行程前一年可以通过<mark style=\"background-color: #fecaca;\">电话<\/mark>进行预订。","analysis":"<strong>答案解析：<\/strong> 问题3询问如何预订具体日期。这里提到可以通过电话预订，但下一句明确指出“要选择具体日期，必须在线预订”，因此电话预订是干扰项，不适用于选择具体日期。"},{"time":"00:02:51,440 --> 00:02:55,040","html":"But to pick a specific date, you must book <mark style=\"background-color: #bbf7d0;\">online<\/mark>.","cn":"但要选择具体日期，您必须<mark style=\"background-color: #bbf7d0;\">在线<\/mark>预订。","analysis":"<strong>答案解析：<\/strong> 问题3的答案是“online”。原文明确指出“要选择具体日期，您必须在线预订”，这与问题中“只能通过______预订具体日期”相符。"},{"time":"00:02:55,040 --> 00:02:59,280","html":"A confirmation email will be sent to you right afterwards.","cn":"之后会立即向您发送一封确认邮件。","analysis":""},{"time":"00:02:59,280 --> 00:03:01,960","html":"[Woman]: How high can the balloons go?","cn":"[女士]:热气球能飞多高？","analysis":""},{"time":"00:03:01,960 --> 00:03:07,200","html":"[Jason]: A hot air balloon's height is limited by the temperature of the air, and how much fuel","cn":"[杰森]:热气球的高度受气温和燃料携带量的限制。","analysis":""},{"time":"00:03:07,200 --> 00:03:08,960","html":"it can carry.","cn":"限制。","analysis":""},{"time":"00:03:08,960 --> 00:03:15,040","html":"And the highest altitude ever recorded for a ride is <mark style=\"background-color: #bbf7d0;\">1,800 metres<\/mark>.","cn":"有记录的最高飞行高度是<mark style=\"background-color: #bbf7d0;\">1,800米<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题4的答案是“1800”。原文明确指出“有记录的最高飞行高度是1,800米”，这与问题中“热气球最高可飞______米”相符。"},{"time":"00:03:15,040 --> 00:03:18,240","html":"But most rides stay below <mark style=\"background-color: #fecaca;\">300 metres<\/mark>.","cn":"但大多数飞行都保持在<mark style=\"background-color: #fecaca;\">300米<\/mark>以下。","analysis":"<strong>答案解析：<\/strong> 问题4询问最高高度。这里的300米是大多数飞行的限制高度，并非最高高度，是干扰项。"},{"time":"00:03:18,240 --> 00:03:21,240","html":"[Woman]: Oh boy, that's impressive.","cn":"[女士]:哦，天哪，真令人印象深刻。","analysis":""},{"time":"00:03:21,600 --> 00:03:24,400","html":"How long is a single ride?","cn":"单次乘坐多长时间？","analysis":""},{"time":"00:03:24,400 --> 00:03:28,240","html":"[Jason]: The average hot air balloon ride lasts about an hour.","cn":"[杰森]:平均热气球飞行时间约为一小时。","analysis":""},{"time":"00:03:28,240 --> 00:03:34,080","html":"The entire ballooning experience, which includes ground preparation, flight and post-flight","cn":"整个热气球体验，包括地面准备、飞行和飞行后","analysis":""},{"time":"00:03:34,080 --> 00:03:39,280","html":"packing up and celebration, may take two to three hours.","cn":"收拾和庆祝，可能需要两到三个小时。","analysis":""},{"time":"00:03:39,280 --> 00:03:41,880","html":"[Woman]: And what time are the flights?","cn":"[女士]:飞行时间是什么时候？","analysis":""},{"time":"00:03:41,880 --> 00:03:46,600","html":"[Jason]: Our flights generally meet about an hour before sunrise on the day.","cn":"[杰森]:我们的航班通常在当天日出前一小时左右集合。","analysis":""},{"time":"00:03:46,600 --> 00:03:51,600","html":"You will be notified of the exact meeting time the evening before your flight.","cn":"您将在飞行前一晚收到确切的集合时间通知。","analysis":""},{"time":"00:03:51,600 --> 00:03:55,200","html":"<mark style=\"background-color: #bbf7d0;\">Night flights<\/mark> are avoided, due to weather conditions.","cn":"由于天气原因，会<mark style=\"background-color: #bbf7d0;\">避免夜间飞行<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题5的答案是“night”。原文明确指出“由于天气原因，会避免夜间飞行”，这与问题中“没有______的航班”相符。"},{"time":"00:03:55,200 --> 00:03:59,000","html":"[Woman]: Fair enough","cn":"[女士]:好吧。","analysis":""},{"time":"00:03:59,000 --> 00:04:05,800","html":"[Narrator]: Before you hear the rest of the conversation, you have some time to look at questions 6-10.","cn":"[旁白]:在听对话的其余部分之前，你将有一些时间查看问题6-10。","analysis":""},{"time":"00:04:46,800 --> 00:04:49,800","html":"And answer questions 6-10.","cn":"并回答问题6-10。","analysis":""},{"time":"00:04:52,600 --> 00:04:56,800","html":"[Woman]: Which month do you recommend for a hot air balloon trip?","cn":"[女士]:你推荐哪个月份进行热气球旅行？","analysis":""},{"time":"00:04:56,800 --> 00:05:00,200","html":"[Jason]: <mark style=\"background-color: #bbf7d0;\">Autumn<\/mark> is the best time of year to take the trip.","cn":"[杰森]:<mark style=\"background-color: #bbf7d0;\">秋季<\/mark>是进行这次旅行的最佳时节。","analysis":"<strong>答案解析：<\/strong> 问题6的答案是“autumn”。原文明确指出“秋季是进行这次旅行的最佳时节”，这与问题中“一年中最好的旅行时间是______”相符。"},{"time":"00:05:00,200 --> 00:05:05,600","html":"Not only can you see the changing hues of the trees from above, but it is a great way","cn":"你不仅可以从高空俯瞰树木变换的色彩，而且这也是一个很好的方式","analysis":""},{"time":"00:05:05,600 --> 00:05:10,200","html":"to spend time with the whole family before it gets too cold.","cn":"在天气变得太冷之前，与全家人共度时光。","analysis":""},{"time":"00:05:10,200 --> 00:05:11,600","html":"[Woman]: I see.","cn":"[女士]:我明白了。","analysis":""},{"time":"00:05:11,600 --> 00:05:18,000","html":"[Jason]: But please note that our flight may be cancelled, and you will be notified by phone the day before.","cn":"[杰森]:但请注意，我们的航班可能会被取消，您将在前一天通过电话收到通知。","analysis":""},{"time":"00:05:18,000 --> 00:05:19,600","html":"[Woman]: Why is that?","cn":"[女士]:为什么会这样？","analysis":""},{"time":"00:05:19,600 --> 00:05:25,200","html":"[Jason]: It can be quite dangerous to fly under bad weather conditions, like a <mark style=\"background-color: #bbf7d0;\">thunderstorm<\/mark>.","cn":"[杰森]:在恶劣天气条件下飞行会非常危险，比如<mark style=\"background-color: #bbf7d0;\">雷暴<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题7的答案是“thunderstorm”。原文明确指出“在恶劣天气条件下飞行会非常危险，比如雷暴”，这与问题中“航班可能因恶劣天气而取消，例如______”相符。"},{"time":"00:05:25,200 --> 00:05:29,800","html":"So our experienced pilots will not go under such conditions.","cn":"所以我们经验丰富的飞行员在这种情况下不会起飞。","analysis":""},{"time":"00:05:29,800 --> 00:05:32,600","html":"[Woman]: What should I wear for the ride?","cn":"[女士]:我应该穿什么去乘坐？","analysis":""},{"time":"00:05:32,600 --> 00:05:36,600","html":"[Jason]: We suggest wearing comfortable clothing, like a <mark style=\"background-color: #fecaca;\">jacket<\/mark>.","cn":"[杰森]:我们建议穿舒适的衣服，比如<mark style=\"background-color: #fecaca;\">夹克<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题8询问除了夹克之外建议穿戴的物品。这里提到了夹克，但问题中已包含“a jacket”，所以这不是填空所需的答案，而是问题提示的一部分，因此是干扰项。"},{"time":"00:05:36,600 --> 00:05:39,600","html":"Multiple layers are always better.","cn":"多层穿着总是更好。","analysis":""},{"time":"00:05:39,600 --> 00:05:44,000","html":"Wearing a <mark style=\"background-color: #bbf7d0;\">helmet<\/mark> for safety concerns is also a good idea.","cn":"出于安全考虑，戴<mark style=\"background-color: #bbf7d0;\">头盔<\/mark>也是个好主意。","analysis":"<strong>答案解析：<\/strong> 问题8的答案是“helmet”。原文提到“建议穿着舒适的衣服，比如夹克”，接着说“出于安全考虑，戴头盔也是个好主意”，这与问题中“建议穿夹克和______”相符。"},{"time":"00:05:44,000 --> 00:05:46,200","html":"<mark style=\"background-color: #fecaca;\">Sandals are not permitted<\/mark>.","cn":"<mark style=\"background-color: #fecaca;\">不允许穿凉鞋<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题8询问建议穿戴的物品。这里提到凉鞋不被允许，这与问题中的建议穿着无关，因此是干扰项。"},{"time":"00:05:46,200 --> 00:05:50,400","html":"[Woman]: Can children or older people participate?","cn":"[女士]:儿童或老年人可以参加吗？","analysis":""},{"time":"00:05:50,400 --> 00:05:55,000","html":"[Jason]: All children must be above the <mark style=\"background-color: #fecaca;\">minimum age of 9 years old<\/mark>.","cn":"[杰森]:所有儿童必须年满<mark style=\"background-color: #fecaca;\">9岁以上<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题9询问成人没有何种限制。这里提到了儿童有9岁的最低年龄限制，这与成人无关，因此是干扰项。"},{"time":"00:05:55,000 --> 00:05:59,800","html":"And they have to be accompanied by at least a parent or guardian.","cn":"并且必须至少由一位家长或监护人陪同。","analysis":""},{"time":"00:05:59,800 --> 00:06:05,400","html":"However, an adult has no <mark style=\"background-color: #bbf7d0;\">age limit<\/mark>, as long as they meet the health requirements.","cn":"然而，成年人没有<mark style=\"background-color: #bbf7d0;\">年龄限制<\/mark>，只要他们符合健康要求。","analysis":"<strong>答案解析：<\/strong> 问题9的答案是“age”。原文明确指出“成年人没有年龄限制”，这与问题中“成年人没有______限制”相符。"},{"time":"00:06:05,400 --> 00:06:09,200","html":"[Woman]: What exactly are the health requirements?","cn":"[女士]:具体的健康要求是什么？","analysis":""},{"time":"00:06:09,200 --> 00:06:13,200","html":"[Jason]: Participants must at least be in fair physical condition.","cn":"[杰森]:参与者必须至少身体状况良好。","analysis":""},{"time":"00:06:13,200 --> 00:06:21,800","html":"For example, they shall have no significant knee, hip or back problems, and no recent surgeries or broken bones.","cn":"例如，他们不应有严重的膝盖、臀部或背部问题，也没有近期手术或骨折。","analysis":""},{"time":"00:06:21,800 --> 00:06:26,200","html":"They must also <mark style=\"background-color: #bbf7d0;\">stand unassisted for an hour during the flight<\/mark>.","cn":"他们还必须在飞行期间能够<mark style=\"background-color: #bbf7d0;\">独自站立一小时<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题10的答案是“stand”。原文明确指出“他们还必须在飞行期间能够独自站立一小时”，这与问题中“参与者必须能够在整个飞行过程中______”相符。"},{"time":"00:06:26,200 --> 00:06:29,800","html":"It is the required position during the whole flight.","cn":"这是整个飞行过程中所需姿势。","analysis":""},{"time":"00:06:29,800 --> 00:06:37,800","html":"As the balloon comes to land, all passengers will need to adopt the landing position, with <mark style=\"background-color: #fecaca;\">knees bent in front of them<\/mark>.","cn":"当热气球着陆时，所有乘客都需要采取着陆姿势，<mark style=\"background-color: #fecaca;\">双膝弯曲在身体前方<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题10询问飞行过程中需要做什么。这里描述的是着陆姿势，而不是整个飞行过程中的姿势，因此是干扰项。"},{"time":"00:06:37,800 --> 00:06:40,200","html":"[Woman]: Are those rides safe?","cn":"[女士]:这些飞行安全吗？","analysis":""},{"time":"00:06:40,200 --> 00:06:45,600","html":"[Jason]: Hot air balloon companies are required to have a commercial balloon pilot license,","cn":"[杰森]:热气球公司必须持有商业热气球飞行员执照，","analysis":""},{"time":"00:06:45,600 --> 00:06:51,200","html":"and all our pilots go through rigorous training before they are allowed to fly.","cn":"我们所有的飞行员都经过严格培训才能获准飞行。","analysis":""},{"time":"00:06:51,200 --> 00:06:54,400","html":"It is a relatively gentle activity.","cn":"这是一项相对温和的活动。","analysis":""},{"time":"00:06:54,400 --> 00:07:02,400","html":"However, the impact of a balloon landing can vary drastically, depending on factors like wind speed.","cn":"然而，热气球着陆的冲击力可能会因风速等因素而差异很大。","analysis":""},{"time":"00:07:02,400 --> 00:07:07,000","html":"Sometimes it is similar to the momentum of jumping off a small chair.","cn":"有时它类似于从一把小椅子上跳下的动量。","analysis":""},{"time":"00:07:07,000 --> 00:07:14,000","html":"If you cannot jump off a small chair, speaking to your doctor before booking a balloon flight is best.","cn":"如果您不能从一把小椅子上跳下，最好在预订热气球飞行前咨询您的医生。","analysis":""},{"time":"00:07:14,000 --> 00:07:18,000","html":"[Woman]: Thank you very much. I think that's all I need to know.","cn":"[女士]:非常感谢。我想我需要知道的就这些了。","analysis":""},{"time":"00:07:18,000 --> 00:07:23,000","html":"[Jason]: Thanks for calling. Goodbye.","cn":"[杰森]:感谢您的来电。再见。","analysis":""},{"time":"00:07:23,000 --> 00:07:31,000","html":"[Narrator]: That is the end of part 1. You now have half a minute to check your answers to part 1.","cn":"[旁白]:第一部分到此结束。你现在有半分钟的时间检查你第一部分的答案。","analysis":""},{"time":"00:07:37,000 --> 00:07:40,000","html":"You","cn":"你","analysis":""},{"time":"00:08:07,000 --> 00:08:10,000","html":"You","cn":"你","analysis":""}],"transcriptHighlights":[{"qid":"1","text":"125","answer":"125"},{"qid":"2","text":"certificate","answer":"certificate"},{"qid":"3","text":"online","answer":"online"},{"qid":"4","text":"1800","answer":"1800/1,800"},{"qid":"4","text":"1,800","answer":"1800/1,800"},{"qid":"5","text":"night","answer":"night"},{"qid":"6","text":"autumn","answer":"autumn"},{"qid":"7","text":"thunderstorm","answer":"thunderstorm"},{"qid":"8","text":"helmet","answer":"helmet"},{"qid":"9","text":"age","answer":"age"},{"qid":"10","text":"stand","answer":"stand"}],"ownerInfo":"此内容由🍠@Listening 永不虾滑整理，仅作为分享供个人使用；禁止商用、倒卖和引流。有问题请先仔细看🍠这个账号的置顶和分享贴。没有团队，不是机构，纯个人分享。督学和其他相关课程请咨询主页另一个号@心情有点虾滑（不回任何机经相关消息）。"}</script>
<script>
const DATA=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const RENDER_VERSION=2;
let secs=0,review=false,timer=setInterval(()=>{secs++;drawTimer();if(secs%5===0)save(false)},1000),drag=null,currentCue=-1,loopCue=false,slowCue=false,showCn=true,showAnalysis=true,dictationMode=false,showOriginal=true,dictationAnswers={};const storeKey='ielts_v4_'+DATA.title.replace(/\W+/g,'_');
const CONFIG_DATA={answerKey:DATA.answerKey,questionList:DATA.questionIds.map(q=>Number(q)||q),localStorageKey:storeKey};window.localStorageKey=storeKey;window.DATA=DATA;window.CONFIG_DATA=CONFIG_DATA;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function matchingRepeatAttr(g){return (g.questions||[]).length>(g.options||[]).length?' data-repeat="true"':''}
function groupHTML(g){if(g.type==='matching'&&g.layout==='flow')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="flow-layout"><div class="flow-steps">${g.questions.map((q,idx)=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>${idx<g.questions.length-1?'<div class="flow-arrow">↓</div>':''}`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='matching')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='map')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'map.png')}" alt="Map"></div><div class="map-grid"><div class="map-answer-list">${g.questions.map(q=>`<div class="map-row"><div class="map-row-label"><strong>${q[0]}</strong> ${esc(q[1]||'')}</div><div class="map-options">${(g.options||['A','B','C','D','E','F','G','H','I']).map(o=>`<div class="choice map-choice" data-name="q${q[0]}" data-value="${o}">${o}</div>`).join('')}</div></div>`).join('')}</div></div></div></section>`;
if(g.type==='single')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div>${g.questions.map(q=>`<p><strong>${q.id}</strong> ${esc(q.text)}</p>${q.options.map(o=>`<div class="choice single-choice" data-name="q${q.id}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}`).join('')}</section>`;
if(g.type==='multiple')return `<section class="group" data-limit="${g.limit}" data-id="${g.id}"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><p><strong>${esc(g.id)}</strong> ${esc(g.questionText)}</p>${g.options.map(o=>`<div class="choice multi-choice" data-name="q${g.id.replace('-','_')}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</section>`;
return `<section class="group"><h3>${esc(g.title)}</h3>${renderFillGroup(g)}</section>`}
function renderFillGroup(g){let qids=(g.questions||[]).map(q=>String(q.id));let used=new Set();let lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:g.questions.map(q=>`${q.id} ${q.text} _____`));let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFillTable(chunk,qids,used);continue}html+=renderFillLine(lines[i++],qids,used)}return html||`<div class="instruction">${esc(g.instruction||'Complete the notes below.')}</div>`}
function renderFillTable(lines,qids,used){let rows=[];lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0;if(!rows[row])rows[row]=[];rows[row][col]=renderFillLine(line,qids,used,true)});return `<div class="fill-table-wrap"><table class="fill-table">${rows.map((cells,idx)=>`<tr>${(cells||[]).map(cell=>idx===0?`<th>${cell}</th>`:`<td>${cell}</td>`).join('')}</tr>`).join('')}</table></div>`}
function fillInput(qid,lead=''){return `<span class="blank-q">${esc(qid)}</span>${esc(lead)}<input class="blank" name="q${esc(qid)}" type="text" autocomplete="off" inputmode="text">`}
function fillLineAttrs(meta,isHeading){let cls=['doc-line'];if(isHeading)cls.push('fill-heading');if(meta.list)cls.push('is-list');let level=Math.max(0,Math.min(6,Number(meta.level)||0));let style=meta.list?` style="--indent:${level*22}px"`:'';return `class="${cls.join(' ')}"${style}`}
function fillLineContent(meta,body){return meta.list?`<span class="doc-bullet">•</span><span class="doc-line-content">${body}</span>`:body}
function isFillHeading(raw,meta,hit){return !hit&&!meta.list&&!/(?:_{2,}|…{2,}|\.{4,})/.test(raw)&&!/^\d+\.?\s+/.test(raw)&&!/^(?:Complete|Write|Choose)\b/i.test(raw)}
function renderFillLine(line,qids,used,inner=false){let meta=typeof line==='object'&&line?line:{},raw=String(meta.text??line),html=esc(raw),hit=false;html=html.replace(/(^|[^\d])(\d{1,2})\.?\s*((?:£\s*)?)(?:_{2,}|…{2,}|\.{4,})/g,(m,prefix,qid,lead)=>{if(!qids.includes(qid))return m;used.add(qid);hit=true;return prefix+fillInput(qid,lead)});let m=raw.match(/^(\d+)\.?\s+(.+)$/);if(!hit&&m&&qids.includes(m[1])){used.add(m[1]);let body=esc(m[2]);let input=fillInput(m[1]);body=/(?:_+|…{2,}|\.{4,})/.test(body)?body.replace(/(?:_+|…{2,}|\.{4,})/,input):`${body} ${input}`;return inner?fillLineContent(meta,body):`<p ${fillLineAttrs(meta,false)}>${fillLineContent(meta,body)}</p>`}return inner?html:`<p ${fillLineAttrs(meta,isFillHeading(raw,meta,hit))}>${fillLineContent(meta,html)}</p>`}
function hardResetAnswers(){$$('input').forEach(i=>{i.value='';i.defaultValue=''});$$('.choice').forEach(c=>c.classList.remove('selected'));$$('.slot').forEach(s=>s.innerHTML='');refreshPool();updateNav()}
function render(){document.title=DATA.title;$('#ownerMeta').textContent=DATA.ownerInfo||'';$('#audio').src=DATA.audio||'audio.mp3';$('#content').innerHTML=DATA.groups.map(groupHTML).join('');$('#nav').innerHTML=DATA.questionIds.map(q=>`<div data-q="${q}">${q}</div>`).join('');bindDynamic();hardResetAnswers();load();updateNav()}
function bindDynamic(){
  $$('#content input').forEach(i=>{i.oninput=()=>{updateNav();save(false)};i.onchange=()=>{updateNav();save(false)}});
  $$('.single-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;$$(`.single-choice[data-name="${btn.dataset.name}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateNav();save(false)});
  $$('.map-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;$$(`.map-choice[data-name="${btn.dataset.name}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateNav();save(false)});
  $$('.multi-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;let group=btn.closest('.group'),limit=Number(group?.dataset.limit||99),name=btn.dataset.name,selected=$$(`.multi-choice[data-name="${name}"].selected`);if(!btn.classList.contains('selected')&&selected.length>=limit)return;btn.classList.toggle('selected');updateNav();save(false)});
  $$('#nav [data-q]').forEach(n=>n.onclick=()=>scrollToQuestion(n.dataset.q));
}
function bindGlobal(){
  document.addEventListener('dragstart',e=>{let d=e.target.closest('.drag,.tag');if(!d||review)return;drag={value:d.dataset.value,text:d.textContent,from:d.closest('.slot')};});
  document.addEventListener('dragover',e=>{if(e.target.closest('.slot,.pool'))e.preventDefault()});
  document.addEventListener('drop',e=>{let slot=e.target.closest('.slot'),pool=e.target.closest('.pool');if(!drag||review)return;e.preventDefault();if(pool&&drag.from){drag.from.innerHTML='';refreshPool();updateNav();save(false);return}if(slot){if(drag.from)drag.from.innerHTML='';slot.innerHTML=`<span class="tag" draggable="true" data-value="${drag.value}">${esc(drag.text)}</span>`;refreshPool();updateNav();save(false)}});
  document.addEventListener('mouseup',handleSelection);
  $('#selbar').onclick=handleToolbar;
}
function scrollToQuestion(q){let first=q.split('-')[0];let target=$(`input[name="q${first}"], .slot[data-q="${first}"], .choice[data-name="q${first}"]`)||$(`input[name="q${q.replace('-','_')}"]`);target?.closest('.group')?.scrollIntoView({behavior:'smooth',block:'center'});}
function refreshPool(){$$('.group').forEach(g=>{let slots=[...g.querySelectorAll('.slot')],drags=[...g.querySelectorAll('.drag')],repeat=g.dataset.repeat==='true'||slots.length>drags.length,used=new Set(slots.map(s=>s.querySelector('.tag')?.dataset.value).filter(Boolean));drags.forEach(d=>d.classList.toggle('hidden',!repeat&&used.has(d.dataset.value)))})}
function restoreDragging(){drag=null;$$('.drag,.tag').forEach(d=>d.draggable=!review)}
function multipleGroupFor(q){let n=Number(q);return DATA.groups.find(g=>{if(g.type!=='multiple')return false;let [a,b]=g.id.split('-').map(Number);return n>=a&&n<=b})}
function multipleNameFor(q){let g=multipleGroupFor(q);return g?'q'+g.id.replace('-','_'):null}
function answered(q){let mn=multipleNameFor(q);if(mn)return $$(`.multi-choice[data-name="${mn}"].selected`).length>0;return !!($(`input[name="q${q}"]`)?.value?.trim()||$(`.single-choice[data-name="q${q}"].selected`)||$(`.map-choice[data-name="q${q}"].selected`)||$(`.slot[data-q="${q}"] .tag`))}
function updateNav(){DATA.questionIds.forEach(q=>{$(`#nav [data-q="${q}"]`)?.classList.toggle('answered',answered(q))})}
function getAnswer(q){let mn=multipleNameFor(q);if(mn){let g=multipleGroupFor(q),ids=rangeIds(g.id),checked=$$(`.multi-choice[data-name="${mn}"].selected`).map(i=>i.dataset.value).sort(),idx=ids.indexOf(String(q));return checked[idx]||''}return $(`input[name="q${q}"]`)?.value||$(`.single-choice[data-name="q${q}"].selected`)?.dataset.value||$(`.map-choice[data-name="q${q}"].selected`)?.dataset.value||$(`.slot[data-q="${q}"] .tag`)?.dataset.value||''}
function correctAnswer(q){return DATA.answerKey.multipleMap?.['q'+q]||DATA.answerKey.text['q'+q]||DATA.answerKey.single['q'+q]||DATA.answerKey.map?.['q'+q]||DATA.answerKey.matching['q'+q]||''}
function norm(s){return String(s).trim().toLowerCase()}function answerVariants(s){return String(s||'').split(/\s*\/\s*/).map(x=>x.trim()).filter(Boolean)}function rangeIds(id){let [a,b]=id.split('-').map(Number),out=[];for(let n=a;n<=b;n++)out.push(String(n));return out}function isCorrect(q){let user=norm(getAnswer(q));return answerVariants(correctAnswer(q)).some(ans=>user===norm(ans))}
function optionTextForQuestion(q){let ans=String(correctAnswer(q)||'');for(let g of DATA.groups||[]){if((g.type==='single'||g.type==='map')&&g.questions){let item=g.questions.find(x=>String(x.id||x[0])===String(q));if(item&&g.type==='single'){let opt=(item.options||[]).find(o=>o[0]===ans);return opt?opt[1]:''}if(item&&g.type==='map')return item[1]||''}if(g.type==='multiple'){let ids=rangeIds(g.id);if(ids.includes(String(q))){let opt=(g.options||[]).find(o=>o[0]===ans);return opt?opt[1]:''}}if(g.type==='matching'){let opt=(g.options||[]).find(o=>o[0]===ans);return opt?opt[1]:''}}return ''}
function keywordScoreForQuestion(q,html){let text=String(html||'').replace(/<[^>]+>/g,' ').toLowerCase(),source=String(optionTextForQuestion(q)||correctAnswer(q)||'').toLowerCase();let words=source.split(/[^a-z0-9]+/).filter(w=>w.length>=4&&!/^(which|about|their|there|with|from|this|that|will|they|more|less)$/i.test(w));let score=0;for(let w of words){if(text.includes(w))score+=15}return score}
function answerRevealCell(q){return `<div class="answer-cell"><span class="answer-value is-hidden" data-answer="${esc(correctAnswer(q))}">Hidden</span><button class="answer-toggle" type="button">查看答案</button></div>`}
function resultStatusCell(q,ok){return `<div class="result-wrap"><span>${ok?"√ Correct":"× Incorrect"}</span><button class="analysis-jump" type="button" data-q="${q}">查看解析</button></div>`}
function resultRows(){return DATA.questionIds.map(q=>{let ok=isCorrect(q);return `<tr><td>${q}</td><td>${esc(getAnswer(q))||"--"}</td><td>${answerRevealCell(q)}</td><td class="${ok?"result-correct":"result-incorrect"}">${resultStatusCell(q,ok)}</td></tr>`}).join("")}
function generateResultsTable(){return `<table class="review-table results-table"><thead><tr><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th></tr></thead><tbody>${resultRows()}</tbody></table>`}
function renderReviewTable(){return `<section class="group review"><div class="review-head"><h3>Answer Review</h3><button class="show-all-answers" type="button">一键显示答案</button></div>${generateResultsTable()}</section>`}
function setAnswerVisible(btn,visible){let cell=btn.closest(".answer-cell"),value=cell?.querySelector(".answer-value");if(!value)return;value.textContent=visible?(value.dataset.answer||""):"Hidden";value.classList.toggle("is-hidden",!visible);btn.textContent=visible?"隐藏答案":"查看答案";btn.dataset.visible=visible?"1":"0"}

const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
