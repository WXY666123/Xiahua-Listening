<style>

.content{padding:20px 28px 92px}.group{border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:20px 22px;margin:0 0 24px}.group h3{margin:0 0 10px;font-size:18px}.instruction{border-left:4px solid var(--accent);background:var(--bg);padding:9px 12px;margin:12px 0 18px;color:var(--muted)}
label{display:block;margin:9px 0}.blank{width:min(170px,48vw);border:0;border-bottom:2px solid #94a3b8;border-radius:0;padding:4px 8px;background:transparent;color:var(--text);font:inherit;line-height:1.4;vertical-align:baseline}.blank:focus{outline:2px solid rgba(37,99,235,.18);border-bottom-color:var(--accent)}.blank-q{font-weight:700;margin-right:6px}.fill-heading{font-weight:700;margin:18px 0 8px}.choice{display:block;margin:8px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);padding:9px 12px;cursor:pointer;user-select:text}.choice.selected{background:#dbeafe;border-color:#60a5fa;color:#1e40af;font-weight:700}.doc-line{line-height:1.75;margin:10px 0}.doc-line.is-list{display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:8px;align-items:baseline;margin:7px 0 7px calc(24px + var(--indent,0px))}.doc-bullet{font-weight:900;color:var(--text);line-height:1}.doc-line-content{min-width:0}
.matching{display:grid;grid-template-columns:minmax(300px,1fr) minmax(220px,.45fr);gap:clamp(12px,2.2vw,24px);align-items:start;max-width:1040px}.match-row{display:grid;grid-template-columns:42px minmax(150px,340px) auto;gap:10px;align-items:center;width:min(100%,520px);margin:12px 0}.slot{min-width:86px;max-width:min(260px,42vw);min-height:38px;border:2px dashed #94a3b8;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;justify-self:start;padding:5px 8px;background:var(--bg);overflow-wrap:anywhere}.flow-layout{display:grid;grid-template-columns:minmax(320px,1fr) minmax(220px,.42fr);gap:clamp(12px,2.2vw,24px);align-items:start;max-width:1040px}.flow-steps{display:flex;flex-direction:column;gap:8px}.flow-step{display:grid;grid-template-columns:42px minmax(280px,520px) auto;gap:12px;align-items:center;width:min(100%,740px);border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:10px}.flow-num{font-weight:800;color:var(--accent)}.flow-text{line-height:1.55;min-width:0}.flow-arrow{width:min(100%,740px);color:var(--muted);font-weight:800;text-align:center}
.map-layout{display:grid;grid-template-columns:minmax(320px,min(58%,720px)) minmax(280px,1fr);gap:18px;align-items:start}.map-image{min-width:0}.map-image img{display:block;width:100%;height:auto;max-height:calc(100vh - 260px);object-fit:contain;border:1px solid var(--border);border-radius:8px;background:var(--bg)}.map-grid{min-width:0}.map-answer-list{display:flex;flex-direction:column;gap:10px}.map-row{display:grid;grid-template-columns:minmax(90px,.8fr) minmax(0,1.5fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}.map-row-label{font-size:14px}.map-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(34px,1fr));gap:6px}.map-choice{margin:0;padding:7px 0;text-align:center;border-radius:6px;font-weight:700}
.fill-table-wrap{overflow:auto;margin:12px 0 18px}.fill-table{width:100%;border-collapse:collapse;min-width:680px}.fill-table th,.fill-table td{border:1px solid var(--border);padding:10px 12px;vertical-align:top;line-height:1.45}.fill-table th{background:var(--bg);font-weight:800;text-align:left}.fill-table .doc-line{margin:0}.fill-table .blank{width:min(150px,100%)}

tml":"First you have some time to look at questions one to five.","cn":"首先，你将有一些时间查看问题一到五。","analysis":""},{"time":"00:01:22,440 --> 00:01:45,400","html":"Now listen carefully and answer questions one to five.","cn":"现在请仔细听并回答问题一到五。","analysis":""},{"time":"00:01:45,400 --> 00:01:48,120","html":"[Park Ranger]: Almond Valley Poppy Reserve may help you.","cn":"【公园管理员】：杏仁谷罂粟保护区，很高兴为您服务。","analysis":""},{"time":"00:01:48,120 --> 00:01:50,480","html":"[Woman]: Is the nature reserve open now?","cn":"【女士】：自然保护区现在开放吗？","analysis":""},{"time":"00:01:50,480 --> 00:01:55,960","html":"[Park Ranger]: Yes, we are actually open all year, although this is the best time of year to see the wild","cn":"【公园管理员】：是的，我们实际上全年开放，尽管现在是观赏野花的最佳时节。","analysis":""},{"time":"00:01:55,960 --> 00:01:56,960","html":"flowers.","cn":"野花。","analysis":""},{"time":"00:01:56,960 --> 00:01:59,120","html":"[Woman]: Are the poppies blooming yet?","cn":"【女士】：罂粟花开了吗？","analysis":""},{"time":"00:01:59,120 --> 00:02:00,120","html":"[Park Ranger]: Absolutely.","cn":"【公园管理员】：当然。","analysis":""},{"time":"00:02:00,120 --> 00:02:04,560","html":"They started to bloom last week and are already beautiful, but they should peak and be","cn":"它们上周就开始开花了，现在已经很美了，但它们应该在本月底达到盛花期并","analysis":""},{"time":"00:02:04,560 --> 00:02:06,960","html":"in full bloom at the end of the <mark style=\"background-color: #bbf7d0;\">month<\/mark>.","cn":"盛开。","analysis":"<strong>答案解析：<\/strong> 问题1询问罂粟花何时达到最佳状态。对话中提到“but they should peak and be in full bloom at the end of the month.”（它们应该在本月底达到盛花期并盛开。），明确指出最佳观赏时间是“month”（月）的末尾，因此答案是Month。"},{"time":"00:02:06,960 --> 00:02:10,920","html":"[Woman]: Oh, I was planning on coming at the end of this week.","cn":"【女士】：哦，我本来计划这周末来的。","analysis":""},{"time":"00:02:10,920 --> 00:02:12,320","html":"Is that too early?","cn":"那是不是太早了？","analysis":""},{"time":"00:02:12,320 --> 00:02:13,760","html":"[Park Ranger]: No, not at all.","cn":"【公园管理员】：不，一点也不。","analysis":""},{"time":"00:02:13,760 --> 00:02:16,200","html":"The hills are already covered with <mark style=\"background-color: #bbf7d0;\">orange<\/mark> poppies.","cn":"山丘上已经覆盖着橙色的罂粟花。","analysis":"<strong>答案解析：<\/strong> 问题2询问山丘上罂粟花的颜色。对话中提到“The hills are already covered with orange poppies.”（山丘上已经覆盖着橙色的罂粟花。），明确指出颜色是“orange”（橙色），因此答案是Orange。"},{"time":"00:02:16,200 --> 00:02:18,680","html":"[Woman]: I thought poppies were <mark style=\"background-color: #fecaca;\">red<\/mark>.","cn":"【女士】：我以为罂粟花是红色的。","analysis":"<strong>答案解析：<\/strong> 问题2询问罂粟花的颜色。女士错误地认为罂粟花是红色的，但公园管理员纠正说加利福尼亚的罂粟花不是红色。因此，“red”是干扰项，因为它不是实际的正确答案。"},{"time":"00:02:18,680 --> 00:02:20,040","html":"[Park Ranger]: Not in California.","cn":"【公园管理员】：在加利福尼亚不是。","analysis":""},{"time":"00:02:20,080 --> 00:02:22,280","html":"I've never seen a red poppy here.","cn":"我在这里从未见过红色的罂粟花。","analysis":""},{"time":"00:02:22,280 --> 00:02:25,120","html":"[Woman]: The poppy reserve is in Ocean County, right?","cn":"【女士】：罂粟保护区在海洋县，对吗？","analysis":""},{"time":"00:02:25,120 --> 00:02:26,120","html":"[Park Ranger]: Right.","cn":"【公园管理员】：没错。","analysis":""},{"time":"00:02:26,120 --> 00:02:29,240","html":"From lakeside, you'll need to drive about an hour <mark style=\"background-color: #bbf7d0;\">east<\/mark>.","cn":"从湖畔出发，你需要向东行驶大约一小时。","analysis":"<strong>答案解析：<\/strong> 问题3询问保护区相对于Lakeside的位置。对话中提到“From lakeside, you'll need to drive about an hour east.”（从湖畔出发，你需要向东行驶大约一小时。），明确指出方向是“east”（东），因此答案是East。"},{"time":"00:02:29,240 --> 00:02:31,560","html":"[Woman]: What time does the reserve open?","cn":"【女士】：保护区什么时候开放？","analysis":""},{"time":"00:02:31,560 --> 00:02:34,640","html":"[Park Ranger]: The reserve is open from sunrise to sunset.","cn":"【公园管理员】：保护区从日出到日落开放。","analysis":""},{"time":"00:02:34,640 --> 00:02:38,800","html":"It's best to come early in the morning to beat the crowds, but for the best photography,","cn":"最好早上早点来避开人群，但如果想拍出最好的照片，","analysis":""},{"time":"00:02:38,800 --> 00:02:42,440","html":"you might want to consider a mid-afternoon visit on a weekday.","cn":"你可能需要考虑在工作日下午中间时段参观。","analysis":""},{"time":"00:02:42,440 --> 00:02:46,360","html":"[Woman]: I heard that there are a lot of rattlesnakes in the desert.","cn":"【女士】：我听说沙漠里有很多响尾蛇。","analysis":""},{"time":"00:02:46,360 --> 00:02:48,920","html":"Is it dangerous to walk about?","cn":"走动危险吗？","analysis":""},{"time":"00:02:48,920 --> 00:02:50,960","html":"[Park Ranger]: This wildlife is quite safe.","cn":"【公园管理员】：这里的野生动物很安全。","analysis":""},{"time":"00:02:50,960 --> 00:02:56,080","html":"There are very few people bitten by rattlesnakes, so we do recommend wearing <mark style=\"background-color: #bbf7d0;\">trousers<\/mark> just","cn":"很少有人被响尾蛇咬伤，所以我们确实建议穿长裤","analysis":""},{"time":"00:02:56,080 --> 00:02:57,760","html":"to be on the safe side.","cn":"以防万一。","analysis":"<strong>答案解析：<\/strong> 问题4询问因响尾蛇而建议穿什么。对话中提到“so we do recommend wearing trousers just to be on the safe side.”（所以我们确实建议穿长裤以防万一。），明确指出要穿“trousers”（长裤），因此答案是Trousers。"},{"time":"00:02:57,760 --> 00:02:58,920","html":"[Woman]: All right.","cn":"【女士】：好的。","analysis":""},{"time":"00:02:58,920 --> 00:03:02,760","html":"I was hoping that I might have the chance to see some wildlife too.","cn":"我希望能有机会看到一些野生动物。","analysis":""},{"time":"00:03:02,760 --> 00:03:06,560","html":"Oh, how much is the admission to the reserve?","cn":"哦，保护区门票多少钱？","analysis":""},{"time":"00:03:06,560 --> 00:03:08,040","html":"[Park Ranger]: It's $5.","cn":"【公园管理员】：5美元。","analysis":""},{"time":"00:03:08,040 --> 00:03:11,600","html":"[Woman]: Can I use my <mark style=\"background-color: #fecaca;\">national park<\/mark> pass to enter the reserve?","cn":"【女士】：我可以使用我的国家公园通行证进入保护区吗？","analysis":"<strong>答案解析：<\/strong> 问题5询问保护区属于哪种类型的公园。女士错误地提问是否可以使用“national park”通行证，这引出了关于公园类型的讨论。因此，“national park”是干扰项，因为它不是保护区的实际类型。"},{"time":"00:03:11,600 --> 00:03:16,200","html":"[Park Ranger]: Unfortunately not, since it is a <mark style=\"background-color: #bbf7d0;\">state<\/mark> park, not a national park.","cn":"【公园管理员】：很遗憾不能，因为它是一个州立公园，而不是国家公园。","analysis":"<strong>答案解析：<\/strong> 问题5询问保护区属于哪种类型的公园。对话中公园管理员回答“Unfortunately not, since it is a state park, not a national park.”（很遗憾不能，因为它是一个州立公园，而不是国家公园。），明确指出保护区是“state”park（州立公园），因此答案是State。"},{"time":"00:03:16,200 --> 00:03:17,760","html":"[Woman]: All right.","cn":"【女士】：好的。","analysis":""},{"time":"00:03:17,800 --> 00:03:21,480","html":"I heard from a friend that there is a nature tour available.","cn":"我听朋友说有自然之旅。","analysis":""},{"time":"00:03:21,480 --> 00:03:22,920","html":"Can you tell me about it?","cn":"你能告诉我详情吗？","analysis":""},{"time":"00:03:22,920 --> 00:03:26,240","html":"[Park Ranger]: Certainly, but can you excuse me just a sec?","cn":"【公园管理员】：当然，但请您稍等一下好吗？","analysis":""},{"time":"00:03:26,240 --> 00:03:27,560","html":"I'll be right back.","cn":"我马上回来。","analysis":""},{"time":"00:03:27,560 --> 00:03:28,560","html":"[Woman]: OK.","cn":"【女士】：好的。","analysis":""},{"time":"00:03:47,760 --> 00:04:06,600","html":"[Narrator]: Now listen and answer questions 6 to 10.","cn":"【旁白】：现在请听并回答问题六到十。","analysis":""},{"time":"00:04:06,600 --> 00:04:07,840","html":"[Park Ranger]: Hello?","cn":"【公园管理员】：你好？","analysis":""},{"time":"00:04:07,840 --> 00:04:12,440","html":"[Woman]: Yes, I'm still here.","cn":"【女士】：是的，我还在。","analysis":""},{"time":"00:04:12,440 --> 00:04:16,280","html":"[Park Ranger]: Now, you are interested in the nature tours, right?","cn":"【公园管理员】：现在，你对自然之旅感兴趣，对吗？","analysis":""},{"time":"00:04:16,280 --> 00:04:18,600","html":"[Woman]: Oh, there's more than one.","cn":"【女士】：哦，不止一个。","analysis":""},{"time":"00:04:18,600 --> 00:04:19,600","html":"[Park Ranger]: Yes.","cn":"【公园管理员】：是的。","analysis":""},{"time":"00:04:19,600 --> 00:04:23,520","html":"We have the <mark style=\"background-color: #bbf7d0;\">general<\/mark> tour, which is the one your friend may have taken.","cn":"我们有普通（general）之旅，你朋友可能参加的就是这个。","analysis":"<strong>答案解析：<\/strong> 问题6询问第一种旅行的名称。对话中提到“We have the general tour, which is the one your friend may have taken.”（我们有普通之旅，你朋友可能参加的就是这个。），明确指出旅行名称是“general” tour（普通之旅），因此答案是General。"},{"time":"00:04:23,520 --> 00:04:26,560","html":"But we also have two more specialized tours.","cn":"但我们还有另外两个专业之旅。","analysis":""},{"time":"00:04:26,560 --> 00:04:29,760","html":"Starting at 7.30 a.m. is our general tour.","cn":"我们的普通之旅从早上7:30开始。","analysis":""},{"time":"00:04:29,760 --> 00:04:31,880","html":"That's early for some people, I know.","cn":"我知道这对一些人来说有点早。","analysis":""},{"time":"00:04:31,880 --> 00:04:34,000","html":"It's offered every hour, too.","cn":"它也是每小时都有。","analysis":""},{"time":"00:04:34,000 --> 00:04:37,320","html":"But it's a great time, and it only lasts 30 minutes.","cn":"但那是很棒的时间，而且只持续30分钟。","analysis":""},{"time":"00:04:37,320 --> 00:04:40,200","html":"[Woman]: Is that the tour that takes you to the vista points?","cn":"【女士】：那是带你去观景点（vista points）的旅行吗？","analysis":""},{"time":"00:04:40,200 --> 00:04:45,680","html":"[Park Ranger]: Yes, that is one of the highlights, along with a film introducing the park and the <mark style=\"background-color: #bbf7d0;\">museum<\/mark>.","cn":"【公园管理员】：是的，那是亮点之一，还有一部介绍公园的影片和博物馆。","analysis":"<strong>答案解析：<\/strong> 问题7询问General tour的亮点之一。对话中提到“Yes, that is one of the highlights, along with a film introducing the park and the museum.”（是的，那是亮点之一，还有一部介绍公园的影片和博物馆。），明确指出亮点包括“museum”（博物馆），因此答案是Museum。"},{"time":"00:04:45,680 --> 00:04:48,440","html":"You're welcome to tour the museum at your leisure.","cn":"欢迎您随时参观博物馆。","analysis":""},{"time":"00:04:48,440 --> 00:04:53,040","html":"It's a great tour for those who just want to take panoramic pictures with automatic cameras.","cn":"对于那些只想用自动相机拍摄全景照片的人来说，这是一个很棒的旅行。","analysis":""},{"time":"00:04:53,040 --> 00:04:58,600","html":"[Woman]: Well, if I come all that way, I'd like to have a more detailed tour.","cn":"【女士】：嗯，如果我大老远来了，我希望能参加一个更详细的旅行。","analysis":""},{"time":"00:04:58,600 --> 00:05:04,640","html":"[Park Ranger]: Then you are in luck because we have a wonderful wildflower tour every two hours from 8 a.m.","cn":"【公园管理员】：那你很幸运，因为我们每两小时就有一个精彩的野花之旅，从早上8点开始。","analysis":""},{"time":"00:05:04,640 --> 00:05:08,960","html":"It lasts <mark style=\"background-color: #bbf7d0;\">one hour<\/mark>, and the volunteer will give you information about many of the flowers","cn":"它持续一小时，志愿者会向你介绍保护区里的许多花卉","analysis":""},{"time":"00:05:08,960 --> 00:05:10,480","html":"on the reserve.","cn":"的种类。","analysis":"<strong>答案解析：<\/strong> 问题8询问Wildflower tour的持续时间。对话中提到“It lasts one hour, and the volunteer will give you information about many of the flowers”（它持续一小时），明确指出持续时间是“one hour”（一小时），因此答案是1 hour。"},{"time":"00:05:10,480 --> 00:05:13,840","html":"[Woman]: Besides the poppies, will cream cups be in bloom?","cn":"【女士】：除了罂粟花，杯状花也会开花吗？","analysis":""},{"time":"00:05:13,880 --> 00:05:17,160","html":"[Park Ranger]: Yes, and you will see lots of sage, too.","cn":"【公园管理员】：是的，你还会看到很多鼠尾草。","analysis":""},{"time":"00:05:17,160 --> 00:05:21,520","html":"We have a volunteer who is really good at giving tips on close-up photography.","cn":"我们有一位志愿者非常擅长提供近距离摄影的技巧。","analysis":""},{"time":"00:05:21,520 --> 00:05:23,760","html":"[Woman]: You mentioned another tour.","cn":"【女士】：你提到了另一个旅行。","analysis":""},{"time":"00:05:23,760 --> 00:05:29,920","html":"[Park Ranger]: Yes, the last one is the wildlife tour, but it is offered at very limited times.","cn":"【公园管理员】：是的，最后一个是野生动物之旅，但它的提供时间非常有限。","analysis":""},{"time":"00:05:29,920 --> 00:05:33,360","html":"[Woman]: Is that because most of the wildlife is nocturnal?","cn":"【女士】：那是因为大多数野生动物是夜行动物吗？","analysis":""},{"time":"00:05:33,360 --> 00:05:39,480","html":"[Park Ranger]: Yes, so we offer this tour only two times, <mark style=\"background-color: #bbf7d0;\">5.30<\/mark> a.m. or 7.00 p.m.","cn":"【公园管理员】：是的，所以我们只提供两次这个旅行，早上5:30或晚上7:00。","analysis":"<strong>答案解析：<\/strong> 问题9询问Wildlife tour的开始时间之一。对话中提到“Yes, so we offer this tour only two times, 5.30 a.m. or 7.00 p.m.”（是的，所以我们只提供两次这个旅行，早上5:30或晚上7:00。），明确指出早上开始时间是“5.30 a.m.”，因此答案是5:30或5.30。"},{"time":"00:05:39,480 --> 00:05:45,040","html":"[Woman]: Wow, that early, but don't the snakes and lizards like the sun?","cn":"【女士】：哇，那么早，但是蛇和蜥蜴不喜欢太阳吗？","analysis":""},{"time":"00:05:45,040 --> 00:05:46,040","html":"[Park Ranger]: Right.","cn":"【公园管理员】：没错。","analysis":""},{"time":"00:05:46,040 --> 00:05:49,720","html":"First let me say it takes about an hour and a half, but you will have the opportunity to","cn":"首先，让我说大约需要一个半小时，但你将有机会","analysis":""},{"time":"00:05:49,720 --> 00:05:54,040","html":"see other animals like coyotes, quail, and roadrunners.","cn":"看到其他动物，比如郊狼、鹌鹑和走鹃。","analysis":""},{"time":"00:05:54,040 --> 00:05:58,400","html":"You have to get here before the crowds arrive or after most of them leave.","cn":"你必须在人群到来之前或他们大部分离开之后到达这里。","analysis":""},{"time":"00:05:58,400 --> 00:05:59,800","html":"[Woman]: Well, that makes sense.","cn":"【女士】：嗯，这很有道理。","analysis":""},{"time":"00:05:59,800 --> 00:06:03,080","html":"Does it require a lot of walking?","cn":"需要走很多路吗？","analysis":""},{"time":"00:06:03,080 --> 00:06:08,320","html":"[Park Ranger]: More like a lot of standing, but most of the time you will be at one or two locations.","cn":"【公园管理员】：更像是长时间站立，但大部分时间你会在一两个地点。","analysis":""},{"time":"00:06:08,320 --> 00:06:12,640","html":"So we recommend bringing a tripod and <mark style=\"background-color: #bbf7d0;\">zoom<\/mark> lens if you want to take pictures.","cn":"所以如果你想拍照，我们建议带一个三脚架和变焦镜头。","analysis":"<strong>答案解析：<\/strong> 问题10询问Wildlife tour建议带的摄影器材。对话中提到“So we recommend bringing a tripod and zoom lens if you want to take pictures.”（所以如果你想拍照，我们建议带一个三脚架和变焦镜头。），明确指出需要带“zoom” lens（变焦镜头），因此答案是Zoom。"},{"time":"00:06:12,640 --> 00:06:15,160","html":"[Woman]: Well, thank you very much.","cn":"【女士】：嗯，非常感谢你。","analysis":""},{"time":"00:06:15,160 --> 00:06:18,440","html":"You've been extremely helpful and informative.","cn":"你非常乐于助人，提供了很多信息。","analysis":""},{"time":"00:06:18,440 --> 00:06:19,440","html":"[Park Ranger]: You're welcome.","cn":"【公园管理员】：不客气。","analysis":""},{"time":"00:06:19,440 --> 00:06:20,680","html":"Glad I could be of service.","cn":"很高兴能为您服务。","analysis":""},{"time":"00:06:20,680 --> 00:06:21,680","html":"[Woman]: Goodbye.","cn":"【女士】：再见。","analysis":""},{"time":"00:06:21,680 --> 00:06:22,440","html":"[Park Ranger]: Goodbye.","cn":"【公园管理员】：再见。","analysis":""},{"time":"00:06:22,440 --> 00:06:28,160","html":"[Narrator]: That is the end of Part 1.","cn":"【旁白】：第一部分到此结束。","analysis":""},{"time":"00:06:28,160 --> 00:06:31,760","html":"You now have one minute to check your answers to Part 1.","cn":"现在你有一分钟时间检查第一部分的答案。","analysis":""}],"transcriptHighlights":[{"qid":"1","text":"Month","answer":"Month"},{"qid":"2","text":"Orange","answer":"Orange"},{"qid":"3","text":"East","answer":"East"},{"qid":"4","text":"Trousers","answer":"Trousers"},{"qid":"5","text":"State","answer":"State"},{"qid":"6","text":"General","answer":"General"},{"qid":"7","text":"Museum","answer":"Museum"},{"qid":"8","text":"1 hour","answer":"1 hour"},{"qid":"9","text":"5:30","answer":"5:30/5.30"},{"qid":"9","text":"5.30","answer":"5:30/5.30"},{"qid":"10","text":"Zoom","answer":"Zoom"}],"ownerInfo":"此内容由🍠@Listening 永不虾滑整理，仅作为分享供个人使用；禁止商用、倒卖和引流。有问题请先仔细看🍠这个账号的置顶和分享贴。没有团队，不是机构，纯个人分享。督学和其他相关课程请咨询主页另一个号@心情有点虾滑（不回任何机经相关消息）。"}</script>
<script>
const DATA=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const RENDER_VERSION=2;
let secs=0,review=false,timer=setInterval(()=>{secs++;drawTimer();if(secs%5===0)save(false)},1000),drag=null,currentCue=-1,loopCue=false,slowCue=false,showCn=true,showAnalysis=true,dictationMode=false,showOriginal=true,dictationAnswers={};const storeKey='ielts_v4_'+DATA.title.replace(/\W+/g,'_');
const CONFIG_DATA={answerKey:DATA.answerKey,questionList:DATA.questionIds.map(q=>Number(q)||q),localStorageKey:storeKey};window.localStorageKey=storeKey;window.DATA=DATA;window.CONFIG_DATA=CONFIG_DATA;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function matchingRepeatAttr(g){return (g.questions||[]).length>(g.options||[]).length?' data-repeat="true"':''}
function groupHTML(g){if(g.type==='matching'&&g.layout==='flow')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="flow-layout"><div class="flow-steps">${g.questions.map((q,idx)=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>${idx<g.questions.length-1?'<div class="flow-arrow">↓</div>':''}`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='matching')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='map')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'map.png')}" alt="Map"></div><div class="map-grid"><div class="map-answer-list">${g.questions.map(q=>`<div class="map-row"><div class="map-row-label"><strong>${q[0]}</strong> ${esc(q[1]||'')}</div><div class="map-options">${(g.options||['A','B','C','D','E','F','G','H','I']).map(o=>`<div class="choice map-choice" data-name="q${q[0]}" data-value="${o}">${o}</div>`).join('')}</div></div>`).join('')}</div></div></div></section>`;
if(g.type==='single')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div>${g.questions.map(q=>`<p><strong>${q.id}</strong> ${esc(q.text)}</p>${q.options.map(o=>`<div class="choice single-choice" data-name="q${q.id}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}`).join('')}</section>`;
if(g.type==='multiple')return `<section class="group" data-limit="${g.limit}" data-id="${g.id}"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><p><strong>${esc(g.id)}</strong> ${esc(g.questionText)}</p>${g.options.map(o=>`<div class="choice multi-choice" data-name="q${g.id.replace('-','_')}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</section>`;
return `<section class="group"><h3>${esc(g.title)}</h3>${renderFillGroup(g)}</section>`}
function renderFillGroup(g){let qids=(g.questions||[]).map(q=>String(q.id));let used=new Set();let lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:g.questions.map(q=>`${q.id} ${q.text} _____`));let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFillTable(chunk,qids,used);continue}html+=renderFillLine(lines[i++],qids,used)}return html||`<div class="instruction">${esc(g.instruction||'Complete the notes below.')}</div>`}
function renderFillTable(lines,qids,used){let rows=[];lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0;if(!rows[row])rows[row]=[];rows[row][col]=renderFillLine(line,qids,used,true)});return `<div class="fill-table-wrap"><table class="fill-table">${rows.map((cells,idx)=>`<tr>${(cells||[]).map(cell=>idx===0?`<th>${cell}</th>`:`<td>${cell}</td>`).join('')}</tr>`).join('')}</table></div>`}
function fillInput(qid,lead=''){return `<span class="blank-q">${esc(qid)}</span>${esc(lead)}<input class="blank" name="q${esc(qid)}" type="text" autocomplete="off" inputmode="text">`}
function fillLineAttrs(meta,isHeading){let cls=['doc-line'];if(isHeading)cls.push('fill-heading');if(meta.list)cls.push('is-list');let level=Math.max(0,Math.min(6,Number(meta.level)||0));let style=meta.list?` style="--indent:${level*22}px"`:'';return `class="${cls.join(' ')}"${style}`}
function fillLineContent(meta,body){return meta.list?`<span class="doc-bullet">•</span><span class="doc-line-content">${body}</span>`:body}
function isFillHeading(raw,meta,hit){return !hit&&!meta.list&&!/(?:_{2,}|…{2,}|\.{4,})/.test(raw)&&!/^\d+\.?\s+/.test(raw)&&!/^(?:Complete|Write|Choose)\b/i.test(raw)}
function renderFillLine(line,qids,used,inner=false){let meta=typeof line==='object'&&line?line:{},raw=String(meta.text??line),html=esc(raw),hit=false;html=html.replace(/(^|[^\d])(\d{1,2})\.?\s*((?:£\s*)?)(?:_{2,}|…{2,}|\.{4,})/g,(m,prefix,qid,lead)=>{if(!qids.includes(qid))return m;used.add(qid);hit=true;return prefix+fillInput(qid,lead)});let m=raw.match(/^(\d+)\.?\s+(.+)$/);if(!hit&&m&&qids.includes(m[1])){used.add(m[1]);let body=esc(m[2]);let input=fillInput(m[1]);body=/(?:_+|…{2,}|\.{4,})/.test(body)?body.replace(/(?:_+|…{2,}|\.{4,})/,input):`${body} ${input}`;return inner?fillLineContent(meta,body):`<p ${fillLineAttrs(meta,false)}>${fillLineContent(meta,body)}</p>`}return inner?html:`<p ${fillLineAttrs(meta,isFillHeading(raw,meta,hit))}>${fillLineContent(meta,html)}</p>`}
function hardResetAnswers(){$$('input').forEach(i=>{i.value='';i.defaultValue=''});$$('.choice').forEach(c=>c.classList.remove('selected'));$$('.slot').forEach(s=>s.innerHTML='');refreshPool();updateNav()}
function render(){document.title=DATA.title;$('#ownerMeta').textContent=DATA.ownerInfo||'';$('#audio').src=DATA.audio||'audio.mp3';$('#content').innerHTML=DATA.groups.map(groupHTML).join('');$('#nav').innerHTML=DATA.questionIds.map(q=>`<div data-q="${q}">${q}</div>`).join('');bindDynamic();hardResetAnswers();load();updateNav()}
function bindDynamic(){
  $$('#content input').forEach(i=>{i.oninput=()=>{updateNav();save(false)};i.onchange=()=>{updateNav();save(false)}});
  $$('.single-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;$$(`.single-choice[data-name="${btn.dataset.name}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateNav();save(false)});
  $$('.map-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;$$(`.map-choice[data-name="${btn.dataset.name}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateNav();save(false)});
  $$('.multi-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;let group=btn.closest('.group'),limit=Number(group?.dataset.limit||99),name=btn.dataset.name,selected=$$(`.multi-choice[data-name="${name}"].selected`);if(!btn.classList.contains('selected')&&selected.length>=limit)return;btn.classList.toggle('selected');updateNav();save(false)});
  $$('#nav [data-q]').forEach(n=>n.onclick=()=>scrollToQuestion(n.dataset.q));
}
function bindGlobal(){
  document.addEventListener('dragstart',e=>{let d=e.target.closest('.drag,.tag');if(!d||review)return;drag={value:d.dataset.value,text:d.textContent,from:d.closest('.slot')};});
  document.addEventListener('dragover',e=>{if(e.target.closest('.slot,.pool'))e.preventDefault()});
  document.addEventListener('drop',e=>{let slot=e.target.closest('.slot'),pool=e.target.closest('.pool');if(!drag||review)return;e.preventDefault();if(pool&&drag.from){drag.from.innerHTML='';refreshPool();updateNav();save(false);return}if(slot){if(drag.from)drag.from.innerHTML='';slot.innerHTML=`<span class="tag" draggable="true" data-value="${drag.value}">${esc(drag.text)}</span>`;refreshPool();updateNav();save(false)}});
  document.addEventListener('mouseup',handleSelection);
  $('#selbar').onclick=handleToolbar;
}
function scrollToQuestion(q){let first=q.split('-')[0];let target=$(`input[name="q${first}"], .slot[data-q="${first}"], .choice[data-name="q${first}"]`)||$(`input[name="q${q.replace('-','_')}"]`);target?.closest('.group')?.scrollIntoView({behavior:'smooth',block:'center'});}
function refreshPool(){$$('.group').forEach(g=>{let slots=[...g.querySelectorAll('.slot')],drags=[...g.querySelectorAll('.drag')],repeat=g.dataset.repeat==='true'||slots.length>drags.length,used=new Set(slots.map(s=>s.querySelector('.tag')?.dataset.value).filter(Boolean));drags.forEach(d=>d.classList.toggle('hidden',!repeat&&used.has(d.dataset.value)))})}
function restoreDragging(){drag=null;$$('.drag,.tag').forEach(d=>d.draggable=!review)}
function multipleGroupFor(q){let n=Number(q);return DATA.groups.find(g=>{if(g.type!=='multiple')return false;let [a,b]=g.id.split('-').map(Number);return n>=a&&n<=b})}
function multipleNameFor(q){let g=multipleGroupFor(q);return g?'q'+g.id.replace('-','_'):null}
function answered(q){let mn=multipleNameFor(q);if(mn)return $$(`.multi-choice[data-name="${mn}"].selected`).length>0;return !!($(`input[name="q${q}"]`)?.value?.trim()||$(`.single-choice[data-name="q${q}"].selected`)||$(`.map-choice[data-name="q${q}"].selected`)||$(`.slot[data-q="${q}"] .tag`))}
function updateNav(){DATA.questionIds.forEach(q=>{$(`#nav [data-q="${q}"]`)?.classList.toggle('answered',answered(q))})}
function getAnswer(q){let mn=multipleNameFor(q);if(mn){let g=multipleGroupFor(q),ids=rangeIds(g.id),checked=$$(`.multi-choice[data-name="${mn}"].selected`).map(i=>i.dataset.value).sort(),idx=ids.indexOf(String(q));return checked[idx]||''}return $(`input[name="q${q}"]`)?.value||$(`.single-choice[data-name="q${q}"].selected`)?.dataset.value||$(`.map-choice[data-name="q${q}"].selected`)?.dataset.value||$(`.slot[data-q="${q}"] .tag`)?.dataset.value||''}
function correctAnswer(q){return DATA.answerKey.multipleMap?.['q'+q]||DATA.answerKey.text['q'+q]||DATA.answerKey.single['q'+q]||DATA.answerKey.map?.['q'+q]||DATA.answerKey.matching['q'+q]||''}
function norm(s){return String(s).trim().toLowerCase()}function answerVariants(s){return String(s||'').split(/\s*\/\s*/).map(x=>x.trim()).filter(Boolean)}function rangeIds(id){let [a,b]=id.split('-').map(Number),out=[];for(let n=a;n<=b;n++)out.push(String(n));return out}function isCorrect(q){let user=norm(getAnswer(q));return answerVariants(correctAnswer(q)).some(ans=>user===norm(ans))}
function optionTextForQuestion(q){let ans=String(correctAnswer(q)||'');for(let g of DATA.groups||[]){if((g.type==='single'||g.type==='map')&&g.questions){let item=g.questions.find(x=>String(x.id||x[0])===String(q));if(item&&g.type==='single'){let opt=(item.options||[]).find(o=>o[0]===ans);return opt?opt[1]:''}if(item&&g.type==='map')return item[1]||''}if(g.type==='multiple'){let ids=rangeIds(g.id);if(ids.includes(String(q))){let opt=(g.options||[]).find(o=>o[0]===ans);return opt?opt[1]:''}}if(g.type==='matching'){let opt=(g.options||[]).find(o=>o[0]===ans);return opt?opt[1]:''}}return ''}
function keywordScoreForQuestion(q,html){let text=String(html||'').replace(/<[^>]+>/g,' ').toLowerCase(),source=String(optionTextForQuestion(q)||correctAnswer(q)||'').toLowerCase();let words=source.split(/[^a-z0-9]+/).filter(w=>w.length>=4&&!/^(which|about|their|there|with|from|this|that|will|they|more|less)$/i.test(w));let score=0;for(let w of words){if(text.includes(w))score+=15}return score}
function answerRevealCell(q){return `<div class="answer-cell"><span class="answer-value is-hidden" data-answer="${esc(correctAnswer(q))}">Hidden</span><button class="answer-toggle" type="button">查看答案</button></div>`}

function questionInText(q,text){let n=Number(String(q).replace(/\D/g,""));if(!n||!text)return false;let raw=String(text).replace(/&nbsp;/g," ");let direct=new RegExp("(?:问题|Question|Q)\\s*0?"+n+"(?!\\d)|第\\s*0?"+n+"\\s*题|(?<!\\d)0?"+n+"\\s*题","i").test(raw)||new RegExp("(?:data-question=[\"']?|class=[\"'][^\"']*q)0?"+n+"(?!\\d)","i").test(raw);if(direct)return true;let re=/(?:问题|Question|Q|第)?\s*(\d+)\s*(?:-|–|—|至|到|and)\s*(\d+)\s*题?/gi,m;while((m=re.exec(raw))){let a=Number(m[1]),b=Number(m[2]);if(n>=Math.min(a,b)&&n<=Math.max(a,b))return true}return false}
function isCorrectEvidenceCue(x){let html=String(x?.html||'');return /#bbf7d0|rgb\s*\(\s*187\s*,\s*247\s*,\s*208\s*\)|background-color\s*:\s*(?:lightgreen|limegreen|palegreen)/i.test(html)}

function evidenceScore(q,lineIdx,analysisIdx){let x=studyLines()[lineIdx],score=0;if(isCorrectEvidenceCue(x))score+=100;if(isQuestionTaggedCue(q,x))score+=80;if(isDistractorEvidenceCue(x))score+=35;score+=keywordScoreForQuestion(q,x?.html||'');let text=String(x?.html||'').replace(/<[^>]+>/g,' ').toLowerCase(),ans=String(correctAnswer(q)||'').toLowerCase();if(ans&&text.includes(ans))score+=8;score-=Math.abs(lineIdx-analysisIdx);return score}
function bestCueNearAnalyses(q,predicate){let lines=studyLines(),analysisIdxs=[];lines.forEach((x,i)=>{if(questionInText(q,String(x.analysis||'')))analysisIdxs.push(i)});let best={idx:-1,score:-1e9};for(let a of analysisIdxs){let prev=a-1;while(prev>=0&&!lines[prev].analysis)prev--;let next=a+1;while(next<lines.length&&!lines[next].analysis)next++;let from=Math.max(0,prev+1),to=Math.min(lines.length-1,next-1);for(let i=from;i<=to;i++){if(predicate(lines[i])){let score=evidenceScore(q,i,a);if(score>best.score)best={idx:i,score}}}}return best.idx}

function highlightTerms(){let terms=[];for(let item of DATA.transcriptHighlights||[]){let text=typeof item==='string'?item:item.text;if(text){terms.push(String(text));String(text).split(/\s+/).map(w=>w.replace(/[^A-Za-z0-9'-]/g,'')).filter(w=>w.length>=5&&!/^(which|three|answer|letter|about|their|there|would|could|should)$/i.test(w)).forEach(w=>terms.push(w))}}return [...new Set(terms.map(t=>t.trim()).filter(t=>t.length>1))].sort((a,b)=>b.length-a.length)}

function setFontSize(size,persist=true){let n=Math.max(MIN_FONT_SIZE,Math.min(MAX_FONT_SIZE,Number(size)||DEFAULT_FONT_SIZE));document.documentElement.style.fontSize=n===DEFAULT_FONT_SIZE?'':n+'px';updateSizeButtons();if(persist)save(false)}
function adjustFontSize(delta){setFontSize(currentFontSize()+delta,true)}
function updateSizeButtons(){let size=currentFontSize(),dark=document.body.classList.contains('dark');$('#fontMinus')?.toggleAttribute('disabled',size<=MIN_FONT_SIZE);$('#fontPlus')?.toggleAttribute('disabled',size>=MAX_FONT_SIZE);$('#fontDefault')?.classList.toggle('active',size===DEFAULT_FONT_SIZE);$('#lightBtn')?.classList.toggle('active',!dark);$('#darkBtn')?.classList.toggle('active',dark)}
function resetAppearance(persist=true){document.body.classList.remove('dark');setFontSize(DEFAULT_FONT_SIZE,false);updateSizeButtons();if(persist)save(false)}
function clearAllProgress(){localStorage.removeItem(storeKey)}
$('#finish').onclick=finish;$('#save').onclick=()=>save(true);$('#clear').onclick=()=>{if(confirm('Clear all progress?')){window.resetTest();showToast('Clear complete')}};$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-open');save(false)};$('#closeNotes').onclick=()=>{document.body.classList.remove('notes-open');save(false)};$('#toggleIntensive').onclick=()=>{toggleIntensive();save(false)};$('#settingsBtn').onclick=()=>{$('#settings').classList.toggle('open');updateSizeButtons()};$('#lightBtn').onclick=()=>{document.body.classList.remove('dark');updateSizeButtons();save(false)};$('#darkBtn').onclick=()=>{document.body.classList.add('dark');updateSizeButtons();save(false)};$('#appearanceReset').onclick=()=>resetAppearance(true);$('#fontMinus').onclick=()=>adjustFontSize(-1);$('#fontPlus').onclick=()=>adjustFontSize(1);$('#fontDefault').onclick=()=>setFontSize(DEFAULT_FONT_SIZE,true);$('#settings').addEventListener('wheel',e=>{e.preventDefault();adjustFontSize(e.deltaY>0?-1:1)},{passive:false});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey)return;let key=e.key;if(key==='+'||key==='='){e.preventDefault();adjustFontSize(1)}else if(key==='-'||key==='_'){e.preventDefault();adjustFontSize(-1)}else if(key==='0'){e.preventDefault();resetAppearance(true)}});
const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
</script>
