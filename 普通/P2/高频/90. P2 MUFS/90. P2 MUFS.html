6":"C"},"multiple":{},"multipleMap":{},"matching":{"q17":"B","q18":"E","q19":"C","q20":"D"},"map":{}},"transcriptLines":[{"time":"00:00:00,000 --> 00:00:13,200","html":"2. You will hear the chairperson of the Middletown Urban Farming scheme talking to a group","cn":"2. 您将听到米德尔敦城市农业计划的主席向一群人讲话","analysis":""},{"time":"00:00:13,200 --> 00:00:16,920","html":"of people who are interested in joining the scheme.","cn":"对加入该计划感兴趣的人。","analysis":""},{"time":"00:00:16,920 --> 00:00:23,760","html":"First, you have some time to look at questions 11-16 on page 3.","cn":"首先，您有时间查看第3页上的问题11-16。","analysis":""},{"time":"00:01:00,000 --> 00:01:13,920","html":"Now listen carefully and answer questions 11-16.","cn":"现在请仔细听并回答问题11-16。","analysis":""},{"time":"00:01:13,920 --> 00:01:22,320","html":"I'm Chris Butler, and I'm the chairperson of the Middletown Urban Farming scheme, or","cn":"我是克里斯·巴特勒，我是米德尔敦城市农业计划（Middletown Urban Farming scheme）的主席，简称","analysis":""},{"time":"00:01:22,320 --> 00:01:28,120","html":"MUFS for short, a highly successful program which encourages city dwellers to grow their","cn":"MUFS，一个非常成功的项目，鼓励城市居民种植自己的","analysis":""},{"time":"00:01:28,120 --> 00:01:32,680","html":"own fruit and vegetables to become city farmers if you will.","cn":"水果和蔬菜，如果您愿意，可以成为城市农夫。","analysis":""},{"time":"00:01:32,680 --> 00:01:34,680","html":"Who started MUFS?","cn":"谁创立了MUFS？","analysis":""},{"time":"00:01:34,680 --> 00:01:40,360","html":"Well, the idea of urban farming has been around for quite a while, particularly among <mark style=\"background-color: #fecaca;\">town<\/mark>","cn":"嗯，城市农业的想法已经存在相当长一段时间了，特别是在<mark style=\"background-color: #fecaca;\">城市规划者<\/mark>中。","analysis":""},{"time":"00:01:40,360 --> 00:01:42,040","html":"<mark style=\"background-color: #fecaca;\">planners<\/mark>.","cn":"","analysis":""},{"time":"00:01:42,040 --> 00:01:47,040","html":"But it was actually a group of Middletown <mark style=\"background-color: #bbf7d0;\">business people<\/mark>, including myself, who decided","cn":"但实际上是包括我在内的一群米德尔敦<mark style=\"background-color: #bbf7d0;\">商人<\/mark>决定","analysis":""},{"time":"00:01:47,040 --> 00:01:50,560","html":"to create what became MUFS.","cn":"创建了后来的MUFS。","analysis":""},{"time":"00:01:50,560 --> 00:01:53,880","html":"<mark style=\"background-color: #fecaca;\">University agriculture specialists got involved later<\/mark>.","cn":"<mark style=\"background-color: #fecaca;\">大学农业专家是后来才参与进来的<\/mark>。","analysis":"<strong>答案解析：<\/strong> 第11题询问MUFS的创始人是谁。原文第11-12行提到：“But it was actually a group of Middletown <mark style=\"background-color: #bbf7d0;\">business people<\/mark>, including myself, who decided to create what became MUFS.”（但实际上是包括我在内的一群米德尔敦<mark style=\"background-color: #bbf7d0;\">商人<\/mark>决定创建了后来的MUFS。），明确指出是商人创建的。因此选项B“business people”（商人）是正确答案。 原文第9-10行提到：“the idea of urban farming has been around for quite a while, particularly among <mark style=\"background-color: #fecaca;\">town planners<\/mark>.”（城市农业的想法已经存在相当长一段时间了，特别是在<mark style=\"background-color: #fecaca;\">城市规划者<\/mark>中。），这表明城市规划者有这个想法，但并不是MUFS的创始人，因此选项C是干扰项。 原文第13行提到：“<mark style=\"background-color: #fecaca;\">University agriculture specialists got involved later<\/mark>.”（<mark style=\"background-color: #fecaca;\">大学农业专家是后来才参与进来的<\/mark>。），明确指出大学专家是后来才参与的，并非创始人，因此选项A是干扰项。"},{"time":"00:01:53,880 --> 00:02:00,440","html":"Now, initially, the aim <mark style=\"background-color: #fecaca;\">was not some eco-friendly goal of reducing CO2 emissions<\/mark> caused by the","cn":"最初，我们的目标<mark style=\"background-color: #fecaca;\">不是为了实现减少因食物运输而产生的二氧化碳排放量的环保目标<\/mark>，","analysis":""},{"time":"00:02:00,440 --> 00:02:03,880","html":"transport of food from farm to dinner plate.","cn":"即从农场到餐桌的食物运输。","analysis":""},{"time":"00:02:03,880 --> 00:02:09,080","html":"It was simply to <mark style=\"background-color: #bbf7d0;\">maximize the utilization of the vacant or idle land that lies within<\/mark>","cn":"而是为了<mark style=\"background-color: #bbf7d0;\">最大限度地利用城市内的空置或闲置土地<\/mark>。","analysis":""},{"time":"00:02:09,080 --> 00:02:10,080","html":"<mark style=\"background-color: #bbf7d0;\">the city<\/mark>.","cn":"","analysis":""},{"time":"00:02:10,080 --> 00:02:15,800","html":"Of course, <mark style=\"background-color: #fecaca;\">later we realized that an additional benefit might be a healthier diet<\/mark> for local","cn":"当然，<mark style=\"background-color: #fecaca;\">后来我们意识到，一个额外的好处可能是当地人更健康的饮食<\/mark>。","analysis":""},{"time":"00:02:15,800 --> 00:02:17,600","html":"<mark style=\"background-color: #fecaca;\">people<\/mark>.","cn":"","analysis":"<strong>答案解析：<\/strong> 第12题询问创办MUFS的最初原因。原文第16-17行提到：“It was simply to <mark style=\"background-color: #bbf7d0;\">maximize the utilization of the vacant or idle land that lies within the city<\/mark>.”（它只是为了<mark style=\"background-color: #bbf7d0;\">最大限度地利用城市内闲置的土地<\/mark>。），这与选项A“to encourage more efficient land use”（鼓励更有效地利用土地）相符。因此选项A是正确答案。 原文第14-15行提到：“initially, the aim <mark style=\"background-color: #fecaca;\">was not some eco-friendly goal of reducing CO2 emissions<\/mark>...”(<mark style=\"background-color: #fecaca;\">最初的目的并非是减少二氧化碳排放量的环保目标<\/mark>...), 明确指出这不是最初目的，因此选项B是干扰项。 原文第18-19行提到：“Of course, <mark style=\"background-color: #fecaca;\">later we realized that an additional benefit might be a healthier diet<\/mark> for local people.”（当然，<mark style=\"background-color: #fecaca;\">后来我们才意识到，一个额外的好处可能是当地人更健康的饮食<\/mark>。），“later”表明这并非最初原因，因此选项C是干扰项。"},{"time":"00:02:17,600 --> 00:02:21,080","html":"Let me tell you a bit about the groups that have joined the scheme.","cn":"让我告诉你们一些已经加入该计划的团体的情况。","analysis":""},{"time":"00:02:21,080 --> 00:02:26,520","html":"We've got any number of <mark style=\"background-color: #fecaca;\">schools involved and loads of corporate employees<\/mark>, so our message","cn":"我们已经有许多<mark style=\"background-color: #fecaca;\">学校和大量公司员工参与其中<\/mark>，所以我们的信息","analysis":""},{"time":"00:02:26,520 --> 00:02:29,120","html":"seems to have been well received there.","cn":"似乎在那里受到了很好的反响。","analysis":""},{"time":"00:02:29,120 --> 00:02:33,760","html":"But for next year, we're going to concentrate on getting various <mark style=\"background-color: #bbf7d0;\">community centers<\/mark>, like","cn":"但明年，我们将集中精力吸引各种<mark style=\"background-color: #bbf7d0;\">社区中心<\/mark>加入，例如","analysis":""},{"time":"00:02:33,760 --> 00:02:39,080","html":"those for senior citizens to join, because so far, they've been somewhat slow to take","cn":"老年人活动中心，因为到目前为止，他们对参与该计划一直有些迟缓。","analysis":""},{"time":"00:02:39,080 --> 00:02:40,520","html":"up the scheme.","cn":"","analysis":"<strong>答案解析：<\/strong> 第13题询问明年MUFS将重点招募哪些成员。原文第23-24行提到：“But for next year, we're going to concentrate on getting various <mark style=\"background-color: #bbf7d0;\">community centers<\/mark>, like those for senior citizens to join...” （但明年，我们将集中精力吸引各种<mark style=\"background-color: #bbf7d0;\">社区中心<\/mark>加入，例如老年人活动中心...），明确指出明年重点招募社区中心。因此选项C“community centres”（社区中心）是正确答案。 原文第21行提到：“We've got any number of <mark style=\"background-color: #fecaca;\">schools involved and loads of corporate employees<\/mark>...” （我们已经有许多<mark style=\"background-color: #fecaca;\">学校和大量公司员工参与其中<\/mark>...），表明学校和公司员工已经大量参与，因此选项A和B不是明年的重点招募对象，是干扰项。"},{"time":"00:02:40,520 --> 00:02:47,560","html":"Now, the core committee of the MUFS is a group of dedicated gardeners.","cn":"现在，MUFS的核心委员会是一群专注的园艺爱好者。","analysis":""},{"time":"00:02:47,560 --> 00:02:51,680","html":"They probably <mark style=\"background-color: #fecaca;\">won't be familiar with your specific plot of land<\/mark>.","cn":"他们可能<mark style=\"background-color: #fecaca;\">不熟悉您具体的地块<\/mark>。","analysis":""},{"time":"00:02:51,680 --> 00:02:53,480","html":"They're mostly amateurs.","cn":"他们大多是业余爱好者。","analysis":""},{"time":"00:02:53,480 --> 00:02:58,320","html":"But they are the people who know the ins and outs of gardening, and they will be happy","cn":"但他们是懂园艺门道的人，他们很乐意","analysis":""},{"time":"00:02:58,320 --> 00:03:04,760","html":"to sit down with any MUFS member and make some <mark style=\"background-color: #bbf7d0;\">hands-on suggestions about gardening<\/mark>.","cn":"与任何MUFS成员坐下来，就园艺提供一些<mark style=\"background-color: #bbf7d0;\">实践性建议<\/mark>。","analysis":""},{"time":"00:03:04,760 --> 00:03:09,800","html":"But don't expect them to know the answers to technical questions, like the <mark style=\"background-color: #fecaca;\">Latin names<\/mark>","cn":"但不要指望他们能回答技术问题，比如植物的<mark style=\"background-color: #fecaca;\">拉丁名称<\/mark>。","analysis":""},{"time":"00:03:09,800 --> 00:03:11,880","html":"<mark style=\"background-color: #fecaca;\">of plants<\/mark>.","cn":"","analysis":"<strong>答案解析：<\/strong> 第14题询问MUFS委员会成员可以提供哪类信息。原文第29-30行提到：“they will be happy to sit down with any MUFS member and make some <mark style=\"background-color: #bbf7d0;\">hands-on suggestions about gardening<\/mark>.”（他们很乐意与任何MUFS成员坐下来，就园艺提供一些<mark style=\"background-color: #bbf7d0;\">实践性建议<\/mark>。），这与选项A“practical gardening tips”（实用园艺技巧）相符。因此选项A是正确答案。 原文第31-32行提到：“But don't expect them to know the answers to technical questions, like the <mark style=\"background-color: #fecaca;\">Latin names of plants<\/mark>.”（但不要指望他们能回答技术问题，比如植物的<mark style=\"background-color: #fecaca;\">拉丁名称<\/mark>。），这表明他们不提供植物科学方面的知识，因此选项B是干扰项。 原文第27行提到：“They probably <mark style=\"background-color: #fecaca;\">won't be familiar with your specific plot of land<\/mark>.”（他们可能<mark style=\"background-color: #fecaca;\">不熟悉您具体的地块<\/mark>。），这表明他们无法提供当地园艺地点的具体信息，因此选项C是干扰项。"},{"time":"00:03:11,880 --> 00:03:17,160","html":"The MUFS are keen to support members who are physically disabled.","cn":"MUFS热衷于支持身体残疾的成员。","analysis":""},{"time":"00:03:17,160 --> 00:03:21,400","html":"They're looking at the possibility of providing specially adapted <mark style=\"background-color: #fecaca;\">gardening tools on loan<\/mark>","cn":"他们正在考虑为无法使用普通工具的成员提供专门改装的<mark style=\"background-color: #fecaca;\">园艺工具供借用<\/mark>","analysis":""},{"time":"00:03:21,400 --> 00:03:24,880","html":"to members who can't cope with regular tools.","cn":"","analysis":""},{"time":"00:03:24,880 --> 00:03:26,560","html":"That's <mark style=\"background-color: #fecaca;\">not happening yet<\/mark>.","cn":"但这<mark style=\"background-color: #fecaca;\">还没有实现<\/mark>。","analysis":""},{"time":"00:03:26,560 --> 00:03:31,800","html":"But we do have some <mark style=\"background-color: #bbf7d0;\">window boxes, as well as larger containers<\/mark>, which we can distribute","cn":"但我们确实有一些<mark style=\"background-color: #bbf7d0;\">窗台花箱和更大的容器<\/mark>，我们可以免费分发给这些成员，","analysis":""},{"time":"00:03:31,800 --> 00:03:36,280","html":"free of charge to these members, although they will have to provide their own <mark style=\"background-color: #fecaca;\">soil and<\/mark>","cn":"尽管他们必须自己提供<mark style=\"background-color: #fecaca;\">土壤和<\/mark>","analysis":""},{"time":"00:03:36,280 --> 00:03:37,880","html":"<mark style=\"background-color: #fecaca;\">compost<\/mark> to themselves.","cn":"<mark style=\"background-color: #fecaca;\">堆肥<\/mark>。","analysis":"<strong>答案解析：<\/strong> 第15题询问MUFS为身体残疾者提供什么。原文第37-38行提到：“But we do have some <mark style=\"background-color: #bbf7d0;\">window boxes, as well as larger containers<\/mark>, which we can distribute free of charge to these members...” （但我们确实有一些<mark style=\"background-color: #bbf7d0;\">窗台花箱和更大的容器<\/mark>，我们可以免费分发给这些成员...），这与选项B“containers for plants”（植物容器）相符。因此选项B是正确答案。 原文第38-39行提到：“although they will have to provide their own <mark style=\"background-color: #fecaca;\">soil and compost<\/mark> to themselves.”（尽管他们必须自己提供<mark style=\"background-color: #fecaca;\">土壤和堆肥<\/mark>。），明确表示MUFS不提供土壤和堆肥，因此选项A是干扰项。 原文第34-36行提到：“They're looking at the possibility of providing specially adapted <mark style=\"background-color: #fecaca;\">gardening tools on loan<\/mark>... That's <mark style=\"background-color: #fecaca;\">not happening yet<\/mark>.”（他们正在考虑提供专门改装的<mark style=\"background-color: #fecaca;\">园艺工具供借用<\/mark>...但这<mark style=\"background-color: #fecaca;\">还没有实现<\/mark>。），明确指出园艺工具目前尚未提供，因此选项C是干扰项。"},{"time":"00:03:37,880 --> 00:03:43,080","html":"I'm especially proud of the work we've done with the local schools, both grade school","cn":"我尤其为我们与当地学校（包括小学和中学）所做的工作感到自豪。","analysis":""},{"time":"00:03:43,080 --> 00:03:45,040","html":"level and high schools.","cn":"","analysis":""},{"time":"00:03:45,040 --> 00:03:49,640","html":"The teachers say that they <mark style=\"background-color: #fecaca;\">knew the scheme would be of some practical use in science classes<\/mark>","cn":"老师们说，他们<mark style=\"background-color: #fecaca;\">知道这个计划在生物等科学课上会有一些实际用途<\/mark>","analysis":""},{"time":"00:03:49,640 --> 00:03:51,560","html":"<mark style=\"background-color: #fecaca;\">like biology<\/mark>.","cn":"","analysis":""},{"time":"00:03:51,560 --> 00:03:56,440","html":"Despite the original hopes of some, the fruit and vegetable plots <mark style=\"background-color: #fecaca;\">haven't provided cheaper<\/mark>","cn":"尽管有些人最初抱有希望，但这些果蔬地块<mark style=\"background-color: #fecaca;\">并未为学生提供更便宜的<\/mark>","analysis":""},{"time":"00:03:56,440 --> 00:03:58,720","html":"<mark style=\"background-color: #fecaca;\">lunches<\/mark> for their students.","cn":"<mark style=\"background-color: #fecaca;\">午餐<\/mark>。","analysis":""},{"time":"00:03:58,720 --> 00:04:03,720","html":"But what they didn't anticipate was the change in attitude that the scheme has created","cn":"但他们没有预料到的是，这个计划在学生中带来了态度上的改变。","analysis":""},{"time":"00:04:03,720 --> 00:04:05,560","html":"amongst their students.","cn":"","analysis":""},{"time":"00:04:05,560 --> 00:04:10,000","html":"They say the students have become much more conscious of their surrounding environment.","cn":"他们说学生们对周围的环境变得更加关注。","analysis":""},{"time":"00:04:10,000 --> 00:04:15,240","html":"They want to keep it <mark style=\"background-color: #bbf7d0;\">neat and tidy<\/mark>.","cn":"他们希望保持环境<mark style=\"background-color: #bbf7d0;\">整洁有序<\/mark>。","analysis":"<strong>答案解析：<\/strong> 第16题询问根据学校老师的说法，MUFS的一个意想不到的好处是什么。原文第46-49行提到：“But what they didn't anticipate was the change in attitude that the scheme has created amongst their students. They say the students have become much more conscious of their surrounding environment. They want to keep it <mark style=\"background-color: #bbf7d0;\">neat and tidy<\/mark>.”（但他们没有预料到的是，这个计划在学生中带来了态度上的改变。他们说学生们对周围的环境变得更加关注。他们希望保持环境<mark style=\"background-color: #bbf7d0;\">整洁有序<\/mark>。），“neat and tidy”体现了学生对社区环境的责任感和自豪感，这与选项C“its help in encouraging community pride among students”（它有助于培养学生的社区自豪感）相符。因此选项C是正确答案。 原文第42-43行提到：“The teachers say that they <mark style=\"background-color: #fecaca;\">knew the scheme would be of some practical use in science classes like biology<\/mark>.”（老师们说，他们<mark style=\"background-color: #fecaca;\">知道这个计划在生物等科学课上会有一些实际用途<\/mark>。），这表明其在科学教学中的作用是老师们“knew”（知道）的，也就是预料到的，而非意想不到的，因此选项A是干扰项。 原文第44-45行提到：“Despite the original hopes of some, the fruit and vegetable plots <mark style=\"background-color: #fecaca;\">haven't provided cheaper lunches<\/mark> for their students.”（尽管有些人最初抱有希望，但这些果蔬地块<mark style=\"background-color: #fecaca;\">并未为学生提供更便宜的午餐<\/mark>。），明确指出没有降低学校餐费，因此选项B是干扰项。"},{"time":"00:04:15,240 --> 00:04:21,760","html":"Before you hear the rest of the talk, you have some time to look at questions 17-20 on","cn":"在听讲座的其余部分之前，您有一些时间查看第4页上的问题17-20。","analysis":""},{"time":"00:04:21,760 --> 00:04:22,720","html":"page 4.","cn":"","analysis":""},{"time":"00:04:40,000 --> 00:04:50,840","html":"Now listen and answer questions 17-20.","cn":"现在请听并回答问题17-20。","analysis":""},{"time":"00:04:50,840 --> 00:04:56,920","html":"Now a number of local organizations and businesses provide our members with free goods and services.","cn":"现在，许多当地组织和企业为我们的会员提供免费商品和服务。","analysis":""},{"time":"00:04:56,920 --> 00:04:58,680","html":"Let me go through some of them.","cn":"我来介绍其中一些。","analysis":""},{"time":"00:04:58,680 --> 00:05:04,840","html":"The city hospital, as you might expect, has to provide thousands of meals for its patients.","cn":"市医院，正如您所料，需要为其病人提供数千份餐食。","analysis":""},{"time":"00:05:04,840 --> 00:05:10,040","html":"Until the manager of its kitchen <mark style=\"background-color: #bbf7d0;\">runs a course for our members on how to use vegetables<\/mark>","cn":"直到其厨房经理为我们的会员<mark style=\"background-color: #bbf7d0;\">开设了一门课程，教授如何使用蔬菜<\/mark>","analysis":""},{"time":"00:05:10,040 --> 00:05:12,880","html":"<mark style=\"background-color: #bbf7d0;\">in a huge variety of dishes<\/mark>.","cn":"<mark style=\"background-color: #bbf7d0;\">制作各种菜肴<\/mark>。","analysis":"<strong>答案解析：<\/strong> 第17题询问市医院提供的免费服务。原文第56-57行提到：“Until the manager of its kitchen <mark style=\"background-color: #bbf7d0;\">runs a course for our members on how to use vegetables in a huge variety of dishes<\/mark>.”（直到其厨房经理为我们的会员<mark style=\"background-color: #bbf7d0;\">开设了一门课程，教授如何使用蔬菜制作各种菜肴<\/mark>。），这与选项B“cooking lessons”（烹饪课程）相符。因此选项B是正确答案。"},{"time":"00:05:12,880 --> 00:05:18,080","html":"The local government found it had a large glass building, which the Parks Department used,","cn":"地方政府发现他们有一个大型玻璃建筑，公园部门曾用它来","analysis":""},{"time":"00:05:18,080 --> 00:05:21,800","html":"to start off flower seeds in young plants during the winter.","cn":"在冬季培育花卉种子和幼苗。","analysis":""},{"time":"00:05:21,800 --> 00:05:26,680","html":"And they agreed to allow our members to <mark style=\"background-color: #bbf7d0;\">use this free of charge to get their own little<\/mark>","cn":"他们同意允许我们的会员<mark style=\"background-color: #bbf7d0;\">免费使用这个地方来培育他们自己的小<\/mark>","analysis":""},{"time":"00:05:26,680 --> 00:05:29,800","html":"<mark style=\"background-color: #bbf7d0;\">seedlings off to a good start<\/mark>.","cn":"<mark style=\"background-color: #bbf7d0;\">幼苗，使其有一个良好的开端<\/mark>。","analysis":"<strong>答案解析：<\/strong> 第18题询问地方政府提供的免费服务。原文第58行提到：“The local government found it had a large glass building”（地方政府发现他们有一个大型玻璃建筑），随后第60-61行指出：“And they agreed to allow our members to <mark style=\"background-color: #bbf7d0;\">use this free of charge to get their own little seedlings off to a good start<\/mark>.”（他们同意允许我们的会员<mark style=\"background-color: #bbf7d0;\">免费使用这个地方来培育他们自己的小幼苗，使其有一个良好的开端<\/mark>。），一个用于培育幼苗的“大型玻璃建筑”就是温室（greenhouse）。这与选项E“use of a greenhouse”（使用温室）相符。因此选项E是正确答案。"},{"time":"00:05:29,800 --> 00:05:30,960","html":"Another thing.","cn":"还有一件事。","analysis":""},{"time":"00:05:30,960 --> 00:05:36,080","html":"The university has agreed that if members send them a sample of their soil, they will","cn":"大学同意，如果会员寄送土壤样本给他们，他们将","analysis":""},{"time":"00:05:36,080 --> 00:05:41,800","html":"<mark style=\"background-color: #bbf7d0;\">do a series of tests on it to indicate what kind of plants will grow best and what types<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">对土壤进行一系列测试，以指出哪种植物最适合生长以及最好使用哪种类型的<\/mark>","analysis":""},{"time":"00:05:41,800 --> 00:05:45,520","html":"<mark style=\"background-color: #bbf7d0;\">of fertilizer and nutrients would be best to use<\/mark>.","cn":"<mark style=\"background-color: #bbf7d0;\">肥料和营养物质<\/mark>。","analysis":"<strong>答案解析：<\/strong> 第19题询问大学提供的免费服务。原文第63-65行提到：“The university has agreed that if members send them a sample of their soil, they will <mark style=\"background-color: #bbf7d0;\">do a series of tests on it to indicate what kind of plants will grow best and what types of fertilizer and nutrients would be best to use<\/mark>.”（大学同意，如果会员寄送土壤样本给他们，他们将<mark style=\"background-color: #bbf7d0;\">对土壤进行一系列测试，以指出哪种植物最适合生长以及最好使用哪种类型的肥料和营养物质<\/mark>。），这与选项C“advice on soil”（土壤建议）相符。虽然也提到了肥料，但核心是通过土壤测试提供种植建议。因此选项C是正确答案。"},{"time":"00:05:45,520 --> 00:05:50,320","html":"And just to make sure our members know what's good for them, a supermarket is offering a","cn":"为了确保我们的会员知道什么对他们有益，一家超市正在提供一系列","analysis":""},{"time":"00:05:50,320 --> 00:05:56,200","html":"series of classes on <mark style=\"background-color: #bbf7d0;\">how to lose weight and stay healthy by having a sensible diet<\/mark>.","cn":"关于<mark style=\"background-color: #bbf7d0;\">如何通过合理饮食来减肥和保持健康<\/mark>的课程。","analysis":"<strong>答案解析：<\/strong> 第20题询问超市提供的免费服务。原文第66-67行提到：“a supermarket is offering a series of classes on <mark style=\"background-color: #bbf7d0;\">how to lose weight and stay healthy by having a sensible diet<\/mark>.”（一家超市正在提供一系列关于<mark style=\"background-color: #bbf7d0;\">如何通过合理饮食来减肥和保持健康<\/mark>的课程。），这与选项D“eat-to-keep-fit course”（饮食健身课程）相符。因此选项D是正确答案。"},{"time":"00:05:56,200 --> 00:05:58,920","html":"Now, let's talk about the practicalities.","cn":"现在，我们来谈谈实际操作。","analysis":""},{"time":"00:06:01,960 --> 00:06:05,800","html":"That is the end of section 2.","cn":"第二部分到此结束。","analysis":""},{"time":"00:06:05,800 --> 00:06:09,000","html":"You now have half a minute to check your answers.","cn":"现在您有半分钟时间检查答案。","analysis":""},{"time":"00:06:30,960 --> 00:06:42,520","html":"Now turn to section 3 on page 5.","cn":"现在翻到第5页的第三部分。","analysis":""}],"transcriptHighlights":[{"qid":"11","text":"business people","answer":"B"},{"qid":"12","text":"to encourage more efficient land use","answer":"A"},{"qid":"13","text":"community centres","answer":"C"},{"qid":"14","text":"practical gardening tips","answer":"A"},{"qid":"15","text":"containers for plants","answer":"B"},{"qid":"16","text":"its help in encouraging community pride among students","answer":"C"},{"qid":"17","text":"cooking lessons","answer":"B"},{"qid":"18","text":"use of a greenhouse","answer":"E"},{"qid":"19","text":"advice on soil","answer":"C"},{"qid":"20","text":"eat-to-keep-fit course","answer":"D"}],"ownerInfo":"此内容由🍠@Listening 永不虾滑整理，仅作为分享供个人使用；禁止商用、倒卖和引流。有问题请先仔细看🍠这个账号的置顶和分享贴。没有团队，不是机构，纯个人分享。督学和其他相关课程请咨询主页另一个号@心情有点虾滑（不回任何机经相关消息）。"}</script>
<script>
const DATA=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const RENDER_VERSION=17;
let secs=0,review=false,timer=setInterval(()=>{secs++;drawTimer();if(secs%5===0)save(false)},1000),drag=null,currentCue=-1,loopCue=false,slowCue=false,showCn=true,showAnalysis=true,dictationMode=false,showOriginal=true,dictationAnswers={};const storeKey='ielts_v4_'+DATA.title.replace(/\W+/g,'_');
const CONFIG_DATA={answerKey:DATA.answerKey,questionList:DATA.questionIds.map(q=>Number(q)||q),localStorageKey:storeKey};window.localStorageKey=storeKey;window.DATA=DATA;window.CONFIG_DATA=CONFIG_DATA;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function matchingRepeatAttr(g){return (g.questions||[]).length>(g.options||[]).length?' data-repeat="true"':''}
function flowQuestionMap(g){let map={};(g.questions||[]).forEach(q=>map[q[0]]=q[1]);return map}
function flowQidsInText(raw,qmap){return Object.keys(qmap).filter(id=>new RegExp(`(?<!\\d)${id}(?!\\d)`).test(raw)).sort((a,b)=>Number(a)-Number(b))}
function renderFlowText(raw,qids){qids=Array.isArray(qids)?qids:[qids];let html=esc(String(raw||''));qids.forEach(qid=>{html=html.replace(new RegExp(`(?<!\\d)${qid}(?!\\d)`),`<span class="flow-num">${qid}</span>`)});let slotIdx=0;html=html.replace(/(?:_{2,}|…{2,}|\.{4,})/g,()=>{let qid=qids[slotIdx++]||qids[qids.length-1];return `<span class="slot" data-q="${qid}"></span>`});qids.slice(slotIdx).forEach(qid=>{html+=` <span class="slot" data-q="${qid}"></span>`});return html}
function renderFlowLine(line,qmap,used){let raw=String((typeof line==='object'&&line?line.text:line)||''),qids=flowQidsInText(raw,qmap);if(qids.length){qids.forEach(qid=>used.add(qid));return `<div class="flow-step flow-step-full"><div class="flow-text">${renderFlowText(raw,qids)}</div></div>`}return `<div class="flow-note">${esc(raw)}</div>`}
function renderFlowTable(lines,qmap,used){let rows=[],maxCols=1;lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0,cols=Number(meta.cols)||1,raw=String(meta.text||''),qids=flowQidsInText(raw,qmap);maxCols=Math.max(maxCols,cols,col+1);if(!rows[row])rows[row]=[];if(!rows[row][col])rows[row][col]=[];qids.forEach(qid=>used.add(qid));rows[row][col].push(`<div class="flow-text">${qids.length?renderFlowText(raw,qids):esc(raw)}</div>`)});return `<div class="flow-table-wrap"><table class="flow-table">${rows.map(cells=>{let filled=(cells||[]).map((parts,col)=>parts?{col,html:parts.join('')}:null).filter(Boolean);return `<tr>${filled.map(cell=>{let span=filled.length===1&&maxCols>1?` colspan="${maxCols}"`:'';return `<td${span}>${cell.html}</td>`}).join('')}</tr>`}).join('')}</table></div>`}
function renderFlowSteps(g){let qmap=flowQuestionMap(g),used=new Set(),lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:[]);if(lines.length){let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFlowTable(chunk,qmap,used);continue}html+=renderFlowLine(lines[i++],qmap,used)}return html+(g.questions||[]).filter(q=>!used.has(q[0])).map(q=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>`).join('')}return g.questions.map((q,idx)=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>${idx<g.questions.length-1?'<div class="flow-arrow">↓</div>':''}`).join('')}
function groupHTML(g){if(g.type==='matching'&&g.layout==='flow')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="flow-layout"><div class="flow-steps">${renderFlowSteps(g)}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='matching'&&g.layout==='diagram')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'diagram.png')}" alt="Diagram"></div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></div></section>`;
if(g.type==='matching')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='map')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'map.png')}" alt="Map" onerror="if(this.dataset.fallback!=='1'){this.dataset.fallback='1';this.src='diagram.png'}"></div><div class="map-grid"><div class="map-answer-list">${g.questions.map(q=>`<div class="map-row"><div class="map-row-label"><strong>${q[0]}</strong> ${esc(q[1]||'')}</div><div class="map-options" style="--map-options:${(g.options||[]).length||1}">${(g.options||[]).map(o=>`<div class="choice map-choice" data-name="q${q[0]}" data-value="${o}">${o}</div>`).join('')}</div></div>`).join('')}</div></div></div></section>`;
if(g.type==='single')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div>${g.questions.map(q=>`<p><strong>${q.id}</strong> ${esc(q.text)}</p>${q.options.map(o=>`<div class="choice single-choice" data-name="q${q.id}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}`).join('')}</section>`;
if(g.type==='multiple')return `<section class="group" data-limit="${g.limit}" data-id="${g.id}"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><p><strong>${esc(g.id)}</strong> ${esc(g.questionText)}</p>${g.options.map(o=>`<div class="choice multi-choice" data-name="q${g.id.replace('-','_')}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</section>`;
return `<section class="group"><h3>${esc(g.title)}</h3>${renderFillGroup(g)}</section>`}
function renderFillGroup(g){let qids=(g.questions||[]).map(q=>String(q.id));let used=new Set();let lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:g.questions.map(q=>`${q.id} ${q.text} _____`));let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFillTable(chunk,qids,used);continue}html+=renderFillLine(lines[i++],qids,used)}return html||`<div class="instruction">${esc(g.instruction||'Complete the notes below.')}</div>`}
function renderFillTable(lines,qids,used){let rows=[],maxCols=1;lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0,cols=Number(meta.cols)||1;maxCols=Math.max(maxCols,cols,col+1);if(!rows[row])rows[row]=[];if(!rows[row][col])rows[row][col]=[];rows[row][col].push(`<div class="fill-table-line">${renderFillLine(line,qids,used,true)}</div>`)});return `<div class="fill-table-wrap"><table class="fill-table">${rows.map((cells,idx)=>{let filled=(cells||[]).map((parts,col)=>parts?{col,html:parts.join('')}:null).filter(Boolean);return `<tr>${filled.map(cell=>{let tag=idx===0?'th':'td',span=filled.length===1&&maxCols>1?` colspan="${maxCols}"`:'';return `<${tag}${span}>${cell.html}</${tag}>`}).join('')}</tr>`}).join('')}</table></div>`}
function fillInput(qid,lead=''){return `<span class="blank-q">${esc(qid)}</span>${esc(lead)}<input class="blank" name="q${esc(qid)}" type="text" autocomplete="off" inputmode="text">`}
function fillLineAttrs(meta,isHeading){let cls=['doc-line'];if(isHeading)cls.push('fill-heading');if(meta.list)cls.push('is-list');let rawLevel=Math.max(0,Math.min(6,Number(meta.level)||0)),level=rawLevel>0?rawLevel+1:rawLevel;let style=meta.list?` style="--indent:${level*30}px"`:'';return `class="${cls.join(' ')}"${style}`}
function fillLineContent(meta,body){let level=Math.max(0,Number(meta.level)||0),bullet=level>0?'◦':'•';return meta.list?`<span class="doc-bullet">${bullet}</span><span class="doc-line-content">${body}</span>`:body}
function isFillHeading(raw,meta,hit){return !hit&&!meta.list&&!/(?:_{2,}|…{2,}|\.{4,})/.test(raw)&&!/^\d+\.?\s+/.test(raw)&&!/^(?:Complete|Write|Choose)\b/i.test(raw)}
function renderFillLine(line,qids,used,inner=false){let meta=typeof line==='object'&&line?line:{},raw=String(meta.text??line),html=esc(raw),hit=false;html=html.replace(/(^|[^\d])(\d{1,2})\.?\s*((?:£\s*)?)(?:_{2,}|…{2,}|\.{4,})/g,(m,prefix,qid,lead)=>{if(!qids.includes(qid))return m;used.add(qid);hit=true;return prefix+fillInput(qid,lead)});let m=raw.match(/^(\d+)\.?\s+(.+)$/);if(!hit&&m&&qids.includes(m[1])){used.add(m[1]);let body=esc(m[2]);let input=fillInput(m[1]);body=/(?:_+|…{2,}|\.{4,})/.test(body)?body.replace(/(?:_+|…{2,}|\.{4,})/,input):`${body} ${input}`;return inner?fillLineContent(meta,body):`<p ${fillLineAttrs(meta,false)}>${fillLineContent(meta,body)}</p>`}return inner?html:`<p ${fillLineAttrs(meta,isFillHeading(raw,meta,hit))}>${fillLineContent(meta,html)}</p>`}
function hardResetAnswers(){$$('input').forEach(i=>{i.value='';i.defaultValue=''});$$('.choice').forEach(c=>c.classList.remove('selected'));$$('.slot').forEach(s=>s.innerHTML='');refreshPool();updateNav()}
function render(){document.title=DATA.title;$('#ownerMeta').textContent=DATA.ownerInfo||'';$('#audio').src=DATA.audio||'audio.mp3';$('#content').innerHTML=DATA.groups.map(groupHTML).join('');$('#nav').innerHTML=DATA.questionIds.map(q=>`<div data-q="${q}">${q}</div>`).join('');bindDynamic();hardResetAnswers();load();updateNav()}
function bindDynamic(){
  $$('#content input').forEach(i=>{i.oninput=()=>{updateNav();save(false)};i.onchange=()=>{updateNav();save(false)}});
  $$('.single-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;$$(`.single-choice[data-name="${btn.dataset.name}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateNav();save(false)});
  $$('.map-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;$$(`.map-choice[data-name="${btn.dataset.name}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateNav();save(false)});
  $$('.multi-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;let group=btn.closest('.group'),limit=Number(group?.dataset.limit||99),name=btn.dataset.name,selected=$$(`.multi-choice[data-name="${name}"].selected`);if(!btn.classList.contains('selected')&&selected.length>=limit)return;btn.classList.toggle('selected');updateNav();save(false)});

function collectAnswers(){let answers={text:{},single:{},multiple:{},matching:{},map:{}};$$('#content input[name^="q"]').forEach(i=>answers.text[i.name]=i.value);$$('.single-choice.selected').forEach(c=>answers.single[c.dataset.name]=c.dataset.value);$$('.map-choice.selected').forEach(c=>answers.map[c.dataset.name]=c.dataset.value);let names=[...new Set($$('.multi-choice').map(c=>c.dataset.name))];names.forEach(name=>answers.multiple[name]=$$(`.multi-choice[data-name="${name}"].selected`).map(c=>c.dataset.value));$$('.slot').forEach(s=>{let tag=s.querySelector('.tag');if(tag)answers.matching[s.dataset.q]=tag.dataset.value});return answers}
function restoreAnswers(a={}){hardResetAnswers();Object.entries(a.text||{}).forEach(([name,val])=>{let el=$(`input[name="${name}"]`);if(el)el.value=val});Object.entries(a.single||{}).forEach(([name,val])=>{let el=$(`.single-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.map||{}).forEach(([name,val])=>{let el=$(`.map-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.multiple||{}).forEach(([name,vals])=>(vals||[]).forEach(val=>{let el=$(`.multi-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')}));Object.entries(a.matching||{}).forEach(([qid,val])=>{let opt=$(`.drag[data-value="${val}"]`),slot=$(`.slot[data-q="${qid}"]`);if(opt&&slot)slot.innerHTML=`<span class="tag" draggable="true" data-value="${val}">${esc(opt.textContent)}</span>`});refreshPool();restoreDragging();updateNav()}
function contentSnapshot(){let clone=$('#content').cloneNode(true);clone.querySelectorAll('.review').forEach(r=>r.remove());clone.querySelectorAll('input').forEach(i=>{i.setAttribute('value',i.value);i.removeAttribute('disabled')});clone.querySelectorAll('.choice').forEach(c=>c.classList.remove('disabled'));return clone.innerHTML}
function notesSnapshot(){$$('#notesList textarea').forEach(t=>{t.textContent=t.value;t.setAttribute('data-value',t.value)});return $('#notesList').innerHTML}
function layoutSignature(){return JSON.stringify([RENDER_VERSION,(DATA.groups||[]).map(g=>[g.type,g.layout||'',g.id||'',g.title||'',g.instruction||'',g.questionText||'',g.image||'',(g.options||[]),(g.questions||[]).map(q=>JSON.stringify(q))])])}
function save(show=false){let data={secs,answers:collectAnswers(),contentHtml:contentSnapshot(),layoutSignature:layoutSignature(),notes:notesSnapshot(),dark:document.body.classList.contains('dark'),font:document.documentElement.style.fontSize,dictationAnswers,studyState:{currentCue,loopCue,slowCue,showCn,showAnalysis,dictationMode,showOriginal},audioTime:audio?.currentTime||0};localStorage.setItem(storeKey,JSON.stringify(data));if(show)showToast()}
function load(){let raw=localStorage.getItem(storeKey);if(!raw)return;let d;try{d=JSON.parse(raw)}catch(err){console.warn('Saved progress could not be read.',err);return}secs=d.secs||0;if(d.answers){try{restoreAnswers(d.answers)}catch(err){console.warn('Saved answers could not be restored.',err)}}if(d.dictationAnswers)dictationAnswers=d.dictationAnswers;if(d.studyState)try{({currentCue=currentCue,loopCue=loopCue,slowCue=slowCue,showCn=showCn,showAnalysis=showAnalysis,dictationMode=dictationMode,showOriginal}=d.studyState)}catch(err){console.warn('Study state could not be restored.',err)}if(d.notes){try{$('#notesList').innerHTML=d.notes;$$('#notesList textarea').forEach(t=>{t.value=t.dataset.value||t.textContent||''})}catch(err){console.warn('Saved notes could not be restored.',err)}}if(d.dark)document.body.classList.add('dark');setFontSize(d.font||DEFAULT_FONT_SIZE,false);if(d.audioTime)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=d.audioTime},{once:true});bindNoteDeletes();drawTimer()}
function handleSelection(e){if(e.target.closest('#selbar,#notes,.bottom-bar'))return;let sel=window.getSelection();let hl=e.target.closest?.('.hl-brown,.hl-rose,.hl-blue');let bar=$('#selbar');if(hl&&sel.isCollapsed){bar.targetElem=hl;placeBar(bar,hl.getBoundingClientRect())}else if(sel&&!sel.isCollapsed&&$('#content').contains(sel.anchorNode)){bar.targetElem=null;placeBar(bar,sel.getRangeAt(0).getBoundingClientRect())}else{bar.hidden=true}}
function placeBar(bar,rect){bar.hidden=false;bar.style.left=Math.max(8,window.scrollX+rect.left+rect.width/2-95)+'px';bar.style.top=Math.max(8,window.scrollY+rect.top-46)+'px'}
function highlightedFromSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let node=sel.anchorNode?.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode;return node?.closest?.('.hl-brown,.hl-rose,.hl-blue')||null}
function handleToolbar(e){let act=e.target.closest('button')?.dataset.act;if(!act)return;let bar=$('#selbar'),target=bar.targetElem||highlightedFromSelection(),sel=window.getSelection();if(act==='del'&&target){unwrap(target);removeNote(target.dataset.hid)}else if(act==='hl'){if(target){if(target.classList.contains('hl-brown'))target.className='hl-rose';else if(target.classList.contains('hl-rose'))target.className='hl-rose';else target.className='hl-brown'}else{let span=wrapSelection('hl-brown');if(span)span.dataset.hid='h_'+Date.now()}}else if(act==='note'){let span=target||wrapSelection('hl-blue');if(span){span.className='hl-blue';if(!span.dataset.hid)span.dataset.hid='n_'+Date.now();createNote(span);document.body.classList.add('notes-open')}}bar.hidden=true;sel.removeAllRanges();save(false)}
function wrapSelection(cls){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let range=sel.getRangeAt(0);if(!$('#content').contains(range.commonAncestorContainer))return null;let span=document.createElement('span');span.className=cls;try{range.surroundContents(span)}catch{return null}return span}
function unwrap(el){let p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize()}
function clearUserHighlights(){$$('.hl-brown,.hl-rose,.hl-blue').forEach(unwrap)}
function createNote(span){let id=span.dataset.hid;if($(`.note-card[data-hid="${id}"]`))return;let card=document.createElement('div');card.className='note-card';card.dataset.hid=id;card.innerHTML=`<div class="note-quote">${esc(span.textContent.slice(0,120))}</div><textarea placeholder="Write note here..."></textarea><button class="delete-note" type="button">Delete</button>`;$('#notesList').prepend(card);bindNoteDeletes()}
function bindNoteDeletes(){$$('#notesList textarea').forEach(t=>t.oninput=()=>save(false));$$('.delete-note').forEach(btn=>btn.onclick=()=>{let card=btn.closest('.note-card'),id=card.dataset.hid,span=$(`[data-hid="${id}"]`);if(span)unwrap(span);card.remove();save(false)})}
function removeNote(id){if(!id)return;$(`.note-card[data-hid="${id}"]`)?.remove()}
function drawTimer(){let m=Math.floor(secs/60),s=secs%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
const DEFAULT_FONT_SIZE=16,MIN_FONT_SIZE=14,MAX_FONT_SIZE=22;
function currentFontSize(){return Number.parseInt(document.documentElement.style.fontSize,10)||DEFAULT_FONT_SIZE}
function setFontSize(size,persist=true){let n=Math.max(MIN_FONT_SIZE,Math.min(MAX_FONT_SIZE,Number(size)||DEFAULT_FONT_SIZE));document.documentElement.style.fontSize=n===DEFAULT_FONT_SIZE?'':n+'px';updateSizeButtons();if(persist)save(false)}
function adjustFontSize(delta){setFontSize(currentFontSize()+delta,true)}
function updateSizeButtons(){let size=currentFontSize(),dark=document.body.classList.contains('dark');$('#fontMinus')?.toggleAttribute('disabled',size<=MIN_FONT_SIZE);$('#fontPlus')?.toggleAttribute('disabled',size>=MAX_FONT_SIZE);$('#fontDefault')?.classList.toggle('active',size===DEFAULT_FONT_SIZE);$('#lightBtn')?.classList.toggle('active',!dark);$('#darkBtn')?.classList.toggle('active',dark)}
function resetAppearance(persist=true){document.body.classList.remove('dark');setFontSize(DEFAULT_FONT_SIZE,false);updateSizeButtons();if(persist)save(false)}
function clearAllProgress(){localStorage.removeItem(storeKey)}
$('#finish').onclick=finish;$('#save').onclick=()=>save(true);$('#clear').onclick=()=>{if(confirm('Clear all progress?')){window.resetTest();showToast('Clear complete')}};$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-open');save(false)};$('#closeNotes').onclick=()=>{document.body.classList.remove('notes-open');save(false)};$('#toggleIntensive').onclick=()=>{toggleIntensive();save(false)};$('#settingsBtn').onclick=()=>{$('#settings').classList.toggle('open');updateSizeButtons()};$('#lightBtn').onclick=()=>{document.body.classList.remove('dark');updateSizeButtons();save(false)};$('#darkBtn').onclick=()=>{document.body.classList.add('dark');updateSizeButtons();save(false)};$('#appearanceReset').onclick=()=>resetAppearance(true);$('#fontMinus').onclick=()=>adjustFontSize(-1);$('#fontPlus').onclick=()=>adjustFontSize(1);$('#fontDefault').onclick=()=>setFontSize(DEFAULT_FONT_SIZE,true);$('#settings').addEventListener('wheel',e=>{e.preventDefault();adjustFontSize(e.deltaY>0?-1:1)},{passive:false});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey)return;let key=e.key;if(key==='+'||key==='='){e.preventDefault();adjustFontSize(1)}else if(key==='-'||key==='_'){e.preventDefault();adjustFontSize(-1)}else if(key==='0'){e.preventDefault();resetAppearance(true)}});
const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
</script>
