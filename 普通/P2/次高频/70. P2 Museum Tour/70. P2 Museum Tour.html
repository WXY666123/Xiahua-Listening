label{display:block;margin:9px 0}.blank{width:min(170px,48vw);border:0;border-bottom:2px solid #94a3b8;border-radius:0;padding:4px 8px;background:transparent;color:var(--text);font:inherit;line-height:1.4;vertical-align:baseline}.blank:focus{outline:2px solid rgba(37,99,235,.18);border-bottom-color:var(--accent)}.blank-q{font-weight:700;margin-right:6px}.fill-heading{font-weight:700;margin:18px 0 8px}.choice{display:block;margin:8px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);padding:9px 12px;cursor:pointer;user-select:text}.choice.selected{background:#dbeafe;border-color:#60a5fa;color:#1e40af;font-weight:700}.doc-line{line-height:1.75;margin:10px 0}.doc-line.is-list{display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:8px;align-items:baseline;margin:7px 0 7px calc(32px + var(--indent,0px))}.doc-bullet{font-weight:900;color:var(--text);line-height:1}.doc-line-content{min-width:0}
.matching{display:grid;grid-template-columns:minmax(300px,1fr) minmax(220px,.45fr);gap:clamp(12px,2.2vw,24px);align-items:start;max-width:1040px}.match-row{display:grid;grid-template-columns:42px minmax(150px,340px) auto;gap:10px;align-items:center;width:min(100%,520px);margin:12px 0}.slot{min-width:86px;max-width:min(260px,42vw);min-height:38px;border:2px dashed #94a3b8;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;justify-self:start;padding:5px 8px;background:var(--bg);overflow-wrap:anywhere}.flow-layout{display:grid;grid-template-columns:minmax(320px,1fr) minmax(220px,.42fr);gap:clamp(12px,2.2vw,24px);align-items:start;max-width:1040px}.flow-steps{display:flex;flex-direction:column;gap:8px}.flow-step{display:grid;grid-template-columns:42px minmax(280px,520px) auto;gap:12px;align-items:center;width:min(100%,740px);border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:10px}.flow-step-full{grid-template-columns:1fr}.flow-step-full .slot{margin-left:10px;vertical-align:middle}.flow-note{width:min(100%,740px);font-weight:800;color:var(--text);padding:6px 2px 2px}.flow-num{font-weight:800;color:var(--accent)}.flow-text{line-height:1.55;min-width:0}.flow-arrow{width:min(100%,740px);color:var(--muted);font-weight:800;text-align:center}.flow-table-wrap{overflow:auto;width:min(100%,780px)}.flow-table{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--bg)}.flow-table td{border:1px solid var(--border);padding:12px 14px;vertical-align:middle;line-height:1.55}.flow-table .slot{margin-left:8px;vertical-align:middle}

.fill-table-wrap{overflow:auto;margin:12px 0 18px}.fill-table{width:100%;border-collapse:collapse;min-width:680px}.fill-table th,.fill-table td{border:1px solid var(--border);padding:10px 12px;vertical-align:top;line-height:1.45}.fill-table th{background:var(--bg);font-weight:800;text-align:left}.fill-table-line{margin:0 0 7px}.fill-table-line:last-child{margin-bottom:0}.fill-table .doc-line{margin:0}.fill-table .blank{width:min(150px,100%)}
.pool{border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:14px;display:flex;flex-direction:column;gap:10px}.drag,.tag{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:7px 11px;cursor:grab}.tag{background:var(--accent);color:#fff}.hidden{display:none}

#selbar{position:absolute;z-index:60;background:var(--panel);border:1px solid var(--border);box-shadow:0 10px 24px rgba(15,23,42,.18);border-radius:999px;padding:6px;display:inline-flex;gap:6px}#selbar[hidden]{display:none}#selbar button{border:0;border-radius:999px;background:var(--bg);color:var(--text);padding:6px 10px;cursor:pointer}

#toast{position:fixed;right:24px;bottom:86px;z-index:70;background:#10b981;color:#fff;border-radius:999px;padding:10px 16px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:translateY(0)}
@media(max-width:980px){.map-layout,.flow-layout{grid-template-columns:1fr}.map-image img{max-height:min(70vh,720px)}.map-row{grid-template-columns:minmax(90px,.5fr) minmax(330px,1fr);align-items:center}.map-grid{overflow-x:auto}.map-options{grid-template-columns:repeat(var(--map-options,10),minmax(30px,1fr))}}@media(max-width:820px){.matching{grid-template-columns:1fr}.match-row,.flow-step{grid-template-columns:42px minmax(0,1fr)}.match-row .slot,.flow-step .slot{grid-column:2;justify-self:start}.map-row{grid-template-columns:1fr}.bottom-bar{height:auto;min-height:82px;align-items:flex-start;gap:10px;flex-direction:column;padding:10px 16px}.content{padding-bottom:130px}.split .right{display:none}}
</style>

e":{"q11":"A","q12":"B","q13":"A","q14":"C","q15":"A","q16":"C"},"multiple":{},"multipleMap":{},"matching":{"q17":"C","q18":"B","q19":"E","q20":"D"},"map":{}},"transcriptLines":[{"time":"00:00:00,000 --> 00:00:10,720","html":"Section 2. You have some time to look at questions 11 to 16.","cn":"第二部分。你有一些时间查看第11至16题。","analysis":""},{"time":"00:00:30,000 --> 00:00:54,840","html":"Okay, well first of all I'll give you a bit of background to the museum and then tell you","cn":"好的，首先我会给大家介绍一点博物馆的背景，然后告诉大家","analysis":""},{"time":"00:00:54,840 --> 00:00:59,760","html":"about some of the galleries. You probably won't have time to see everything today so whatever","cn":"一些展厅的情况。你们今天可能没有时间看完所有内容，所以我","analysis":""},{"time":"00:00:59,760 --> 00:01:05,120","html":"recommend you do is go to the <mark style=\"background-color: #bbf7d0;\">Egyptian Room first<\/mark> because it's everyone's favorite place and it","cn":"建议你们先去<mark style=\"background-color: #bbf7d0;\">埃及展厅<\/mark>，因为那里是大家最喜欢的地方，而且","analysis":"<strong>答案解析：<\/strong>第11题问导游建议游客今天在博物馆做什么，原文说 go to the Egyptian Room first，因为它最受欢迎，对应 A “see the most popular exhibits first”。"},{"time":"00:01:05,120 --> 00:01:10,720","html":"gets very crowded with the school parties later in the day. Oh and I should mention that the","cn":"当天晚些时候会被学校团体挤满。哦，我还应该提一下，","analysis":""},{"time":"00:01:10,720 --> 00:01:15,280","html":"<mark style=\"background-color: #fecaca;\">photography gallery<\/mark>'s undergoing refurbishment at the moment so while that's definitely worth","cn":"<mark style=\"background-color: #fecaca;\">摄影展厅<\/mark>目前正在翻新，所以虽然它绝对值得","analysis":""},{"time":"00:01:15,280 --> 00:01:22,160","html":"seeing it'll have to wait for another time. Now the actual museum building itself is quite interesting.","cn":"参观，但只能等下次了。现在，博物馆建筑本身也相当有意思。","analysis":""},{"time":"00:01:22,160 --> 00:01:28,560","html":"It was designed by a local architect called William Craven in the 19th century at a time when","cn":"它由一位名叫 William Craven 的本地建筑师在19世纪设计，当时","analysis":""},{"time":"00:01:28,560 --> 00:01:34,080","html":"the city was developing rapidly with new <mark style=\"background-color: #fecaca;\">factories<\/mark> to cope with the expansion of the textile industry.","cn":"这座城市随着纺织业扩张而快速发展，出现了新的<mark style=\"background-color: #fecaca;\">工厂<\/mark>。","analysis":""},{"time":"00:01:35,680 --> 00:01:40,080","html":"The museum's built in a very similar style to the <mark style=\"background-color: #fecaca;\">railway station<\/mark> which was constructed at","cn":"博物馆的建筑风格与<mark style=\"background-color: #fecaca;\">火车站<\/mark>非常相似，火车站建于","analysis":""},{"time":"00:01:40,080 --> 00:01:45,920","html":"around the same time. That was designed by another architect but William Craven did also provide","cn":"大约同一时期。火车站是由另一位建筑师设计的，但 William Craven 确实也提供了","analysis":""},{"time":"00:01:45,920 --> 00:01:52,720","html":"the plans for the <mark style=\"background-color: #bbf7d0;\">town hall<\/mark> which was built just a few years later. Construction of the museum","cn":"<mark style=\"background-color: #bbf7d0;\">市政厅<\/mark>的设计方案，市政厅是在几年后建成的。博物馆的建造","analysis":"<strong>答案解析：<\/strong>第12题问 William Craven 还设计了什么，原文说 provided the plans for the town hall，因此答案是 B。"},{"time":"00:01:52,800 --> 00:02:01,600","html":"began in <mark style=\"background-color: #fecaca;\">1888<\/mark> with a large team of carpenters, stone masons and builders. Then in recent years it's","cn":"始于<mark style=\"background-color: #fecaca;\">1888年<\/mark>，由一大批木匠、石匠和建筑工人完成。近年来，它","analysis":""},{"time":"00:02:01,600 --> 00:02:07,920","html":"been extensively refurbished. The lovely big <mark style=\"background-color: #fecaca;\">windows<\/mark> have been retained to let the daylight flood in","cn":"经过了大规模翻新。漂亮的大<mark style=\"background-color: #fecaca;\">窗户<\/mark>被保留下来，让自然光照进来，","analysis":""},{"time":"00:02:07,920 --> 00:02:13,200","html":"but the award-winning part of the project was the restoration of the area around the central hall.","cn":"但该项目获奖的部分是中央大厅周围区域的修复。","analysis":""},{"time":"00:02:14,000 --> 00:02:19,040","html":"In particular the beautiful wrought iron <mark style=\"background-color: #bbf7d0;\">staircase<\/mark> which was brought back to its former glory.","cn":"尤其是那座美丽的锻铁<mark style=\"background-color: #bbf7d0;\">楼梯<\/mark>，它被恢复到了昔日的辉煌。","analysis":"<strong>答案解析：<\/strong>第13题问博物馆因保护什么而获奖，原文说 award-winning part... in particular the staircase，因此答案是 A。"},{"time":"00:02:20,000 --> 00:02:25,840","html":"Unfortunately the museum's original <mark style=\"background-color: #fecaca;\">tiled floor<\/mark> had to be replaced with new tiles of a similar design.","cn":"遗憾的是，博物馆原来的<mark style=\"background-color: #fecaca;\">瓷砖地面<\/mark>不得不用类似设计的新瓷砖替换。","analysis":""},{"time":"00:02:27,360 --> 00:02:32,240","html":"It was a very expensive project and since we don't charge admission fees we had to find other ways","cn":"这是一个非常昂贵的项目，而且由于我们不收门票，所以必须寻找其他方式","analysis":""},{"time":"00:02:32,240 --> 00:02:36,880","html":"of funding it. We did get some money from the Department of Culture at <mark style=\"background-color: #fecaca;\">National Level<\/mark>","cn":"为其筹资。我们确实从<mark style=\"background-color: #fecaca;\">国家层面<\/mark>的文化部门获得了一些资金，","analysis":""},{"time":"00:02:37,440 --> 00:02:42,080","html":"but we had even more generous support from companies and industries here in the city who were our","cn":"但我们从本市的公司和行业获得了更慷慨的支持，它们是我们的","analysis":""},{"time":"00:02:42,080 --> 00:02:48,400","html":"main benefactors. However we do also depend on donations from <mark style=\"background-color: #fecaca;\">people living in the area<\/mark> for the","cn":"主要资助者。不过，我们也依靠<mark style=\"background-color: #fecaca;\">当地居民<\/mark>的捐款来进行建筑的","analysis":"<strong>答案解析：<\/strong>第14题问项目大部分资金来自哪里，原文说 companies and industries in the city were our main benefactors，对应 C “local businesses”。"},{"time":"00:02:48,400 --> 00:02:55,040","html":"ongoing maintenance of the building. So how will the museum mainly be spending its money in the","cn":"持续维护。那么，博物馆未来五年主要会把资金花在什么地方呢？","analysis":""},{"time":"00:02:55,040 --> 00:03:00,960","html":"next five years? We already work with <mark style=\"background-color: #fecaca;\">schools and colleges<\/mark> helping people get a better understanding","cn":"我们已经与<mark style=\"background-color: #fecaca;\">学校和学院<\/mark>合作，帮助人们更好地理解","analysis":""},{"time":"00:03:00,960 --> 00:03:06,480","html":"of all the creative disciplines. We consider the most important part of our work the <mark style=\"background-color: #bbf7d0;\">restoration<\/mark>","cn":"所有创意学科。我们认为我们工作中最重要的部分是<mark style=\"background-color: #bbf7d0;\">修复<\/mark>","analysis":""},{"time":"00:03:06,480 --> 00:03:11,920","html":"of the valuable historical objects we are lucky enough to have in our possession and this will continue","cn":"我们有幸收藏的珍贵历史物品，而这将继续","analysis":""},{"time":"00:03:11,920 --> 00:03:17,600","html":"to be where the most funding is allocated. Of course it would be wonderful to <mark style=\"background-color: #fecaca;\">purchase new objects<\/mark>","cn":"是分配最多资金的领域。当然，如果能<mark style=\"background-color: #fecaca;\">购买新藏品<\/mark>会很棒，","analysis":"<strong>答案解析：<\/strong>第15题问未来五年博物馆主要投资什么，原文说 restoration of valuable historical objects... most funding is allocated，对应 A “restoring existing collections”。"},{"time":"00:03:17,600 --> 00:03:20,720","html":"for the museum but we simply don't have the space at the moment.","cn":"但目前我们实在没有空间。","analysis":""},{"time":"00:03:22,480 --> 00:03:27,120","html":"Well we do hope you enjoy your day today but if you would like to learn more about our exhibits","cn":"我们确实希望你们今天过得愉快，但如果你们想更多了解我们的展品，","analysis":""},{"time":"00:03:27,120 --> 00:03:32,000","html":"on display here I suggest you come to one of the Saturday morning <mark style=\"background-color: #bbf7d0;\">lectures<\/mark> which are given","cn":"我建议你们参加周六上午的<mark style=\"background-color: #bbf7d0;\">讲座<\/mark>，这些讲座","analysis":""},{"time":"00:03:32,000 --> 00:03:37,840","html":"every month by one of our team of experts. Of course you can pick up <mark style=\"background-color: #fecaca;\">leaflets<\/mark> about the exhibits","cn":"每个月由我们专家团队中的一位主讲。当然，你们也可以领取关于展品的<mark style=\"background-color: #fecaca;\">传单<\/mark>，","analysis":"<strong>答案解析：<\/strong>第16题问想更深入了解展品的游客应该做什么，原文说 come to Saturday morning lectures every month，对应 C “attend the monthly lectures”。"},{"time":"00:03:37,840 --> 00:03:43,680","html":"and most of the galleries too but you'll only get a basic introduction from those. We're also","cn":"以及大多数展厅的传单，但你只能从中获得基本介绍。我们也在","analysis":""},{"time":"00:03:43,680 --> 00:03:49,040","html":"working to update our <mark style=\"background-color: #fecaca;\">website<\/mark> so that it provides more background on the exhibits but that's still at","cn":"努力更新我们的<mark style=\"background-color: #fecaca;\">网站<\/mark>，让它提供更多展品背景信息，但这仍处于","analysis":""},{"time":"00:03:49,040 --> 00:03:58,320","html":"the planning stage. Before you hear the rest of the talk you have some time to look at question 17","cn":"规划阶段。在听剩余讲话之前，你有一些时间查看第17","analysis":""},{"time":"00:03:58,320 --> 00:04:00,480","html":"to 20 on page 4.","cn":"至20题，在第4页。","analysis":""},{"time":"00:04:13,840 --> 00:04:24,480","html":"Now listen and answer questions 17 to 20.","cn":"现在请听，并回答第17至20题。","analysis":""},{"time":"00:04:28,080 --> 00:04:32,400","html":"Okay now let me just tell you a bit about what's on at the moment.","cn":"好的，现在我来简单介绍一下目前正在展出的内容。","analysis":""},{"time":"00:04:33,200 --> 00:04:39,600","html":"Well we're very well known for our collection of <mark style=\"background-color: #bbf7d0;\">18th century paintings<\/mark> both oils and watercolors.","cn":"我们以收藏<mark style=\"background-color: #bbf7d0;\">18世纪绘画<\/mark>而闻名，包括油画和水彩画。","analysis":""},{"time":"00:04:40,320 --> 00:04:44,400","html":"Some of these are English landscapes and portraits but we also have paintings by other","cn":"其中一些是英国风景画和肖像画，但我们也有其他","analysis":""},{"time":"00:04:44,400 --> 00:04:50,400","html":"<mark style=\"background-color: #bbf7d0;\">European<\/mark> artists who were working during this period. If you're interested in art that's a bit","cn":"<mark style=\"background-color: #bbf7d0;\">欧洲<\/mark>艺术家在这一时期创作的画作。如果你对更","analysis":"<strong>答案解析：<\/strong>第17题问 18th-century paintings 的信息，原文说有 English 作品，也有其他 European artists 的作品，说明来自不同国家，对应 C。"},{"time":"00:04:50,400 --> 00:04:57,200","html":"nearer home the <mark style=\"background-color: #bbf7d0;\">Farnley collection<\/mark> is a set of drawings by Paul Farnley. He was born in <mark style=\"background-color: #fecaca;\">Ireland<\/mark>","cn":"接近本地的艺术感兴趣，<mark style=\"background-color: #bbf7d0;\">Farnley collection<\/mark> 是 Paul Farnley 的一组绘画。他出生在<mark style=\"background-color: #fecaca;\">爱尔兰<\/mark>，","analysis":""},{"time":"00:04:57,200 --> 00:05:02,720","html":"but he came to work here in the city in the early 20th century and then made it his <mark style=\"background-color: #bbf7d0;\">home<\/mark>.","cn":"但在20世纪初来到这座城市工作，并把这里当作自己的<mark style=\"background-color: #bbf7d0;\">家<\/mark>。","analysis":"<strong>答案解析：<\/strong>第18题问 Farnley collection 的信息，原文说 Paul Farnley 后来 made it his home，说明作品来自本地居民，对应 B。"},{"time":"00:05:03,840 --> 00:05:08,720","html":"He worked on a factory but spent his spare time drawing the buildings and urban landscape","cn":"他在一家工厂工作，但业余时间会画这座城市的建筑和城市景观，","analysis":""},{"time":"00:05:08,720 --> 00:05:15,360","html":"of the city and his work has now been collected and displayed here. On a more practical note we","cn":"他的作品现在已经被收藏并在这里展出。说到更实用的东西，","analysis":""},{"time":"00:05:15,360 --> 00:05:20,160","html":"have a display of <mark style=\"background-color: #bbf7d0;\">kitchen appliances<\/mark> which might interest you. These are the sorts of things you","cn":"我们有一个<mark style=\"background-color: #bbf7d0;\">厨房电器<\/mark>展，可能会让你感兴趣。这些是你","analysis":""},{"time":"00:05:20,160 --> 00:05:26,480","html":"wouldn't normally expect to see in a museum. There's an electric potato peeler from the <mark style=\"background-color: #fecaca;\">1970s<\/mark> which","cn":"通常不会想到会在博物馆里看到的东西。其中有一台来自<mark style=\"background-color: #fecaca;\">20世纪70年代<\/mark>的电动削土豆器，","analysis":""},{"time":"00:05:26,480 --> 00:05:32,240","html":"sold really well at the time but no one's got one now. There are lots of other similar appliances","cn":"当时卖得很好，但现在已经没人有了。还有很多类似的电器，","analysis":""},{"time":"00:05:32,240 --> 00:05:36,000","html":"which must have seemed like great ideas at the time but which <mark style=\"background-color: #bbf7d0;\">never took off<\/mark>.","cn":"在当时一定看起来是很棒的想法，但后来<mark style=\"background-color: #bbf7d0;\">从未真正流行起来<\/mark>。","analysis":"<strong>答案解析：<\/strong>第19题问 kitchen appliances 的信息，原文说 no one’s got one now / never took off，说明展示的是现在不常见的东西，对应 E。"},{"time":"00:05:36,480 --> 00:05:42,480","html":"You might also like to visit the <mark style=\"background-color: #bbf7d0;\">fashion gallery<\/mark>. This is an exhibition which is running for the","cn":"你们可能也想参观<mark style=\"background-color: #bbf7d0;\">时装展厅<\/mark>。这是一个展览，将只持续","analysis":""},{"time":"00:05:42,480 --> 00:05:49,760","html":"next few weeks only and shows men's and women's fashion from <mark style=\"background-color: #fecaca;\">1900 to 2000<\/mark> including some of the","cn":"接下来几周，展示<mark style=\"background-color: #fecaca;\">1900年至2000年<\/mark>的男女时装，包括当时一些","analysis":"<strong>答案解析：<\/strong>第20题问 fashion gallery 的信息，原文说 running for the next few weeks only，说明只是临时展出，对应 D。"},{"time":"00:05:49,760 --> 00:05:55,600","html":"famous designers of the time. Okay so if anyone's got any questions follow me.","cn":"著名设计师的作品。好了，如果有人有问题，请跟我来。","analysis":""},{"time":"00:05:59,120 --> 00:06:04,640","html":"That is the end of section 2. You now have half a minute to check your answers.","cn":"第二部分到此结束。现在你有半分钟时间检查答案。","analysis":""},{"time":"00:06:36,000 --> 00:06:38,720","html":"Now turn to section 3.","cn":"现在翻到第三部分。","analysis":""}],"transcriptHighlights":[{"qid":"11","text":"see the most popular exhibits first","answer":"A"},{"qid":"12","text":"the town hall","answer":"B"},{"qid":"13","text":"staircase","answer":"A"},{"qid":"14","text":"local businesses","answer":"C"},{"qid":"15","text":"restoring existing collections","answer":"A"},{"qid":"16","text":"attend the monthly lectures","answer":"C"},{"qid":"17","text":"has exhibits from various countries","answer":"C"},{"qid":"18","text":"consists of work by a local resident","answer":"B"},{"qid":"19","text":"shows things that are no longer common","answer":"E"},{"qid":"20","text":"is only on temporary display","answer":"D"}],"ownerInfo":"此内容由🍠@Listening 永不虾滑整理，仅作为分享供个人使用；禁止商用、倒卖和引流。有问题请先仔细看🍠这个账号的置顶和分享贴。没有团队，不是机构，纯个人分享。督学和其他相关课程请咨询主页另一个号@心情有点虾滑（不回任何机经相关消息）。"}</script>

function markTranscript(text){let raw=String(text??''),lower=raw.toLowerCase(),ranges=[];for(let term of highlightTerms()){let needle=term.toLowerCase(),start=0;while(needle&&start<lower.length){let idx=lower.indexOf(needle,start);if(idx<0)break;let end=idx+needle.length,before=idx===0?' ':lower[idx-1],after=end>=lower.length?' ':lower[end];let bounded=!/[a-z0-9]/i.test(before)&&!/[a-z0-9]/i.test(after);if(bounded&&!ranges.some(r=>idx<r.end&&end>r.start))ranges.push({start:idx,end});start=end}}ranges.sort((a,b)=>a.start-b.start);let out='',pos=0;for(let r of ranges){out+=esc(raw.slice(pos,r.start));out+=`<span class="answer-highlight">${esc(raw.slice(r.start,r.end))}</span>`;pos=r.end}return out+esc(raw.slice(pos))}
function markStyle(el){let m=String(el.getAttribute('style')||'').match(/background-color\s*:\s*(#[0-9a-fA-F]{3,8})/);return m?`background-color: ${m[1]};`:''}
function sanitizeTranscriptHtml(html){let t=document.createElement('template');t.innerHTML=String(html||'');t.content.querySelectorAll('*').forEach(el=>{let tag=el.tagName.toLowerCase();if(tag!=='mark'&&tag!=='span'&&tag!=='strong'){el.replaceWith(document.createTextNode(el.textContent));return}let cls=[...el.classList].filter(c=>c==='hl'||/^q\\d+$/.test(c)||c==='answer-highlight'||c==='q-label').join(' '),style=tag==='mark'?markStyle(el):'';[...el.attributes].forEach(a=>el.removeAttribute(a.name));if(tag==='mark'&&!cls&&!style)cls='answer-highlight';if(cls)el.setAttribute('class',cls);if(style)el.setAttribute('style',style)});return t.innerHTML}
function formatCueTime(time){return String(time||'').replace(/,000\b/g,'')}
function parseStamp(t){let m=String(t||'').match(/(?:(\d{1,3}):)?(\d{2}):(\d{2})[,:.](\d{1,3})/);return m?+(m[1]||0)*3600+ +m[2]*60+ +m[3]+ +(m[4]||0)/1000:0}
function cueRange(x){let parts=String(x?.time||'').split(/\s*-->\s*/);return {start:parseStamp(parts[0]),end:parseStamp(parts[1])}}
function transcriptLineHTML(x){if(x&&typeof x==='object'&&x.html!==undefined){let html=sanitizeTranscriptHtml(x.html),hit=/<mark\b|class="[^"]*(hl|answer-highlight)/.test(html),cn=x.cn?`<div class="cue-cn">${sanitizeTranscriptHtml(x.cn)}</div>`:'',analysis=x.analysis?`<div class="cue-analysis">${sanitizeTranscriptHtml(x.analysis)}</div>`:'';return `<section class="cue ${hit?'has-hit':''}"><div class="cue-time">${esc(formatCueTime(x.time))}</div><div><p>${html}</p>${cn}${analysis}</div></section>`}return `<p>${markTranscript(Array.isArray(x)?(x[2]||x.join(' ')):x)}</p>`}
function buildTranscript(){let lines=DATA.transcriptLines||[];$('#transcript').classList.remove('hide-cn','hide-analysis');$('#transcript').innerHTML=lines.length?`<h3>Listening Transcript</h3>${lines.map(transcriptLineHTML).join('')}<p>&nbsp;</p>`:'<h3>Listening Transcript</h3><p>No transcript was provided in the source file.</p><p>&nbsp;</p>'}
function studyLines(){return (DATA.transcriptLines||[]).filter(x=>x&&typeof x==='object'&&x.html!==undefined)}
function studyCueHTML(x,i){let html=sanitizeTranscriptHtml(x.html),cn=x.cn?`<div class="cue-cn">${sanitizeTranscriptHtml(x.cn)}</div>`:'',analysis=x.analysis?`<div class="cue-analysis">${sanitizeTranscriptHtml(x.analysis)}</div>`:'',saved=esc(dictationAnswers[i]||''),box=dictationMode?`<textarea class="dictation-box" data-idx="${i}" placeholder="输入你听到的内容..." onclick="event.stopPropagation()">${saved}</textarea>`:'';return `<button class="study-cue" type="button" data-idx="${i}"><span class="cue-time">${esc(formatCueTime(x.time))}</span><p>${html}</p>${cn}${analysis}${box}</button>`}
function buildIntensive(){let lines=studyLines(),panel=$('#transcript');panel.classList.toggle('hide-cn',!showCn);panel.classList.toggle('hide-analysis',!showAnalysis);panel.classList.toggle('dictation-mode',dictationMode);panel.classList.toggle('show-original',showOriginal);panel.innerHTML=lines.length?`<div class="study-head"><h3>原文和精听</h3><div class="study-controls"><button id="prevCue" type="button">上一句</button><button id="playCue" type="button">播放 / 暂停</button><button id="nextCue" type="button">下一句</button><button id="loopCue" type="button" class="${loopCue?'active':''}">循环当前句</button><button id="slowCue" type="button" class="${slowCue?'active':''}">0.8x 慢速</button></div><div class="study-controls"><button id="dictationCue" type="button" class="${dictationMode?'active':''}">听写模式</button><button id="originalCue" type="button" class="${showOriginal?'active':''}">显示原文</button><button id="cnCue" type="button" class="${showCn?'active':''}">显示中文</button><button id="analysisCue" type="button" class="${showAnalysis?'active':''}">显示解析</button></div></div><div class="study-list">${lines.map(studyCueHTML).join('')}</div><p>&nbsp;</p>`:'<h3>原文和精听</h3><p>No timed transcript was provided.</p><p>&nbsp;</p>';bindStudyControls();setActiveCue(currentCue)}
function toggleIntensive(){let main=$('#main');if(main.classList.contains('split')&&$('#transcript .study-head')){main.classList.remove('split');return}main.classList.add('split');buildIntensive()}
function bindStudyControls(){let panel=$('#transcript');panel.querySelectorAll('.study-cue').forEach(btn=>btn.onclick=e=>{if(e.target.closest('.dictation-box'))return;playCue(Number(btn.dataset.idx))});panel.querySelectorAll('.dictation-box').forEach(box=>{box.oninput=()=>{dictationAnswers[box.dataset.idx]=box.value;save(false)}});$('#prevCue')?.addEventListener('click',()=>playCue(Math.max(0,(currentCue<0?0:currentCue-1))));$('#nextCue')?.addEventListener('click',()=>playCue(Math.min(studyLines().length-1,(currentCue<0?0:currentCue+1))));$('#playCue')?.addEventListener('click',()=>audio.paused?audio.play():audio.pause());$('#loopCue')?.addEventListener('click',()=>{loopCue=!loopCue;buildIntensive();save(false)});$('#slowCue')?.addEventListener('click',()=>{slowCue=!slowCue;audio.playbackRate=slowCue ? 0.8 : +$('#speed').value;buildIntensive();save(false)});$('#cnCue')?.addEventListener('click',()=>{showCn=!showCn;buildIntensive();save(false)});$('#analysisCue')?.addEventListener('click',()=>{showAnalysis=!showAnalysis;buildIntensive();save(false)});$('#dictationCue')?.addEventListener('click',()=>{dictationMode=!dictationMode;if(dictationMode){showOriginal=false;showCn=false;showAnalysis=false}else{showOriginal=true;showCn=true;showAnalysis=true}buildIntensive();save(false)});$('#originalCue')?.addEventListener('click',()=>{showOriginal=!showOriginal;buildIntensive();save(false)})}
function playCue(i){let lines=studyLines();if(!lines.length)return;currentCue=Math.max(0,Math.min(i,lines.length-1));let r=cueRange(lines[currentCue]);audio.currentTime=r.start||0;if(slowCue)audio.playbackRate=.8;audio.play();setActiveCue(currentCue);save(false)}
function setActiveCue(i){$$('.study-cue').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.idx)===i));let active=$(`.study-cue[data-idx="${i}"]`);active?.scrollIntoView({block:'nearest'})}
function maintainCueLoop(){if(currentCue<0||!loopCue)return;let line=studyLines()[currentCue],r=cueRange(line);if(r.end&&audio.currentTime>=r.end-.05){audio.currentTime=r.start||0;audio.play()}}
function showToast(msg='Progress saved!'){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1400)}
function collectAnswers(){let answers={text:{},single:{},multiple:{},matching:{},map:{}};$$('#content input[name^="q"]').forEach(i=>answers.text[i.name]=i.value);$$('.single-choice.selected').forEach(c=>answers.single[c.dataset.name]=c.dataset.value);$$('.map-choice.selected').forEach(c=>answers.map[c.dataset.name]=c.dataset.value);let names=[...new Set($$('.multi-choice').map(c=>c.dataset.name))];names.forEach(name=>answers.multiple[name]=$$(`.multi-choice[data-name="${name}"].selected`).map(c=>c.dataset.value));$$('.slot').forEach(s=>{let tag=s.querySelector('.tag');if(tag)answers.matching[s.dataset.q]=tag.dataset.value});return answers}
function restoreAnswers(a={}){hardResetAnswers();Object.entries(a.text||{}).forEach(([name,val])=>{let el=$(`input[name="${name}"]`);if(el)el.value=val});Object.entries(a.single||{}).forEach(([name,val])=>{let el=$(`.single-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.map||{}).forEach(([name,val])=>{let el=$(`.map-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.multiple||{}).forEach(([name,vals])=>(vals||[]).forEach(val=>{let el=$(`.multi-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')}));Object.entries(a.matching||{}).forEach(([qid,val])=>{let opt=$(`.drag[data-value="${val}"]`),slot=$(`.slot[data-q="${qid}"]`);if(opt&&slot)slot.innerHTML=`<span class="tag" draggable="true" data-value="${val}">${esc(opt.textContent)}</span>`});refreshPool();restoreDragging();updateNav()}
function contentSnapshot(){let clone=$('#content').cloneNode(true);clone.querySelectorAll('.review').forEach(r=>r.remove());clone.querySelectorAll('input').forEach(i=>{i.setAttribute('value',i.value);i.removeAttribute('disabled')});clone.querySelectorAll('.choice').forEach(c=>c.classList.remove('disabled'));return clone.innerHTML}
function notesSnapshot(){$$('#notesList textarea').forEach(t=>{t.textContent=t.value;t.setAttribute('data-value',t.value)});return $('#notesList').innerHTML}
function layoutSignature(){return JSON.stringify([RENDER_VERSION,(DATA.groups||[]).map(g=>[g.type,g.layout||'',g.id||'',g.title||'',g.instruction||'',g.questionText||'',g.image||'',(g.options||[]),(g.questions||[]).map(q=>JSON.stringify(q))])])}
function save(show=false){let data={secs,answers:collectAnswers(),contentHtml:contentSnapshot(),layoutSignature:layoutSignature(),notes:notesSnapshot(),dark:document.body.classList.contains('dark'),font:document.documentElement.style.fontSize,dictationAnswers,studyState:{currentCue,loopCue,slowCue,showCn,showAnalysis,dictationMode,showOriginal},audioTime:audio?.currentTime||0};localStorage.setItem(storeKey,JSON.stringify(data));if(show)showToast()}
function load(){let raw=localStorage.getItem(storeKey);if(!raw)return;let d;try{d=JSON.parse(raw)}catch(err){console.warn('Saved progress could not be read.',err);return}secs=d.secs||0;if(d.answers){try{restoreAnswers(d.answers)}catch(err){console.warn('Saved answers could not be restored.',err)}}if(d.dictationAnswers)dictationAnswers=d.dictationAnswers;if(d.studyState)try{({currentCue=currentCue,loopCue=loopCue,slowCue=slowCue,showCn=showCn,showAnalysis=showAnalysis,dictationMode=dictationMode,showOriginal}=d.studyState)}catch(err){console.warn('Study state could not be restored.',err)}if(d.notes){try{$('#notesList').innerHTML=d.notes;$$('#notesList textarea').forEach(t=>{t.value=t.dataset.value||t.textContent||''})}catch(err){console.warn('Saved notes could not be restored.',err)}}if(d.dark)document.body.classList.add('dark');setFontSize(d.font||DEFAULT_FONT_SIZE,false);if(d.audioTime)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=d.audioTime},{once:true});bindNoteDeletes();drawTimer()}
function handleSelection(e){if(e.target.closest('#selbar,#notes,.bottom-bar'))return;let sel=window.getSelection();let hl=e.target.closest?.('.hl-brown,.hl-rose,.hl-blue');let bar=$('#selbar');if(hl&&sel.isCollapsed){bar.targetElem=hl;placeBar(bar,hl.getBoundingClientRect())}else if(sel&&!sel.isCollapsed&&$('#content').contains(sel.anchorNode)){bar.targetElem=null;placeBar(bar,sel.getRangeAt(0).getBoundingClientRect())}else{bar.hidden=true}}
function placeBar(bar,rect){bar.hidden=false;bar.style.left=Math.max(8,window.scrollX+rect.left+rect.width/2-95)+'px';bar.style.top=Math.max(8,window.scrollY+rect.top-46)+'px'}
function highlightedFromSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let node=sel.anchorNode?.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode;return node?.closest?.('.hl-brown,.hl-rose,.hl-blue')||null}
function handleToolbar(e){let act=e.target.closest('button')?.dataset.act;if(!act)return;let bar=$('#selbar'),target=bar.targetElem||highlightedFromSelection(),sel=window.getSelection();if(act==='del'&&target){unwrap(target);removeNote(target.dataset.hid)}else if(act==='hl'){if(target){if(target.classList.contains('hl-brown'))target.className='hl-rose';else if(target.classList.contains('hl-rose'))target.className='hl-rose';else target.className='hl-brown'}else{let span=wrapSelection('hl-brown');if(span)span.dataset.hid='h_'+Date.now()}}else if(act==='note'){let span=target||wrapSelection('hl-blue');if(span){span.className='hl-blue';if(!span.dataset.hid)span.dataset.hid='n_'+Date.now();createNote(span);document.body.classList.add('notes-open')}}bar.hidden=true;sel.removeAllRanges();save(false)}
function wrapSelection(cls){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let range=sel.getRangeAt(0);if(!$('#content').contains(range.commonAncestorContainer))return null;let span=document.createElement('span');span.className=cls;try{range.surroundContents(span)}catch{return null}return span}
function unwrap(el){let p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize()}
function clearUserHighlights(){$$('.hl-brown,.hl-rose,.hl-blue').forEach(unwrap)}
function createNote(span){let id=span.dataset.hid;if($(`.note-card[data-hid="${id}"]`))return;let card=document.createElement('div');card.className='note-card';card.dataset.hid=id;card.innerHTML=`<div class="note-quote">${esc(span.textContent.slice(0,120))}</div><textarea placeholder="Write note here..."></textarea><button class="delete-note" type="button">Delete</button>`;$('#notesList').prepend(card);bindNoteDeletes()}
function bindNoteDeletes(){$$('#notesList textarea').forEach(t=>t.oninput=()=>save(false));$$('.delete-note').forEach(btn=>btn.onclick=()=>{let card=btn.closest('.note-card'),id=card.dataset.hid,span=$(`[data-hid="${id}"]`);if(span)unwrap(span);card.remove();save(false)})}
function removeNote(id){if(!id)return;$(`.note-card[data-hid="${id}"]`)?.remove()}
function drawTimer(){let m=Math.floor(secs/60),s=secs%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
const DEFAULT_FONT_SIZE=16,MIN_FONT_SIZE=14,MAX_FONT_SIZE=22;
function currentFontSize(){return Number.parseInt(document.documentElement.style.fontSize,10)||DEFAULT_FONT_SIZE}
function setFontSize(size,persist=true){let n=Math.max(MIN_FONT_SIZE,Math.min(MAX_FONT_SIZE,Number(size)||DEFAULT_FONT_SIZE));document.documentElement.style.fontSize=n===DEFAULT_FONT_SIZE?'':n+'px';updateSizeButtons();if(persist)save(false)}
function adjustFontSize(delta){setFontSize(currentFontSize()+delta,true)}
function updateSizeButtons(){let size=currentFontSize(),dark=document.body.classList.contains('dark');$('#fontMinus')?.toggleAttribute('disabled',size<=MIN_FONT_SIZE);$('#fontPlus')?.toggleAttribute('disabled',size>=MAX_FONT_SIZE);$('#fontDefault')?.classList.toggle('active',size===DEFAULT_FONT_SIZE);$('#lightBtn')?.classList.toggle('active',!dark);$('#darkBtn')?.classList.toggle('active',dark)}
function resetAppearance(persist=true){document.body.classList.remove('dark');setFontSize(DEFAULT_FONT_SIZE,false);updateSizeButtons();if(persist)save(false)}
function clearAllProgress(){localStorage.removeItem(storeKey)}
$('#finish').onclick=finish;$('#save').onclick=()=>save(true);$('#clear').onclick=()=>{if(confirm('Clear all progress?')){window.resetTest();showToast('Clear complete')}};$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-open');save(false)};$('#closeNotes').onclick=()=>{document.body.classList.remove('notes-open');save(false)};$('#toggleIntensive').onclick=()=>{toggleIntensive();save(false)};$('#settingsBtn').onclick=()=>{$('#settings').classList.toggle('open');updateSizeButtons()};$('#lightBtn').onclick=()=>{document.body.classList.remove('dark');updateSizeButtons();save(false)};$('#darkBtn').onclick=()=>{document.body.classList.add('dark');updateSizeButtons();save(false)};$('#appearanceReset').onclick=()=>resetAppearance(true);$('#fontMinus').onclick=()=>adjustFontSize(-1);$('#fontPlus').onclick=()=>adjustFontSize(1);$('#fontDefault').onclick=()=>setFontSize(DEFAULT_FONT_SIZE,true);$('#settings').addEventListener('wheel',e=>{e.preventDefault();adjustFontSize(e.deltaY>0?-1:1)},{passive:false});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey)return;let key=e.key;if(key==='+'||key==='='){e.preventDefault();adjustFontSize(1)}else if(key==='-'||key==='_'){e.preventDefault();adjustFontSize(-1)}else if(key==='0'){e.preventDefault();resetAppearance(true)}});
const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
