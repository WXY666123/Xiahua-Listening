"analysis":""},{"time":"00:00:15,280 --> 00:00:20,960","html":"First, you have some time to look at questions 21 to 24.","cn":"首先，你有一些时间查看问题21至24。","analysis":""},{"time":"00:00:30,000 --> 00:00:46,120","html":"Now listen carefully and answer questions 21 to 24.","cn":"现在请仔细听并回答问题21至24。","analysis":""},{"time":"00:00:46,120 --> 00:00:53,320","html":"[Jason]: Becky, hi, what are you doing here at the college?","cn":"[杰森]: 贝琪，你好，你在这里的大学做什么？","analysis":""},{"time":"00:00:53,320 --> 00:00:57,920","html":"[Becky]: Hi Jason, just using the library, what about you?","cn":"[贝琪]: 嗨，杰森，我只是来用图书馆，你呢？","analysis":""},{"time":"00:00:57,920 --> 00:01:02,720","html":"[Jason]: I'm taking the PSW program, you know, personal support worker.","cn":"[杰森]: 我正在上PSW课程，你知道的，就是个人护理员。","analysis":""},{"time":"00:01:02,720 --> 00:01:07,240","html":"[Becky]: You're kidding, I've just qualified as a PSW.","cn":"[贝琪]: 你在开玩笑吧，我刚获得PSW资格。","analysis":""},{"time":"00:01:07,240 --> 00:01:08,240","html":"[Jason]: Really?","cn":"[杰森]: 真的吗？","analysis":""},{"time":"00:01:08,240 --> 00:01:10,720","html":"I'd love to talk to you about the program.","cn":"我很想和你聊聊这个课程。","analysis":""},{"time":"00:01:10,720 --> 00:01:17,000","html":"[Becky]: Okay, well, first off, the main duties they taught me here were exactly what I needed","cn":"[贝琪]: 好的，首先，他们在这里教我的主要职责正是我工作所需的。","analysis":""},{"time":"00:01:17,000 --> 00:01:18,160","html":"on the job.","cn":"职责。","analysis":""},{"time":"00:01:18,160 --> 00:01:20,640","html":"[Jason]: You mean like <mark style=\"background-color: #bbf7d0;\">bathing and dressing people<\/mark>?","cn":"[杰森]: 你是指像<mark style=\"background-color: #bbf7d0;\">帮人洗澡和穿衣<\/mark>吗？","analysis":""},{"time":"00:01:20,640 --> 00:01:26,920","html":"[Becky]: Yes, young and old need this, you'll work with people of all ages from young people","cn":"[贝琪]: 是的，无论老少都需要这个，你会和所有年龄段的人一起工作，从年轻的","analysis":""},{"time":"00:01:26,920 --> 00:01:30,000","html":"with disabilities to seniors.","cn":"残疾人到老年人。","analysis":""},{"time":"00:01:30,000 --> 00:01:35,200","html":"But you know, nothing really prepares you for how alone many people are.","cn":"但你知道，没有什么能真正让你准备好面对许多人有多么孤独。","analysis":""},{"time":"00:01:35,200 --> 00:01:40,160","html":"They crave conversation, and I don't mind chatting with them while I work, <mark style=\"background-color: #fecaca;\">though that's<\/mark>","cn":"他们渴望交谈，我不介意在工作时和他们聊天，<mark style=\"background-color: #fecaca;\">尽管那不是<\/mark>","analysis":""},{"time":"00:01:40,160 --> 00:01:42,840","html":"<mark style=\"background-color: #fecaca;\">not officially in my job description.<\/mark>","cn":"<mark style=\"background-color: #fecaca;\">我工作职责中正式包含的内容。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题21和22询问PSW的两项主要职责。 <mark style=\"background-color: #bbf7d0;\">\"bathing and dressing people\"<\/mark> (洗澡和穿衣) 是Becky明确提到的主要职责之一，对应选项C（帮助满足身体需求）。 <mark style=\"background-color: #fecaca;\">\"though that's not officially in my job description\"<\/mark> (尽管那不是我工作职责中正式包含的内容) 表明与客户交谈（选项A）不是正式职责，因此是干扰项。"},{"time":"00:01:42,840 --> 00:01:46,360","html":"[Jason]: I think I'd like to focus on seniors care.","cn":"[杰森]: 我想我更想专注于老年护理。","analysis":""},{"time":"00:01:46,360 --> 00:01:51,440","html":"And with the country's older population growing, maybe I'll get a job fast.","cn":"而且随着国家老年人口的增长，也许我能很快找到工作。","analysis":""},{"time":"00:01:51,440 --> 00:01:54,000","html":"<mark style=\"background-color: #fecaca;\">Do we have to be responsible for any medications?<\/mark>","cn":"<mark style=\"background-color: #fecaca;\">我们需要负责任何药物吗？<\/mark>","analysis":""},{"time":"00:01:54,000 --> 00:01:56,560","html":"[Becky]: <mark style=\"background-color: #fecaca;\">No, that's not for us to do.<\/mark>","cn":"[贝琪]: <mark style=\"background-color: #fecaca;\">不，那不是我们做的。<\/mark>","analysis":""},{"time":"00:01:56,560 --> 00:02:00,440","html":"<mark style=\"background-color: #fecaca;\">And while you will prepare meals, you won't feed people.<\/mark>","cn":"<mark style=\"background-color: #fecaca;\">虽然你会准备饭菜，但你不会喂人吃饭。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题21和22询问PSW的两项主要职责。 <mark style=\"background-color: #fecaca;\">\"Do we have to be responsible for any medications? No, that's not for us to do.\"<\/mark> (我们需要负责任何药物吗？不，那不是我们做的。) 明确指出管理药物（选项E）不是PSW的职责，因此是干扰项。 <mark style=\"background-color: #fecaca;\">\"And while you will prepare meals, you won't feed people.\"<\/mark> (虽然你会准备饭菜，但你不会喂人吃饭。) 明确指出帮助客户饮食（选项B）不是PSW的职责，因此是干扰项。"},{"time":"00:02:00,440 --> 00:02:05,320","html":"[Becky]: But <mark style=\"background-color: #bbf7d0;\">working to keep clients healthy and able to live on their own without risk as long<\/mark>","cn":"[贝琪]: 但<mark style=\"background-color: #bbf7d0;\">努力让客户保持健康，并尽可能长时间地独立生活，没有风险<\/mark>","analysis":""},{"time":"00:02:05,320 --> 00:02:08,360","html":"<mark style=\"background-color: #bbf7d0;\">as possible is always the goal.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">始终是目标。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题21和22询问PSW的两项主要职责。 <mark style=\"background-color: #bbf7d0;\">\"working to keep clients healthy and able to live on their own without risk as long as possible is always the goal.\"<\/mark> (努力让客户保持健康，并尽可能长时间地独立生活，没有风险始终是目标。) 明确表示确保客户健康和安全（选项D）是主要目标，因此是正确答案。"},{"time":"00:02:08,360 --> 00:02:13,880","html":"And we're recognizing that with life spans increasing, long term care facilities won't","cn":"我们认识到，随着寿命的延长，长期护理设施将无法","analysis":""},{"time":"00:02:13,880 --> 00:02:17,280","html":"be able to keep up with the number of people who will need care.","cn":"满足需要护理的人数。","analysis":""},{"time":"00:02:17,280 --> 00:02:21,800","html":"[Jason]: I almost didn't meet the requirements for entry into the PSW program.","cn":"[杰森]: 我差点不符合进入PSW课程的要求。","analysis":""},{"time":"00:02:21,800 --> 00:02:27,720","html":"I was one core short getting my <mark style=\"background-color: #bbf7d0;\">high school diploma<\/mark>, so I had to go back to summer school.","cn":"我差一个核心课程才能拿到<mark style=\"background-color: #bbf7d0;\">高中毕业证书<\/mark>，所以我不得不回去上暑期学校。","analysis":""},{"time":"00:02:27,720 --> 00:03:00,440","html":"I took science because <mark style=\"background-color: #fecaca;\">I'm no good at math<\/mark>. Oh, and speaking of not getting in, having my <mark style=\"background-color: #bbf7d0;\">first aid certificate<\/mark> was a real piece of luck. I would have been turned down without that, too. [Becky]: And I would have had a problem with immunizations except that I traveled the year before. And when the doctor checked my records, they were up to date. I also had to hand in a written essay on why I wanted to be a PSW.","cn":"我学了科学，因为<mark style=\"background-color: #fecaca;\">我不擅长数学<\/mark>。哦，说到入学，我有<mark style=\"background-color: #bbf7d0;\">急救证书<\/mark>真是万幸。没有它，我也会被拒之门外。[贝琪]: 我本来会有免疫接种的问题，但前一年我旅行了。医生检查我的记录时，它们都是最新的。我还必须提交一篇关于为什么我想成为PSW的书面文章。","analysis":"<strong>答案解析：<\/strong> 问题23和24询问参加PSW课程的两项要求。 <mark style=\"background-color: #bbf7d0;\">\"I was one core short getting my high school diploma\"<\/mark> (我差一个核心课程才能拿到高中毕业证书) 表明高中毕业（选项A）是要求。 <mark style=\"background-color: #fecaca;\">\"I took science because I'm no good at math\"<\/mark> (我学了科学，因为我不擅长数学) 表明数学课程（选项B）不是必须的，或者至少不是他选择的满足要求的科目，因此是干扰项。 <mark style=\"background-color: #bbf7d0;\">\"having my first aid certificate was a real piece of luck. I would have been turned down without that, too.\"<\/mark> (我有急救证书真是万幸。没有它，我也会被拒之门外。) 明确指出急救培训（选项E）是要求。"},{"time":"00:03:00,440 --> 00:03:03,200","html":"[Narrator]: Before you hear the rest of the discussion, you have some time to look at questions 25","cn":"[旁白]: 在你听到对话的其余部分之前，你有一些时间查看问题25","analysis":""},{"time":"00:03:03,200 --> 00:03:03,960","html":"to 30.","cn":"到30。","analysis":""},{"time":"00:03:19,680 --> 00:03:42,240","html":"Now listen and answer questions 25 to 30.","cn":"现在请听并回答问题25至30。","analysis":""},{"time":"00:03:42,240 --> 00:03:47,160","html":"[Jason]: So Becky, what did you think about the courses you had to take in the personal support worker","cn":"[杰森]: 那么贝琪，你觉得个人护理员课程中你必须上的那些课程怎么样？","analysis":""},{"time":"00:03:47,160 --> 00:03:48,160","html":"program?","cn":"课程怎么样？","analysis":""},{"time":"00:03:48,160 --> 00:03:53,880","html":"[Becky]: Well, I used to think I got my points across pretty well with people until I took the","cn":"[贝琪]: 嗯，我以前认为我与人沟通得很好，直到我上了","analysis":""},{"time":"00:03:53,880 --> 00:03:57,040","html":"<mark style=\"background-color: #bbf7d0;\">understanding is essential course.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">理解是基础课程。<\/mark>","analysis":""},{"time":"00:03:57,040 --> 00:04:01,920","html":"For starters, it taught me how to <mark style=\"background-color: #bbf7d0;\">express myself much more effectively.<\/mark>","cn":"首先，它教会了我如何<mark style=\"background-color: #bbf7d0;\">更有效地表达自己。<\/mark>","analysis":""},{"time":"00:04:01,920 --> 00:04:08,320","html":"I also learned a lot about <mark style=\"background-color: #bbf7d0;\">preparing clear reports for my supervisors and dealing in a<\/mark>","cn":"我还学到了很多关于<mark style=\"background-color: #bbf7d0;\">为我的主管准备清晰报告以及如何更好地与人打交道<\/mark>的知识。","analysis":""},{"time":"00:04:08,320 --> 00:04:14,800","html":"<mark style=\"background-color: #bbf7d0;\">better way with people in general, you know, like giving facts without personal views.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">例如，在陈述事实时避免个人观点。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题25询问“Understanding is Essential”课程的主题。 课程内容包括“express myself much more effectively”（更有效地表达自己）、“preparing clear reports for my supervisors”（为我的主管准备清晰的报告）和“dealing in a better way with people in general, you know, like giving facts without personal views”（更好地与人打交道，例如在陈述事实时避免个人观点），这些都与**D. workplace communication (工作场所沟通)**直接相关。"},{"time":"00:04:14,800 --> 00:04:18,520","html":"You'll find that you need those skills every single day.","cn":"你会发现你每天都需要这些技能。","analysis":""},{"time":"00:04:18,520 --> 00:04:21,080","html":"[Jason]: I'm enjoying the <mark style=\"background-color: #bbf7d0;\">foundations course.<\/mark>","cn":"[杰森]: 我很喜欢<mark style=\"background-color: #bbf7d0;\">基础课程。<\/mark>","analysis":""},{"time":"00:04:21,080 --> 00:04:25,960","html":"I'm taking it now and I'm getting a lot out of it because support workers are a newer","cn":"我现在正在上这门课，从中获益匪浅，因为护理员是该省较新的一种","analysis":""},{"time":"00:04:25,960 --> 00:04:27,840","html":"level of care in the province.","cn":"护理级别。","analysis":""},{"time":"00:04:27,840 --> 00:04:33,480","html":"I think we absolutely have to <mark style=\"background-color: #bbf7d0;\">understand how we fit into the overall system.<\/mark>","cn":"我认为我们绝对必须<mark style=\"background-color: #bbf7d0;\">了解我们如何融入整个体系。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题26询问“Foundations”课程的主题。 Jason提到“support workers are a newer level of care in the province. I think we absolutely have to understand how we fit into the overall system.”（护理员是该省较新的一种护理级别。我认为我们绝对必须了解我们如何融入整个体系。）这直接描述了PSW在医疗保健系统中的作用，因此与**C. PSWs’ role in health care (PSW在医疗保健中的角色)**匹配。"},{"time":"00:04:33,480 --> 00:04:36,560","html":"It's a great place to voice your opinions freely.","cn":"这是一个自由表达意见的好地方。","analysis":""},{"time":"00:04:36,560 --> 00:04:38,320","html":"Some are quite personal.","cn":"有些是相当私人的。","analysis":""},{"time":"00:04:38,320 --> 00:04:41,560","html":"Did you have to take a course called <mark style=\"background-color: #bbf7d0;\">the way we work<\/mark>?","cn":"你有没有上过一门叫做《<mark style=\"background-color: #bbf7d0;\">我们的工作方式<\/mark>》的课程？","analysis":""},{"time":"00:04:41,560 --> 00:04:45,000","html":"<mark style=\"background-color: #fecaca;\">I didn't know psychology was part of the program.<\/mark>","cn":"<mark style=\"background-color: #fecaca;\">我不知道心理学是课程的一部分。<\/mark>","analysis":""},{"time":"00:04:45,000 --> 00:04:50,320","html":"[Becky]: That course was a favorite of mine, but <mark style=\"background-color: #fecaca;\">it's probably not what you're thinking, Jason.<\/mark>","cn":"[贝琪]: 那门课是我最喜欢的，但<mark style=\"background-color: #fecaca;\">可能不是你所想的那样，杰森。<\/mark>","analysis":""},{"time":"00:04:50,320 --> 00:04:54,920","html":"It's about <mark style=\"background-color: #bbf7d0;\">what happens on the inside of the body and covers the functions that keep<\/mark>","cn":"它是关于<mark style=\"background-color: #bbf7d0;\">身体内部发生的事情，并涵盖了维持我们身体<\/mark>","analysis":""},{"time":"00:04:54,920 --> 00:04:57,600","html":"<mark style=\"background-color: #bbf7d0;\">our bodies operating well.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">良好运作的功能。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题27询问“The Way We Work”课程的主题。 Jason提到<mark style=\"background-color: #fecaca;\">“I didn't know psychology was part of the program.”<\/mark> (我不知道心理学是课程的一部分。)，这暗示他认为这门课可能与心理学有关，但Becky随后纠正说<mark style=\"background-color: #fecaca;\">“it's probably not what you're thinking, Jason.”<\/mark> (可能不是你所想的那样，杰森。)，并解释道“It's about what happens on the inside of the body and covers the functions that keep our bodies operating well.”（它是关于身体内部发生的事情，并涵盖了维持我们身体良好运作的功能。）因此，心理学是干扰项，而正确主题与**G. biological systems (生物系统)**匹配。"},{"time":"00:04:57,600 --> 00:05:01,360","html":"Even if you're not a PSW, the course is really interesting.","cn":"即使你不是PSW，这门课也真的很有趣。","analysis":""},{"time":"00:05:01,360 --> 00:05:03,840","html":"I learned so much.","cn":"我学到了很多。","analysis":""},{"time":"00:05:03,840 --> 00:05:06,080","html":"[Jason]: What do you think about <mark style=\"background-color: #bbf7d0;\">residence care<\/mark>?","cn":"[杰森]: 你觉得<mark style=\"background-color: #bbf7d0;\">居住护理<\/mark>怎么样？","analysis":""},{"time":"00:05:06,080 --> 00:05:10,520","html":"I know the thinking now is that long-term care facilities aren't the answer for our","cn":"我知道现在的观点是长期护理设施不是我们","analysis":""},{"time":"00:05:10,520 --> 00:05:12,680","html":"aging population.","cn":"老龄人口的解决方案。","analysis":""},{"time":"00:05:12,680 --> 00:05:13,680","html":"[Becky]: Right.","cn":"[贝琪]: 对。","analysis":""},{"time":"00:05:13,680 --> 00:05:19,000","html":"This course zeroes in on the <mark style=\"background-color: #bbf7d0;\">changes people can make to their homes so they can stay there,<\/mark>","cn":"这门课专注于<mark style=\"background-color: #bbf7d0;\">人们可以对自己的家进行改造，以便他们可以住在那里，<\/mark>","analysis":""},{"time":"00:05:19,000 --> 00:05:22,000","html":"<mark style=\"background-color: #bbf7d0;\">like installing higher toilets, for example.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">例如安装更高的马桶。<\/mark>","analysis":""},{"time":"00:05:22,000 --> 00:05:24,560","html":"<mark style=\"background-color: #bbf7d0;\">You'll also learn about specialized equipment.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">你还会学到专用设备。<\/mark>","analysis":""},{"time":"00:05:24,560 --> 00:05:29,400","html":"<mark style=\"background-color: #bbf7d0;\">People can get to help themselves, safety bars for the shower and so on.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">人们可以用来帮助自己，比如淋浴扶手等等。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题28询问“Residence Care”课程的主题。 Becky解释这门课关注“changes people can make to their homes so they can stay there”（人们可以对自己的家进行改造，以便他们可以住在那里）以及“specialized equipment. People can get to help themselves”（人们可以用来帮助自己的专用设备）。这些描述都围绕着帮助人们在自己家中独立生活，因此与**A. independent living (独立生活)**匹配。"},{"time":"00:05:29,400 --> 00:05:33,200","html":"[Jason]: Do any of the courses focus on the families of our clients?","cn":"[杰森]: 有没有课程关注我们客户的家庭？","analysis":""},{"time":"00:05:33,200 --> 00:05:37,200","html":"After all, any kind of illness or disability affects everybody.","cn":"毕竟，任何疾病或残疾都会影响到每一个人。","analysis":""},{"time":"00:05:37,200 --> 00:05:38,200","html":"[Becky]: So true.","cn":"[贝琪]: 说得太对了。","analysis":""},{"time":"00:05:38,200 --> 00:05:39,720","html":"And yes, there is one.","cn":"是的，有一门。","analysis":""},{"time":"00:05:39,720 --> 00:05:41,400","html":"It's called <mark style=\"background-color: #bbf7d0;\">dynamics<\/mark>.","cn":"它叫《<mark style=\"background-color: #bbf7d0;\">动态<\/mark>》。","analysis":""},{"time":"00:05:41,400 --> 00:05:43,760","html":"You usually get that in your last term.","cn":"你通常会在最后一个学期学到它。","analysis":""},{"time":"00:05:43,760 --> 00:05:47,920","html":"You'll learn different strategies to <mark style=\"background-color: #bbf7d0;\">help relieve some of the anxiety and strain that<\/mark>","cn":"你将学习不同的策略来<mark style=\"background-color: #bbf7d0;\">帮助缓解家庭内部的一些焦虑和压力<\/mark>","analysis":""},{"time":"00:05:47,920 --> 00:05:49,520","html":"<mark style=\"background-color: #bbf7d0;\">happens within the family.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">发生的情况。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题29询问“Dynamics”课程的主题。 Becky提到这门课程会教“different strategies to help relieve some of the anxiety and strain that happens within the family”（不同的策略来帮助缓解家庭内部发生的一些焦虑和压力）。这明确指向处理压力，因此与**F. handling stress (处理压力)**匹配。"},{"time":"00:05:49,520 --> 00:05:52,240","html":"I got a lot out of that course.","cn":"我从那门课中学到了很多。","analysis":""},{"time":"00:05:52,240 --> 00:05:56,960","html":"It's the only one that focuses on emotions rather than facts.","cn":"它是唯一一门专注于情感而非事实的课程。","analysis":""},{"time":"00:05:56,960 --> 00:06:02,040","html":"I think giving people this kind of help is just as valuable as any kind of expensive","cn":"我认为给予人们这种帮助与任何昂贵的","analysis":""},{"time":"00:06:02,040 --> 00:06:04,440","html":"equipment they buy to help themselves.","cn":"他们购买来帮助自己的设备一样有价值。","analysis":""},{"time":"00:06:04,440 --> 00:06:08,120","html":"[Jason]: The course I'm really looking forward to is the <mark style=\"background-color: #bbf7d0;\">power within<\/mark>.","cn":"[杰森]: 我真正期待的课程是《<mark style=\"background-color: #bbf7d0;\">内在力量<\/mark>》。","analysis":""},{"time":"00:06:08,120 --> 00:06:10,520","html":"[Becky]: Oh, it's terrific.","cn":"[贝琪]: 哦，太棒了。","analysis":""},{"time":"00:06:10,520 --> 00:06:14,200","html":"Getting old has quite an impact on the mind, as you know.","cn":"正如你所知，衰老对心智有相当大的影响。","analysis":""},{"time":"00:06:14,200 --> 00:06:20,560","html":"But you'll be taught ways to <mark style=\"background-color: #bbf7d0;\">help clients keep the mind active so they're not so forgetful.<\/mark>","cn":"但你会学到一些方法来<mark style=\"background-color: #bbf7d0;\">帮助客户保持思维活跃，这样他们就不会那么健忘。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题30询问“The Power Within”课程的主题。 Becky解释这门课程会教“ways to help clients keep the mind active so they're not so forgetful”（帮助客户保持思维活跃，这样他们就不会那么健忘的方法）。这直接描述了记忆刺激活动，因此与**E. memory stimulation activities (记忆刺激活动)**匹配。"},{"time":"00:06:20,560 --> 00:06:24,240","html":"You'd be surprised how much improvement you can see in clients when you apply these","cn":"当你运用这些方法时，你会惊讶于客户的改善程度","analysis":""},{"time":"00:06:24,240 --> 00:06:28,480","html":"methods.","cn":"方法。","analysis":""},{"time":"00:06:28,480 --> 00:06:30,960","html":"[Narrator]: That is the end of part three.","cn":"[旁白]: 第三部分到此结束。","analysis":""},{"time":"00:06:30,960 --> 00:06:34,680","html":"We now have 30 seconds to check your answers to part three.","cn":"现在你有30秒时间检查第三部分的答案。","analysis":""}],"transcriptHighlights":[{"qid":"21","text":"helping with physical needs","answer":"C"},{"qid":"22","text":"ensuring clients are well and safe","answer":"D"},{"qid":"23","text":"high school completion","answer":"A"},{"qid":"24","text":"First Aid training","answer":"E"},{"qid":"25","text":"workplace communication","answer":"D"},{"qid":"26","text":"PSWs’ role in health care","answer":"C"},{"qid":"27","text":"biological systems","answer":"G"},{"qid":"28","text":"independent living","answer":"A"},{"qid":"29","text":"handling stress","answer":"F"},{"qid":"30","text":"memory stimulation activities","answer":"E"}],"ownerInfo":"此内容由🍠@Listening 永不虾滑整理，仅作为分享供个人使用；禁止商用、倒卖和引流。有问题请先仔细看🍠这个账号的置顶和分享贴。没有团队，不是机构，纯个人分享。督学和其他相关课程请咨询主页另一个号@心情有点虾滑（不回任何机经相关消息）。"}</script>
<script>

let secs=0,review=false,timer=setInterval(()=>{secs++;drawTimer();if(secs%5===0)save(false)},1000),drag=null,currentCue=-1,loopCue=false,slowCue=false,showCn=true,showAnalysis=true,dictationMode=false,showOriginal=true,dictationAnswers={};const storeKey='ielts_v4_'+DATA.title.replace(/\W+/g,'_');
const CONFIG_DATA={answerKey:DATA.answerKey,questionList:DATA.questionIds.map(q=>Number(q)||q),localStorageKey:storeKey};window.localStorageKey=storeKey;window.DATA=DATA;window.CONFIG_DATA=CONFIG_DATA;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function flowQuestionMap(g){let map={};(g.questions||[]).forEach(q=>map[q[0]]=q[1]);return map}
function flowQidsInText(raw,qmap){return Object.keys(qmap).filter(id=>new RegExp(`(?<!\\d)${id}(?!\\d)`).test(raw)).sort((a,b)=>Number(a)-Number(b))}
function renderFlowText(raw,qids){qids=Array.isArray(qids)?qids:[qids];let html=esc(String(raw||''));qids.forEach(qid=>{html=html.replace(new RegExp(`(?<!\\d)${qid}(?!\\d)`),`<span class="flow-num">${qid}</span>`)});let slotIdx=0;html=html.replace(/(?:_{2,}|…{2,}|\.{4,})/g,()=>{let qid=qids[slotIdx++]||qids[qids.length-1];return `<span class="slot" data-q="${qid}"></span>`});qids.slice(slotIdx).forEach(qid=>{html+=` <span class="slot" data-q="${qid}"></span>`});return html}
function renderFlowLine(line,qmap,used){let raw=String((typeof line==='object'&&line?line.text:line)||''),qids=flowQidsInText(raw,qmap);if(qids.length){qids.forEach(qid=>used.add(qid));return `<div class="flow-step flow-step-full"><div class="flow-text">${renderFlowText(raw,qids)}</div></div>`}return `<div class="flow-note">${esc(raw)}</div>`}
function renderFlowTable(lines,qmap,used){let rows=[],maxCols=1;lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0,cols=Number(meta.cols)||1,raw=String(meta.text||''),qids=flowQidsInText(raw,qmap);maxCols=Math.max(maxCols,cols,col+1);if(!rows[row])rows[row]=[];if(!rows[row][col])rows[row][col]=[];qids.forEach(qid=>used.add(qid));rows[row][col].push(`<div class="flow-text">${qids.length?renderFlowText(raw,qids):esc(raw)}</div>`)});return `<div class="flow-table-wrap"><table class="flow-table">${rows.map(cells=>{let filled=(cells||[]).map((parts,col)=>parts?{col,html:parts.join('')}:null).filter(Boolean);return `<tr>${filled.map(cell=>{let span=filled.length===1&&maxCols>1?` colspan="${maxCols}"`:'';return `<td${span}>${cell.html}</td>`}).join('')}</tr>`}).join('')}</table></div>`}
function renderFlowSteps(g){let qmap=flowQuestionMap(g),used=new Set(),lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:[]);if(lines.length){let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFlowTable(chunk,qmap,used);continue}html+=renderFlowLine(lines[i++],qmap,used)}return html+(g.questions||[]).filter(q=>!used.has(q[0])).map(q=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>`).join('')}return g.questions.map((q,idx)=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>${idx<g.questions.length-1?'<div class="flow-arrow">↓</div>':''}`).join('')}
function groupHTML(g){if(g.type==='matching'&&g.layout==='flow')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="flow-layout"><div class="flow-steps">${renderFlowSteps(g)}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='matching'&&g.layout==='diagram')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'diagram.png')}" alt="Diagram"></div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></div></section>`;
if(g.type==='matching')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='map')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'map.png')}" alt="Map" onerror="if(this.dataset.fallback!=='1'){this.dataset.fallback='1';this.src='diagram.png'}"></div><div class="map-grid"><div class="map-answer-list">${g.questions.map(q=>`<div class="map-row"><div class="map-row-label"><strong>${q[0]}</strong> ${esc(q[1]||'')}</div><div class="map-options" style="--map-options:${(g.options||[]).length||1}">${(g.options||[]).map(o=>`<div class="choice map-choice" data-name="q${q[0]}" data-value="${o}">${o}</div>`).join('')}</div></div>`).join('')}</div></div></div></section>`;
if(g.type==='single')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div>${g.questions.map(q=>`<p><strong>${q.id}</strong> ${esc(q.text)}</p>${q.options.map(o=>`<div class="choice single-choice" data-name="q${q.id}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}`).join('')}</section>`;
if(g.type==='multiple')return `<section class="group" data-limit="${g.limit}" data-id="${g.id}"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><p><strong>${esc(g.id)}</strong> ${esc(g.questionText)}</p>${g.options.map(o=>`<div class="choice multi-choice" data-name="q${g.id.replace('-','_')}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</section>`;
return `<section class="group"><h3>${esc(g.title)}</h3>${renderFillGroup(g)}</section>`}
function renderFillGroup(g){let qids=(g.questions||[]).map(q=>String(q.id));let used=new Set();let lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:g.questions.map(q=>`${q.id} ${q.text} _____`));let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFillTable(chunk,qids,used);continue}html+=renderFillLine(lines[i++],qids,used)}return html||`<div class="instruction">${esc(g.instruction||'Complete the notes below.')}</div>`}
function renderFillTable(lines,qids,used){let rows=[],maxCols=1;lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0,cols=Number(meta.cols)||1;maxCols=Math.max(maxCols,cols,col+1);if(!rows[row])rows[row]=[];if(!rows[row][col])rows[row][col]=[];rows[row][col].push(`<div class="fill-table-line">${renderFillLine(line,qids,used,true)}</div>`)});return `<div class="fill-table-wrap"><table class="fill-table">${rows.map((cells,idx)=>{let filled=(cells||[]).map((parts,col)=>parts?{col,html:parts.join('')}:null).filter(Boolean);return `<tr>${filled.map(cell=>{let tag=idx===0?'th':'td',span=filled.length===1&&maxCols>1?` colspan="${maxCols}"`:'';return `<${tag}${span}>${cell.html}</${tag}>`}).join('')}</tr>`}).join('')}</table></div>`}
function fillInput(qid,lead=''){return `<span class="blank-q">${esc(qid)}</span>${esc(lead)}<input class="blank" name="q${esc(qid)}" type="text" autocomplete="off" inputmode="text">`}
function fillLineAttrs(meta,isHeading){let cls=['doc-line'];if(isHeading)cls.push('fill-heading');if(meta.list)cls.push('is-list');let rawLevel=Math.max(0,Math.min(6,Number(meta.level)||0)),level=rawLevel>0?rawLevel+1:rawLevel;let style=meta.list?` style="--indent:${level*30}px"`:'';return `class="${cls.join(' ')}"${style}`}
function fillLineContent(meta,body){let level=Math.max(0,Number(meta.level)||0),bullet=level>0?'◦':'•';return meta.list?`<span class="doc-bullet">${bullet}</span><span class="doc-line-content">${body}</span>`:body}
function isFillHeading(raw,meta,hit){return !hit&&!meta.list&&!/(?:_{2,}|…{2,}|\.{4,})/.test(raw)&&!/^\d+\.?\s+/.test(raw)&&!/^(?:Complete|Write|Choose)\b/i.test(raw)}
function renderFillLine(line,qids,used,inner=false){let meta=typeof line==='object'&&line?line:{},raw=String(meta.text??line),html=esc(raw),hit=false;html=html.replace(/(^|[^\d])(\d{1,2})\.?\s*((?:£\s*)?)(?:_{2,}|…{2,}|\.{4,})/g,(m,prefix,qid,lead)=>{if(!qids.includes(qid))return m;used.add(qid);hit=true;return prefix+fillInput(qid,lead)});let m=raw.match(/^(\d+)\.?\s+(.+)$/);if(!hit&&m&&qids.includes(m[1])){used.add(m[1]);let body=esc(m[2]);let input=fillInput(m[1]);body=/(?:_+|…{2,}|\.{4,})/.test(body)?body.replace(/(?:_+|…{2,}|\.{4,})/,input):`${body} ${input}`;return inner?fillLineContent(meta,body):`<p ${fillLineAttrs(meta,false)}>${fillLineContent(meta,body)}</p>`}return inner?html:`<p ${fillLineAttrs(meta,isFillHeading(raw,meta,hit))}>${fillLineContent(meta,html)}</p>`}
function hardResetAnswers(){$$('input').forEach(i=>{i.value='';i.defaultValue=''});$$('.choice').forEach(c=>c.classList.remove('selected'));$$('.slot').forEach(s=>s.innerHTML='');refreshPool();updateNav()}
function render(){document.title=DATA.title;$('#ownerMeta').textContent=DATA.ownerInfo||'';$('#audio').src=DATA.audio||'audio.mp3';$('#content').innerHTML=DATA.groups.map(groupHTML).join('');$('#nav').innerHTML=DATA.questionIds.map(q=>`<div data-q="${q}">${q}</div>`).join('');bindDynamic();hardResetAnswers();load();updateNav()}
function bindDynamic(){
  $$('#content input').forEach(i=>{i.oninput=()=>{updateNav();save(false)};i.onchange=()=>{updateNav();save(false)}});

  $$('.map-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;$$(`.map-choice[data-name="${btn.dataset.name}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateNav();save(false)});
  $$('.multi-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;let group=btn.closest('.group'),limit=Number(group?.dataset.limit||99),name=btn.dataset.name,selected=$$(`.multi-choice[data-name="${name}"].selected`);if(!btn.classList.contains('selected')&&selected.length>=limit)return;btn.classList.toggle('selected');updateNav();save(false)});

function bindGlobal(){

function refreshPool(){$$('.group').forEach(g=>{let slots=[...g.querySelectorAll('.slot')],drags=[...g.querySelectorAll('.drag')],repeat=g.dataset.repeat==='true'||slots.length>drags.length,used=new Set(slots.map(s=>s.querySelector('.tag')?.dataset.value).filter(Boolean));drags.forEach(d=>d.classList.toggle('hidden',!repeat&&used.has(d.dataset.value)))})}

function multipleGroupFor(q){let n=Number(q);return DATA.groups.find(g=>{if(g.type!=='multiple')return false;let [a,b]=g.id.split('-').map(Number);return n>=a&&n<=b})}

function norm(s){return String(s).normalize('NFKC').trim().replace(/[А]/g,'A').replace(/[В]/g,'B').replace(/[Е]/g,'E').replace(/[Н]/g,'H').replace(/[К]/g,'K').replace(/[М]/g,'M').replace(/[О]/g,'O').replace(/[Р]/g,'P').replace(/[С]/g,'C').replace(/[Т]/g,'T').replace(/[Х]/g,'X').replace(/[а]/g,'a').replace(/[е]/g,'e').replace(/[о]/g,'o').replace(/[р]/g,'p').replace(/[с]/g,'c').replace(/[х]/g,'x').toLowerCase().replace(/[‘’`´]/g,"'").replace(/'/g,'').replace(/\s+/g,' ')}function answerVariants(s){return String(s||'').split(/\s*\/\s*/).map(x=>x.trim()).filter(Boolean)}function rangeIds(id){let [a,b]=id.split('-').map(Number),out=[];for(let n=a;n<=b;n++)out.push(String(n));return out}function multipleCorrectSetFor(q){let g=multipleGroupFor(q);if(!g)return null;let vals=DATA.answerKey.multiple?.['q'+g.id.replace('-','_')]||[];return new Set(vals.flatMap(v=>answerVariants(v)).map(v=>norm(v)).filter(Boolean))}function isCorrect(q){let user=norm(getAnswer(q));let multiSet=multipleCorrectSetFor(q);if(multiSet)return !!user&&multiSet.has(user);return answerVariants(correctAnswer(q)).some(ans=>user===norm(ans))}
function optionTextForQuestion(q){let ans=String(correctAnswer(q)||'');for(let g of DATA.groups||[]){if((g.type==='single'||g.type==='map')&&g.questions){let item=g.questions.find(x=>String(x.id||x[0])===String(q));if(item&&g.type==='single'){let opt=(item.options||[]).find(o=>o[0]===ans);return opt?opt[1]:''}if(item&&g.type==='map')return item[1]||''}if(g.type==='multiple'){let ids=rangeIds(g.id);if(ids.includes(String(q))){let opt=(g.options||[]).find(o=>o[0]===ans);return opt?opt[1]:''}}if(g.type==='matching'){let opt=(g.options||[]).find(o=>o[0]===ans);return opt?opt[1]:''}}return ''}

function questionInText(q,text){let n=Number(String(q).replace(/\D/g,""));if(!n||!text)return false;let raw=String(text).replace(/&nbsp;/g," ");let direct=new RegExp("(?:问题|Question|Q)\\s*0?"+n+"(?!\\d)|第\\s*0?"+n+"\\s*题|(?<!\\d)0?"+n+"\\s*题","i").test(raw)||new RegExp("(?:data-question=[\"']?|class=[\"'][^\"']*q)0?"+n+"(?!\\d)","i").test(raw);if(direct)return true;let re=/(?:问题|Question|Q|第)?\s*(\d+)\s*(?:-|–|—|至|到|和|and|to|&)\s*(\d+)\s*题?/gi,m;while((m=re.exec(raw))){let a=Number(m[1]),b=Number(m[2]);if(n>=Math.min(a,b)&&n<=Math.max(a,b))return true}return false}

function evidenceScore(q,lineIdx,analysisIdx){let x=studyLines()[lineIdx],score=0;if(isCorrectEvidenceCue(x))score+=100;if(isQuestionTaggedCue(q,x))score+=80;if(isDistractorEvidenceCue(x))score+=35;score+=keywordScoreForQuestion(q,x?.html||'');let text=String(x?.html||'').replace(/<[^>]+>/g,' ').toLowerCase(),ans=String(correctAnswer(q)||'').toLowerCase();if(ans&&text.includes(ans))score+=8;score-=Math.abs(lineIdx-analysisIdx);return score}
function bestCueNearAnalyses(q,predicate){let lines=studyLines(),analysisIdxs=[];lines.forEach((x,i)=>{if(questionInText(q,String(x.analysis||'')))analysisIdxs.push(i)});let best={idx:-1,score:-1e9};for(let a of analysisIdxs){let prev=a-1;while(prev>=0&&!lines[prev].analysis)prev--;let next=a+1;while(next<lines.length&&!lines[next].analysis)next++;let from=Math.max(0,prev+1),to=Math.min(lines.length-1,next-1);for(let i=from;i<=to;i++){if(predicate(lines[i])){let score=evidenceScore(q,i,a);if(score>best.score)best={idx:i,score}}}}return best.idx}

function highlightTerms(){let terms=[];for(let item of DATA.transcriptHighlights||[]){let text=typeof item==='string'?item:item.text;if(text){terms.push(String(text));String(text).split(/\s+/).map(w=>w.replace(/[^A-Za-z0-9'-]/g,'')).filter(w=>w.length>=5&&!/^(which|three|answer|letter|about|their|there|would|could|should)$/i.test(w)).forEach(w=>terms.push(w))}}return [...new Set(terms.map(t=>t.trim()).filter(t=>t.length>1))].sort((a,b)=>b.length-a.length)}

function placeBar(bar,rect){bar.hidden=false;bar.style.left=Math.max(8,window.scrollX+rect.left+rect.width/2-95)+'px';bar.style.top=Math.max(8,window.scrollY+rect.top-46)+'px'}
function highlightedFromSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let node=sel.anchorNode?.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode;return node?.closest?.('.hl-brown,.hl-rose,.hl-blue')||null}
function handleToolbar(e){let act=e.target.closest('button')?.dataset.act;if(!act)return;let bar=$('#selbar'),target=bar.targetElem||highlightedFromSelection(),sel=window.getSelection();if(act==='del'&&target){unwrap(target);removeNote(target.dataset.hid)}else if(act==='hl'){if(target){if(target.classList.contains('hl-brown'))target.className='hl-rose';else if(target.classList.contains('hl-rose'))target.className='hl-rose';else target.className='hl-brown'}else{let span=wrapSelection('hl-brown');if(span)span.dataset.hid='h_'+Date.now()}}else if(act==='note'){let span=target||wrapSelection('hl-blue');if(span){span.className='hl-blue';if(!span.dataset.hid)span.dataset.hid='n_'+Date.now();createNote(span);document.body.classList.add('notes-open')}}bar.hidden=true;sel.removeAllRanges();save(false)}
function wrapSelection(cls){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let range=sel.getRangeAt(0);if(!$('#content').contains(range.commonAncestorContainer))return null;let span=document.createElement('span');span.className=cls;try{range.surroundContents(span)}catch{return null}return span}
function unwrap(el){let p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize()}
function clearUserHighlights(){$$('.hl-brown,.hl-rose,.hl-blue').forEach(unwrap)}
function createNote(span){let id=span.dataset.hid;if($(`.note-card[data-hid="${id}"]`))return;let card=document.createElement('div');card.className='note-card';card.dataset.hid=id;card.innerHTML=`<div class="note-quote">${esc(span.textContent.slice(0,120))}</div><textarea placeholder="Write note here..."></textarea><button class="delete-note" type="button">Delete</button>`;$('#notesList').prepend(card);bindNoteDeletes()}
function bindNoteDeletes(){$$('#notesList textarea').forEach(t=>t.oninput=()=>save(false));$$('.delete-note').forEach(btn=>btn.onclick=()=>{let card=btn.closest('.note-card'),id=card.dataset.hid,span=$(`[data-hid="${id}"]`);if(span)unwrap(span);card.remove();save(false)})}
function removeNote(id){if(!id)return;$(`.note-card[data-hid="${id}"]`)?.remove()}
function drawTimer(){let m=Math.floor(secs/60),s=secs%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
const DEFAULT_FONT_SIZE=16,MIN_FONT_SIZE=14,MAX_FONT_SIZE=22;
function currentFontSize(){return Number.parseInt(document.documentElement.style.fontSize,10)||DEFAULT_FONT_SIZE}
function setFontSize(size,persist=true){let n=Math.max(MIN_FONT_SIZE,Math.min(MAX_FONT_SIZE,Number(size)||DEFAULT_FONT_SIZE));document.documentElement.style.fontSize=n===DEFAULT_FONT_SIZE?'':n+'px';updateSizeButtons();if(persist)save(false)}
function adjustFontSize(delta){setFontSize(currentFontSize()+delta,true)}
function updateSizeButtons(){let size=currentFontSize(),dark=document.body.classList.contains('dark');$('#fontMinus')?.toggleAttribute('disabled',size<=MIN_FONT_SIZE);$('#fontPlus')?.toggleAttribute('disabled',size>=MAX_FONT_SIZE);$('#fontDefault')?.classList.toggle('active',size===DEFAULT_FONT_SIZE);$('#lightBtn')?.classList.toggle('active',!dark);$('#darkBtn')?.classList.toggle('active',dark)}
function resetAppearance(persist=true){document.body.classList.remove('dark');setFontSize(DEFAULT_FONT_SIZE,false);updateSizeButtons();if(persist)save(false)}
function clearAllProgress(){localStorage.removeItem(storeKey)}
$('#finish').onclick=finish;$('#save').onclick=()=>save(true);$('#clear').onclick=()=>{if(confirm('Clear all progress?')){window.resetTest();showToast('Clear complete')}};$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-open');save(false)};$('#closeNotes').onclick=()=>{document.body.classList.remove('notes-open');save(false)};$('#toggleIntensive').onclick=()=>{toggleIntensive();save(false)};$('#settingsBtn').onclick=()=>{$('#settings').classList.toggle('open');updateSizeButtons()};$('#lightBtn').onclick=()=>{document.body.classList.remove('dark');updateSizeButtons();save(false)};$('#darkBtn').onclick=()=>{document.body.classList.add('dark');updateSizeButtons();save(false)};$('#appearanceReset').onclick=()=>resetAppearance(true);$('#fontMinus').onclick=()=>adjustFontSize(-1);$('#fontPlus').onclick=()=>adjustFontSize(1);$('#fontDefault').onclick=()=>setFontSize(DEFAULT_FONT_SIZE,true);$('#settings').addEventListener('wheel',e=>{e.preventDefault();adjustFontSize(e.deltaY>0?-1:1)},{passive:false});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey)return;let key=e.key;if(key==='+'||key==='='){e.preventDefault();adjustFontSize(1)}else if(key==='-'||key==='_'){e.preventDefault();adjustFontSize(-1)}else if(key==='0'){e.preventDefault();resetAppearance(true)}});
const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
</script>
