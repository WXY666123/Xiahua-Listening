alysis":""},{"time":"00:00:19,920 --> 00:00:25,560","html":"You will hear a discussion between a student called Helen and her tutor about an assignment","cn":"你将听到一个名叫海伦的学生和她的导师讨论一份作业。","analysis":""},{"time":"00:00:25,560 --> 00:00:27,520","html":"that Helen is working on.","cn":"海伦正在完成的作业。","analysis":""},{"time":"00:00:27,520 --> 00:00:33,520","html":"First you have some time to look at questions 21 to 24 on page 5.","cn":"首先，你有一些时间查看第5页的第21至24题。","analysis":""},{"time":"00:00:57,520 --> 00:01:12,000","html":"Now listen carefully and answer questions 21 to 24.","cn":"现在请仔细听并回答第21至24题。","analysis":""},{"time":"00:01:12,000 --> 00:01:14,440","html":"[Tutor]: Come in Helen, how can I help you?","cn":"[导师]: 请进，海伦，我能帮你什么？","analysis":""},{"time":"00:01:14,440 --> 00:01:20,000","html":"[Helen]: Well, I'm doing research for the anthropology assignment and I was hoping to check a few","cn":"[海伦]: 嗯，我正在为人类学作业做研究，希望能核对一些细节。","analysis":""},{"time":"00:01:20,000 --> 00:01:21,000","html":"details.","cn":"细节。","analysis":""},{"time":"00:01:21,000 --> 00:01:22,000","html":"[Tutor]: Sure.","cn":"[导师]: 当然。","analysis":""},{"time":"00:01:22,000 --> 00:01:26,000","html":"You chose the top of a good Pacific Island top of cloth, didn't you?","cn":"你选的是一件很好的太平洋岛屿的塔帕布，对吗？","analysis":""},{"time":"00:01:26,000 --> 00:01:28,240","html":"What if you found out so far?","cn":"你目前发现了什么？","analysis":""},{"time":"00:01:28,240 --> 00:01:33,440","html":"[Helen]: Well, I was going to introduce my assignment by saying that the top of cloth is a fabric","cn":"[海伦]: 嗯，我打算这样介绍我的作业：塔帕布是一种面料，","analysis":""},{"time":"00:01:33,440 --> 00:01:37,960","html":"made from back, just the outer layer of the trees.","cn":"由树皮制成，只是树的外层。","analysis":""},{"time":"00:01:37,960 --> 00:01:42,800","html":"It's particularly common in the Pacific Islands, but <mark style=\"background-color: #fecaca;\">not exclusive to them<\/mark>.","cn":"它在太平洋岛屿尤为常见，但并非<mark style=\"background-color: #fecaca;\">仅限于此<\/mark>。","analysis":"<strong>答案解析：<\/strong>第21题的选项A“the only tapa made today”是一个干扰项。原文提到“not exclusive to them”（并非仅限于此），并且接下来会提到“many other peoples around the world have made high quality cloth from back”，这表明太平洋塔帕布并非是唯一现存或曾经存在的塔帕布，因此A是错误的。"},{"time":"00:01:42,800 --> 00:01:48,600","html":"In fact, <mark style=\"background-color: #fecaca;\">many other peoples around the world have made high quality cloth from back<\/mark>, but","cn":"事实上，<mark style=\"background-color: #fecaca;\">世界上许多其他民族也用树皮制作了高质量的布料<\/mark>，但","analysis":"<strong>答案解析：<\/strong>第21题的选项B“better quality than others”是一个干扰项。原文明确指出“many other peoples around the world have made high quality cloth from back”，这表明其他地区的塔帕布质量也很好，并未暗示太平洋塔帕布的质量比其他地区更好，因此B是错误的。"},{"time":"00:01:48,600 --> 00:01:55,400","html":"what sets Pacific Tapper apart is <mark style=\"background-color: #bbf7d0;\">the incredible variety of roles it's played in this region<\/mark>.","cn":"太平洋塔帕布的独特之处在于它在<mark style=\"background-color: #bbf7d0;\">该地区扮演的各种各样的角色<\/mark>。","analysis":"<strong>答案解析：<\/strong>第21题的正确答案是C“put to a wider range of uses”。原文明确指出“what sets Pacific Tapper apart is the incredible variety of roles it's played in this region”，这直接对应了选项C中“wider range of uses”（更广泛的用途），强调了太平洋塔帕布用途的广泛性是其独特之处。"},{"time":"00:01:55,640 --> 00:02:01,280","html":"[Tutor]: Yes, nice introduction, though I think you could be more specific regarding dates.","cn":"[导师]: 嗯，不错的介绍，不过我觉得你可以在日期方面更具体一些。","analysis":""},{"time":"00:02:01,280 --> 00:02:05,520","html":"OK, so what about the raw materials used?","cn":"好的，那么使用的原材料呢？","analysis":""},{"time":"00:02:05,520 --> 00:02:12,040","html":"[Helen]: Well, Tapper cloth is made from several species of tree, and the Pacific, the paper mulberry","cn":"[海伦]: 嗯，塔帕布是由几种树木制成的，在太平洋地区，构树","analysis":""},{"time":"00:02:12,040 --> 00:02:16,560","html":"tree is most common, but <mark style=\"background-color: #fecaca;\">it doesn't thrive in all conditions<\/mark>.","cn":"最为常见，但<mark style=\"background-color: #fecaca;\">它并非在所有条件下都能茁壮成长<\/mark>。","analysis":"<strong>答案解析：<\/strong>第22题的选项C“It can grow in any environment”是一个干扰项。原文明确指出“but it doesn't thrive in all conditions”（但它并非在所有条件下都能茁壮成长），这与选项C的意思完全相反，因此C是错误的。"},{"time":"00:02:16,560 --> 00:02:21,600","html":"In fact, <mark style=\"background-color: #bbf7d0;\">it wasn't originally found in the islands, but was carried in their canoes<\/mark>","cn":"事实上，<mark style=\"background-color: #bbf7d0;\">它最初并非在岛屿上发现，而是由第一批移民乘独木舟带入的<\/mark>。","analysis":"<strong>答案解析：<\/strong>第22题的正确答案是B“It is not native to the Pacific”。原文提到“it wasn't originally found in the islands, but was carried in their canoes by the first migrants”，这直接说明构树并非太平洋地区的原生植物，而是由早期移民带来的，符合选项B的描述。"},{"time":"00:02:21,600 --> 00:02:23,840","html":"by the first migrants.","cn":"由第一批移民带入的。","analysis":""},{"time":"00:02:23,840 --> 00:02:28,800","html":"The Tapper is also made from the bread fruit tree, which is convenient because it's fruit","cn":"塔帕布也由面包果树制成，这很方便，因为它的果实","analysis":""},{"time":"00:02:28,800 --> 00:02:30,720","html":"as a staple food.","cn":"是一种主食。","analysis":""},{"time":"00:02:30,720 --> 00:02:35,520","html":"The paper mulberry tree is <mark style=\"background-color: #fecaca;\">only grown for Tapper making<\/mark>, though.","cn":"然而，构树<mark style=\"background-color: #fecaca;\">只用于制作塔帕布<\/mark>。","analysis":"<strong>答案解析：<\/strong>第22题的选项A“It is also a source of food”是一个干扰项。原文明确指出“The paper mulberry tree is only grown for Tapper making, though.”，并提到面包果树的果实是主食，通过对比说明构树并非食物来源，因此A是错误的。"},{"time":"00:02:35,520 --> 00:02:37,840","html":"[Tutor]: Yes, that's good.","cn":"[导师]: 嗯，很好。","analysis":""},{"time":"00:02:37,840 --> 00:02:42,160","html":"Now what about the Maori people here in New Zealand?","cn":"那么新西兰的毛利人呢？","analysis":""},{"time":"00:02:42,160 --> 00:02:44,520","html":"[Helen]: But the Maori don't make Tapper now.","cn":"[海伦]: 但是毛利人现在不制作塔帕布了。","analysis":""},{"time":"00:02:44,520 --> 00:02:47,160","html":"[Tutor]: That's right, and you need to account for it.","cn":"[导师]: 对，你需要解释一下原因。","analysis":""},{"time":"00:02:47,160 --> 00:02:52,000","html":"We know that when Maori migrated here from the other Pacific Islands, they were prepared","cn":"我们知道，当毛利人从其他太平洋岛屿迁徙到这里时，他们准备","analysis":""},{"time":"00:02:52,000 --> 00:02:56,600","html":"to make Tapper because <mark style=\"background-color: #fecaca;\">they brought the paper mulberry tree with them<\/mark>.","cn":"制作塔帕布，因为<mark style=\"background-color: #fecaca;\">他们带来了构树<\/mark>。","analysis":"<strong>答案解析：<\/strong>第23题的选项A“They could not find the right trees in New Zealand”是一个干扰项。原文提到毛利人“brought the paper mulberry tree with them”，这说明他们最初是带来了制作塔帕布的原材料（构树），因此不能说他们找不到合适的树木，A是错误的。"},{"time":"00:02:56,600 --> 00:03:01,960","html":"The thing was, after they'd been in New Zealand a bit, they found the <mark style=\"background-color: #bbf7d0;\">flax plant, which<\/mark>","cn":"问题是，他们在新西兰居住一段时间后，发现了<mark style=\"background-color: #bbf7d0;\">亚麻植物，它<\/mark>","analysis":""},{"time":"00:03:01,960 --> 00:03:06,120","html":"<mark style=\"background-color: #bbf7d0;\">is superior to Tapper because it makes a stronger fabric<\/mark>.","cn":"<mark style=\"background-color: #bbf7d0;\">比塔帕布更优越，因为它能制作出更结实的布料<\/mark>。","analysis":"<strong>答案解析：<\/strong>第23题的正确答案是C“They found a better material for making fabric”。原文指出毛利人发现了“flax plant, which is superior to Tapper because it makes a stronger fabric”，这直接表明他们找到了比塔帕布更好的材料（亚麻）来制作布料，符合选项C的描述。"},{"time":"00:03:06,120 --> 00:03:11,440","html":"<mark style=\"background-color: #fecaca;\">By the time Europeans arrived in the 18th century, Maori were making all their fabric from<\/mark>","cn":"<mark style=\"background-color: #fecaca;\">到18世纪欧洲人到来时，毛利人已经用亚麻制作所有的布料了<\/mark>","analysis":""},{"time":"00:03:11,440 --> 00:03:14,480","html":"<mark style=\"background-color: #fecaca;\">flax and had been for some time<\/mark>.","cn":"<mark style=\"background-color: #fecaca;\">并且已经持续了一段时间<\/mark>。","analysis":"<strong>答案解析：<\/strong>第23题的选项B“They were introduced to other fabrics by the Europeans”是一个干扰项。原文说“By the time Europeans arrived in the 18th century, Maori were making all their fabric from flax and had been for some time”，这意味着毛利人在欧洲人到来之前就已经开始使用亚麻制作布料了，而非由欧洲人引入，因此B是错误的。"},{"time":"00:03:14,480 --> 00:03:21,440","html":"[Helen]: OK, so with the production process itself, first at the inner bark is beaten with wooden","cn":"[海伦]: 好的，那么制作过程本身呢，首先用木锤敲打树皮内层","analysis":""},{"time":"00:03:21,440 --> 00:03:23,680","html":"hammers to soften the fibres.","cn":"使其纤维软化。","analysis":""},{"time":"00:03:23,680 --> 00:03:29,880","html":"Then the different pieces are <mark style=\"background-color: #bbf7d0;\">glued together using an adhesive paste<\/mark> made from the arrowroot","cn":"然后将不同的碎片<mark style=\"background-color: #bbf7d0;\">用葛粉制成的粘合剂粘合在一起<\/mark>。","analysis":"<strong>答案解析：<\/strong>第24题的正确答案是A“stuck together”。原文明确指出“Then the different pieces are glued together using an adhesive paste”，其中“glued together”（粘合在一起）与选项A的“stuck together”（粘在一起）意思相同。"},{"time":"00:03:29,880 --> 00:03:30,880","html":"tuba.","cn":"葛粉。","analysis":""},{"time":"00:03:30,880 --> 00:03:36,560","html":"This is the only way to fabricate large pieces of cloth because bark strands are too fine","cn":"这是制作大块布料的唯一方法，因为树皮纤维太细，","analysis":""},{"time":"00:03:36,560 --> 00:03:43,360","html":"<mark style=\"background-color: #fecaca;\">to be woven together<\/mark> and <mark style=\"background-color: #fecaca;\">stitching isn't strong enough<\/mark>.","cn":"无法<mark style=\"background-color: #fecaca;\">编织在一起<\/mark>，而且<mark style=\"background-color: #fecaca;\">缝合也不够牢固<\/mark>。","analysis":"<strong>答案解析：<\/strong>第24题的选项B“woven together”（编织在一起）和C“sewn together”（缝合在一起）是干扰项。原文明确指出“bark strands are too fine to be woven together and stitching isn't strong enough”，这直接否定了编织和缝合这两种方法，因此B和C是错误的。"},{"time":"00:03:43,360 --> 00:03:48,280","html":"[Narrator]: Before you hear the rest of the discussion, you have some time to look at questions 25","cn":"[旁白]: 在你听完剩余的讨论之前，你有一些时间查看第25","analysis":""},{"time":"00:03:48,280 --> 00:03:50,480","html":"to 30 on page 6.","cn":"至30题，在第6页。","analysis":""},{"time":"00:04:18,280 --> 00:04:27,800","html":"Now, listen and answer questions 25 to 30.","cn":"现在，请听并回答第25至30题。","analysis":""},{"time":"00:04:27,800 --> 00:04:31,200","html":"[Tutor]: So now you need details about different countries.","cn":"[导师]: 那么现在你需要不同国家的详细信息。","analysis":""},{"time":"00:04:31,200 --> 00:04:32,680","html":"[Helen]: Where would you start?","cn":"[海伦]: 你会从哪里开始？","analysis":""},{"time":"00:04:32,680 --> 00:04:35,560","html":"[Tutor]:I think Samoa is the obvious place.","cn":"[导师]: 我想萨摩亚是显而易见的起点。","analysis":""},{"time":"00:04:35,560 --> 00:04:41,480","html":"It's famous for its very fine cloth called Seattle, which is hand-painted with representations","cn":"它以其名为“西阿坡”的精美布料闻名，上面手绘着祖先的形象。","analysis":""},{"time":"00:04:41,480 --> 00:04:43,520","html":"of the ancestors.","cn":"祖先的形象。","analysis":""},{"time":"00:04:43,520 --> 00:04:49,880","html":"Still today, at the most profound events in life such as births, funerals, weddings","cn":"直到今天，在生活中最重要的事件，如出生、葬礼、婚礼","analysis":""},{"time":"00:04:49,880 --> 00:04:56,360","html":"and the investiture of chiefs, Samoans were siapo robes to add <mark style=\"background-color: #bbf7d0;\">significance and meaning<\/mark>","cn":"以及酋长的授职仪式上，萨摩亚人都会穿着西阿坡长袍，以增加<mark style=\"background-color: #bbf7d0;\">仪式的意义和重要性<\/mark>。","analysis":"<strong>答案解析：<\/strong>第25题的正确答案是C（spiritual）。原文指出在“births, funerals, weddings and the investiture of chiefs”这些“profound events”中，萨摩亚人穿着西阿坡长袍以“add significance and meaning to the ceremony”，这 clearly indicates a spiritual or ceremonial function。"},{"time":"00:04:56,360 --> 00:04:58,080","html":"<mark style=\"background-color: #bbf7d0;\">to the ceremony<\/mark>.","cn":"<mark style=\"background-color: #bbf7d0;\">和意义<\/mark>。","analysis":""},{"time":"00:04:58,080 --> 00:05:01,080","html":"[Helen]: OK, then I could talk about Tonga.","cn":"[海伦]: 好的，然后我可以说说汤加。","analysis":""},{"time":"00:05:01,080 --> 00:05:06,800","html":"It seems to me that the great innovation in Tonga has been developing a simple, coarse","cn":"在我看来，汤加的一大创新是开发出一种简单、粗糙的","analysis":""},{"time":"00:05:06,800 --> 00:05:10,080","html":"cloth, which is quick and easy to make.","cn":"布料，制作快捷方便。","analysis":""},{"time":"00:05:10,080 --> 00:05:16,120","html":"This is suitable for all sorts of <mark style=\"background-color: #bbf7d0;\">everyday functions around the house like bedcudders<\/mark>,","cn":"这适用于各种<mark style=\"background-color: #bbf7d0;\">家庭日常用途，比如床罩<\/mark>、","analysis":"<strong>答案解析：<\/strong>第26题的正确答案是B（practical）。原文描述汤加的塔帕布“is suitable for all sorts of everyday functions around the house like bedcudders, mosquito nets and curtains”，这些都是日常家居用品， clearly indicates a practical function。"},{"time":"00:05:16,120 --> 00:05:18,680","html":"<mark style=\"background-color: #bbf7d0;\">mosquito nets and curtains<\/mark>.","cn":"<mark style=\"background-color: #bbf7d0;\">蚊帐和窗帘<\/mark>。","analysis":""},{"time":"00:05:18,680 --> 00:05:19,680","html":"[Tutor]: Good point.","cn":"[导师]: 说得好。","analysis":""},{"time":"00:05:19,680 --> 00:05:22,880","html":"Now, what about Cook Island's Tupper?","cn":"那么库克群岛的塔帕布呢？","analysis":""},{"time":"00:05:22,880 --> 00:05:29,080","html":"[Helen]: Well, the soil there is poor quality, so the breadfruit tree is often used.","cn":"[海伦]: 嗯，那里的土壤质量很差，所以经常使用面包果树。","analysis":""},{"time":"00:05:29,080 --> 00:05:34,800","html":"One type of thick cloth, called Tikoru, was wrapped around the poles and used to mark the","cn":"一种名为Tikoru的厚布，被缠绕在杆子上，用于标记","analysis":""},{"time":"00:05:34,800 --> 00:05:40,440","html":"<mark style=\"background-color: #bbf7d0;\">entrances to places of worship so it was highly regarded in local culture<\/mark>.","cn":"<mark style=\"background-color: #bbf7d0;\">礼拜场所的入口，因此在当地文化中备受推崇<\/mark>。","analysis":"<strong>答案解析：<\/strong>第27题的正确答案是C（spiritual）。原文指出Tikoru这种布料“was wrapped around the poles and used to mark the entrances to places of worship so it was highly regarded in local culture”，这直接表明它在宗教场所使用并受到高度重视，具有精神或宗教意义。"},{"time":"00:05:40,440 --> 00:05:46,600","html":"[Tutor]: You might mention Fiji as well, which is interesting because Tupper was actually used as a <mark style=\"background-color: #bbf7d0;\">currency<\/mark>","cn":"[导师]: 你也可以提一下斐济，这很有趣，因为塔帕布在那里实际上被用作<mark style=\"background-color: #bbf7d0;\">货币<\/mark>。","analysis":""},{"time":"00:05:46,600 --> 00:05:47,600","html":"<mark style=\"background-color: #bbf7d0;\">there<\/mark>.","cn":"<mark style=\"background-color: #bbf7d0;\">货币<\/mark>。","analysis":""},{"time":"00:05:47,600 --> 00:05:52,760","html":"<mark style=\"background-color: #bbf7d0;\">Fijians used to sail between the islands and exchange Tupper for other commodities like<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">斐济人过去常在岛屿之间航行，用塔帕布交换其他商品，比如<\/mark>","analysis":""},{"time":"00:05:52,760 --> 00:05:54,840","html":"<mark style=\"background-color: #bbf7d0;\">canoes or pigs<\/mark>.","cn":"<mark style=\"background-color: #bbf7d0;\">独木舟或猪<\/mark>。","analysis":"<strong>答案解析：<\/strong>第28题的正确答案是D（commercial）。原文明确指出“Tupper was actually used as a currency there”并且“Fijians used to sail between the islands and exchange Tupper for other commodities like canoes or pigs”，这清楚地表明塔帕布在斐济具有商业交易和货币的功能。"},{"time":"00:05:54,840 --> 00:06:00,120","html":"[Helen]: I know that in Tahiti, the Tupper cloth is different because the patterns are in colour,","cn":"[海伦]: 我知道在塔希提，塔帕布是不同的，因为图案是彩色的，","analysis":""},{"time":"00:06:00,120 --> 00:06:03,840","html":"which is considered more valuable than the usual brown patterns.","cn":"这被认为比通常的棕色图案更有价值。","analysis":""},{"time":"00:06:03,840 --> 00:06:09,320","html":"[Tutor]: You are right about the Tahitians using coloured pigments, but <mark style=\"background-color: #fecaca;\">they aren't more valuable<\/mark>.","cn":"[导师]: 人们写塔希提人使用彩色颜料，但<mark style=\"background-color: #fecaca;\">它们并没有更高的价值<\/mark>。","analysis":"<strong>答案解析：<\/strong>第29题的正确答案是A（recreational）。在海伦提到彩色图案被认为更有价值之后，导师纠正说“they aren't more valuable. The colours are only a decoration. People enjoy wearing bright robes, especially for dancing and competitive games and do it just for fun.”，明确指出彩色图案仅用于装饰，人们穿它是为了跳舞、比赛和娱乐，这些都属于休闲娱乐功能，因此A是正确的。海伦认为“more valuable”是错误的观点，因此导师的纠正信息“they aren't more valuable”是区分干扰项的关键。"},{"time":"00:06:09,320 --> 00:06:12,080","html":"The colours are only a decoration.","cn":"这些颜色只是一种装饰。","analysis":""},{"time":"00:06:12,080 --> 00:06:17,480","html":"<mark style=\"background-color: #bbf7d0;\">People enjoy wearing bright robes, especially for dancing and competitive games and do it<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">人们喜欢穿鲜艳的长袍，尤其是在跳舞和竞技游戏时，这样做<\/mark>","analysis":""},{"time":"00:06:17,480 --> 00:06:18,480","html":"<mark style=\"background-color: #bbf7d0;\">just for fun<\/mark>.","cn":"<mark style=\"background-color: #bbf7d0;\">只是为了好玩<\/mark>。","analysis":""},{"time":"00:06:18,480 --> 00:06:21,000","html":"[Helen]: Oh, I'll make a note of it.","cn":"[海伦]: 哦，我会记下来。","analysis":""},{"time":"00:06:21,000 --> 00:06:25,760","html":"Well, the last place I was going to mention was Tikorpia.","cn":"嗯，我最后要提到的地方是蒂科皮亚。","analysis":""},{"time":"00:06:25,760 --> 00:06:30,760","html":"Even today it's common place to see people wearing <mark style=\"background-color: #bbf7d0;\">clothes made of Tupper cloth<\/mark>.","cn":"即使在今天，看到人们穿着<mark style=\"background-color: #bbf7d0;\">塔帕布制成的衣服<\/mark>也很常见。","analysis":""},{"time":"00:06:30,760 --> 00:06:36,480","html":"In many of the other islands, the Tupper only comes out on special occasions, but here","cn":"在许多其他岛屿上，塔帕布只在特殊场合出现，但在这里","analysis":""},{"time":"00:06:36,480 --> 00:06:40,040","html":"you see <mark style=\"background-color: #bbf7d0;\">people working in the gardens wearing Tupper<\/mark>.","cn":"你会看到<mark style=\"background-color: #bbf7d0;\">人们在花园里工作时穿着塔帕布<\/mark>。","analysis":"<strong>答案解析：<\/strong>第30题的正确答案是B（practical）。原文指出“Even today it's common place to see people wearing clothes made of Tupper cloth”以及“you see people working in the gardens wearing Tupper”，这表明在Tikopia，塔帕布被用作日常穿着和工作服，是一种非常实用的功能。"},{"time":"00:06:40,040 --> 00:06:41,040","html":"[Tutor]: Sounds promising, Helen.","cn":"[导师]: 听起来很有希望，海伦。","analysis":""},{"time":"00:06:41,040 --> 00:06:46,880","html":"I'll look forward to reading your assignment.","cn":"我期待阅读你的作业。","analysis":""},{"time":"00:06:46,880 --> 00:06:49,480","html":"[Narrator]: That is the end of section 3.","cn":"[旁白]: 第3部分到此结束。","analysis":""},{"time":"00:06:49,480 --> 00:06:52,200","html":"You now have half a minute to check your answers.","cn":"现在你有半分钟的时间检查你的答案。","analysis":""}],"transcriptHighlights":[{"qid":"21","text":"put to a wider range of uses","answer":"C"},{"qid":"22","text":"It is not native to the Pacific","answer":"B"},{"qid":"23","text":"They found a better material for making fabric","answer":"C"},{"qid":"24","text":"stuck together","answer":"A"},{"qid":"25","text":"Spiritual","answer":"C"},{"qid":"26","text":"Practical","answer":"B"},{"qid":"28","text":"Commercial","answer":"D"},{"qid":"29","text":"Recreational","answer":"A"}],"ownerInfo":"此内容由🍠@Listening 永不虾滑整理，仅作为分享供个人使用；禁止商用、倒卖和引流。有问题请先仔细看🍠这个账号的置顶和分享贴。没有团队，不是机构，纯个人分享。督学和其他相关课程请咨询主页另一个号@心情有点虾滑（不回任何机经相关消息）。"}</script>
<script>
const DATA=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const RENDER_VERSION=17;
let secs=0,review=false,timer=setInterval(()=>{secs++;drawTimer();if(secs%5===0)save(false)},1000),drag=null,currentCue=-1,loopCue=false,slowCue=false,showCn=true,showAnalysis=true,dictationMode=false,showOriginal=true,dictationAnswers={};const storeKey='ielts_v4_'+DATA.title.replace(/\W+/g,'_');
const CONFIG_DATA={answerKey:DATA.answerKey,questionList:DATA.questionIds.map(q=>Number(q)||q),localStorageKey:storeKey};window.localStorageKey=storeKey;window.DATA=DATA;window.CONFIG_DATA=CONFIG_DATA;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function matchingRepeatAttr(g){return (g.questions||[]).length>(g.options||[]).length?' data-repeat="true"':''}
function flowQuestionMap(g){let map={};(g.questions||[]).forEach(q=>map[q[0]]=q[1]);return map}
function flowQidsInText(raw,qmap){return Object.keys(qmap).filter(id=>new RegExp(`(?<!\\d)${id}(?!\\d)`).test(raw)).sort((a,b)=>Number(a)-Number(b))}
function renderFlowText(raw,qids){qids=Array.isArray(qids)?qids:[qids];let html=esc(String(raw||''));qids.forEach(qid=>{html=html.replace(new RegExp(`(?<!\\d)${qid}(?!\\d)`),`<span class="flow-num">${qid}</span>`)});let slotIdx=0;html=html.replace(/(?:_{2,}|…{2,}|\.{4,})/g,()=>{let qid=qids[slotIdx++]||qids[qids.length-1];return `<span class="slot" data-q="${qid}"></span>`});qids.slice(slotIdx).forEach(qid=>{html+=` <span class="slot" data-q="${qid}"></span>`});return html}
function renderFlowLine(line,qmap,used){let raw=String((typeof line==='object'&&line?line.text:line)||''),qids=flowQidsInText(raw,qmap);if(qids.length){qids.forEach(qid=>used.add(qid));return `<div class="flow-step flow-step-full"><div class="flow-text">${renderFlowText(raw,qids)}</div></div>`}return `<div class="flow-note">${esc(raw)}</div>`}
function renderFlowTable(lines,qmap,used){let rows=[],maxCols=1;lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0,cols=Number(meta.cols)||1,raw=String(meta.text||''),qids=flowQidsInText(raw,qmap);maxCols=Math.max(maxCols,cols,col+1);if(!rows[row])rows[row]=[];if(!rows[row][col])rows[row][col]=[];qids.forEach(qid=>used.add(qid));rows[row][col].push(`<div class="flow-text">${qids.length?renderFlowText(raw,qids):esc(raw)}</div>`)});return `<div class="flow-table-wrap"><table class="flow-table">${rows.map(cells=>{let filled=(cells||[]).map((parts,col)=>parts?{col,html:parts.join('')}:null).filter(Boolean);return `<tr>${filled.map(cell=>{let span=filled.length===1&&maxCols>1?` colspan="${maxCols}"`:'';return `<td${span}>${cell.html}</td>`}).join('')}</tr>`}).join('')}</table></div>`}
function renderFlowSteps(g){let qmap=flowQuestionMap(g),used=new Set(),lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:[]);if(lines.length){let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFlowTable(chunk,qmap,used);continue}html+=renderFlowLine(lines[i++],qmap,used)}return html+(g.questions||[]).filter(q=>!used.has(q[0])).map(q=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>`).join('')}return g.questions.map((q,idx)=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>${idx<g.questions.length-1?'<div class="flow-arrow">↓</div>':''}`).join('')}
function groupHTML(g){if(g.type==='matching'&&g.layout==='flow')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="flow-layout"><div class="flow-steps">${renderFlowSteps(g)}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='matching'&&g.layout==='diagram')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'diagram.png')}" alt="Diagram"></div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></div></section>`;
if(g.type==='matching')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='map')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'map.png')}" alt="Map" onerror="if(this.dataset.fallback!=='1'){this.dataset.fallback='1';this.src='diagram.png'}"></div><div class="map-grid"><div class="map-answer-list">${g.questions.map(q=>`<div class="map-row"><div class="map-row-label"><strong>${q[0]}</strong> ${esc(q[1]||'')}</div><div class="map-options" style="--map-options:${(g.options||[]).length||1}">${(g.options||[]).map(o=>`<div class="choice map-choice" data-name="q${q[0]}" data-value="${o}">${o}</div>`).join('')}</div></div>`).join('')}</div></div></div></section>`;
if(g.type==='single')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div>${g.questions.map(q=>`<p><strong>${q.id}</strong> ${esc(q.text)}</p>${q.options.map(o=>`<div class="choice single-choice" data-name="q${q.id}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}`).join('')}</section>`;
if(g.type==='multiple')return `<section class="group" data-limit="${g.limit}" data-id="${g.id}"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><p><strong>${esc(g.id)}</strong> ${esc(g.questionText)}</p>${g.options.map(o=>`<div class="choice multi-choice" data-name="q${g.id.replace('-','_')}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</section>`;
return `<section class="group"><h3>${esc(g.title)}</h3>${renderFillGroup(g)}</section>`}
function renderFillGroup(g){let qids=(g.questions||[]).map(q=>String(q.id));let used=new Set();let lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:g.questions.map(q=>`${q.id} ${q.text} _____`));let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFillTable(chunk,qids,used);continue}html+=renderFillLine(lines[i++],qids,used)}return html||`<div class="instruction">${esc(g.instruction||'Complete the notes below.')}</div>`}
function renderFillTable(lines,qids,used){let rows=[],maxCols=1;lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0,cols=Number(meta.cols)||1;maxCols=Math.max(maxCols,cols,col+1);if(!rows[row])rows[row]=[];if(!rows[row][col])rows[row][col]=[];rows[row][col].push(`<div class="fill-table-line">${renderFillLine(line,qids,used,true)}</div>`)});return `<div class="fill-table-wrap"><table class="fill-table">${rows.map((cells,idx)=>{let filled=(cells||[]).map((parts,col)=>parts?{col,html:parts.join('')}:null).filter(Boolean);return `<tr>${filled.map(cell=>{let tag=idx===0?'th':'td',span=filled.length===1&&maxCols>1?` colspan="${maxCols}"`:'';return `<${tag}${span}>${cell.html}</${tag}>`}).join('')}</tr>`}).join('')}</table></div>`}
function fillInput(qid,lead=''){return `<span class="blank-q">${esc(qid)}</span>${esc(lead)}<input class="blank" name="q${esc(qid)}" type="text" autocomplete="off" inputmode="text">`}
function fillLineAttrs(meta,isHeading){let cls=['doc-line'];if(isHeading)cls.push('fill-heading');if(meta.list)cls.push('is-list');let rawLevel=Math.max(0,Math.min(6,Number(meta.level)||0)),level=rawLevel>0?rawLevel+1:rawLevel;let style=meta.list?` style="--indent:${level*30}px"`:'';return `class="${cls.join(' ')}"${style}`}
function fillLineContent(meta,body){let level=Math.max(0,Number(meta.level)||0),bullet=level>0?'◦':'•';return meta.list?`<span class="doc-bullet">${bullet}</span><span class="doc-line-content">${body}</span>`:body}
function isFillHeading(raw,meta,hit){return !hit&&!meta.list&&!/(?:_{2,}|…{2,}|\.{4,})/.test(raw)&&!/^\d+\.?\s+/.test(raw)&&!/^(?:Complete|Write|Choose)\b/i.test(raw)}
function renderFillLine(line,qids,used,inner=false){let meta=typeof line==='object'&&line?line:{},raw=String(meta.text??line),html=esc(raw),hit=false;html=html.replace(/(^|[^\d])(\d{1,2})\.?\s*((?:£\s*)?)(?:_{2,}|…{2,}|\.{4,})/g,(m,prefix,qid,lead)=>{if(!qids.includes(qid))return m;used.add(qid);hit=true;return prefix+fillInput(qid,lead)});let m=raw.match(/^(\d+)\.?\s+(.+)$/);if(!hit&&m&&qids.includes(m[1])){used.add(m[1]);let body=esc(m[2]);let input=fillInput(m[1]);body=/(?:_+|…{2,}|\.{4,})/.test(body)?body.replace(/(?:_+|…{2,}|\.{4,})/,input):`${body} ${input}`;return inner?fillLineContent(meta,body):`<p ${fillLineAttrs(meta,false)}>${fillLineContent(meta,body)}</p>`}return inner?html:`<p ${fillLineAttrs(meta,isFillHeading(raw,meta,hit))}>${fillLineContent(meta,html)}</p>`}
function hardResetAnswers(){$$('input').forEach(i=>{i.value='';i.defaultValue=''});$$('.choice').forEach(c=>c.classList.remove('selected'));$$('.slot').forEach(s=>s.innerHTML='');refreshPool();updateNav()}
function render(){document.title=DATA.title;$('#ownerMeta').textContent=DATA.ownerInfo||'';$('#audio').src=DATA.audio||'audio.mp3';$('#content').innerHTML=DATA.groups.map(groupHTML).join('');$('#nav').innerHTML=DATA.questionIds.map(q=>`<div data-q="${q}">${q}</div>`).join('');bindDynamic();hardResetAnswers();load();updateNav()}
function bindDynamic(){
  $$('#content input').forEach(i=>{i.oninput=()=>{updateNav();save(false)};i.onchange=()=>{updateNav();save(false)}});
  $$('.single-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;$$(`.single-choice[data-name="${btn.dataset.name}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateNav();save(false)});
  $$('.map-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;$$(`.map-choice[data-name="${btn.dataset.name}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateNav();save(false)});
  $$('.multi-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;let group=btn.closest('.group'),limit=Number(group?.dataset.limit||99),name=btn.dataset.name,selected=$$(`.multi-choice[data-name="${name}"].selected`);if(!btn.classList.contains('selected')&&selected.length>=limit)return;btn.classList.toggle('selected');updateNav();save(false)});
  $$('#nav [data-q]').forEach(n=>n.onclick=()=>scrollToQuestion(n.dataset.q));
}
function bindGlobal(){
  document.addEventListener('dragstart',e=>{let d=e.target.closest('.drag,.tag');if(!d||review)return;drag={value:d.dataset.value,text:d.textContent,from:d.closest('.slot')};});
  document.addEventListener('dragover',e=>{if(e.target.closest('.slot,.pool'))e.preventDefault()});
  document.addEventListener('drop',e=>{let slot=e.target.closest('.slot'),pool=e.target.closest('.pool');if(!drag||review)return;e.preventDefault();if(pool&&drag.from){drag.from.innerHTML='';refreshPool();updateNav();save(false);return}if(slot){if(drag.from)drag.from.innerHTML='';slot.innerHTML=`<span class="tag" draggable="true" data-value="${drag.value}">${esc(drag.text)}</span>`;refreshPool();updateNav();save(false)}});
  document.addEventListener('mouseup',handleSelection);

function layoutSignature(){return JSON.stringify([RENDER_VERSION,(DATA.groups||[]).map(g=>[g.type,g.layout||'',g.id||'',g.title||'',g.instruction||'',g.questionText||'',g.image||'',(g.options||[]),(g.questions||[]).map(q=>JSON.stringify(q))])])}
function save(show=false){let data={secs,answers:collectAnswers(),contentHtml:contentSnapshot(),layoutSignature:layoutSignature(),notes:notesSnapshot(),dark:document.body.classList.contains('dark'),font:document.documentElement.style.fontSize,dictationAnswers,studyState:{currentCue,loopCue,slowCue,showCn,showAnalysis,dictationMode,showOriginal},audioTime:audio?.currentTime||0};localStorage.setItem(storeKey,JSON.stringify(data));if(show)showToast()}
function load(){let raw=localStorage.getItem(storeKey);if(!raw)return;let d;try{d=JSON.parse(raw)}catch(err){console.warn('Saved progress could not be read.',err);return}secs=d.secs||0;if(d.answers){try{restoreAnswers(d.answers)}catch(err){console.warn('Saved answers could not be restored.',err)}}if(d.dictationAnswers)dictationAnswers=d.dictationAnswers;if(d.studyState)try{({currentCue=currentCue,loopCue=loopCue,slowCue=slowCue,showCn=showCn,showAnalysis=showAnalysis,dictationMode=dictationMode,showOriginal}=d.studyState)}catch(err){console.warn('Study state could not be restored.',err)}if(d.notes){try{$('#notesList').innerHTML=d.notes;$$('#notesList textarea').forEach(t=>{t.value=t.dataset.value||t.textContent||''})}catch(err){console.warn('Saved notes could not be restored.',err)}}if(d.dark)document.body.classList.add('dark');setFontSize(d.font||DEFAULT_FONT_SIZE,false);if(d.audioTime)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=d.audioTime},{once:true});bindNoteDeletes();drawTimer()}
function handleSelection(e){if(e.target.closest('#selbar,#notes,.bottom-bar'))return;let sel=window.getSelection();let hl=e.target.closest?.('.hl-brown,.hl-rose,.hl-blue');let bar=$('#selbar');if(hl&&sel.isCollapsed){bar.targetElem=hl;placeBar(bar,hl.getBoundingClientRect())}else if(sel&&!sel.isCollapsed&&$('#content').contains(sel.anchorNode)){bar.targetElem=null;placeBar(bar,sel.getRangeAt(0).getBoundingClientRect())}else{bar.hidden=true}}
function placeBar(bar,rect){bar.hidden=false;bar.style.left=Math.max(8,window.scrollX+rect.left+rect.width/2-95)+'px';bar.style.top=Math.max(8,window.scrollY+rect.top-46)+'px'}
function highlightedFromSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let node=sel.anchorNode?.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode;return node?.closest?.('.hl-brown,.hl-rose,.hl-blue')||null}
function handleToolbar(e){let act=e.target.closest('button')?.dataset.act;if(!act)return;let bar=$('#selbar'),target=bar.targetElem||highlightedFromSelection(),sel=window.getSelection();if(act==='del'&&target){unwrap(target);removeNote(target.dataset.hid)}else if(act==='hl'){if(target){if(target.classList.contains('hl-brown'))target.className='hl-rose';else if(target.classList.contains('hl-rose'))target.className='hl-rose';else target.className='hl-brown'}else{let span=wrapSelection('hl-brown');if(span)span.dataset.hid='h_'+Date.now()}}else if(act==='note'){let span=target||wrapSelection('hl-blue');if(span){span.className='hl-blue';if(!span.dataset.hid)span.dataset.hid='n_'+Date.now();createNote(span);document.body.classList.add('notes-open')}}bar.hidden=true;sel.removeAllRanges();save(false)}
function wrapSelection(cls){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let range=sel.getRangeAt(0);if(!$('#content').contains(range.commonAncestorContainer))return null;let span=document.createElement('span');span.className=cls;try{range.surroundContents(span)}catch{return null}return span}
function unwrap(el){let p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize()}
function clearUserHighlights(){$$('.hl-brown,.hl-rose,.hl-blue').forEach(unwrap)}
function createNote(span){let id=span.dataset.hid;if($(`.note-card[data-hid="${id}"]`))return;let card=document.createElement('div');card.className='note-card';card.dataset.hid=id;card.innerHTML=`<div class="note-quote">${esc(span.textContent.slice(0,120))}</div><textarea placeholder="Write note here..."></textarea><button class="delete-note" type="button">Delete</button>`;$('#notesList').prepend(card);bindNoteDeletes()}
function bindNoteDeletes(){$$('#notesList textarea').forEach(t=>t.oninput=()=>save(false));$$('.delete-note').forEach(btn=>btn.onclick=()=>{let card=btn.closest('.note-card'),id=card.dataset.hid,span=$(`[data-hid="${id}"]`);if(span)unwrap(span);card.remove();save(false)})}
function removeNote(id){if(!id)return;$(`.note-card[data-hid="${id}"]`)?.remove()}
function drawTimer(){let m=Math.floor(secs/60),s=secs%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
const DEFAULT_FONT_SIZE=16,MIN_FONT_SIZE=14,MAX_FONT_SIZE=22;
function currentFontSize(){return Number.parseInt(document.documentElement.style.fontSize,10)||DEFAULT_FONT_SIZE}
function setFontSize(size,persist=true){let n=Math.max(MIN_FONT_SIZE,Math.min(MAX_FONT_SIZE,Number(size)||DEFAULT_FONT_SIZE));document.documentElement.style.fontSize=n===DEFAULT_FONT_SIZE?'':n+'px';updateSizeButtons();if(persist)save(false)}
function adjustFontSize(delta){setFontSize(currentFontSize()+delta,true)}
function updateSizeButtons(){let size=currentFontSize(),dark=document.body.classList.contains('dark');$('#fontMinus')?.toggleAttribute('disabled',size<=MIN_FONT_SIZE);$('#fontPlus')?.toggleAttribute('disabled',size>=MAX_FONT_SIZE);$('#fontDefault')?.classList.toggle('active',size===DEFAULT_FONT_SIZE);$('#lightBtn')?.classList.toggle('active',!dark);$('#darkBtn')?.classList.toggle('active',dark)}
function resetAppearance(persist=true){document.body.classList.remove('dark');setFontSize(DEFAULT_FONT_SIZE,false);updateSizeButtons();if(persist)save(false)}
function clearAllProgress(){localStorage.removeItem(storeKey)}
$('#finish').onclick=finish;$('#save').onclick=()=>save(true);$('#clear').onclick=()=>{if(confirm('Clear all progress?')){window.resetTest();showToast('Clear complete')}};$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-open');save(false)};$('#closeNotes').onclick=()=>{document.body.classList.remove('notes-open');save(false)};$('#toggleIntensive').onclick=()=>{toggleIntensive();save(false)};$('#settingsBtn').onclick=()=>{$('#settings').classList.toggle('open');updateSizeButtons()};$('#lightBtn').onclick=()=>{document.body.classList.remove('dark');updateSizeButtons();save(false)};$('#darkBtn').onclick=()=>{document.body.classList.add('dark');updateSizeButtons();save(false)};$('#appearanceReset').onclick=()=>resetAppearance(true);$('#fontMinus').onclick=()=>adjustFontSize(-1);$('#fontPlus').onclick=()=>adjustFontSize(1);$('#fontDefault').onclick=()=>setFontSize(DEFAULT_FONT_SIZE,true);$('#settings').addEventListener('wheel',e=>{e.preventDefault();adjustFontSize(e.deltaY>0?-1:1)},{passive:false});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey)return;let key=e.key;if(key==='+'||key==='='){e.preventDefault();adjustFontSize(1)}else if(key==='-'||key==='_'){e.preventDefault();adjustFontSize(-1)}else if(key==='0'){e.preventDefault();resetAppearance(true)}});
const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
</script>
