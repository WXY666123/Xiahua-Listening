 reading."],["E","It’s inaccurate."],["F","It’s well illustrated."],["G","It’s boring."]],"questions":[["27","Contemporary Farming Manual"],["28","Running a Small Farm"],["29","Agriculture and Economics"],["30","How to Survive in Farming"]]}],"answerKey":{"text":{},"single":{"q21":"A","q22":"C","q23":"B","q24":"A","q25":"B","q26":"B"},"multiple":{},"multipleMap":{},"matching":{"q27":"G","q28":"E","q29":"D","q30":"B"},"map":{}},"transcriptLines":[{"time":"00:00:00,000 --> 00:00:07,820","html":"[Narrator]: Section 3.","cn":"旁白：第三部分。","analysis":""},{"time":"00:00:07,820 --> 00:00:13,220","html":"You will hear a student, called Joel, talking to his tutor about his research and the","cn":"你将听到一位名叫乔尔的学生向他的导师谈论他的研究以及","analysis":""},{"time":"00:00:13,220 --> 00:00:18,180","html":"farmer's attitudes towards new developments in agriculture.","cn":"农民对农业新发展的态度。","analysis":""},{"time":"00:00:18,180 --> 00:00:25,180","html":"First, you have some time to look at questions 21 to 26 on page 5.","cn":"首先，您有时间查看第5页上的问题21到26。","analysis":""},{"time":"00:00:48,180 --> 00:01:15,180","html":"Now listen carefully and answer questions 21 to 26.","cn":"现在请仔细听并回答问题21到26。","analysis":""},{"time":"00:01:18,680 --> 00:01:20,180","html":"[Joel]: Doctor Owen.","cn":"乔尔：欧文博士。","analysis":""},{"time":"00:01:20,180 --> 00:01:21,680","html":"[Dr. Owen]: Come in Joel.","cn":"欧文博士：进来吧，乔尔。","analysis":""},{"time":"00:01:21,680 --> 00:01:24,680","html":"Right, so how's your research going?","cn":"好的，你的研究进展如何？","analysis":""},{"time":"00:01:24,680 --> 00:01:30,180","html":"You're looking at how farmers feel about new technology and agriculture aren't you?","cn":"你是不是在研究农民对农业新技术的看法？","analysis":""},{"time":"00:01:30,180 --> 00:01:34,180","html":"[Joel]: Well, actually it's more general than that.","cn":"乔尔：嗯，实际上比那更广泛。","analysis":""},{"time":"00:01:34,180 --> 00:01:39,180","html":"I'm looking at their attitudes to a variety of new developments in agriculture.","cn":"我正在研究他们对农业各种新发展的态度。","analysis":""},{"time":"00:01:39,180 --> 00:01:40,180","html":"[Dr. Owen]: Okay.","cn":"欧文博士：好的。","analysis":""},{"time":"00:01:40,180 --> 00:01:43,180","html":"Have you got a title for the project yet?","cn":"你的项目有标题了吗？","analysis":""},{"time":"00:01:43,180 --> 00:01:51,180","html":"[Joel]: I was thinking of something simple, like <mark style=\"background-color: #fecaca;\">farmers attitudes towards the adoption of new farming practices<\/mark>.","cn":"乔尔：我正在考虑一个简单的标题，比如《农民对采用新耕作方式的态度》。","analysis":"<strong>答案解析：<\/strong> 乔尔最初的想法是“农民对采用新耕作方式的态度”，这与选项C“the types of farming”（耕作类型）以及选项B“the number of farmers”（农民数量）都无关，且在后续对话中被导师建议修改，所以这里是关于他标题的最初想法，但不是被采纳的建议，因此被标记为干扰项。"},{"time":"00:01:51,180 --> 00:01:55,180","html":"[Dr. Owen]: <mark style=\"background-color: #fecaca;\">That's possibly a bit too general<\/mark>.","cn":"欧文博士：<mark style=\"background-color: #fecaca;\">那可能有点太笼统了<\/mark>。","analysis":"<strong>答案解析：<\/strong> 欧文博士指出乔尔的标题“太笼统”，暗示乔尔需要更具体地限定研究范围，这直接否定了乔尔的初始想法，因此被标记为干扰项。"},{"time":"00:01:55,180 --> 00:01:59,180","html":"I think the title needs to be a bit more specific.","cn":"我认为标题需要更具体一些。","analysis":""},{"time":"00:01:59,180 --> 00:02:02,180","html":"What kind of farming will you be looking at?","cn":"你会研究哪种类型的农业？","analysis":""},{"time":"00:02:02,180 --> 00:02:05,180","html":"[Joel]: Well, <mark style=\"background-color: #fecaca;\">that'll vary, actually<\/mark>.","cn":"乔尔：嗯，<mark style=\"background-color: #fecaca;\">实际上会因情况而异<\/mark>。","analysis":"<strong>答案解析：<\/strong> 欧文博士询问“你会研究哪种类型的农业？”（对应问题21中的C选项“the types of farming”），但乔尔回答说“会因情况而异”，这表明他不会在标题中明确指出农业类型，因此C选项是干扰项。"},{"time":"00:02:05,180 --> 00:02:09,180","html":"But I want to speak to each of <mark style=\"background-color: #fecaca;\">the ten farmers<\/mark> in my sample.","cn":"但我希望与我样本中的<mark style=\"background-color: #fecaca;\">十位农民<\/mark>交谈。","analysis":"<strong>答案解析：<\/strong> 乔尔提到了他样本中“十位农民”的数量（对应问题21中的B选项“the number of farmers”），但欧文博士并未建议他将这个数量包含在项目标题中，所以B选项是干扰项。"},{"time":"00:02:09,180 --> 00:02:12,180","html":"So I've chosen farms which are <mark style=\"background-color: #bbf7d0;\">all in the same region<\/mark>.","cn":"所以我选择了<mark style=\"background-color: #bbf7d0;\">都在同一个地区<\/mark>的农场。","analysis":"<strong>答案解析：<\/strong> 乔尔提到他选择的农场“都在同一个地区”，这为欧文博士接下来的建议提供了基础。这里是正确答案的铺垫。"},{"time":"00:02:12,180 --> 00:02:13,180","html":"[Dr. Owen]: Okay.","cn":"欧文博士：好的。","analysis":""},{"time":"00:02:13,180 --> 00:02:17,180","html":"Well, I'd <mark style=\"background-color: #bbf7d0;\">specify where they are<\/mark> then.","cn":"嗯，那么我会<mark style=\"background-color: #bbf7d0;\">具体说明它们的位置<\/mark>。","analysis":"<strong>答案解析：<\/strong> 欧文博士建议乔尔“具体说明它们的位置”（specify where they are），这直接对应了问题21中的正确答案A“the location of the farms”（农场的位置）。"},{"time":"00:02:17,180 --> 00:02:18,180","html":"[Joel]: Right.","cn":"乔尔：好的。","analysis":""},{"time":"00:02:18,180 --> 00:02:20,180","html":"I'll amend the title to do that.","cn":"我会修改标题来做到这一点。","analysis":"<strong>答案解析：<\/strong> 乔尔同意修改标题以包含位置信息，确认了欧文博士的建议是最终采纳的。"},{"time":"00:02:20,180 --> 00:02:21,180","html":"[Dr. Owen]: Okay.","cn":"欧文博士：好的。","analysis":""},{"time":"00:02:21,180 --> 00:02:27,180","html":"Is there any particular reason why you've decided to do face-to-face interviews?","cn":"你决定进行面对面访谈有什么特别的原因吗？","analysis":""},{"time":"00:02:27,180 --> 00:02:30,180","html":"<mark style=\"background-color: #fecaca;\">It'll be quite time-consuming<\/mark>, won't it?","cn":"<mark style=\"background-color: #fecaca;\">这会相当耗时<\/mark>，不是吗？","analysis":"<strong>答案解析：<\/strong> 欧文博士指出面对面访谈会“相当耗时”，这与问题22中的选项B“to limit the time he spends on the project”（限制项目耗时）相矛盾，因此B是干扰项。"},{"time":"00:02:30,180 --> 00:02:31,180","html":"[Joel]: Yes.","cn":"乔尔：是的。","analysis":""},{"time":"00:02:31,180 --> 00:02:36,180","html":"And I did consider doing telephone interviews for that reason.","cn":"因此我确实考虑过进行电话访谈。","analysis":""},{"time":"00:02:36,180 --> 00:02:41,180","html":"Especially as <mark style=\"background-color: #fecaca;\">it's unnecessary for me to actually see the places where they work<\/mark>.","cn":"尤其是我<mark style=\"background-color: #fecaca;\">没有必要亲自去看他们工作的地方<\/mark>。","analysis":"<strong>答案解析：<\/strong> 乔尔明确表示他“没有必要亲自去看他们工作的地方”，这直接排除了问题22中的选项A“to see the farmers' workplaces”（查看农民的工作场所），因此A是干扰项。"},{"time":"00:02:42,180 --> 00:02:48,180","html":"It's just that, in my experience, a lot of farmers don't like talking on the phone.","cn":"只是根据我的经验，很多农民不喜欢打电话。","analysis":""},{"time":"00:02:48,180 --> 00:02:52,180","html":"So they'll be <mark style=\"background-color: #bbf7d0;\">more likely to talk freely if I see them in person<\/mark>.","cn":"所以如果我亲自去见他们，他们会<mark style=\"background-color: #bbf7d0;\">更愿意自由交谈<\/mark>。","analysis":"<strong>答案解析：<\/strong> 乔尔解释说，农民“更愿意自由交谈”如果他亲自去见他们。这表明面对面访谈能促使农民给出更详尽的回答，即“to get fuller answers”（获得更充分的回答），对应问题22中的正确答案C。"},{"time":"00:02:52,180 --> 00:02:53,180","html":"[Dr. Owen]: Yes.","cn":"欧文博士：是的。","analysis":""},{"time":"00:02:53,180 --> 00:02:55,180","html":"You're probably right.","cn":"你可能说得对。","analysis":""},{"time":"00:02:55,180 --> 00:02:56,180","html":"Good.","cn":"很好。","analysis":""},{"time":"00:02:56,180 --> 00:03:05,180","html":"[Joel]: Well, then the first thing I want to investigate is how the farmers actually find out about new developments in agriculture","cn":"乔尔：那么，我想调查的第一件事是农民究竟是如何了解到农业新发展的","analysis":""},{"time":"00:03:05,180 --> 00:03:07,180","html":"that they might want to adopt.","cn":"他们可能想要采纳的。","analysis":""},{"time":"00:03:07,180 --> 00:03:09,180","html":"What sources they use.","cn":"他们使用什么来源。","analysis":""},{"time":"00:03:09,180 --> 00:03:10,180","html":"[Dr. Owen]: Right.","cn":"欧文博士：好的。","analysis":""},{"time":"00:03:10,180 --> 00:03:13,180","html":"So how are you going to do this?","cn":"那你打算怎么做呢？","analysis":""},{"time":"00:03:13,180 --> 00:03:19,180","html":"[Joel]: Well, I could <mark style=\"background-color: #fecaca;\">make a checklist of sources of information for them to look at in advance<\/mark>,","cn":"乔尔：嗯，我可以在事前<mark style=\"background-color: #fecaca;\">为他们制作一份信息来源清单<\/mark>，","analysis":"<strong>答案解析：<\/strong> 乔尔最初的计划是“制作一份信息来源清单让他们提前查看”，这对应了问题23中的C选项“by sending them a checklist in advance”（提前给他们发送一份清单）。然而，这个方法被欧文博士否定了，因此C是干扰项。"},{"time":"00:03:19,180 --> 00:03:23,180","html":"so they could tick off the ones they actually use.","cn":"这样他们就可以勾选出他们实际使用的。","analysis":""},{"time":"00:03:23,180 --> 00:03:31,180","html":"Things like farming magazines, farm product advertisements, television and the internet and so on.","cn":"比如农业杂志、农产品广告、电视和互联网等等。","analysis":""},{"time":"00:03:31,180 --> 00:03:36,180","html":"[Dr. Owen]: It might be more useful to <mark style=\"background-color: #fecaca;\">ask them rather than show them a list<\/mark>.","cn":"欧文博士：<mark style=\"background-color: #fecaca;\">直接问他们而不是给他们看清单<\/mark>可能更有用。","analysis":"<strong>答案解析：<\/strong> 欧文博士否定了乔尔使用清单的想法，为接下来的正确建议做铺垫。"},{"time":"00:03:36,180 --> 00:03:43,180","html":"<mark style=\"background-color: #bbf7d0;\">A spontaneous response to one or two open questions might give you a more accurate picture<\/mark>.","cn":"<mark style=\"background-color: #bbf7d0;\">对一两个开放性问题的自发回答可能会给你更准确的情况<\/mark>。","analysis":"<strong>答案解析：<\/strong> 欧文博士建议“对一两个开放性问题的自发回答可能会给你更准确的情况”，这直接对应了问题23中的正确答案B“by asking them open questions”（通过问他们开放性问题）。"},{"time":"00:03:43,180 --> 00:03:44,180","html":"[Joel]: All right.","cn":"乔尔：好的。","analysis":""},{"time":"00:03:44,180 --> 00:03:45,180","html":"I'll do that then.","cn":"那我就这么做。","analysis":"<strong>答案解析：<\/strong> 乔尔同意了欧文博士的建议。"},{"time":"00:03:45,180 --> 00:03:49,180","html":"[Dr. Owen]: Now, talk me through some of the other issues you want to cover.","cn":"欧文博士：现在，跟我说说你还想涵盖的其他一些问题。","analysis":""},{"time":"00:03:49,180 --> 00:03:53,180","html":"[Joel]: Well, there's the way the government communicates with farmers.","cn":"乔尔：嗯，还有政府与农民沟通的方式。","analysis":""},{"time":"00:03:53,180 --> 00:03:54,180","html":"[Dr. Owen]: Right.","cn":"欧文博士：好的。","analysis":""},{"time":"00:03:54,180 --> 00:04:01,180","html":"Well, one thing is, farmers complain that <mark style=\"background-color: #bbf7d0;\">the government sends out the same information to all of them<\/mark>,","cn":"嗯，其中一件事是，农民抱怨<mark style=\"background-color: #bbf7d0;\">政府向所有农民发送相同的信息<\/mark>，","analysis":""},{"time":"00:04:01,180 --> 00:04:06,180","html":"whether they're poultry farmers or dairy farmers or arable farmers.","cn":"无论他们是养禽户、奶农还是耕地农民。","analysis":""},{"time":"00:04:06,180 --> 00:04:11,180","html":"[Joel]: So they get all this information, but <mark style=\"background-color: #bbf7d0;\">half of it doesn't actually apply to them<\/mark>.","cn":"乔尔：所以他们收到所有这些信息，但<mark style=\"background-color: #bbf7d0;\">其中一半实际上与他们无关<\/mark>。","analysis":"<strong>答案解析：<\/strong> 欧文博士指出政府向所有农民发送相同信息，乔尔总结到“其中一半实际上与他们无关”，这意味着信息“不相关”（irrelevant）。这直接对应了问题24中的正确答案A“much of it is irrelevant”（其中大部分是不相关的）。"},{"time":"00:04:11,180 --> 00:04:12,180","html":"[Dr. Owen]: <mark style=\"background-color: #bbf7d0;\">Exactly<\/mark>.","cn":"欧文博士：<mark style=\"background-color: #bbf7d0;\">没错<\/mark>。","analysis":"<strong>答案解析：<\/strong> 欧文博士用“Exactly”（没错）来表示他完全同意乔尔的观点，进一步确认了问题24中的答案A是他们共同的看法。"},{"time":"00:04:12,180 --> 00:04:15,180","html":"So you could look at that.","cn":"所以你可以研究一下这一点。","analysis":""},{"time":"00:04:15,180 --> 00:04:16,180","html":"[Joel]: Right.","cn":"乔尔：好的。","analysis":""},{"time":"00:04:16,180 --> 00:04:23,180","html":"Then I wanted to look at attitudes of British farmers to the cost of making any changes on their farms.","cn":"然后我想研究英国农民对在农场进行任何改变所需成本的态度。","analysis":""},{"time":"00:04:24,180 --> 00:04:34,180","html":"According to articles I've read, farmers in Britain <mark style=\"background-color: #fecaca;\">aren't in principle against investing money in new machinery and new practices<\/mark>,","cn":"根据我读过的文章，英国农民<mark style=\"background-color: #fecaca;\">原则上不反对投资新机械和新实践<\/mark>，","analysis":"<strong>答案解析：<\/strong> 乔尔的阅读表明英国农民“原则上不反对投资新机械和新实践”，这直接排除了问题25中的C选项“are reluctant to spend money on improvements”（不愿在改进上花钱），因此C是干扰项。"},{"time":"00:04:34,180 --> 00:04:40,180","html":"but they're actually <mark style=\"background-color: #bbf7d0;\">just too busy to work out what the financial implications are<\/mark>.","cn":"但他们实际上<mark style=\"background-color: #bbf7d0;\">只是太忙了，没时间计算财务影响<\/mark>。","analysis":"<strong>答案解析：<\/strong> 乔尔提到英国农民“只是太忙了，没时间计算财务影响”（too busy to work out what the financial implications are），这直接对应了问题25中的正确答案B“have too little time to calculate the costs of new methods”（没有足够时间计算新方法的成本）。"},{"time":"00:04:40,180 --> 00:04:48,180","html":"[Dr. Owen]: Yes, and <mark style=\"background-color: #fecaca;\">a lot of them don't seem to consider getting financial advice from their accountants about it either<\/mark>.","cn":"欧文博士：是的，而且<mark style=\"background-color: #fecaca;\">他们很多人似乎也没有考虑向他们的会计师寻求财务建议<\/mark>。","analysis":"<strong>答案解析：<\/strong> 欧文博士补充说农民“没有考虑向他们的会计师寻求财务建议”，这与问题25中的A选项“leave investment decisions to their accountants”（将投资决策留给他们的会计师）相矛盾，因此A是干扰项。"},{"time":"00:04:48,180 --> 00:04:49,180","html":"[Joel]: Right.","cn":"乔尔：好的。","analysis":""},{"time":"00:04:49,180 --> 00:04:54,180","html":"[Dr. Owen]: I've been some research in Australia on sheep rearing practices.","cn":"欧文博士：我一直在澳大利亚进行一些关于绵羊饲养实践的研究。","analysis":""},{"time":"00:04:54,180 --> 00:04:57,180","html":"I can give you the reference, if you like.","cn":"如果你愿意，我可以给你参考文献。","analysis":""},{"time":"00:04:57,180 --> 00:05:10,180","html":"Basically, it appears that <mark style=\"background-color: #bbf7d0;\">the majority of Australian sheep farmers are willing to risk adopting new practices on the basis of just a few pieces of research<\/mark>.","cn":"基本上，似乎<mark style=\"background-color: #bbf7d0;\">大多数澳大利亚绵羊养殖户愿意在仅有少量研究的基础上冒险采用新实践<\/mark>。","analysis":"<strong>答案解析：<\/strong> 欧文博士指出大多数澳大利亚绵羊养殖户“愿意在仅有少量研究的基础上冒险采用新实践”，这直接对应了问题26中的正确答案B“make changes based on limited research”（根据有限的研究进行改变）。"},{"time":"00:05:10,180 --> 00:05:17,180","html":"<mark style=\"background-color: #fecaca;\">They don't usually wait until the evidence in favour of the changes is overwhelming<\/mark>.","cn":"<mark style=\"background-color: #fecaca;\">他们通常不会等到支持这些改变的证据确凿无疑才行动<\/mark>。","analysis":"<strong>答案解析：<\/strong> 欧文博士补充说他们“通常不会等到支持这些改变的证据确凿无疑才行动”，这与问题26中的C选项“want plenty of evidence before they make changes”（在做出改变前需要大量证据）相矛盾，因此C是干扰项。"},{"time":"00:05:17,180 --> 00:05:22,180","html":"<mark style=\"background-color: #fecaca;\">They're quite happy to act before then so they can get ahead of the game<\/mark>.","cn":"<mark style=\"background-color: #fecaca;\">他们很乐意在此之前行动，以便抢占先机<\/mark>。","analysis":"<strong>答案解析：<\/strong> 欧文博士提到他们“很乐意在此之前行动”，这与问题26中的A选项“are usually reluctant to make changes”（通常不愿做出改变）相矛盾，因此A是干扰项。"},{"time":"00:05:22,180 --> 00:05:25,180","html":"[Joel]: OK, I'll take a look at that.","cn":"乔尔：好的，我会看看。","analysis":""},{"time":"00:05:25,180 --> 00:05:26,180","html":"Thanks.","cn":"谢谢。","analysis":""},{"time":"00:05:29,180 --> 00:05:37,180","html":"[Narrator]: Before you hear the rest of the discussion, you have some time to look at questions 27 to 30 on page 6.","cn":"旁白：在您听讨论的其余部分之前，您有时间查看第6页上的问题27到30。","analysis":""},{"time":"00:05:48,180 --> 00:05:53,180","html":"Now listen and answer questions 27 to 30.","cn":"现在请听并回答问题27到30。","analysis":""},{"time":"00:06:04,180 --> 00:06:09,180","html":"[Dr. Owen]: We said we'd also look at some of the reading material I've been reviewing.","cn":"欧文博士：我们说过也要看看我一直在审阅的一些阅读材料。","analysis":""},{"time":"00:06:10,180 --> 00:06:17,180","html":"[Joel]: Yes, I had another look at contemporary farming manual, which is clearly bang up to date.","cn":"乔尔：是的，我又看了一遍《当代农业手册》，它显然是最新的。","analysis":""},{"time":"00:06:17,180 --> 00:06:22,180","html":"It covers a lot of things a farmer might want to know, but it's <mark style=\"background-color: #bbf7d0;\">so dull<\/mark>.","cn":"它涵盖了农民可能想知道的很多东西，但它<mark style=\"background-color: #bbf7d0;\">太枯燥了<\/mark>。","analysis":"<strong>答案解析：<\/strong> 乔尔形容《当代农业手册》“太枯燥了”（so dull），这直接对应了问题27中的正确答案G“It’s boring”（它很无聊）。"},{"time":"00:06:22,180 --> 00:06:24,180","html":"[Dr. Owen]: Oh, <mark style=\"background-color: #bbf7d0;\">absolutely<\/mark>.","cn":"欧文博士：哦，<mark style=\"background-color: #bbf7d0;\">完全同意<\/mark>。","analysis":"<strong>答案解析：<\/strong> 欧文博士用“absolutely”来表示完全同意乔尔对这本书的看法，进一步确认了该书的评价。"},{"time":"00:06:24,180 --> 00:06:26,180","html":"I found it really hard going.","cn":"我发现它读起来真的很费劲。","analysis":""},{"time":"00:06:26,180 --> 00:06:29,180","html":"And I can't imagine any farmer waiting through it.","cn":"我无法想象有哪个农民会读完它。","analysis":""},{"time":"00:06:29,180 --> 00:06:32,180","html":"<mark style=\"background-color: #fecaca;\">There aren't even any decent pictures<\/mark>.","cn":"<mark style=\"background-color: #fecaca;\">甚至没有像样的图片<\/mark>。","analysis":"<strong>答案解析：<\/strong> 欧文博士抱怨书中“甚至没有像样的图片”，这与问题27中的F选项“It’s well illustrated”（插图精美）相矛盾，因此F是干扰项。"},{"time":"00:06:32,180 --> 00:06:35,180","html":"Did you have time to look at running a small farm?","cn":"你有时间看《小农场经营》吗？","analysis":""},{"time":"00:06:35,180 --> 00:06:42,180","html":"[Joel]: Yes, although I only read bits of it because despite being entertaining, <mark style=\"background-color: #fecaca;\">it wasn't very academic<\/mark>.","cn":"乔尔：是的，虽然我只读了一部分，因为它虽然有趣，但<mark style=\"background-color: #fecaca;\">不怎么学术<\/mark>。","analysis":"<strong>答案解析：<\/strong> 乔尔说这本书“不怎么学术”，这并不是一个负面评价，因为它可能只是风格不同。真正的负面评价是欧文博士的反馈。"},{"time":"00:06:42,180 --> 00:06:44,180","html":"[Dr. Owen]: I know.","cn":"欧文博士：我知道。","analysis":""},{"time":"00:06:44,180 --> 00:06:48,180","html":"And <mark style=\"background-color: #bbf7d0;\">a lot of the information is either misleading or simply wrong<\/mark>.","cn":"而且<mark style=\"background-color: #bbf7d0;\">很多信息不是误导就是完全错误<\/mark>。","analysis":"<strong>答案解析：<\/strong> 欧文博士指出《小农场经营》中“很多信息不是误导就是完全错误”，这直接对应了问题28中的正确答案E“It’s inaccurate”（它不准确）。"},{"time":"00:06:48,180 --> 00:06:51,180","html":"I'm surprised it got published at all.","cn":"我真惊讶它竟然出版了。","analysis":""},{"time":"00:06:51,180 --> 00:06:55,180","html":"I don't imagine the farming press will rate it very highly.","cn":"我想农业出版界不会给它很高的评价。","analysis":""},{"time":"00:06:55,180 --> 00:07:00,180","html":"[Joel]: You recommend agriculture and economics.","cn":"乔尔：您推荐了《农业与经济学》。","analysis":""},{"time":"00:07:01,180 --> 00:07:04,180","html":"I expected that <mark style=\"background-color: #fecaca;\">it would be really difficult<\/mark>.","cn":"我本以为<mark style=\"background-color: #fecaca;\">它会非常难<\/mark>。","analysis":"<strong>答案解析：<\/strong> 乔尔提到他曾预期这本书“会非常难”，但这只是他最初的假设，并非这本书的真实评价，也不是一个选项。他后续的评价才是关键。"},{"time":"00:07:04,180 --> 00:07:10,180","html":"<mark style=\"background-color: #fecaca;\">The titles are a bit off-putting<\/mark>, but I thought <mark style=\"background-color: #fecaca;\">it was brilliant<\/mark>, so I've bought it.","cn":"<mark style=\"background-color: #fecaca;\">标题有点让人望而却步<\/mark>，但我认为<mark style=\"background-color: #fecaca;\">它非常出色<\/mark>，所以我买了它。","analysis":"<strong>答案解析：<\/strong> 乔尔对这本书的标题感觉“有点让人望而却步”，但这并非书的实际内容评价，且他最终认为“它非常出色”。这些都不直接对应选项A、C、G。关键信息在欧文博士的评价中。"},{"time":"00:07:10,180 --> 00:07:11,180","html":"[Dr. Owen]: Yes.","cn":"欧文博士：是的。","analysis":""},{"time":"00:07:11,180 --> 00:07:17,180","html":"<mark style=\"background-color: #fecaca;\">Some people think it relies too heavily on farming practices in specific parts of the world<\/mark>,","cn":"<mark style=\"background-color: #fecaca;\">有些人认为它过于依赖世界特定地区的农业实践<\/mark>，","analysis":"<strong>答案解析：<\/strong> 欧文博士提到“有些人认为它过于依赖世界特定地区的农业实践”，但这只是“一些人”的观点，并且欧文博士立即对此进行了反驳，所以这不是对这本书的整体或最终评价，也不是选项A、C、G的直接对应。"},{"time":"00:07:17,180 --> 00:07:21,180","html":"but <mark style=\"background-color: #bbf7d0;\">the theories that underpin these are universal<\/mark>.","cn":"但<mark style=\"background-color: #bbf7d0;\">支撑这些的理论是普遍适用的<\/mark>。","analysis":""},{"time":"00:07:21,180 --> 00:07:27,180","html":"And that's why <mark style=\"background-color: #bbf7d0;\">it's a required textbook for anyone studying agriculture<\/mark>.","cn":"这就是为什么它<mark style=\"background-color: #bbf7d0;\">是所有农业学习者的必读教材<\/mark>。","analysis":"<strong>答案解析：<\/strong> 欧文博士解释说《农业与经济学》的理论是普遍适用的，并且它“是所有农业学习者的必读教材”（a required textbook for anyone studying agriculture），这直接对应了问题29中的正确答案D“It’s essential reading”（它是必读的）。"},{"time":"00:07:27,180 --> 00:07:28,180","html":"[Joel]: Right.","cn":"乔尔：好的。","analysis":""},{"time":"00:07:28,180 --> 00:07:31,180","html":"[Dr. Owen]: What else did you come across?","cn":"欧文博士：你还遇到了什么？","analysis":""},{"time":"00:07:31,180 --> 00:07:35,180","html":"[Joel]: I borrowed how to survive in farming from the library.","cn":"乔尔：我从图书馆借了《如何在农业中生存》。","analysis":""},{"time":"00:07:35,180 --> 00:07:40,180","html":"I thought it would be interesting background, and I liked the informal style,","cn":"我以为它会是一个有趣的背景资料，而且我喜欢它的非正式风格，","analysis":""},{"time":"00:07:40,180 --> 00:07:43,180","html":"but <mark style=\"background-color: #bbf7d0;\">it turned out to have been written years ago<\/mark>.","cn":"但<mark style=\"background-color: #bbf7d0;\">结果它是在很多年前写的<\/mark>。","analysis":"<strong>答案解析：<\/strong> 乔尔发现《如何在农业中生存》“是在很多年前写的”，这暗示了它可能不再适用。这为欧文博士的确认提供了铺垫。"},{"time":"00:07:43,180 --> 00:07:48,180","html":"[Dr. Owen]: Yes, and like everything else, <mark style=\"background-color: #bbf7d0;\">farming fashions have changed<\/mark>,","cn":"欧文博士：是的，和所有其他事物一样，<mark style=\"background-color: #bbf7d0;\">农业潮流已经改变了<\/mark>，","analysis":""},{"time":"00:07:48,180 --> 00:07:51,180","html":"so <mark style=\"background-color: #bbf7d0;\">it's spardly in need of a new addition<\/mark>.","cn":"所以<mark style=\"background-color: #bbf7d0;\">它迫切需要一个新版本<\/mark>。","analysis":"<strong>答案解析：<\/strong> 欧文博士指出“农业潮流已经改变了”并且这本书“迫切需要一个新版本”，这明确表示这本书“过时了”（out of date），直接对应了问题30中的正确答案B“It’s out of date”（它过时了）。"},{"time":"00:07:51,180 --> 00:07:54,180","html":"[Joel]: Can I ask you a question about...","cn":"乔尔：我能问你一个关于……的问题吗？","analysis":""},{"time":"00:07:55,180 --> 00:07:59,180","html":"[Narrator]: That is the end of section 3.","cn":"旁白：第三部分到此结束。","analysis":""},{"time":"00:07:59,180 --> 00:08:03,180","html":"You now have half a minute to check your answers.","cn":"您现在有半分钟时间检查您的答案。","analysis":""},{"time":"00:08:24,180 --> 00:08:30,180","html":"Now turn to section 4 on page 7.","cn":"现在翻到第7页的第四部分。","analysis":""},{"time":"00:08:54,180 --> 00:08:57,180","html":"You","cn":"你","analysis":""}],"transcriptHighlights":[{"qid":"21","text":"the location of the farms","answer":"A"},{"qid":"22","text":"to get fuller answers","answer":"C"},{"qid":"23","text":"by asking them open questions.","answer":"B"},{"qid":"24","text":"much of it is irrelevant.","answer":"A"},{"qid":"25","text":"have too little time to calculate the costs of new methods.","answer":"B"},{"qid":"26","text":"make changes based on limited research.","answer":"B"},{"qid":"27","text":"It’s boring.","answer":"G"},{"qid":"28","text":"It’s inaccurate.","answer":"E"},{"qid":"29","text":"It’s essential reading.","answer":"D"},{"qid":"30","text":"It’s out of date.","answer":"B"}],"ownerInfo":"此内容由🍠@Listening 永不虾滑整理，仅作为分享供个人使用；禁止商用、倒卖和引流。有问题请先仔细看🍠这个账号的置顶和分享贴。没有团队，不是机构，纯个人分享。督学和其他相关课程请咨询主页另一个号@心情有点虾滑（不回任何机经相关消息）。"}</script>
<script>
const DATA=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const RENDER_VERSION=17;
let secs=0,review=false,timer=setInterval(()=>{secs++;drawTimer();if(secs%5===0)save(false)},1000),drag=null,currentCue=-1,loopCue=false,slowCue=false,showCn=true,showAnalysis=true,dictationMode=false,showOriginal=true,dictationAnswers={};const storeKey='ielts_v4_'+DATA.title.replace(/\W+/g,'_');
const CONFIG_DATA={answerKey:DATA.answerKey,questionList:DATA.questionIds.map(q=>Number(q)||q),localStorageKey:storeKey};window.localStorageKey=storeKey;window.DATA=DATA;window.CONFIG_DATA=CONFIG_DATA;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function matchingRepeatAttr(g){return (g.questions||[]).length>(g.options||[]).length?' data-repeat="true"':''}
function flowQuestionMap(g){let map={};(g.questions||[]).forEach(q=>map[q[0]]=q[1]);return map}
function flowQidsInText(raw,qmap){return Object.keys(qmap).filter(id=>new RegExp(`(?<!\\d)${id}(?!\\d)`).test(raw)).sort((a,b)=>Number(a)-Number(b))}
function renderFlowText(raw,qids){qids=Array.isArray(qids)?qids:[qids];let html=esc(String(raw||''));qids.forEach(qid=>{html=html.replace(new RegExp(`(?<!\\d)${qid}(?!\\d)`),`<span class="flow-num">${qid}</span>`)});let slotIdx=0;html=html.replace(/(?:_{2,}|…{2,}|\.{4,})/g,()=>{let qid=qids[slotIdx++]||qids[qids.length-1];return `<span class="slot" data-q="${qid}"></span>`});qids.slice(slotIdx).forEach(qid=>{html+=` <span class="slot" data-q="${qid}"></span>`});return html}
function renderFlowLine(line,qmap,used){let raw=String((typeof line==='object'&&line?line.text:line)||''),qids=flowQidsInText(raw,qmap);if(qids.length){qids.forEach(qid=>used.add(qid));return `<div class="flow-step flow-step-full"><div class="flow-text">${renderFlowText(raw,qids)}</div></div>`}return `<div class="flow-note">${esc(raw)}</div>`}
function renderFlowTable(lines,qmap,used){let rows=[],maxCols=1;lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0,cols=Number(meta.cols)||1,raw=String(meta.text||''),qids=flowQidsInText(raw,qmap);maxCols=Math.max(maxCols,cols,col+1);if(!rows[row])rows[row]=[];if(!rows[row][col])rows[row][col]=[];qids.forEach(qid=>used.add(qid));rows[row][col].push(`<div class="flow-text">${qids.length?renderFlowText(raw,qids):esc(raw)}</div>`)});return `<div class="flow-table-wrap"><table class="flow-table">${rows.map(cells=>{let filled=(cells||[]).map((parts,col)=>parts?{col,html:parts.join('')}:null).filter(Boolean);return `<tr>${filled.map(cell=>{let span=filled.length===1&&maxCols>1?` colspan="${maxCols}"`:'';return `<td${span}>${cell.html}</td>`}).join('')}</tr>`}).join('')}</table></div>`}
function renderFlowSteps(g){let qmap=flowQuestionMap(g),used=new Set(),lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:[]);if(lines.length){let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFlowTable(chunk,qmap,used);continue}html+=renderFlowLine(lines[i++],qmap,used)}return html+(g.questions||[]).filter(q=>!used.has(q[0])).map(q=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>`).join('')}return g.questions.map((q,idx)=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>${idx<g.questions.length-1?'<div class="flow-arrow">↓</div>':''}`).join('')}
function groupHTML(g){if(g.type==='matching'&&g.layout==='flow')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="flow-layout"><div class="flow-steps">${renderFlowSteps(g)}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='matching'&&g.layout==='diagram')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'diagram.png')}" alt="Diagram"></div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></div></section>`;
if(g.type==='matching')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;

function cueRange(x){let parts=String(x?.time||'').split(/\s*-->\s*/);return {start:parseStamp(parts[0]),end:parseStamp(parts[1])}}
function transcriptLineHTML(x){if(x&&typeof x==='object'&&x.html!==undefined){let html=sanitizeTranscriptHtml(x.html),hit=/<mark\b|class="[^"]*(hl|answer-highlight)/.test(html),cn=x.cn?`<div class="cue-cn">${sanitizeTranscriptHtml(x.cn)}</div>`:'',analysis=x.analysis?`<div class="cue-analysis">${sanitizeTranscriptHtml(x.analysis)}</div>`:'';return `<section class="cue ${hit?'has-hit':''}"><div class="cue-time">${esc(formatCueTime(x.time))}</div><div><p>${html}</p>${cn}${analysis}</div></section>`}return `<p>${markTranscript(Array.isArray(x)?(x[2]||x.join(' ')):x)}</p>`}
function buildTranscript(){let lines=DATA.transcriptLines||[];$('#transcript').classList.remove('hide-cn','hide-analysis');$('#transcript').innerHTML=lines.length?`<h3>Listening Transcript</h3>${lines.map(transcriptLineHTML).join('')}<p>&nbsp;</p>`:'<h3>Listening Transcript</h3><p>No transcript was provided in the source file.</p><p>&nbsp;</p>'}
function studyLines(){return (DATA.transcriptLines||[]).filter(x=>x&&typeof x==='object'&&x.html!==undefined)}
function studyCueHTML(x,i){let html=sanitizeTranscriptHtml(x.html),cn=x.cn?`<div class="cue-cn">${sanitizeTranscriptHtml(x.cn)}</div>`:'',analysis=x.analysis?`<div class="cue-analysis">${sanitizeTranscriptHtml(x.analysis)}</div>`:'',saved=esc(dictationAnswers[i]||''),box=dictationMode?`<textarea class="dictation-box" data-idx="${i}" placeholder="输入你听到的内容..." onclick="event.stopPropagation()">${saved}</textarea>`:'';return `<button class="study-cue" type="button" data-idx="${i}"><span class="cue-time">${esc(formatCueTime(x.time))}</span><p>${html}</p>${cn}${analysis}${box}</button>`}
function buildIntensive(){let lines=studyLines(),panel=$('#transcript');panel.classList.toggle('hide-cn',!showCn);panel.classList.toggle('hide-analysis',!showAnalysis);panel.classList.toggle('dictation-mode',dictationMode);panel.classList.toggle('show-original',showOriginal);panel.innerHTML=lines.length?`<div class="study-head"><h3>原文和精听</h3><div class="study-controls"><button id="prevCue" type="button">上一句</button><button id="playCue" type="button">播放 / 暂停</button><button id="nextCue" type="button">下一句</button><button id="loopCue" type="button" class="${loopCue?'active':''}">循环当前句</button><button id="slowCue" type="button" class="${slowCue?'active':''}">0.8x 慢速</button></div><div class="study-controls"><button id="dictationCue" type="button" class="${dictationMode?'active':''}">听写模式</button><button id="originalCue" type="button" class="${showOriginal?'active':''}">显示原文</button><button id="cnCue" type="button" class="${showCn?'active':''}">显示中文</button><button id="analysisCue" type="button" class="${showAnalysis?'active':''}">显示解析</button></div></div><div class="study-list">${lines.map(studyCueHTML).join('')}</div><p>&nbsp;</p>`:'<h3>原文和精听</h3><p>No timed transcript was provided.</p><p>&nbsp;</p>';bindStudyControls();setActiveCue(currentCue)}
function toggleIntensive(){let main=$('#main');if(main.classList.contains('split')&&$('#transcript .study-head')){main.classList.remove('split');return}main.classList.add('split');buildIntensive()}
function bindStudyControls(){let panel=$('#transcript');panel.querySelectorAll('.study-cue').forEach(btn=>btn.onclick=e=>{if(e.target.closest('.dictation-box'))return;playCue(Number(btn.dataset.idx))});panel.querySelectorAll('.dictation-box').forEach(box=>{box.oninput=()=>{dictationAnswers[box.dataset.idx]=box.value;save(false)}});$('#prevCue')?.addEventListener('click',()=>playCue(Math.max(0,(currentCue<0?0:currentCue-1))));$('#nextCue')?.addEventListener('click',()=>playCue(Math.min(studyLines().length-1,(currentCue<0?0:currentCue+1))));$('#playCue')?.addEventListener('click',()=>audio.paused?audio.play():audio.pause());$('#loopCue')?.addEventListener('click',()=>{loopCue=!loopCue;buildIntensive();save(false)});$('#slowCue')?.addEventListener('click',()=>{slowCue=!slowCue;audio.playbackRate=slowCue ? 0.8 : +$('#speed').value;buildIntensive();save(false)});$('#cnCue')?.addEventListener('click',()=>{showCn=!showCn;buildIntensive();save(false)});$('#analysisCue')?.addEventListener('click',()=>{showAnalysis=!showAnalysis;buildIntensive();save(false)});$('#dictationCue')?.addEventListener('click',()=>{dictationMode=!dictationMode;if(dictationMode){showOriginal=false;showCn=false;showAnalysis=false}else{showOriginal=true;showCn=true;showAnalysis=true}buildIntensive();save(false)});$('#originalCue')?.addEventListener('click',()=>{showOriginal=!showOriginal;buildIntensive();save(false)})}
function playCue(i){let lines=studyLines();if(!lines.length)return;currentCue=Math.max(0,Math.min(i,lines.length-1));let r=cueRange(lines[currentCue]);audio.currentTime=r.start||0;if(slowCue)audio.playbackRate=.8;audio.play();setActiveCue(currentCue);save(false)}
function setActiveCue(i){$$('.study-cue').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.idx)===i));let active=$(`.study-cue[data-idx="${i}"]`);active?.scrollIntoView({block:'nearest'})}
function maintainCueLoop(){if(currentCue<0||!loopCue)return;let line=studyLines()[currentCue],r=cueRange(line);if(r.end&&audio.currentTime>=r.end-.05){audio.currentTime=r.start||0;audio.play()}}
function showToast(msg='Progress saved!'){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1400)}
function collectAnswers(){let answers={text:{},single:{},multiple:{},matching:{},map:{}};$$('#content input[name^="q"]').forEach(i=>answers.text[i.name]=i.value);$$('.single-choice.selected').forEach(c=>answers.single[c.dataset.name]=c.dataset.value);$$('.map-choice.selected').forEach(c=>answers.map[c.dataset.name]=c.dataset.value);let names=[...new Set($$('.multi-choice').map(c=>c.dataset.name))];names.forEach(name=>answers.multiple[name]=$$(`.multi-choice[data-name="${name}"].selected`).map(c=>c.dataset.value));$$('.slot').forEach(s=>{let tag=s.querySelector('.tag');if(tag)answers.matching[s.dataset.q]=tag.dataset.value});return answers}
function restoreAnswers(a={}){hardResetAnswers();Object.entries(a.text||{}).forEach(([name,val])=>{let el=$(`input[name="${name}"]`);if(el)el.value=val});Object.entries(a.single||{}).forEach(([name,val])=>{let el=$(`.single-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.map||{}).forEach(([name,val])=>{let el=$(`.map-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.multiple||{}).forEach(([name,vals])=>(vals||[]).forEach(val=>{let el=$(`.multi-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')}));Object.entries(a.matching||{}).forEach(([qid,val])=>{let opt=$(`.drag[data-value="${val}"]`),slot=$(`.slot[data-q="${qid}"]`);if(opt&&slot)slot.innerHTML=`<span class="tag" draggable="true" data-value="${val}">${esc(opt.textContent)}</span>`});refreshPool();restoreDragging();updateNav()}
function contentSnapshot(){let clone=$('#content').cloneNode(true);clone.querySelectorAll('.review').forEach(r=>r.remove());clone.querySelectorAll('input').forEach(i=>{i.setAttribute('value',i.value);i.removeAttribute('disabled')});clone.querySelectorAll('.choice').forEach(c=>c.classList.remove('disabled'));return clone.innerHTML}
function notesSnapshot(){$$('#notesList textarea').forEach(t=>{t.textContent=t.value;t.setAttribute('data-value',t.value)});return $('#notesList').innerHTML}
function layoutSignature(){return JSON.stringify([RENDER_VERSION,(DATA.groups||[]).map(g=>[g.type,g.layout||'',g.id||'',g.title||'',g.instruction||'',g.questionText||'',g.image||'',(g.options||[]),(g.questions||[]).map(q=>JSON.stringify(q))])])}
function save(show=false){let data={secs,answers:collectAnswers(),contentHtml:contentSnapshot(),layoutSignature:layoutSignature(),notes:notesSnapshot(),dark:document.body.classList.contains('dark'),font:document.documentElement.style.fontSize,dictationAnswers,studyState:{currentCue,loopCue,slowCue,showCn,showAnalysis,dictationMode,showOriginal},audioTime:audio?.currentTime||0};localStorage.setItem(storeKey,JSON.stringify(data));if(show)showToast()}
function load(){let raw=localStorage.getItem(storeKey);if(!raw)return;let d;try{d=JSON.parse(raw)}catch(err){console.warn('Saved progress could not be read.',err);return}secs=d.secs||0;if(d.answers){try{restoreAnswers(d.answers)}catch(err){console.warn('Saved answers could not be restored.',err)}}if(d.dictationAnswers)dictationAnswers=d.dictationAnswers;if(d.studyState)try{({currentCue=currentCue,loopCue=loopCue,slowCue=slowCue,showCn=showCn,showAnalysis=showAnalysis,dictationMode=dictationMode,showOriginal}=d.studyState)}catch(err){console.warn('Study state could not be restored.',err)}if(d.notes){try{$('#notesList').innerHTML=d.notes;$$('#notesList textarea').forEach(t=>{t.value=t.dataset.value||t.textContent||''})}catch(err){console.warn('Saved notes could not be restored.',err)}}if(d.dark)document.body.classList.add('dark');setFontSize(d.font||DEFAULT_FONT_SIZE,false);if(d.audioTime)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=d.audioTime},{once:true});bindNoteDeletes();drawTimer()}
function handleSelection(e){if(e.target.closest('#selbar,#notes,.bottom-bar'))return;let sel=window.getSelection();let hl=e.target.closest?.('.hl-brown,.hl-rose,.hl-blue');let bar=$('#selbar');if(hl&&sel.isCollapsed){bar.targetElem=hl;placeBar(bar,hl.getBoundingClientRect())}else if(sel&&!sel.isCollapsed&&$('#content').contains(sel.anchorNode)){bar.targetElem=null;placeBar(bar,sel.getRangeAt(0).getBoundingClientRect())}else{bar.hidden=true}}
function placeBar(bar,rect){bar.hidden=false;bar.style.left=Math.max(8,window.scrollX+rect.left+rect.width/2-95)+'px';bar.style.top=Math.max(8,window.scrollY+rect.top-46)+'px'}
function highlightedFromSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let node=sel.anchorNode?.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode;return node?.closest?.('.hl-brown,.hl-rose,.hl-blue')||null}
function handleToolbar(e){let act=e.target.closest('button')?.dataset.act;if(!act)return;let bar=$('#selbar'),target=bar.targetElem||highlightedFromSelection(),sel=window.getSelection();if(act==='del'&&target){unwrap(target);removeNote(target.dataset.hid)}else if(act==='hl'){if(target){if(target.classList.contains('hl-brown'))target.className='hl-rose';else if(target.classList.contains('hl-rose'))target.className='hl-rose';else target.className='hl-brown'}else{let span=wrapSelection('hl-brown');if(span)span.dataset.hid='h_'+Date.now()}}else if(act==='note'){let span=target||wrapSelection('hl-blue');if(span){span.className='hl-blue';if(!span.dataset.hid)span.dataset.hid='n_'+Date.now();createNote(span);document.body.classList.add('notes-open')}}bar.hidden=true;sel.removeAllRanges();save(false)}
function wrapSelection(cls){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let range=sel.getRangeAt(0);if(!$('#content').contains(range.commonAncestorContainer))return null;let span=document.createElement('span');span.className=cls;try{range.surroundContents(span)}catch{return null}return span}
function unwrap(el){let p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize()}
function clearUserHighlights(){$$('.hl-brown,.hl-rose,.hl-blue').forEach(unwrap)}
function createNote(span){let id=span.dataset.hid;if($(`.note-card[data-hid="${id}"]`))return;let card=document.createElement('div');card.className='note-card';card.dataset.hid=id;card.innerHTML=`<div class="note-quote">${esc(span.textContent.slice(0,120))}</div><textarea placeholder="Write note here..."></textarea><button class="delete-note" type="button">Delete</button>`;$('#notesList').prepend(card);bindNoteDeletes()}
function bindNoteDeletes(){$$('#notesList textarea').forEach(t=>t.oninput=()=>save(false));$$('.delete-note').forEach(btn=>btn.onclick=()=>{let card=btn.closest('.note-card'),id=card.dataset.hid,span=$(`[data-hid="${id}"]`);if(span)unwrap(span);card.remove();save(false)})}
function removeNote(id){if(!id)return;$(`.note-card[data-hid="${id}"]`)?.remove()}
function drawTimer(){let m=Math.floor(secs/60),s=secs%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
const DEFAULT_FONT_SIZE=16,MIN_FONT_SIZE=14,MAX_FONT_SIZE=22;
function currentFontSize(){return Number.parseInt(document.documentElement.style.fontSize,10)||DEFAULT_FONT_SIZE}
function setFontSize(size,persist=true){let n=Math.max(MIN_FONT_SIZE,Math.min(MAX_FONT_SIZE,Number(size)||DEFAULT_FONT_SIZE));document.documentElement.style.fontSize=n===DEFAULT_FONT_SIZE?'':n+'px';updateSizeButtons();if(persist)save(false)}
function adjustFontSize(delta){setFontSize(currentFontSize()+delta,true)}
function updateSizeButtons(){let size=currentFontSize(),dark=document.body.classList.contains('dark');$('#fontMinus')?.toggleAttribute('disabled',size<=MIN_FONT_SIZE);$('#fontPlus')?.toggleAttribute('disabled',size>=MAX_FONT_SIZE);$('#fontDefault')?.classList.toggle('active',size===DEFAULT_FONT_SIZE);$('#lightBtn')?.classList.toggle('active',!dark);$('#darkBtn')?.classList.toggle('active',dark)}
function resetAppearance(persist=true){document.body.classList.remove('dark');setFontSize(DEFAULT_FONT_SIZE,false);updateSizeButtons();if(persist)save(false)}
function clearAllProgress(){localStorage.removeItem(storeKey)}
$('#finish').onclick=finish;$('#save').onclick=()=>save(true);$('#clear').onclick=()=>{if(confirm('Clear all progress?')){window.resetTest();showToast('Clear complete')}};$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-open');save(false)};$('#closeNotes').onclick=()=>{document.body.classList.remove('notes-open');save(false)};$('#toggleIntensive').onclick=()=>{toggleIntensive();save(false)};$('#settingsBtn').onclick=()=>{$('#settings').classList.toggle('open');updateSizeButtons()};$('#lightBtn').onclick=()=>{document.body.classList.remove('dark');updateSizeButtons();save(false)};$('#darkBtn').onclick=()=>{document.body.classList.add('dark');updateSizeButtons();save(false)};$('#appearanceReset').onclick=()=>resetAppearance(true);$('#fontMinus').onclick=()=>adjustFontSize(-1);$('#fontPlus').onclick=()=>adjustFontSize(1);$('#fontDefault').onclick=()=>setFontSize(DEFAULT_FONT_SIZE,true);$('#settings').addEventListener('wheel',e=>{e.preventDefault();adjustFontSize(e.deltaY>0?-1:1)},{passive:false});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey)return;let key=e.key;if(key==='+'||key==='='){e.preventDefault();adjustFontSize(1)}else if(key==='-'||key==='_'){e.preventDefault();adjustFontSize(-1)}else if(key==='0'){e.preventDefault();resetAppearance(true)}});
const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
</script>
