 prove his theory."]],"bodyLines":[{"text":"Seracini’s search for Leonardo Da Vinci’s Battle of Anghiari","list":false,"level":0},{"text":"Seracini used 25 to help make a model of the building.","list":true,"level":0},{"text":"Seracini used 26 to reveal different materials in the walls.","list":true,"level":0},{"text":"He found the original architecture.","list":true,"level":0},{"text":"Seracini guessed that Da Vinci painted his masterpiece on the east wall, in a space that used to hold 27","list":true,"level":0},{"text":"Seracini analysed the wall using 28 and discovered a second wall behind it.","list":true,"level":0},{"text":"Seracini hypothesised that the Da Vinci painting is still there on the original 29 wall.","list":true,"level":0},{"text":"Seracini is using 30 to prove his theory.","list":true,"level":0}]}],"answerKey":{"text":{},"single":{"q21":"B","q22":"A","q23":"B","q24":"C"},"multiple":{},"multipleMap":{},"matching":{"q25":"D","q26":"G","q27":"F","q28":"E","q29":"C","q30":"B"},"map":{}},"transcriptLines":[{"time":"00:00:00,000 --> 00:00:08,920","html":"Section 3. You will hear two students called","cn":"第三部分。你将听到两名学生，名字叫","analysis":""},{"time":"00:00:08,920 --> 00:00:16,280","html":"Josh and Emily discussing an assignment on applying scientific techniques to art.","cn":"Josh 和 Emily，讨论一项关于将科学技术应用于艺术的作业。","analysis":""},{"time":"00:00:16,280 --> 00:00:21,520","html":"First you have some time to look at questions 21 to 24 on page 5.","cn":"首先，你有一些时间浏览第5页第21至第24题。","analysis":""},{"time":"00:00:30,000 --> 00:00:59,760","html":"Now listen carefully and answer questions 21 to 24.","cn":"现在请仔细听，并回答第21至第24题。","analysis":""},{"time":"00:00:59,760 --> 00:01:03,760","html":"Josh: Hi Emily. Emily: Hi Josh, are you ready to work on the assignment?","cn":"Josh：嗨，Emily。 Emily：嗨，Josh，准备好做作业了吗？","analysis":""},{"time":"00:01:03,760 --> 00:01:11,760","html":"Josh: Yeah. Now we need to describe how modern scientific techniques are being used in the field of art history.","cn":"Josh：准备好了。我们需要描述现代科学技术如何被用于艺术史领域。","analysis":""},{"time":"00:01:11,760 --> 00:01:17,760","html":"Emily: Right. And Dr Abbott suggested that we choose some famous cases to illustrate the argument.","cn":"Emily：对。Abbott 博士建议我们选择一些著名案例来说明论点。","analysis":""},{"time":"00:01:17,760 --> 00:01:20,760","html":"Josh: Okay, so what have you found?","cn":"Josh：好，那你找到了什么？","analysis":""},{"time":"00:01:20,760 --> 00:01:24,760","html":"Emily: Well, there's a Canadian forensic scientist called Biro.","cn":"Emily：有一位加拿大法医科学家叫 Biro。","analysis":""},{"time":"00:01:24,760 --> 00:01:26,760","html":"Josh: Yes, I think I've heard of him.","cn":"Josh：是的，我好像听说过他。","analysis":""},{"time":"00:01:26,760 --> 00:01:28,760","html":"Emily：What do you know about him?","cn":"Emily：你对他了解什么？","analysis":""},{"time":"00:01:28,760 --> 00:01:31,760","html":"Josh: Well, I'm a big fan of Jackson Pollock.","cn":"Josh: 嗯，我是 Jackson Pollock 的忠实粉丝。","analysis":""},{"time":"00:01:31,760 --> 00:01:33,760","html":"Emily：The modern American artist.","cn":"Emily：就是那位现代美国艺术家。","analysis":""},{"time":"00:01:33,760 --> 00:01:37,760","html":"Didn't he paint those really huge abstract paintings?","cn":"他是不是画那些特别大的抽象画？","analysis":""},{"time":"00:01:37,760 --> 00:01:38,760","html":"Josh: That's him.","cn":"Josh：就是他。","analysis":""},{"time":"00:01:38,760 --> 00:01:41,760","html":"Emily: I guess it would be pretty easy to fake one of those paintings.","cn":"Emily：我猜伪造那种画应该挺容易的。","analysis":""},{"time":"00:01:41,760 --> 00:01:46,760","html":"Josh: No way Emily. I know a lot of people think that even a <mark style=\"background-color: #fecaca;\">child<\/mark> could paint one.","cn":"Josh：绝不可能，Emily。我知道很多人觉得连<mark style=\"background-color: #fecaca;\">孩子<\/mark>都能画出一幅。","analysis":""},{"time":"00:01:46,760 --> 00:01:53,760","html":"To the untrained eye they might look simple but they're incredibly <mark style=\"background-color: #bbf7d0;\">intricate works of art<\/mark>.","cn":"在未经训练的人眼里，它们可能看起来简单，但其实是极其<mark style=\"background-color: #bbf7d0;\">复杂精细的艺术作品<\/mark>。","analysis":"<strong>答案解析：<\/strong>第21题问 Josh 怎么看 Jackson Pollock 的画。原文说它们看似 simple，但其实 incredibly intricate works of art，所以答案是 <strong>B. They are complex<\/strong>。"},{"time":"00:01:53,760 --> 00:01:58,760","html":"Emily: Well sorry, but I really can't agree with you.","cn":"Emily：抱歉，但我真的不同意你。","analysis":""},{"time":"00:01:58,760 --> 00:02:00,760","html":"Anyway what did Biro find out?","cn":"总之，Biro 发现了什么？","analysis":""},{"time":"00:02:00,760 --> 00:02:10,760","html":"Josh: Well Biro worked on a case where a client asked him to prove that a painting she bought for only <mark style=\"background-color: #fecaca;\">five dollars<\/mark> was an authentic Jackson Pollock.","cn":"Josh：Biro 处理过一个案例，一位客户请他证明她只花<mark style=\"background-color: #fecaca;\">5美元<\/mark>买到的一幅画是真正的 Jackson Pollock。","analysis":""},{"time":"00:02:10,760 --> 00:02:12,760","html":"Emily: So was it a fake?","cn":"Emily：所以它是假的吗？","analysis":""},{"time":"00:02:12,760 --> 00:02:19,760","html":"Josh: Well Biro found evidence to show it was a genuine Pollock but the art world didn't accept his findings.","cn":"Josh：Biro 找到了证据证明它是真正的 Pollock，但艺术界不接受他的发现。","analysis":""},{"time":"00:02:19,760 --> 00:02:20,760","html":"Emily: Why?","cn":"Emily：为什么？","analysis":""},{"time":"00:02:20,760 --> 00:02:27,760","html":"Josh: Well one critic said that compared to other Pollocks the <mark style=\"background-color: #fecaca;\">white and yellow lines<\/mark> on the painting were too straight.","cn":"Josh：一位评论家说，与其他 Pollock 作品相比，这幅画上的<mark style=\"background-color: #fecaca;\">白色和黄色线条<\/mark>太直了。","analysis":""},{"time":"00:02:27,760 --> 00:02:29,760","html":"Emily: Come on Josh.","cn":"Emily：拜托，Josh。","analysis":""},{"time":"00:02:29,760 --> 00:02:32,760","html":"That doesn't seem that convincing.","cn":"这听起来没那么有说服力。","analysis":""},{"time":"00:02:32,760 --> 00:02:34,760","html":"Josh: No you're right, it is a bit weak.","cn":"Josh：是，你说得对，这个理由有点弱。","analysis":""},{"time":"00:02:34,760 --> 00:02:39,760","html":"But the strongest argument was that there were <mark style=\"background-color: #bbf7d0;\">no records of previous owners<\/mark>.","cn":"但最有力的论点是，它<mark style=\"background-color: #bbf7d0;\">没有历任持有者记录<\/mark>。","analysis":""},{"time":"00:02:39,760 --> 00:02:47,760","html":"For the painting to be authentic you really should be able to trace the painting all the way back to the artist's studio.","cn":"如果这幅画是真品，应该能够一路追溯到艺术家的工作室。","analysis":"<strong>答案解析：<\/strong>第22题问这幅5美元的画为什么被认为是假的。原文说 strongest argument 是 no records of previous owners，也就是缺少来源文件/记录，所以答案是 <strong>A. it lacked documentation<\/strong>。"},{"time":"00:02:47,760 --> 00:02:50,760","html":"Emily: Well that's true I suppose.","cn":"Emily：嗯，我想这倒是真的。","analysis":""},{"time":"00:02:50,760 --> 00:02:53,760","html":"Did they consult with anyone else?","cn":"他们还咨询了其他人吗？","analysis":""},{"time":"00:02:53,760 --> 00:02:57,760","html":"Josh: The International Foundation for Art Research got involved.","cn":"Josh：国际艺术研究基金会参与了。","analysis":""},{"time":"00:02:57,760 --> 00:02:59,760","html":"Emily: And what was their verdict?","cn":"Emily：他们的结论是什么？","analysis":""},{"time":"00:02:59,760 --> 00:03:03,760","html":"Josh: Well they saw a definite similarity in the <mark style=\"background-color: #fecaca;\">painting techniques<\/mark> used.","cn":"Josh：他们发现所使用的<mark style=\"background-color: #fecaca;\">绘画技法<\/mark>有明显相似之处。","analysis":""},{"time":"00:03:03,760 --> 00:03:07,760","html":"Emily: You mean the way Pollock dripped the oils on the canvas?","cn":"Emily：你是说 Pollock 把油彩滴在画布上的方式？","analysis":""},{"time":"00:03:07,760 --> 00:03:13,760","html":"Josh: Yeah, and they noted the <mark style=\"background-color: #fecaca;\">dirt and paint marks on the back<\/mark> which all of Pollock's paintings have.","cn":"Josh：是的，他们还注意到画背面的<mark style=\"background-color: #fecaca;\">泥土和颜料痕迹<\/mark>，这些是 Pollock 的画都有的。","analysis":""},{"time":"00:03:13,760 --> 00:03:15,760","html":"Emily: Why's that?","cn":"Emily：为什么会这样？","analysis":""},{"time":"00:03:15,760 --> 00:03:19,760","html":"Josh: He used to lie his canvases down on the ground when he painted them.","cn":"Josh：因为他画画时通常把画布平铺在地上。","analysis":""},{"time":"00:03:19,760 --> 00:03:24,760","html":"But the foundation were worried about the <mark style=\"background-color: #bbf7d0;\">acrylic paint<\/mark> that was used on the painting.","cn":"但基金会担心这幅画中使用的<mark style=\"background-color: #bbf7d0;\">丙烯颜料<\/mark>。","analysis":""},{"time":"00:03:24,760 --> 00:03:29,760","html":"It's quite common now but it was very unusual back in Pollock's day.","cn":"这种颜料现在很常见，但在 Pollock 的时代非常少见。","analysis":""},{"time":"00:03:29,760 --> 00:03:32,760","html":"Emily: So it was probably painted much later.","cn":"Emily：所以它很可能是更晚才画的。","analysis":""},{"time":"00:03:32,760 --> 00:03:33,760","html":"Josh: Right.","cn":"Josh：对。","analysis":"<strong>答案解析：<\/strong>第23题问国际艺术研究基金会为什么拒绝这幅5美元的画。原文说他们 worried about the acrylic paint，因为这种颜料在 Pollock 时代很少见，所以答案是 <strong>B. the type of paint used<\/strong>。"},{"time":"00:03:33,760 --> 00:03:37,760","html":"Emily: So whose side are we on in this argument?","cn":"Emily：那在这个争论中，我们站哪一边？","analysis":""},{"time":"00:03:37,760 --> 00:03:41,760","html":"Josh: When it comes to art you can see the art critics point.","cn":"Josh：谈到艺术，你能理解艺术评论家的观点。","analysis":""},{"time":"00:03:41,760 --> 00:03:47,760","html":"If their knowledge and expertise tells them that it definitely isn't a Pollock painting,","cn":"如果他们的知识和专业经验告诉他们这绝对不是 Pollock 的画，","analysis":""},{"time":"00:03:47,760 --> 00:03:49,760","html":"shouldn't we believe them?","cn":"我们难道不该相信他们吗？","analysis":""},{"time":"00:03:49,760 --> 00:03:53,760","html":"I mean that is usually how it works in the art world isn't it?","cn":"我的意思是，艺术界通常就是这样运作的，不是吗？","analysis":""},{"time":"00:03:53,760 --> 00:03:58,760","html":"Emily: Art historians have always judged paintings but things are changing now.","cn":"Emily：艺术史学家一直以来都会评判画作，但现在情况正在改变。","analysis":""},{"time":"00:03:58,760 --> 00:04:04,760","html":"If we have modern scientific techniques like fingerprint analysis, why not use them?","cn":"如果我们有像指纹分析这样的现代科学技术，为什么不用呢？","analysis":""},{"time":"00:04:04,760 --> 00:04:05,760","html":"Josh: That's true.","cn":"Josh：这倒是真的。","analysis":""},{"time":"00:04:05,760 --> 00:04:08,760","html":"Well maybe we need a <mark style=\"background-color: #bbf7d0;\">combination<\/mark>.","cn":"也许我们需要两者<mark style=\"background-color: #bbf7d0;\">结合<\/mark>。","analysis":""},{"time":"00:04:08,760 --> 00:04:10,760","html":"Emily: I think you're right.","cn":"Emily：我觉得你说得对。","analysis":"<strong>答案解析：<\/strong>第24题问 Josh 和 Emily 对艺术评估达成什么一致意见。原文最后说 maybe we need a combination，并得到赞同，意思是艺术专家和科学方法应结合，所以答案是 <strong>C. Experts from the science and art worlds should work together<\/strong>。"},{"time":"00:04:11,760 --> 00:04:20,760","html":"Before you hear the rest of the discussion you have some time to look at questions 25 to 30 on page 6.","cn":"在听剩余讨论之前，你有一些时间浏览第6页第25至第30题。","analysis":""},{"time":"00:04:41,760 --> 00:04:53,760","html":"Now listen and answer questions 25 to 30.","cn":"现在请听录音，并回答第25至第30题。","analysis":""},{"time":"00:04:53,760 --> 00:04:59,760","html":"Emily: So did you find out anything else Josh?","cn":"Emily：Josh，那你还发现了什么？","analysis":""},{"time":"00:04:59,760 --> 00:05:03,760","html":"Josh: Well have you ever heard of a painting called The Battle of Anghiari?","cn":"Josh：你听说过一幅叫《安吉亚里之战》的画吗？","analysis":""},{"time":"00:05:03,760 --> 00:05:05,760","html":"Emily: I have actually.","cn":"Emily：我确实听说过。","analysis":""},{"time":"00:05:05,760 --> 00:05:10,760","html":"It's the Lost Masterpiece by Leonardo da Vinci, the famous Italian artist.","cn":"那是著名意大利艺术家 Leonardo da Vinci 的失落杰作。","analysis":""},{"time":"00:05:10,760 --> 00:05:11,760","html":"What about it?","cn":"它怎么了？","analysis":""},{"time":"00:05:11,760 --> 00:05:21,760","html":"Josh: Well an Italian art analyst called Seracini thinks he knows where it is and he's using scientific techniques to help locate it.","cn":"Josh：一位名叫 Seracini 的意大利艺术分析师认为他知道它在哪里，并且正在用科学技术帮助定位它。","analysis":""},{"time":"00:05:21,760 --> 00:05:22,760","html":"Emily: How?","cn":"Emily：怎么做？","analysis":""},{"time":"00:05:22,760 --> 00:05:26,760","html":"Josh: Well art historians knew where the painting was last seen.","cn":"Josh：艺术史学家知道这幅画最后一次出现在哪里。","analysis":""},{"time":"00:05:26,760 --> 00:05:30,760","html":"Emily：That's right in the Hall of the 500 in Florence.","cn":"Emily：就在佛罗伦萨的五百人大厅。","analysis":""},{"time":"00:05:30,760 --> 00:05:31,760","html":"Josh: Right.","cn":"Josh: 对。","analysis":""},{"time":"00:05:31,760 --> 00:05:37,760","html":"So Seracini had a theory that the painting was still there and he set out to prove it.","cn":"所以 Seracini 提出理论，认为这幅画还在那里，并开始证明这一点。","analysis":""},{"time":"00:05:37,760 --> 00:05:43,760","html":"He used a lot of different technology like <mark style=\"background-color: #fecaca;\">radar<\/mark> and <mark style=\"background-color: #fecaca;\">thermographic cameras<\/mark>.","cn":"他使用了很多不同技术，比如<mark style=\"background-color: #fecaca;\">雷达<\/mark>和<mark style=\"background-color: #fecaca;\">热成像相机<\/mark>。","analysis":""},{"time":"00:05:43,760 --> 00:05:52,760","html":"But initially he scanned every inch of the hall with <mark style=\"background-color: #bbf7d0;\">a laser<\/mark> in order to make a really accurate 3D model of the building's design.","cn":"但一开始，他用<mark style=\"background-color: #bbf7d0;\">激光<\/mark>扫描了大厅的每一寸，以制作一个非常精确的建筑设计3D模型。","analysis":"<strong>答案解析：<\/strong>第25题问 Seracini 用什么帮助建立建筑模型。原文说 scanned every inch with a laser to make a 3D model，对应选项 <strong>D. a laser scanner<\/strong>。"},{"time":"00:05:52,760 --> 00:05:56,760","html":"Emily: Did he think the painting was hidden in the building somewhere?","cn":"Emily：他认为这幅画藏在建筑里的某个地方吗？","analysis":""},{"time":"00:05:56,760 --> 00:05:57,760","html":"Josh: Exactly.","cn":"Josh：正是。","analysis":""},{"time":"00:05:57,760 --> 00:06:04,760","html":"Then to find out what the hall looked like in Leonardo's time, he took pictures of it with a <mark style=\"background-color: #bbf7d0;\">thermographic camera<\/mark>.","cn":"然后，为了弄清大厅在 Leonardo 时代是什么样子，他用<mark style=\"background-color: #bbf7d0;\">热成像相机<\/mark>拍摄了它。","analysis":""},{"time":"00:06:04,760 --> 00:06:07,760","html":"Emily: Couldn't he have used <mark style=\"background-color: #fecaca;\">ultrasound<\/mark> to do that?","cn":"Emily：他不能用<mark style=\"background-color: #fecaca;\">超声波<\/mark>来做这件事吗？","analysis":""},{"time":"00:06:07,760 --> 00:06:08,760","html":"Josh: Not really.","cn":"Josh：不太行。","analysis":""},{"time":"00:06:08,760 --> 00:06:16,760","html":"Different types of building materials produce different amounts of radiation and you can really see those differences in a <mark style=\"background-color: #bbf7d0;\">thermal image<\/mark>.","cn":"不同类型的建筑材料会产生不同量的辐射，在<mark style=\"background-color: #bbf7d0;\">热成像图<\/mark>中可以清楚看到这些差异。","analysis":"<strong>答案解析：<\/strong>第26题问 Seracini 用什么显示墙体中不同材料。原文说用 thermographic camera，并解释 thermal image 能显示材料差异，所以答案是 <strong>G. a thermographic camera<\/strong>。ultrasound 被否定，是干扰。"},{"time":"00:06:16,760 --> 00:06:21,760","html":"Emily: So <mark style=\"background-color: #fecaca;\">brick<\/mark> would look different from wood or <mark style=\"background-color: #bbf7d0;\">glass<\/mark>, for example.","cn":"Emily: 所以比如说，<mark style=\"background-color: #fecaca;\">砖<\/mark>会和木材或<mark style=\"background-color: #bbf7d0;\">玻璃<\/mark>看起来不同。","analysis":""},{"time":"00:06:21,760 --> 00:06:22,760","html":"Josh: Yes.","cn":"Josh: 是的。","analysis":""},{"time":"00:06:22,760 --> 00:06:29,760","html":"Seracini worked out what the building looked like when it was first built and what renovations took place after that.","cn":"Seracini 弄清了这座建筑最初建成时的样子，以及后来进行了哪些改造。","analysis":""},{"time":"00:06:30,760 --> 00:06:43,760","html":"He found that two large <mark style=\"background-color: #bbf7d0;\">glass windows<\/mark> on the east wall had been removed and filled in by the time Da Vinci started work on his painting, leaving a space big enough for it.","cn":"他发现东墙上的两扇大<mark style=\"background-color: #bbf7d0;\">玻璃窗<\/mark>在 Da Vinci 开始作画时已经被移除并填上，留下了足够大的空间。","analysis":"<strong>答案解析：<\/strong>第27题问 Da Vinci 作画的空间原本用来放什么。原文说 two large glass windows had been removed and filled in，所以答案是 <strong>F. glass<\/strong>。"},{"time":"00:06:43,760 --> 00:06:47,760","html":"Emily: But why hasn't the painting been seen for 400 years?","cn":"Emily：但为什么这幅画400年来都没人见过？","analysis":""},{"time":"00:06:47,760 --> 00:06:54,760","html":"Josh: To answer that question, Seracini needed to study that wall even more closely.","cn":"Josh：为了回答这个问题，Seracini 需要更仔细地研究那面墙。","analysis":""},{"time":"00:06:54,760 --> 00:06:56,760","html":"Emily: Did he use the thermographic camera again?","cn":"Emily：他又用了热成像相机吗？","analysis":""},{"time":"00:06:56,760 --> 00:07:01,760","html":"Josh: No, this time he used another kind of technology, <mark style=\"background-color: #bbf7d0;\">radar<\/mark>.","cn":"Josh：没有，这次他用了另一种技术，<mark style=\"background-color: #bbf7d0;\">雷达<\/mark>。","analysis":""},{"time":"00:07:01,760 --> 00:07:03,760","html":"Emily: And what did that show?","cn":"Emily：那显示了什么？","analysis":""},{"time":"00:07:03,760 --> 00:07:10,760","html":"Josh: It showed that there were in fact two walls there, an older one and a newer one built in front of it.","cn":"Josh：它显示那里实际上有两堵墙，一堵旧墙，前面又建了一堵新墙。","analysis":"<strong>答案解析：<\/strong>第28题问 Seracini 用什么分析墙并发现后面有第二堵墙。原文说 this time he used radar，所以答案是 <strong>E. a radar machine<\/strong>。"},{"time":"00:07:10,760 --> 00:07:15,760","html":"Emily: So does Seracini believe that Da Vinci's painting is on the concealed wall?","cn":"Emily：所以 Seracini 认为 Da Vinci 的画在那堵被隐藏的墙上吗？","analysis":""},{"time":"00:07:15,760 --> 00:07:16,760","html":"Josh: Yes.","cn":"Josh：是的。","analysis":""},{"time":"00:07:16,760 --> 00:07:20,760","html":"On a <mark style=\"background-color: #bbf7d0;\">stone wall<\/mark> concealed by the newer <mark style=\"background-color: #fecaca;\">brick wall<\/mark>.","cn":"在一堵被较新的<mark style=\"background-color: #fecaca;\">砖墙<\/mark>遮住的<mark style=\"background-color: #bbf7d0;\">石墙<\/mark>上。","analysis":"<strong>答案解析：<\/strong>第29题问 Da Vinci 的画仍在原来的什么墙上。原文说 on a stone wall concealed by the newer brick wall，所以答案是 <strong>C. stone<\/strong>。brick 是新墙材料，不是原墙。"},{"time":"00:07:20,760 --> 00:07:24,760","html":"Emily: So what's the next stage in the investigation?","cn":"Emily：那调查的下一阶段是什么？","analysis":""},{"time":"00:07:24,760 --> 00:07:33,760","html":"Josh: Well, he isn't allowed to remove any plaster or bricks, so he's now experimenting with a <mark style=\"background-color: #bbf7d0;\">gamma ray camera<\/mark> to try and verify his theory.","cn":"Josh：他不被允许移除任何灰泥或砖块，所以现在正在尝试使用<mark style=\"background-color: #bbf7d0;\">伽马射线相机<\/mark>来验证他的理论。","analysis":"<strong>答案解析：<\/strong>第30题问 Seracini 正在用什么证明自己的理论。原文说 experimenting with a gamma ray camera，对应选项 <strong>B. gamma-ray technology<\/strong>。"},{"time":"00:07:33,760 --> 00:07:39,760","html":"Emily: Well, I think we've got some really strong examples there of how science can help art.","cn":"Emily：我觉得我们已经有了一些非常有力的例子，说明科学如何帮助艺术。","analysis":""},{"time":"00:07:39,760 --> 00:07:43,760","html":"Let's see if we can type up an outline.","cn":"我们看看能不能把大纲打出来。","analysis":""},{"time":"00:07:46,760 --> 00:07:48,760","html":"That is the end of section 3.","cn":"第三部分到此结束。","analysis":""},{"time":"00:07:48,760 --> 00:07:52,760","html":"You now have half a minute to check your answers.","cn":"你现在有半分钟时间检查答案。","analysis":""},{"time":"00:07:54,760 --> 00:07:59,760","html":"Now turn to section 4.","cn":"现在请翻到第四部分。","analysis":""},{"time":"00:07:59,760 --> 00:08:04,760","html":"On page 3.","cn":"在第3页。","analysis":""},{"time":"00:08:04,760 --> 00:08:08,760","html":"Now turn to section 4.","cn":"现在请翻到第四部分。","analysis":""},{"time":"00:08:08,760 --> 00:08:12,760","html":"On page 3.","cn":"在第3页。","analysis":""},{"time":"00:08:12,760 --> 00:08:16,760","html":"Now turn to section 4.","cn":"现在请翻到第四部分。","analysis":""},{"time":"00:08:16,760 --> 00:08:20,760","html":"On page 3.","cn":"在第3页。","analysis":""},{"time":"00:08:21,760 --> 00:08:24,760","html":"Now turn to section 4.","cn":"现在请翻到第四部分。","analysis":""},{"time":"00:08:24,760 --> 00:08:27,760","html":"On page 7.","cn":"在第7页。","analysis":""}],"transcriptHighlights":[{"qid":"21","text":"They are complex.","answer":"B"},{"qid":"22","text":"it lacked documentation.","answer":"A"},{"qid":"23","text":"the type of paint used","answer":"B"},{"qid":"24","text":"Experts from the science and art worlds should work together.","answer":"C"},{"qid":"25","text":"a laser scanner","answer":"D"},{"qid":"26","text":"a thermographic camera","answer":"G"},{"qid":"27","text":"glass","answer":"F"},{"qid":"28","text":"a radar machine","answer":"E"},{"qid":"29","text":"stone","answer":"C"},{"qid":"30","text":"gamma-ray technology","answer":"B"}],"ownerInfo":"此内容由🍠@Listening 永不虾滑整理，仅作为分享供个人使用；禁止商用、倒卖和引流。有问题请先仔细看🍠这个账号的置顶和分享贴。没有团队，不是机构，纯个人分享。督学和其他相关课程请咨询主页另一个号@心情有点虾滑（不回任何机经相关消息）。"}</script>
<script>
const DATA=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const RENDER_VERSION=16;
let secs=0,review=false,timer=setInterval(()=>{secs++;drawTimer();if(secs%5===0)save(false)},1000),drag=null,currentCue=-1,loopCue=false,slowCue=false,showCn=true,showAnalysis=true,dictationMode=false,showOriginal=true,dictationAnswers={};const storeKey='ielts_v4_'+DATA.title.replace(/\W+/g,'_');
const CONFIG_DATA={answerKey:DATA.answerKey,questionList:DATA.questionIds.map(q=>Number(q)||q),localStorageKey:storeKey};window.localStorageKey=storeKey;window.DATA=DATA;window.CONFIG_DATA=CONFIG_DATA;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function matchingRepeatAttr(g){return (g.questions||[]).length>(g.options||[]).length?' data-repeat="true"':''}
function flowQuestionMap(g){let map={};(g.questions||[]).forEach(q=>map[q[0]]=q[1]);return map}
function flowQidsInText(raw,qmap){return Object.keys(qmap).filter(id=>new RegExp(`(?<!\\d)${id}(?!\\d)`).test(raw)).sort((a,b)=>Number(a)-Number(b))}
function renderFlowText(raw,qids){qids=Array.isArray(qids)?qids:[qids];let html=esc(String(raw||''));qids.forEach(qid=>{html=html.replace(new RegExp(`(?<!\\d)${qid}(?!\\d)`),`<span class="flow-num">${qid}</span>`)});let slotIdx=0;html=html.replace(/(?:_{2,}|…{2,}|\.{4,})/g,()=>{let qid=qids[slotIdx++]||qids[qids.length-1];return `<span class="slot" data-q="${qid}"></span>`});qids.slice(slotIdx).forEach(qid=>{html+=` <span class="slot" data-q="${qid}"></span>`});return html}
function renderFlowLine(line,qmap,used){let raw=String((typeof line==='object'&&line?line.text:line)||''),qids=flowQidsInText(raw,qmap);if(qids.length){qids.forEach(qid=>used.add(qid));return `<div class="flow-step flow-step-full"><div class="flow-text">${renderFlowText(raw,qids)}</div></div>`}return `<div class="flow-note">${esc(raw)}</div>`}
function renderFlowTable(lines,qmap,used){let rows=[],maxCols=1;lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0,cols=Number(meta.cols)||1,raw=String(meta.text||''),qids=flowQidsInText(raw,qmap);maxCols=Math.max(maxCols,cols,col+1);if(!rows[row])rows[row]=[];if(!rows[row][col])rows[row][col]=[];qids.forEach(qid=>used.add(qid));rows[row][col].push(`<div class="flow-text">${qids.length?renderFlowText(raw,qids):esc(raw)}</div>`)});return `<div class="flow-table-wrap"><table class="flow-table">${rows.map(cells=>{let filled=(cells||[]).map((parts,col)=>parts?{col,html:parts.join('')}:null).filter(Boolean);return `<tr>${filled.map(cell=>{let span=filled.length===1&&maxCols>1?` colspan="${maxCols}"`:'';return `<td${span}>${cell.html}</td>`}).join('')}</tr>`}).join('')}</table></div>`}
function renderFlowSteps(g){let qmap=flowQuestionMap(g),used=new Set(),lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:[]);if(lines.length){let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFlowTable(chunk,qmap,used);continue}html+=renderFlowLine(lines[i++],qmap,used)}return html+(g.questions||[]).filter(q=>!used.has(q[0])).map(q=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>`).join('')}return g.questions.map((q,idx)=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>${idx<g.questions.length-1?'<div class="flow-arrow">↓</div>':''}`).join('')}
function groupHTML(g){if(g.type==='matching'&&g.layout==='flow')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="flow-layout"><div class="flow-steps">${renderFlowSteps(g)}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='matching'&&g.layout==='diagram')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'diagram.png')}" alt="Diagram"></div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></div></section>`;
if(g.type==='matching')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='map')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'map.png')}" alt="Map" onerror="if(this.dataset.fallback!=='1'){this.dataset.fallback='1';this.src='diagram.png'}"></div><div class="map-grid"><div class="map-answer-list">${g.questions.map(q=>`<div class="map-row"><div class="map-row-label"><strong>${q[0]}</strong> ${esc(q[1]||'')}</div><div class="map-options" style="--map-options:${(g.options||[]).length||1}">${(g.options||[]).map(o=>`<div class="choice map-choice" data-name="q${q[0]}" data-value="${o}">${o}</div>`).join('')}</div></div>`).join('')}</div></div></div></section>`;
if(g.type==='single')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div>${g.questions.map(q=>`<p><strong>${q.id}</strong> ${esc(q.text)}</p>${q.options.map(o=>`<div class="choice single-choice" data-name="q${q.id}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}`).join('')}</section>`;
if(g.type==='multiple')return `<section class="group" data-limit="${g.limit}" data-id="${g.id}"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><p><strong>${esc(g.id)}</strong> ${esc(g.questionText)}</p>${g.options.map(o=>`<div class="choice multi-choice" data-name="q${g.id.replace('-','_')}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</section>`;
return `<section class="group"><h3>${esc(g.title)}</h3>${renderFillGroup(g)}</section>`}
function renderFillGroup(g){let qids=(g.questions||[]).map(q=>String(q.id));let used=new Set();let lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:g.questions.map(q=>`${q.id} ${q.text} _____`));let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFillTable(chunk,qids,used);continue}html+=renderFillLine(lines[i++],qids,used)}return html||`<div class="instruction">${esc(g.instruction||'Complete the notes below.')}</div>`}
function renderFillTable(lines,qids,used){let rows=[],maxCols=1;lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0,cols=Number(meta.cols)||1;maxCols=Math.max(maxCols,cols,col+1);if(!rows[row])rows[row]=[];if(!rows[row][col])rows[row][col]=[];rows[row][col].push(`<div class="fill-table-line">${renderFillLine(line,qids,used,true)}</div>`)});return `<div class="fill-table-wrap"><table class="fill-table">${rows.map((cells,idx)=>{let filled=(cells||[]).map((parts,col)=>parts?{col,html:parts.join('')}:null).filter(Boolean);return `<tr>${filled.map(cell=>{let tag=idx===0?'th':'td',span=filled.length===1&&maxCols>1?` colspan="${maxCols}"`:'';return `<${tag}${span}>${cell.html}</${tag}>`}).join('')}</tr>`}).join('')}</table></div>`}
function fillInput(qid,lead=''){return `<span class="blank-q">${esc(qid)}</span>${esc(lead)}<input class="blank" name="q${esc(qid)}" type="text" autocomplete="off" inputmode="text">`}
function fillLineAttrs(meta,isHeading){let cls=['doc-line'];if(isHeading)cls.push('fill-heading');if(meta.list)cls.push('is-list');let rawLevel=Math.max(0,Math.min(6,Number(meta.level)||0)),level=rawLevel>0?rawLevel+1:rawLevel;let style=meta.list?` style="--indent:${level*30}px"`:'';return `class="${cls.join(' ')}"${style}`}
function fillLineContent(meta,body){let level=Math.max(0,Number(meta.level)||0),bullet=level>0?'◦':'•';return meta.list?`<span class="doc-bullet">${bullet}</span><span class="doc-line-content">${body}</span>`:body}
function isFillHeading(raw,meta,hit){return !hit&&!meta.list&&!/(?:_{2,}|…{2,}|\.{4,})/.test(raw)&&!/^\d+\.?\s+/.test(raw)&&!/^(?:Complete|Write|Choose)\b/i.test(raw)}
function renderFillLine(line,qids,used,inner=false){let meta=typeof line==='object'&&line?line:{},raw=String(meta.text??line),html=esc(raw),hit=false;html=html.replace(/(^|[^\d])(\d{1,2})\.?\s*((?:£\s*)?)(?:_{2,}|…{2,}|\.{4,})/g,(m,prefix,qid,lead)=>{if(!qids.includes(qid))return m;used.add(qid);hit=true;return prefix+fillInput(qid,lead)});let m=raw.match(/^(\d+)\.?\s+(.+)$/);if(!hit&&m&&qids.includes(m[1])){used.add(m[1]);let body=esc(m[2]);let input=fillInput(m[1]);body=/(?:_+|…{2,}|\.{4,})/.test(body)?body.replace(/(?:_+|…{2,}|\.{4,})/,input):`${body} ${input}`;return inner?fillLineContent(meta,body):`<p ${fillLineAttrs(meta,false)}>${fillLineContent(meta,body)}</p>`}return inner?html:`<p ${fillLineAttrs(meta,isFillHeading(raw,meta,hit))}>${fillLineContent(meta,html)}</p>`}
function hardResetAnswers(){$$('input').forEach(i=>{i.value='';i.defaultValue=''});$$('.choice').forEach(c=>c.classList.remove('selected'));$$('.slot').forEach(s=>s.innerHTML='');refreshPool();updateNav()}
function render(){document.title=DATA.title;$('#ownerMeta').textContent=DATA.ownerInfo||'';$('#audio').src=DATA.audio||'audio.mp3';$('#content').innerHTML=DATA.groups.map(groupHTML).join('');$('#nav').innerHTML=DATA.questionIds.map(q=>`<div data-q="${q}">${q}</div>`).join('');bindDynamic();hardResetAnswers();load();updateNav()}
function bindDynamic(){
  $$('#content input').forEach(i=>{i.oninput=()=>{updateNav();save(false)};i.onchange=()=>{updateNav();save(false)}});
  $$('.single-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;$$(`.single-choice[data-name="${btn.dataset.name}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateNav();save(false)});
  $$('.map-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;$$(`.map-choice[data-name="${btn.dataset.name}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateNav();save(false)});
  $$('.multi-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;let group=btn.closest('.group'),limit=Number(group?.dataset.limit||99),name=btn.dataset.name,selected=$$(`.multi-choice[data-name="${name}"].selected`);if(!btn.classList.contains('selected')&&selected.length>=limit)return;btn.classList.toggle('selected');updateNav();save(false)});
  $$('#nav [data-q]').forEach(n=>n.onclick=()=>scrollToQuestion(n.dataset.q));
}
function bindGlobal(){
  document.addEventListener('dragstart',e=>{let d=e.target.closest('.drag,.tag');if(!d||review)return;drag={value:d.dataset.value,text:d.textContent,from:d.closest('.slot')};});
  document.addEventListener('dragover',e=>{if(e.target.closest('.slot,.pool'))e.preventDefault()});
  document.addEventListener('drop',e=>{let slot=e.target.closest('.slot'),pool=e.target.closest('.pool');if(!drag||review)return;e.preventDefault();if(pool&&drag.from){drag.from.innerHTML='';refreshPool();updateNav();save(false);return}if(slot){if(drag.from)drag.from.innerHTML='';slot.innerHTML=`<span class="tag" draggable="true" data-value="${drag.value}">${esc(drag.text)}</span>`;refreshPool();updateNav();save(false)}});
  document.addEventListener('mouseup',handleSelection);
  $('#selbar').onclick=handleToolbar;
}
function scrollToQuestion(q){let first=q.split('-')[0];let target=$(`input[name="q${first}"], .slot[data-q="${first}"], .choice[data-name="q${first}"]`)||$(`input[name="q${q.replace('-','_')}"]`);target?.closest('.group')?.scrollIntoView({behavior:'smooth',block:'center'});}

function questionInText(q,text){let n=Number(String(q).replace(/\D/g,""));if(!n||!text)return false;let raw=String(text).replace(/&nbsp;/g," ");let direct=new RegExp("(?:问题|Question|Q)\\s*0?"+n+"(?!\\d)|第\\s*0?"+n+"\\s*题|(?<!\\d)0?"+n+"\\s*题","i").test(raw)||new RegExp("(?:data-question=[\"']?|class=[\"'][^\"']*q)0?"+n+"(?!\\d)","i").test(raw);if(direct)return true;let re=/(?:问题|Question|Q|第)?\s*(\d+)\s*(?:-|–|—|至|到|和|and|to|&)\s*(\d+)\s*题?/gi,m;while((m=re.exec(raw))){let a=Number(m[1]),b=Number(m[2]);if(n>=Math.min(a,b)&&n<=Math.max(a,b))return true}return false}

function highlightTerms(){let terms=[];for(let item of DATA.transcriptHighlights||[]){let text=typeof item==='string'?item:item.text;if(text){terms.push(String(text));String(text).split(/\s+/).map(w=>w.replace(/[^A-Za-z0-9'-]/g,'')).filter(w=>w.length>=5&&!/^(which|three|answer|letter|about|their|there|would|could|should)$/i.test(w)).forEach(w=>terms.push(w))}}return [...new Set(terms.map(t=>t.trim()).filter(t=>t.length>1))].sort((a,b)=>b.length-a.length)}

function layoutSignature(){return JSON.stringify([RENDER_VERSION,(DATA.groups||[]).map(g=>[g.type,g.layout||'',g.id||'',g.title||'',g.instruction||'',g.questionText||'',g.image||'',(g.options||[]),(g.questions||[]).map(q=>JSON.stringify(q))])])}
function save(show=false){let data={secs,answers:collectAnswers(),contentHtml:contentSnapshot(),layoutSignature:layoutSignature(),notes:notesSnapshot(),dark:document.body.classList.contains('dark'),font:document.documentElement.style.fontSize,dictationAnswers,studyState:{currentCue,loopCue,slowCue,showCn,showAnalysis,dictationMode,showOriginal},audioTime:audio?.currentTime||0};localStorage.setItem(storeKey,JSON.stringify(data));if(show)showToast()}
function load(){let raw=localStorage.getItem(storeKey);if(!raw)return;let d;try{d=JSON.parse(raw)}catch(err){console.warn('Saved progress could not be read.',err);return}secs=d.secs||0;if(d.answers){try{restoreAnswers(d.answers)}catch(err){console.warn('Saved answers could not be restored.',err)}}if(d.dictationAnswers)dictationAnswers=d.dictationAnswers;if(d.studyState)try{({currentCue=currentCue,loopCue=loopCue,slowCue=slowCue,showCn=showCn,showAnalysis=showAnalysis,dictationMode=dictationMode,showOriginal}=d.studyState)}catch(err){console.warn('Study state could not be restored.',err)}if(d.notes){try{$('#notesList').innerHTML=d.notes;$$('#notesList textarea').forEach(t=>{t.value=t.dataset.value||t.textContent||''})}catch(err){console.warn('Saved notes could not be restored.',err)}}if(d.dark)document.body.classList.add('dark');setFontSize(d.font||DEFAULT_FONT_SIZE,false);if(d.audioTime)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=d.audioTime},{once:true});bindNoteDeletes();drawTimer()}
function handleSelection(e){if(e.target.closest('#selbar,#notes,.bottom-bar'))return;let sel=window.getSelection();let hl=e.target.closest?.('.hl-brown,.hl-rose,.hl-blue');let bar=$('#selbar');if(hl&&sel.isCollapsed){bar.targetElem=hl;placeBar(bar,hl.getBoundingClientRect())}else if(sel&&!sel.isCollapsed&&$('#content').contains(sel.anchorNode)){bar.targetElem=null;placeBar(bar,sel.getRangeAt(0).getBoundingClientRect())}else{bar.hidden=true}}
function placeBar(bar,rect){bar.hidden=false;bar.style.left=Math.max(8,window.scrollX+rect.left+rect.width/2-95)+'px';bar.style.top=Math.max(8,window.scrollY+rect.top-46)+'px'}
function highlightedFromSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let node=sel.anchorNode?.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode;return node?.closest?.('.hl-brown,.hl-rose,.hl-blue')||null}
function handleToolbar(e){let act=e.target.closest('button')?.dataset.act;if(!act)return;let bar=$('#selbar'),target=bar.targetElem||highlightedFromSelection(),sel=window.getSelection();if(act==='del'&&target){unwrap(target);removeNote(target.dataset.hid)}else if(act==='hl'){if(target){if(target.classList.contains('hl-brown'))target.className='hl-rose';else if(target.classList.contains('hl-rose'))target.className='hl-rose';else target.className='hl-brown'}else{let span=wrapSelection('hl-brown');if(span)span.dataset.hid='h_'+Date.now()}}else if(act==='note'){let span=target||wrapSelection('hl-blue');if(span){span.className='hl-blue';if(!span.dataset.hid)span.dataset.hid='n_'+Date.now();createNote(span);document.body.classList.add('notes-open')}}bar.hidden=true;sel.removeAllRanges();save(false)}
function wrapSelection(cls){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let range=sel.getRangeAt(0);if(!$('#content').contains(range.commonAncestorContainer))return null;let span=document.createElement('span');span.className=cls;try{range.surroundContents(span)}catch{return null}return span}
function unwrap(el){let p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize()}
function clearUserHighlights(){$$('.hl-brown,.hl-rose,.hl-blue').forEach(unwrap)}
function createNote(span){let id=span.dataset.hid;if($(`.note-card[data-hid="${id}"]`))return;let card=document.createElement('div');card.className='note-card';card.dataset.hid=id;card.innerHTML=`<div class="note-quote">${esc(span.textContent.slice(0,120))}</div><textarea placeholder="Write note here..."></textarea><button class="delete-note" type="button">Delete</button>`;$('#notesList').prepend(card);bindNoteDeletes()}
function bindNoteDeletes(){$$('#notesList textarea').forEach(t=>t.oninput=()=>save(false));$$('.delete-note').forEach(btn=>btn.onclick=()=>{let card=btn.closest('.note-card'),id=card.dataset.hid,span=$(`[data-hid="${id}"]`);if(span)unwrap(span);card.remove();save(false)})}
function removeNote(id){if(!id)return;$(`.note-card[data-hid="${id}"]`)?.remove()}
function drawTimer(){let m=Math.floor(secs/60),s=secs%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
const DEFAULT_FONT_SIZE=16,MIN_FONT_SIZE=14,MAX_FONT_SIZE=22;
function currentFontSize(){return Number.parseInt(document.documentElement.style.fontSize,10)||DEFAULT_FONT_SIZE}
function setFontSize(size,persist=true){let n=Math.max(MIN_FONT_SIZE,Math.min(MAX_FONT_SIZE,Number(size)||DEFAULT_FONT_SIZE));document.documentElement.style.fontSize=n===DEFAULT_FONT_SIZE?'':n+'px';updateSizeButtons();if(persist)save(false)}
function adjustFontSize(delta){setFontSize(currentFontSize()+delta,true)}
function updateSizeButtons(){let size=currentFontSize(),dark=document.body.classList.contains('dark');$('#fontMinus')?.toggleAttribute('disabled',size<=MIN_FONT_SIZE);$('#fontPlus')?.toggleAttribute('disabled',size>=MAX_FONT_SIZE);$('#fontDefault')?.classList.toggle('active',size===DEFAULT_FONT_SIZE);$('#lightBtn')?.classList.toggle('active',!dark);$('#darkBtn')?.classList.toggle('active',dark)}
function resetAppearance(persist=true){document.body.classList.remove('dark');setFontSize(DEFAULT_FONT_SIZE,false);updateSizeButtons();if(persist)save(false)}
function clearAllProgress(){localStorage.removeItem(storeKey)}
$('#finish').onclick=finish;$('#save').onclick=()=>save(true);$('#clear').onclick=()=>{if(confirm('Clear all progress?')){window.resetTest();showToast('Clear complete')}};$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-open');save(false)};$('#closeNotes').onclick=()=>{document.body.classList.remove('notes-open');save(false)};$('#toggleIntensive').onclick=()=>{toggleIntensive();save(false)};$('#settingsBtn').onclick=()=>{$('#settings').classList.toggle('open');updateSizeButtons()};$('#lightBtn').onclick=()=>{document.body.classList.remove('dark');updateSizeButtons();save(false)};$('#darkBtn').onclick=()=>{document.body.classList.add('dark');updateSizeButtons();save(false)};$('#appearanceReset').onclick=()=>resetAppearance(true);$('#fontMinus').onclick=()=>adjustFontSize(-1);$('#fontPlus').onclick=()=>adjustFontSize(1);$('#fontDefault').onclick=()=>setFontSize(DEFAULT_FONT_SIZE,true);$('#settings').addEventListener('wheel',e=>{e.preventDefault();adjustFontSize(e.deltaY>0?-1:1)},{passive:false});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey)return;let key=e.key;if(key==='+'||key==='='){e.preventDefault();adjustFontSize(1)}else if(key==='-'||key==='_'){e.preventDefault();adjustFontSize(-1)}else if(key==='0'){e.preventDefault();resetAppearance(true)}});
const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
</script>
