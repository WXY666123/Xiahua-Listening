aims."],["B","Spend more money on it."],["C","Listen to the views of parents."]]},{"id":"29","text":"What did Smith and Barker say about children in rural areas?","options":[["A","They tend not to be allowed on farmland."],["B","They receive more supervision outdoors."],["C","They spend more time outdoors than city children."]]},{"id":"30","text":"What problem does Dr Chang highlight about Smith and Barker’s research?","options":[["A","Its findings are inconclusive."],["B","It is too old to be useful."],["C","Its focus is limited."]]}]}],"answerKey":{"text":{},"single":{"q27":"B","q28":"A","q29":"A","q30":"C"},"multiple":{"q21_22":["A","E"],"q23_24":["A","D"],"q25_26":["C","D"]},"multipleMap":{"q21":"A","q22":"E","q23":"A","q24":"D","q25":"C","q26":"D"},"matching":{},"map":{}},"transcriptLines":[{"time":"00:00:00,000 --> 00:00:15,600","html":"[Narrator]: You will hear a student called Ravi talking to his tutor, Dr. Cheng, about research he","cn":"[旁白]: 你将听到一个名叫Ravi的学生和他的导师程博士谈论他正在做的研究，这个研究是关于","analysis":""},{"time":"00:00:15,600 --> 00:00:21,360","html":"is doing for an assignment on children playing outdoors.","cn":"一项关于儿童户外玩耍的作业。","analysis":""},{"time":"00:00:21,360 --> 00:00:24,840","html":"Just you have some time to look at questions 21 to 26.","cn":"你现在有一些时间看第21到26题。","analysis":""},{"time":"00:00:51,360 --> 00:01:08,680","html":"[Dr. Cheng]: Right Ravi, tell me how the research for your assignment about children's outdoor","cn":"[程博士]: 好的，Ravi，告诉我你关于儿童户外玩耍作业的研究进展如何。","analysis":""},{"time":"00:01:08,680 --> 00:01:10,160","html":"play is going.","cn":"进行得怎么样了。","analysis":""},{"time":"00:01:10,160 --> 00:01:16,840","html":"[Ravi]: Yes, well I've been reading about why children spend less time playing outside now than 20","cn":"[Ravi]: 是的，我一直在研究为什么现在的孩子比二三十年前花更少的时间在户外玩耍。","analysis":""},{"time":"00:01:16,840 --> 00:01:18,800","html":"or 30 years ago.","cn":"二三十年前。","analysis":""},{"time":"00:01:18,800 --> 00:01:24,200","html":"[Dr. Cheng]: So is it just because of the amount of online time that children have now, which obviously","cn":"[程博士]: 那么，这仅仅是因为孩子们现在花在网上的时间多了吗？这显然","analysis":""},{"time":"00:01:24,200 --> 00:01:25,880","html":"happens indoors?","cn":"是在室内进行的。","analysis":""},{"time":"00:01:25,880 --> 00:01:32,520","html":"[Ravi]: Well, if that was the case, there'd be a correlation between high internet use and low levels","cn":"[Ravi]: 嗯，如果真是那样，那么高网络使用率和低户外玩耍水平之间就会存在关联。","analysis":""},{"time":"00:01:32,520 --> 00:01:34,600","html":"of outdoor play.","cn":"的户外玩耍。","analysis":""},{"time":"00:01:34,600 --> 00:01:39,520","html":"And it's nothing to do with whether there are adequate facilities outside, <mark style=\"background-color: #fecaca;\">playgrounds<\/mark>","cn":"而且这与外面是否有足够的设施无关，<mark style=\"background-color: #fecaca;\">比如游乐场<\/mark>，","analysis":""},{"time":"00:01:39,520 --> 00:01:43,520","html":"for example, as any open space will do.","cn":"因为任何开放空间都可以。","analysis":"<strong>答案解析：<\/strong> 问题21和22 选项B“Limited outdoor play facilities”（户外游乐设施有限）被Ravi明确否认了，他说“it's nothing to do with whether there are adequate facilities outside, playgrounds for example, as any open space will do”，意指是否拥有足够设施（如游乐场）无关，任何开放空间都可以，因此B是干扰项。"},{"time":"00:01:43,520 --> 00:01:49,040","html":"<mark style=\"background-color: #bbf7d0;\">There's perhaps no single more important factor than parental worries about the dangers<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">也许没有比父母担心街道上的车辆危险更重要的单一因素了。<\/mark>","analysis":""},{"time":"00:01:49,040 --> 00:01:51,560","html":"<mark style=\"background-color: #bbf7d0;\">of vehicles on the streets.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">街道上的车辆。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题21 Ravi明确指出“There's perhaps no single more important factor than parental worries about the dangers of vehicles on the streets.”（也许没有比父母担心街道上的车辆危险更重要的单一因素了），这直接对应了选项A“Concerns about traffic”（对交通的担忧），因此A是正确答案。"},{"time":"00:01:51,560 --> 00:01:57,280","html":"[Dr. Cheng]: But it could also be that children today prefer playing indoors to outdoors?","cn":"[程博士]: 但也可能是现在的孩子更喜欢在室内玩耍而不是户外玩耍？","analysis":""},{"time":"00:01:57,280 --> 00:02:01,920","html":"[Ravi]: Well a study in Tokyo suggests it's the other way around.","cn":"[Ravi]: 嗯，东京的一项研究表明情况恰恰相反。","analysis":"<strong>答案解析：<\/strong> 问题21和22 选项D“Preference for indoor play”（偏爱室内玩耍）是程博士提出的可能性，但Ravi立即反驳说“a study in Tokyo suggests it's the other way around”（东京的一项研究表明情况恰恰相反），因此D是干扰项。"},{"time":"00:02:01,920 --> 00:02:08,120","html":"<mark style=\"background-color: #bbf7d0;\">But children are spending more time in structured activities and out of school clubs than before.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">但孩子们现在花在有组织的活动和校外俱乐部的时间比以前更多了。<\/mark>","analysis":""},{"time":"00:02:08,120 --> 00:02:13,480","html":"<mark style=\"background-color: #bbf7d0;\">And this has a knock on effect on what's left for outdoor play.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">这对外出玩耍的时间产生了连锁反应。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题22 Ravi提到“children are spending more time in structured activities and out of school clubs than before. And this has a knock on effect on what's left for outdoor play.”（孩子们现在花在有组织的活动和校外俱乐部的时间比以前更多了。这对外出玩耍的时间产生了连锁反应。），这直接对应了选项E“Reduction in free time”（空闲时间减少），因此E是正确答案。"},{"time":"00:02:13,480 --> 00:02:18,640","html":"[Dr. Cheng]: Your premise is that outdoor play is good.","cn":"[程博士]: 你的前提是户外玩耍是好的。","analysis":""},{"time":"00:02:18,640 --> 00:02:22,040","html":"What exactly do you want to focus on in your assignment?","cn":"你的作业具体想重点关注什么？","analysis":""},{"time":"00:02:22,040 --> 00:02:27,800","html":"[Ravi]: Well, not so much on things that apply to exercise in general, like children's muscles","cn":"[Ravi]: 嗯，不太关注那些适用于一般运动的事情，比如孩子们的肌肉","analysis":""},{"time":"00:02:27,800 --> 00:02:30,840","html":"<mark style=\"background-color: #fecaca;\">getting stronger because they run around.<\/mark>","cn":"<mark style=\"background-color: #fecaca;\">因为跑来跑去而变得更强壮。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题23和24 Ravi明确表示“not so much on things that apply to exercise in general, like children's muscles getting stronger because they run around.”（不太关注那些适用于一般运动的事情，比如孩子们因为跑来跑去而肌肉变得更强壮。），这表明他不想关注选项C“How it aids children’s muscular development”（它如何帮助儿童肌肉发展），因此C是干扰项。"},{"time":"00:02:30,840 --> 00:02:36,640","html":"And not on what seems, for instance, self-evident, that outdoor play helps children to concentrate","cn":"而且不关注那些显而易见的事情，比如户外玩耍有助于孩子们集中注意力","analysis":""},{"time":"00:02:36,640 --> 00:02:38,560","html":"on things other than lessons.","cn":"在学习以外的事情上。","analysis":""},{"time":"00:02:38,560 --> 00:02:39,760","html":"[Dr. Cheng]: Sure.","cn":"[程博士]: 当然。","analysis":""},{"time":"00:02:39,800 --> 00:02:45,760","html":"[Ravi]: I'd like to investigate some of the more unexpected benefits like to children's digestion.","cn":"[Ravi]: 我想研究一些更意想不到的好处，比如对儿童消化系统的影响。","analysis":""},{"time":"00:02:45,760 --> 00:02:49,320","html":"<mark style=\"background-color: #bbf7d0;\">This is because fresh air tends to stimulate hunger.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">这是因为新鲜空气往往会刺激饥饿感。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题24 Ravi说“I'd like to investigate some of the more unexpected benefits like to children's digestion.”（我想研究一些更意想不到的好处，比如对儿童消化系统的影响。），这直接对应了选项D“How it improves children’s digestion”（它如何改善儿童的消化），因此D是正确答案。"},{"time":"00:02:49,320 --> 00:02:54,520","html":"Perhaps leaving to one side the question of whether climbing trees helps educate children","cn":"也许我们可以把爬树是否能帮助孩子认识","analysis":""},{"time":"00:02:54,520 --> 00:02:56,360","html":"<mark style=\"background-color: #fecaca;\">about the natural world.<\/mark>","cn":"<mark style=\"background-color: #fecaca;\">自然界的问题放在一边。<\/mark>","analysis":""},{"time":"00:02:56,360 --> 00:02:59,120","html":"[Dr. Cheng]: <mark style=\"background-color: #fecaca;\">No, not really relevant.<\/mark>","cn":"[程博士]: <mark style=\"background-color: #fecaca;\">不，不太相关。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题23和24 Ravi提出“whether climbing trees helps educate children about the natural world”（爬树是否能帮助孩子认识自然界），这对应了选项E“How it teaches children about the environment”（它如何教导儿童关于环境），但程博士回答“No, not really relevant.”（不，不太相关。），明确表示不关注这个方面，因此E是干扰项。"},{"time":"00:02:59,120 --> 00:03:04,600","html":"<mark style=\"background-color: #bbf7d0;\">What sort of decisions do outdoor games and activities force children to make?<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">户外游戏和活动迫使孩子们做出什么样的决定？<\/mark>","analysis":""},{"time":"00:03:04,600 --> 00:03:09,720","html":"[Ravi]: <mark style=\"background-color: #bbf7d0;\">Well, for example, how they decide how dangerous something might be.<\/mark>","cn":"[Ravi]: <mark style=\"background-color: #bbf7d0;\">嗯，例如，他们如何判断某件事可能有多危险。<\/mark>","analysis":""},{"time":"00:03:09,720 --> 00:03:12,480","html":"<mark style=\"background-color: #bbf7d0;\">I'd like to outline the main findings on that.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">我希望能概述一下这方面的主要发现。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题23 Ravi表示“What sort of decisions do outdoor games and activities force children to make? Well, for example, how they decide how dangerous something might be.”（户外游戏和活动迫使孩子们做出什么样的决定？嗯，例如，他们如何判断某件事可能有多危险。），这直接对应了选项A“How it helps children to evaluate risk”（它如何帮助儿童评估风险），因此A是正确答案。"},{"time":"00:03:12,480 --> 00:03:13,800","html":"[Dr. Cheng]: Okay.","cn":"[程博士]: 好的。","analysis":""},{"time":"00:03:13,800 --> 00:03:18,800","html":"And as you're arguing that there's been a shift in play patterns over the last generation","cn":"既然你认为过去一代人的玩耍模式发生了转变，","analysis":""},{"time":"00:03:18,800 --> 00:03:22,240","html":"or so, how are you going to substantiate this?","cn":"你将如何证实这一点？","analysis":""},{"time":"00:03:22,240 --> 00:03:23,240","html":"[Ravi]: Yes.","cn":"[Ravi]: 是的。","analysis":""},{"time":"00:03:23,240 --> 00:03:28,840","html":"Surveys have compared parents' recollections of their childhood play 30 years ago with","cn":"调查比较了父母对30年前自己童年玩耍的回忆与","analysis":""},{"time":"00:03:28,840 --> 00:03:31,200","html":"what their children do now.","cn":"他们的孩子现在所做的。","analysis":""},{"time":"00:03:31,200 --> 00:03:36,040","html":"And the nature of what children do when they are playing outdoors has changed.","cn":"孩子们在户外玩耍的方式也发生了变化。","analysis":""},{"time":"00:03:36,040 --> 00:03:37,560","html":"[Dr. Cheng]: How exactly?","cn":"[程博士]: 具体是怎样变化的？","analysis":""},{"time":"00:03:37,560 --> 00:03:43,600","html":"[Ravi]: Well, surprisingly, it's not so much how often children play outside or preferences for","cn":"[Ravi]: 嗯，令人惊讶的是，这并不太关乎孩子们多久玩一次户外活动，或者对","analysis":""},{"time":"00:03:43,600 --> 00:03:45,800","html":"<mark style=\"background-color: #fecaca;\">large or small groups.<\/mark>","cn":"<mark style=\"background-color: #fecaca;\">大或小群体玩耍的偏好。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题25和26 Ravi提到“it's not so much how often children play outside or preferences for large or small groups.”（这并不太关乎孩子们多久玩一次户外活动，或者对大或小群体玩耍的偏好。），这表明选项B“They involve fewer children”（他们涉及的孩子更少）不是现在的变化，因此B是干扰项。"},{"time":"00:03:45,800 --> 00:03:50,080","html":"<mark style=\"background-color: #bbf7d0;\">But the fact that the play sessions don't go on for as long.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">而是玩耍的时间不再那么长了。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题25 Ravi明确指出“But the fact that the play sessions don't go on for as long.”（但玩耍的时间不再那么长了。），这直接对应了选项C“They usually last a shorter time”（它们通常持续时间更短），因此C是正确答案。"},{"time":"00:03:50,080 --> 00:03:55,640","html":"And games involving one child running after another who tries to get away, these are","cn":"而那种一个孩子追另一个想逃跑的追逐游戏，这些","analysis":""},{"time":"00:03:55,640 --> 00:03:58,360","html":"<mark style=\"background-color: #fecaca;\">still as popular as ever.<\/mark>","cn":"<mark style=\"background-color: #fecaca;\">仍然和以前一样受欢迎。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题25和26 Ravi说“And games involving one child running after another who tries to get away, these are still as popular as ever.”（而那种一个孩子追另一个想逃跑的追逐游戏，这些仍然和以前一样受欢迎。），这表明选项E“They involve fewer chasing games”（它们涉及更少的追逐游戏）不是现在的变化，因此E是干扰项。"},{"time":"00:03:58,360 --> 00:04:02,000","html":"<mark style=\"background-color: #bbf7d0;\">But one thing that is declined is improvised games.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">但有一点下降的是即兴游戏。<\/mark>","analysis":""},{"time":"00:04:02,000 --> 00:04:05,040","html":"And I'd like to examine why this might be.","cn":"我想研究一下这可能是什么原因。","analysis":"<strong>答案解析：<\/strong> 问题26 Ravi提到“But one thing that is declined is improvised games.”（但有一点下降的是即兴游戏。），“improvised games”即“made-up games”（自创游戏），这直接对应了选项D“They include fewer made-up games”（它们包含更少的自创游戏），因此D是正确答案。"},{"time":"00:04:05,040 --> 00:04:06,920","html":"[Dr. Cheng]: Interesting.","cn":"[程博士]: 有趣。","analysis":""},{"time":"00:04:06,920 --> 00:04:08,920","html":"And what about safety?","cn":"那安全方面呢？","analysis":""},{"time":"00:04:08,920 --> 00:04:13,760","html":"[Ravi]: Well, from my reading, <mark style=\"background-color: #fecaca;\">serious accidents are still rare.<\/mark>","cn":"[Ravi]: 嗯，根据我的阅读，<mark style=\"background-color: #fecaca;\">严重的事故仍然很少见。<\/mark>","analysis":""},{"time":"00:04:13,760 --> 00:04:21,360","html":"More kids hurt themselves falling out of bed than out of trees.","cn":"孩子们从床上摔下来受伤的比从树上摔下来受伤的还多。","analysis":"<strong>答案解析：<\/strong> Ravi表示“serious accidents are still rare”（严重的事故仍然很少见），并且说“More kids hurt themselves falling out of bed than out of trees”（孩子们从床上摔下来受伤的比从树上摔下来受伤的还多）。这说明危险程度一直较低，而不是与上一代相比“less dangerous”（危险性降低），因此A是干扰项。"},{"time":"00:04:21,360 --> 00:04:26,560","html":"[Narrator]: Before you hear the rest of the discussion, you have some time to look at questions 27","cn":"[旁白]: 在你听完剩余的讨论之前，你有一些时间看第27","analysis":""},{"time":"00:04:26,560 --> 00:04:27,120","html":"to 30.","cn":"到30题。","analysis":""},{"time":"00:04:35,040 --> 00:05:04,360","html":"Now, listen and answer a questions 27 to 30.","cn":"现在，听并回答第27到30题。","analysis":""},{"time":"00:05:04,360 --> 00:05:09,760","html":"[Ravi]: I think that a client of outdoor play is a problem which should worry parents.","cn":"[Ravi]: 我认为户外玩耍的减少是父母应该担心的一个问题。","analysis":""},{"time":"00:05:09,760 --> 00:05:13,040","html":"I mean, perhaps the children themselves don't miss it.","cn":"我的意思是，也许孩子们自己并不怀念它。","analysis":""},{"time":"00:05:13,040 --> 00:05:16,440","html":"They may be happy to spend lots of time indoors.","cn":"他们可能很高兴花很多时间在室内。","analysis":"<strong>答案解析：<\/strong> 问题27 Ravi提到“perhaps the children themselves don't miss it. They may be happy to spend lots of time indoors.”（也许孩子们自己并不怀念它。他们可能很高兴花很多时间在室内。），这暗示了选项C“It makes childhood less enjoyable”（它让童年乐趣减少）不是父母应该担忧的原因，因为孩子们可能仍然感到快乐，因此C是干扰项。"},{"time":"00:05:16,440 --> 00:05:22,800","html":"<mark style=\"background-color: #bbf7d0;\">But the links between inactivity and physical problems when their adults are so well established<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">但久坐不动与成年后身体问题之间的联系已经如此明确，<\/mark>","analysis":""},{"time":"00:05:22,800 --> 00:05:27,560","html":"<mark style=\"background-color: #bbf7d0;\">that I think kids should be encouraged to spend more time outdoors with their brothers<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">所以我认为应该鼓励孩子们和他们的兄弟姐妹<\/mark>","analysis":""},{"time":"00:05:27,560 --> 00:05:29,840","html":"and sisters and friends.","cn":"和朋友们多花时间在户外。","analysis":"<strong>答案解析：<\/strong> 问题27 Ravi明确指出“But the links between inactivity and physical problems when their adults are so well established”（但久坐不动与成年后身体问题之间的联系已经如此明确），这直接对应了选项B“It leads to health problems later in life”（它导致晚年健康问题），因此B是正确答案。他最后提到“spend more time outdoors with their brothers and sisters and friends”是鼓励方式，并非父母担忧的核心原因。"},{"time":"00:05:29,840 --> 00:05:31,440","html":"[Dr. Cheng]: What about schools?","cn":"[程博士]: 学校呢？","analysis":""},{"time":"00:05:31,440 --> 00:05:37,000","html":"[Ravi]: Well, what I think they should do differently regarding outdoor play and it wouldn't actually","cn":"[Ravi]: 嗯，我认为他们在户外玩耍方面应该做些不同的事情，而且这实际上并不需要","analysis":""},{"time":"00:05:37,000 --> 00:05:43,760","html":"<mark style=\"background-color: #fecaca;\">require a great deal of expenditure<\/mark> is base their policy on different outcomes, like developing","cn":"<mark style=\"background-color: #fecaca;\">大量的开支<\/mark>，而是应该将政策建立在不同的成果上，比如培养","analysis":"<strong>答案解析：<\/strong> 问题28 Ravi明确指出“it wouldn't actually require a great deal of expenditure”（这实际上并不需要大量的开支），这直接否定了选项B“Spend more money on it”（在这方面花更多钱），因此B是干扰项。"},{"time":"00:05:43,760 --> 00:05:49,800","html":"<mark style=\"background-color: #bbf7d0;\">children's confidence, not just thinking about exam results,<\/mark> although I don't know how","cn":"<mark style=\"background-color: #bbf7d0;\">孩子们的自信心，而不仅仅是考虑考试成绩，<\/mark>尽管我不知道","analysis":""},{"time":"00:05:49,800 --> 00:05:52,600","html":"it would go down with the parents.","cn":"家长们会怎么看。","analysis":"<strong>答案解析：<\/strong> 问题28 Ravi建议学校“base their policy on different outcomes, like developing children's confidence, not just thinking about exam results”（将政策建立在不同的成果上，比如培养孩子们的自信心，而不仅仅是考虑考试成绩），这表明学校应该改变其目标或宗旨，直接对应了选项A“Revise their aims”（修正他们的目标），因此A是正确答案。他提到“although I don't know how it would go down with the parents”（尽管我不知道家长们会怎么看），这表示不确定家长们的反应，而非建议听取家长意见来制定政策，因此C是干扰项。"},{"time":"00:05:52,600 --> 00:05:57,000","html":"[Dr. Cheng]: And do children get more contact with nature in rural areas?","cn":"[程博士]: 那么，农村地区的孩子是否能更多地接触大自然呢？","analysis":""},{"time":"00:05:57,000 --> 00:06:00,560","html":"[Ravi]: There's research on this by Smith and Barker.","cn":"[Ravi]: Smith和Barker对此有研究。","analysis":""},{"time":"00:06:00,560 --> 00:06:06,560","html":"Intuitively, you'd expect children in rural areas to spend more time out in the open, but","cn":"直观上，你会期望农村地区的儿童在户外度过更多时间，但","analysis":""},{"time":"00:06:06,560 --> 00:06:11,200","html":"<mark style=\"background-color: #bbf7d0;\">in fact, they are generally told to keep off agricultural land.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">实际上，他们通常被告知要远离农田。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题29 Ravi说“Intuitively, you'd expect children in rural areas to spend more time out in the open, but in fact, they are generally told to keep off agricultural land.”（直观上，你会期望农村地区的儿童在户外度过更多时间，但实际上，他们通常被告知要远离农田。），这直接对应了选项A“They tend not to be allowed on farmland”（他们通常不被允许进入农田），因此A是正确答案。"},{"time":"00:06:11,200 --> 00:06:15,520","html":"<mark style=\"background-color: #fecaca;\">Plus, there are difficulties with supervision outside towns and cities.<\/mark>","cn":"<mark style=\"background-color: #fecaca;\">此外，在城镇和城市以外的地区，监管也存在困难。<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题29 Ravi提到“Plus, there are difficulties with supervision outside towns and cities.”（此外，在城镇和城市以外的地区，监管也存在困难。），这意味着农村地区的户外监管可能更少或更复杂，而不是“more supervision outdoors”（户外受到更多监管），因此B是干扰项。而他开始说的“Intuitively, you'd expect children in rural areas to spend more time out in the open”是直觉，紧接着用“but in fact”进行反驳，说明C“They spend more time outdoors than city children”（他们比城市儿童花更多时间在户外）不符合实际情况，因此C也是干扰项。"},{"time":"00:06:15,520 --> 00:06:16,520","html":"[Dr. Cheng]: Right.","cn":"[程博士]: 好的。","analysis":""},{"time":"00:06:16,520 --> 00:06:22,160","html":"And Smith and Barker's paper was published in 2001.","cn":"Smith和Barker的论文发表于2001年。","analysis":""},{"time":"00:06:22,160 --> 00:06:29,840","html":"<mark style=\"background-color: #fecaca;\">Not the most up-to-date, but still valid to use,<\/mark> but you'll need to stipulate very precisely","cn":"<mark style=\"background-color: #fecaca;\">虽然不是最新的，但仍然有效可用，<\/mark>但你需要非常精确地指出","analysis":"<strong>答案解析：<\/strong> 问题30 程博士提到“Not the most up-to-date, but still valid to use”（虽然不是最新的，但仍然有效可用），这直接反驳了选项B“It is too old to be useful”（它太旧而无法使用），因此B是干扰项。"},{"time":"00:06:29,840 --> 00:06:35,800","html":"<mark style=\"background-color: #bbf7d0;\">that their focus was, if I remember correctly, just on rural areas.<\/mark>","cn":"<mark style=\"background-color: #bbf7d0;\">如果我没记错的话，他们的研究重点只在农村地区。<\/mark>","analysis":""},{"time":"00:06:35,800 --> 00:06:41,880","html":"So you'd need to consider how far their restricted findings might be applicable to urban areas","cn":"所以你需要考虑他们的这些有限的发现在多大程度上适用于城市地区","analysis":""},{"time":"00:06:41,880 --> 00:06:42,880","html":"as well.","cn":"也一样。","analysis":"<strong>答案解析：<\/strong> 问题30 程博士明确指出“their focus was, if I remember correctly, just on rural areas. So you'd need to consider how far their restricted findings might be applicable to urban areas as well.”（如果我没记错的话，他们的研究重点只在农村地区。所以你需要考虑他们的这些有限的发现在多大程度上适用于城市地区。），这直接对应了选项C“Its focus is limited”（其关注点有限），因此C是正确答案。"},{"time":"00:06:42,880 --> 00:06:43,880","html":"[Ravi]: OK.","cn":"[Ravi]: 好的。","analysis":""},{"time":"00:06:43,880 --> 00:06:44,880","html":"[Dr. Cheng]: Right.","cn":"[程博士]: 好的。","analysis":""},{"time":"00:06:44,880 --> 00:06:49,440","html":"So now I'd suggest you produce an overview of what you're going to cover.","cn":"所以现在我建议你制作一个你将要涵盖内容的概述。","analysis":""},{"time":"00:06:53,160 --> 00:06:56,000","html":"[Narrator]: That is the end of part three.","cn":"[旁白]: 第三部分到此结束。","analysis":""},{"time":"00:06:56,000 --> 00:06:59,760","html":"You now have 30 seconds to check your answers to part three.","cn":"你现在有30秒的时间检查第三部分的答案。","analysis":""}],"transcriptHighlights":[{"qid":"21","text":"Concerns about traffic","answer":"A"},{"qid":"22","text":"Reduction in free time","answer":"E"},{"qid":"23","text":"How it helps children to evaluate risk","answer":"A"},{"qid":"24","text":"How it improves children’s digestion","answer":"D"},{"qid":"25","text":"They usually last a shorter time.","answer":"C"},{"qid":"26","text":"They include fewer made-up games.","answer":"D"},{"qid":"27","text":"It leads to health problems later in life.","answer":"B"},{"qid":"28","text":"Revise their aims.","answer":"A"},{"qid":"29","text":"They tend not to be allowed on farmland.","answer":"A"},{"qid":"30","text":"Its focus is limited.","answer":"C"}],"ownerInf <script>
const DATA=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const RENDER_VERSION=17;
let secs=0,review=false,timer=setInterval(()=>{secs++;drawTimer();if(secs%5===0)save(false)},1000),drag=null,currentCue=-1,loopCue=false,slowCue=false,showCn=true,showAnalysis=true,dictationMode=false,showOriginal=true,dictationAnswers={};const storeKey='ielts_v4_'+DATA.title.replace(/\W+/g,'_');
const CONFIG_DATA={answerKey:DATA.answerKey,questionList:DATA.questionIds.map(q=>Number(q)||q),localStorageKey:storeKey};window.localStorageKey=storeKey;window.DATA=DATA;window.CONFIG_DATA=CONFIG_DATA;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function matchingRepeatAttr(g){return (g.questions||[]).length>(g.options||[]).length?' data-repeat="true"':''}
function flowQuestionMap(g){let map={};(g.questions||[]).forEach(q=>map[q[0]]=q[1]);return map}
function flowQidsInText(raw,qmap){return Object.keys(qmap).filter(id=>new RegExp(`(?<!\\d)${id}(?!\\d)`).test(raw)).sort((a,b)=>Number(a)-Number(b))}
function renderFlowText(raw,qids){qids=Array.isArray(qids)?qids:[qids];let html=esc(String(raw||''));qids.forEach(qid=>{html=html.replace(new RegExp(`(?<!\\d)${qid}(?!\\d)`),`<span class="flow-num">${qid}</span>`)});let slotIdx=0;html=html.replace(/(?:_{2,}|…{2,}|\.{4,})/g,()=>{let qid=qids[slotIdx++]||qids[qids.length-1];return `<span class="slot" data-q="${qid}"></span>`});qids.slice(slotIdx).forEach(qid=>{html+=` <span class="slot" data-q="${qid}"></span>`});return html}
function renderFlowLine(line,qmap,used){let raw=String((typeof line==='object'&&line?line.text:line)||''),qids=flowQidsInText(raw,qmap);if(qids.length){qids.forEach(qid=>used.add(qid));return `<div class="flow-step flow-step-full"><div class="flow-text">${renderFlowText(raw,qids)}</div></div>`}return `<div class="flow-note">${esc(raw)}</div>`}
function renderFlowTable(lines,qmap,used){let rows=[],maxCols=1;lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0,cols=Number(meta.cols)||1,raw=String(meta.text||''),qids=flowQidsInText(raw,qmap);maxCols=Math.max(maxCols,cols,col+1);if(!rows[row])rows[row]=[];if(!rows[row][col])rows[row][col]=[];qids.forEach(qid=>used.add(qid));rows[row][col].push(`<div class="flow-text">${qids.length?renderFlowText(raw,qids):esc(raw)}</div>`)});return `<div class="flow-table-wrap"><table class="flow-table">${rows.map(cells=>{let filled=(cells||[]).map((parts,col)=>parts?{col,html:parts.join('')}:null).filter(Boolean);return `<tr>${filled.map(cell=>{let span=filled.length===1&&maxCols>1?` colspan="${maxCols}"`:'';return `<td${span}>${cell.html}</td>`}).join('')}</tr>`}).join('')}</table></div>`}
function renderFlowSteps(g){let qmap=flowQuestionMap(g),used=new Set(),lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:[]);if(lines.length){let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFlowTable(chunk,qmap,used);continue}html+=renderFlowLine(lines[i++],qmap,used)}return html+(g.questions||[]).filter(q=>!used.has(q[0])).map(q=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>`).join('')}return g.questions.map((q,idx)=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>${idx<g.questions.length-1?'<div class="flow-arrow">↓</div>':''}`).join('')}
function groupHTML(g){if(g.type==='matching'&&g.layout==='flow')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="flow-layout"><div class="flow-steps">${renderFlowSteps(g)}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='matching'&&g.layout==='diagram')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'diagram.png')}" alt="Diagram"></div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></div></section>`;
if(g.type==='matching')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='map')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'map.png')}" alt="Map" onerror="if(this.dataset.fallback!=='1'){this.dataset.fallback='1';this.src='diagram.png'}"></div><div class="map-grid"><div class="map-answer-list">${g.questions.map(q=>`<div class="map-row"><div class="map-row-label"><strong>${q[0]}</strong> ${esc(q[1]||'')}</div><div class="map-options" style="--map-options:${(g.options||[]).length||1}">${(g.options||[]).map(o=>`<div class="choice map-choice" data-name="q${q[0]}" data-value="${o}">${o}</div>`).join('')}</div></div>`).join('')}</div></div></div></section>`;
if(g.type==='single')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div>${g.questions.map(q=>`<p><strong>${q.id}</strong> ${esc(q.text)}</p>${q.options.map(o=>`<div class="choice single-choice" data-name="q${q.id}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}`).join('')}</section>`;
if(g.type==='multiple')return `<section class="group" data-limit="${g.limit}" data-id="${g.id}"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><p><strong>${esc(g.id)}</strong> ${esc(g.questionText)}</p>${g.options.map(o=>`<div class="choice multi-choice" data-name="q${g.id.replace('-','_')}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</section>`;
return `<section class="group"><h3>${esc(g.title)}</h3>${renderFillGroup(g)}</section>`}
function renderFillGroup(g){let qids=(g.questions||[]).map(q=>String(q.id));let used=new Set();let lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:g.questions.map(q=>`${q.id} ${q.text} _____`));let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFillTable(chunk,qids,used);continue}html+=renderFillLine(lines[i++],qids,used)}return html||`<div class="instruction">${esc(g.instruction||'Complete the notes below.')}</div>`}
function renderFillTable(lines,qids,used){let rows=[],maxCols=1;lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0,cols=Number(meta.cols)||1;maxCols=Math.max(maxCols,cols,col+1);if(!rows[row])rows[row]=[];if(!rows[row][col])rows[row][col]=[];rows[row][col].push(`<div class="fill-table-line">${renderFillLine(line,qids,used,true)}</div>`)});return `<div class="fill-table-wrap"><table class="fill-table">${rows.map((cells,idx)=>{let filled=(cells||[]).map((parts,col)=>parts?{col,html:parts.join('')}:null).filter(Boolean);return `<tr>${filled.map(cell=>{let tag=idx===0?'th':'td',span=filled.length===1&&maxCols>1?` colspan="${maxCols}"`:'';return `<${tag}${span}>${cell.html}</${tag}>`}).join('')}</tr>`}).join('')}</table></div>`}
function fillInput(qid,lead=''){return `<span class="blank-q">${esc(qid)}</span>${esc(lead)}<input class="blank" name="q${esc(qid)}" type="text" autocomplete="off" inputmode="text">`}
function fillLineAttrs(meta,isHeading){let cls=['doc-line'];if(isHeading)cls.push('fill-heading');if(meta.list)cls.push('is-list');let rawLevel=Math.max(0,Math.min(6,Number(meta.level)||0)),level=rawLevel>0?rawLevel+1:rawLevel;let style=meta.list?` style="--indent:${level*30}px"`:'';return `class="${cls.join(' ')}"${style}`}
function fillLineContent(meta,body){let level=Math.max(0,Number(meta.level)||0),bullet=level>0?'◦':'•';return meta.list?`<span class="doc-bullet">${bullet}</span><span class="doc-line-content">${body}</span>`:body}
function isFillHeading(raw,meta,hit){return !hit&&!meta.list&&!/(?:_{2,}|…{2,}|\.{4,})/.test(raw)&&!/^\d+\.?\s+/.test(raw)&&!/^(?:Complete|Write|Choose)\b/i.test(raw)}
function renderFillLine(line,qids,used,inner=false){let meta=typeof line==='object'&&line?line:{},raw=String(meta.text??line),html=esc(raw),hit=false;html=html.replace(/(^|[^\d])(\d{1,2})\.?\s*((?:£\s*)?)(?:_{2,}|…{2,}|\.{4,})/g,(m,prefix,qid,lead)=>{if(!qids.includes(qid))return m;used.add(qid);hit=true;return prefix+fillInput(qid,lead)});let m=raw.match(/^(\d+)\.?\s+(.+)$/);if(!hit&&m&&qids.includes(m[1])){used.add(m[1]);let body=esc(m[2]);let input=fillInput(m[1]);body=/(?:_+|…{2,}|\.{4,})/.test(body)?body.replace(/(?:_+|…{2,}|\.{4,})/,input):`${body} ${input}`;return inner?fillLineContent(meta,body):`<p ${fillLineAttrs(meta,false)}>${fillLineContent(meta,body)}</p>`}return inner?html:`<p ${fillLineAttrs(meta,isFillHeading(raw,meta,hit))}>${fillLineContent(meta,html)}</p>`}
function hardResetAnswers(){$$('input').forEach(i=>{i.value='';i.defaultValue=''});$$('.choice').forEach(c=>c.classList.remove('selected'));$$('.slot').forEach(s=>s.innerHTML='');refreshPool();updateNav()}
function render(){document.title=DATA.title;$('#ownerMeta').textContent=DATA.ownerInfo||'';$('#audio').src=DATA.audio||'audio.mp3';$('#content').innerHTML=DATA.groups.map(groupHTML).join('');$('#nav').innerHTML=DATA.questionIds.map(q=>`<div data-q="${q}">${q}</div>`).join('');bindDynamic();hardResetAnswers();load();updateNav()}
function bindDynamic(){

function showToast(msg='Progress saved!'){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1400)}
function collectAnswers(){let answers={text:{},single:{},multiple:{},matching:{},map:{}};$$('#content input[name^="q"]').forEach(i=>answers.text[i.name]=i.value);$$('.single-choice.selected').forEach(c=>answers.single[c.dataset.name]=c.dataset.value);$$('.map-choice.selected').forEach(c=>answers.map[c.dataset.name]=c.dataset.value);let names=[...new Set($$('.multi-choice').map(c=>c.dataset.name))];names.forEach(name=>answers.multiple[name]=$$(`.multi-choice[data-name="${name}"].selected`).map(c=>c.dataset.value));$$('.slot').forEach(s=>{let tag=s.querySelector('.tag');if(tag)answers.matching[s.dataset.q]=tag.dataset.value});return answers}
function restoreAnswers(a={}){hardResetAnswers();Object.entries(a.text||{}).forEach(([name,val])=>{let el=$(`input[name="${name}"]`);if(el)el.value=val});Object.entries(a.single||{}).forEach(([name,val])=>{let el=$(`.single-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.map||{}).forEach(([name,val])=>{let el=$(`.map-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.multiple||{}).forEach(([name,vals])=>(vals||[]).forEach(val=>{let el=$(`.multi-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')}));Object.entries(a.matching||{}).forEach(([qid,val])=>{let opt=$(`.drag[data-value="${val}"]`),slot=$(`.slot[data-q="${qid}"]`);if(opt&&slot)slot.innerHTML=`<span class="tag" draggable="true" data-value="${val}">${esc(opt.textContent)}</span>`});refreshPool();restoreDragging();updateNav()}
function contentSnapshot(){let clone=$('#content').cloneNode(true);clone.querySelectorAll('.review').forEach(r=>r.remove());clone.querySelectorAll('input').forEach(i=>{i.setAttribute('value',i.value);i.removeAttribute('disabled')});clone.querySelectorAll('.choice').forEach(c=>c.classList.remove('disabled'));return clone.innerHTML}
function notesSnapshot(){$$('#notesList textarea').forEach(t=>{t.textContent=t.value;t.setAttribute('data-value',t.value)});return $('#notesList').innerHTML}
function layoutSignature(){return JSON.stringify([RENDER_VERSION,(DATA.groups||[]).map(g=>[g.type,g.layout||'',g.id||'',g.title||'',g.instruction||'',g.questionText||'',g.image||'',(g.options||[]),(g.questions||[]).map(q=>JSON.stringify(q))])])}
function save(show=false){let data={secs,answers:collectAnswers(),contentHtml:contentSnapshot(),layoutSignature:layoutSignature(),notes:notesSnapshot(),dark:document.body.classList.contains('dark'),font:document.documentElement.style.fontSize,dictationAnswers,studyState:{currentCue,loopCue,slowCue,showCn,showAnalysis,dictationMode,showOriginal},audioTime:audio?.currentTime||0};localStorage.setItem(storeKey,JSON.stringify(data));if(show)showToast()}
function load(){let raw=localStorage.getItem(storeKey);if(!raw)return;let d;try{d=JSON.parse(raw)}catch(err){console.warn('Saved progress could not be read.',err);return}secs=d.secs||0;if(d.answers){try{restoreAnswers(d.answers)}catch(err){console.warn('Saved answers could not be restored.',err)}}if(d.dictationAnswers)dictationAnswers=d.dictationAnswers;if(d.studyState)try{({currentCue=currentCue,loopCue=loopCue,slowCue=slowCue,showCn=showCn,showAnalysis=showAnalysis,dictationMode=dictationMode,showOriginal}=d.studyState)}catch(err){console.warn('Study state could not be restored.',err)}if(d.notes){try{$('#notesList').innerHTML=d.notes;$$('#notesList textarea').forEach(t=>{t.value=t.dataset.value||t.textContent||''})}catch(err){console.warn('Saved notes could not be restored.',err)}}if(d.dark)document.body.classList.add('dark');setFontSize(d.font||DEFAULT_FONT_SIZE,false);if(d.audioTime)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=d.audioTime},{once:true});bindNoteDeletes();drawTimer()}
function handleSelection(e){if(e.target.closest('#selbar,#notes,.bottom-bar'))return;let sel=window.getSelection();let hl=e.target.closest?.('.hl-brown,.hl-rose,.hl-blue');let bar=$('#selbar');if(hl&&sel.isCollapsed){bar.targetElem=hl;placeBar(bar,hl.getBoundingClientRect())}else if(sel&&!sel.isCollapsed&&$('#content').contains(sel.anchorNode)){bar.targetElem=null;placeBar(bar,sel.getRangeAt(0).getBoundingClientRect())}else{bar.hidden=true}}
function placeBar(bar,rect){bar.hidden=false;bar.style.left=Math.max(8,window.scrollX+rect.left+rect.width/2-95)+'px';bar.style.top=Math.max(8,window.scrollY+rect.top-46)+'px'}
function highlightedFromSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let node=sel.anchorNode?.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode;return node?.closest?.('.hl-brown,.hl-rose,.hl-blue')||null}
function handleToolbar(e){let act=e.target.closest('button')?.dataset.act;if(!act)return;let bar=$('#selbar'),target=bar.targetElem||highlightedFromSelection(),sel=window.getSelection();if(act==='del'&&target){unwrap(target);removeNote(target.dataset.hid)}else if(act==='hl'){if(target){if(target.classList.contains('hl-brown'))target.className='hl-rose';else if(target.classList.contains('hl-rose'))target.className='hl-rose';else target.className='hl-brown'}else{let span=wrapSelection('hl-brown');if(span)span.dataset.hid='h_'+Date.now()}}else if(act==='note'){let span=target||wrapSelection('hl-blue');if(span){span.className='hl-blue';if(!span.dataset.hid)span.dataset.hid='n_'+Date.now();createNote(span);document.body.classList.add('notes-open')}}bar.hidden=true;sel.removeAllRanges();save(false)}
function wrapSelection(cls){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let range=sel.getRangeAt(0);if(!$('#content').contains(range.commonAncestorContainer))return null;let span=document.createElement('span');span.className=cls;try{range.surroundContents(span)}catch{return null}return span}
function unwrap(el){let p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize()}
function clearUserHighlights(){$$('.hl-brown,.hl-rose,.hl-blue').forEach(unwrap)}
function createNote(span){let id=span.dataset.hid;if($(`.note-card[data-hid="${id}"]`))return;let card=document.createElement('div');card.className='note-card';card.dataset.hid=id;card.innerHTML=`<div class="note-quote">${esc(span.textContent.slice(0,120))}</div><textarea placeholder="Write note here..."></textarea><button class="delete-note" type="button">Delete</button>`;$('#notesList').prepend(card);bindNoteDeletes()}
function bindNoteDeletes(){$$('#notesList textarea').forEach(t=>t.oninput=()=>save(false));$$('.delete-note').forEach(btn=>btn.onclick=()=>{let card=btn.closest('.note-card'),id=card.dataset.hid,span=$(`[data-hid="${id}"]`);if(span)unwrap(span);card.remove();save(false)})}
function removeNote(id){if(!id)return;$(`.note-card[data-hid="${id}"]`)?.remove()}
function drawTimer(){let m=Math.floor(secs/60),s=secs%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
const DEFAULT_FONT_SIZE=16,MIN_FONT_SIZE=14,MAX_FONT_SIZE=22;
function currentFontSize(){return Number.parseInt(document.documentElement.style.fontSize,10)||DEFAULT_FONT_SIZE}
function setFontSize(size,persist=true){let n=Math.max(MIN_FONT_SIZE,Math.min(MAX_FONT_SIZE,Number(size)||DEFAULT_FONT_SIZE));document.documentElement.style.fontSize=n===DEFAULT_FONT_SIZE?'':n+'px';updateSizeButtons();if(persist)save(false)}
function adjustFontSize(delta){setFontSize(currentFontSize()+delta,true)}
function updateSizeButtons(){let size=currentFontSize(),dark=document.body.classList.contains('dark');$('#fontMinus')?.toggleAttribute('disabled',size<=MIN_FONT_SIZE);$('#fontPlus')?.toggleAttribute('disabled',size>=MAX_FONT_SIZE);$('#fontDefault')?.classList.toggle('active',size===DEFAULT_FONT_SIZE);$('#lightBtn')?.classList.toggle('active',!dark);$('#darkBtn')?.classList.toggle('active',dark)}
function resetAppearance(persist=true){document.body.classList.remove('dark');setFontSize(DEFAULT_FONT_SIZE,false);updateSizeButtons();if(persist)save(false)}
function clearAllProgress(){localStorage.removeItem(storeKey)}
$('#finish').onclick=finish;$('#save').onclick=()=>save(true);$('#clear').onclick=()=>{if(confirm('Clear all progress?')){window.resetTest();showToast('Clear complete')}};$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-open');save(false)};$('#closeNotes').onclick=()=>{document.body.classList.remove('notes-open');save(false)};$('#toggleIntensive').onclick=()=>{toggleIntensive();save(false)};$('#settingsBtn').onclick=()=>{$('#settings').classList.toggle('open');updateSizeButtons()};$('#lightBtn').onclick=()=>{document.body.classList.remove('dark');updateSizeButtons();save(false)};$('#darkBtn').onclick=()=>{document.body.classList.add('dark');updateSizeButtons();save(false)};$('#appearanceReset').onclick=()=>resetAppearance(true);$('#fontMinus').onclick=()=>adjustFontSize(-1);$('#fontPlus').onclick=()=>adjustFontSize(1);$('#fontDefault').onclick=()=>setFontSize(DEFAULT_FONT_SIZE,true);$('#settings').addEventListener('wheel',e=>{e.preventDefault();adjustFontSize(e.deltaY>0?-1:1)},{passive:false});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey)return;let key=e.key;if(key==='+'||key==='='){e.preventDefault();adjustFontSize(1)}else if(key==='-'||key==='_'){e.preventDefault();adjustFontSize(-1)}else if(key==='0'){e.preventDefault();resetAppearance(true)}});
const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
</script>
