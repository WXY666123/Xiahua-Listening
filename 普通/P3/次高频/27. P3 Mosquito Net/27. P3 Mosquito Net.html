{"text":"global incidence of the disease","list":true,"level":0},{"text":"impact on 26. _______________________","list":true,"level":0},{"text":"History","list":false,"level":0},{"text":"27. _______________________","list":true,"level":0},{"text":"Production","list":false,"level":0},{"text":"information about 28. _______________________","list":true,"level":0},{"text":"profile of manufacturer with description of 29. _______________________","list":true,"level":0},{"text":"30. _______________________ (according to website)","list":true,"level":0}]}],"answerKey":{"text":{},"single":{"q21":"A","q22":"C","q23":"B","q24":"C","q25":"A"},"multiple":{},"multipleMap":{},"matching":{"q26":"G","q27":"D","q28":"B","q29":"A","q30":"F"},"map":{}},"transcriptLines":[{"time":"00:00:12,680 --> 00:00:17,200","html":"research he is doing on product development.","cn":"关于产品开发的研究。","analysis":""},{"time":"00:00:17,200 --> 00:00:21,320","html":"First you have some time to look at questions 21 to 25.","cn":"首先，您将有一些时间查看问题21至25。","analysis":""},{"time":"00:00:30,000 --> 00:00:59,800","html":"Now listen carefully and answer questions 21 to 25.","cn":"现在请仔细听并回答问题21至25。","analysis":""},{"time":"00:00:59,800 --> 00:01:05,800","html":"[Tutor]: Hello Edward, sit down.","cn":"[导师]: 你好，爱德华，请坐。","analysis":""},{"time":"00:01:05,800 --> 00:01:10,800","html":"[Edward]: Thanks. I need some advice on my presentation about product development.","cn":"[爱德华]: 谢谢。我需要一些关于我产品开发演示的建议。","analysis":""},{"time":"00:01:10,800 --> 00:01:13,800","html":"[Tutor]: Right. Have you decided what to focus on?","cn":"[导师]: 好的。你决定好重点了吗？","analysis":""},{"time":"00:01:13,800 --> 00:01:17,800","html":"[Edward]: Yes. The product I've chosen is a particular type of mosquito net.","cn":"[爱德华]: 是的。我选择的产品是一种特殊的蚊帐。","analysis":""},{"time":"00:01:17,800 --> 00:01:19,800","html":"[Tutor]: Any reason for choosing that?","cn":"[导师]: 选择它的原因是什么？","analysis":""},{"time":"00:01:19,800 --> 00:01:23,800","html":"[Edward]: I spent last summer traveling around Africa with a friend.","cn":"[爱德华]: 去年夏天我和一个朋友在非洲旅行。","analysis":""},{"time":"00:01:23,800 --> 00:01:28,800","html":"He's studying medicine. So when we're in a region where mosquitoes cause malaria,","cn":"他学医。所以当我们在蚊子引起疟疾的地区时，","analysis":""},{"time":"00:01:28,800 --> 00:01:34,800","html":"we visited a medical center. I chatted to <mark style=\"background-color: #bbf7d0;\">an administrator<\/mark> while my <mark style=\"background-color: #fecaca;\">friend<\/mark> talked to one of the <mark style=\"background-color: #fecaca;\">doctors<\/mark>.","cn":"我们参观了一个医疗中心。我跟一位<mark style=\"background-color: #bbf7d0;\">行政人员<\/mark>聊了聊，而我的<mark style=\"background-color: #fecaca;\">朋友<\/mark>则跟一位<mark style=\"background-color: #fecaca;\">医生<\/mark>谈话。","analysis":"<strong>答案解析：<\/strong> 问题21询问爱德华从谁那里了解到这种蚊帐。爱德华说他“chat to an administrator”（与一位行政人员聊天），并在那之后了解到蚊帐的情况。虽然他的朋友和医生也在场，但爱德华的信息直接来源于与行政人员的对话，因此A是正确答案。B（医生）和C（朋友）是干扰项，因为他们没有直接提供爱德华所需的信息。"},{"time":"00:01:34,800 --> 00:01:41,800","html":"And I found out they've had far fewer cases of malaria since these mosquito nets became available locally.","cn":"我发现自从这些蚊帐在当地普及以来，疟疾病例大大减少了。","analysis":""},{"time":"00:01:41,800 --> 00:01:43,800","html":"That made me interested in them.","cn":"这让我对它们产生了兴趣。","analysis":""},{"time":"00:01:43,800 --> 00:01:48,800","html":"[Tutor]: Okay. Mosquito nets have quite a long history, don't they?","cn":"[导师]: 好的。蚊帐的历史相当悠久，不是吗？","analysis":""},{"time":"00:01:48,800 --> 00:01:51,800","html":"I believe they've been used in <mark style=\"background-color: #fecaca;\">Japan<\/mark> for centuries.","cn":"我认为它们在<mark style=\"background-color: #fecaca;\">日本<\/mark>已经使用了几个世纪。","analysis":"<strong>答案解析：<\/strong> 问题22询问爱德华认为蚊帐最初是在哪里使用的。导师明确表示“I believe they've been used in Japan for centuries”（我相信它们在日本已经使用了几个世纪），而不是爱德华。所以，这是一个干扰项。"},{"time":"00:01:51,800 --> 00:01:56,800","html":"[Edward]: That's right. Though apparently, Queen Cleopatra slept under one in <mark style=\"background-color: #bbf7d0;\">ancient Egypt<\/mark>. That was probably where they were invented.","cn":"[爱德华]: 没错。不过显然，埃及艳后克利奥帕特拉在<mark style=\"background-color: #bbf7d0;\">古埃及<\/mark>曾睡在蚊帐下。那可能就是蚊帐的发明地。","analysis":"<strong>答案解析：<\/strong> 问题22询问爱德华认为蚊帐最初是在哪里使用的。爱德华提出“Queen Cleopatra slept under one in ancient Egypt. That was probably where they were invented.”（埃及艳后克利奥帕特拉在古埃及曾睡在蚊帐下。那可能就是蚊帐的发明地。）表明在讨论中，埃及被确认为最可能的发源地。因此，C（埃及）是正确答案。"},{"time":"00:01:56,800 --> 00:01:59,800","html":"That was probably where they were invented.","cn":"那可能就是它们的发明地。","analysis":""},{"time":"00:01:59,800 --> 00:02:02,800","html":"And much later, nets were used in <mark style=\"background-color: #fecaca;\">China<\/mark>.","cn":"后来，蚊帐在中国也被使用。","analysis":"<strong>答案解析：<\/strong> 问题22询问爱德华认为蚊帐最初是在哪里使用的。爱德华后续提到“And much later, nets were used in China”（后来，蚊帐在中国也被使用），这表明中国不是最初的发明地。因此，A（中国）是一个干扰项。"},{"time":"00:02:02,800 --> 00:02:05,800","html":"So perhaps they were invented there independently.","cn":"所以它们可能是在那里独立发明的。","analysis":""},{"time":"00:02:05,800 --> 00:02:11,800","html":"Originally, they were made of silk, but later cotton was used, and nowadays they're mainly <mark style=\"background-color: #fecaca;\">synthetic<\/mark>.","cn":"最初它们是用丝绸制作的，后来改用棉花，现在它们主要由<mark style=\"background-color: #fecaca;\">合成材料<\/mark>制成。","analysis":"<strong>答案解析：<\/strong> 问题23询问20世纪中叶的蚊帐化学处理。选项C（通过现代纺织品得以实现）与此处的“synthetic”（合成材料）有关，但合成材料是在“nowadays”（现在）才主要使用的，而不是20世纪中叶的化学处理成为可能的原因。因此，C是一个干扰项。"},{"time":"00:02:11,800 --> 00:02:20,800","html":"It wasn't until the <mark style=\"background-color: #fecaca;\">middle of the 20th century that they developed nets treated with insecticides for use by the military<\/mark>, and that was a major step forward.","cn":"直到20世纪中叶，他们才开发出<mark style=\"background-color: #fecaca;\">用于军事用途的经杀虫剂处理的蚊帐<\/mark>，这是一个重大进步。","analysis":"<strong>答案解析：<\/strong> 问题23询问20世纪中叶的蚊帐化学处理。文本提到“for use by the military”（供军队使用），但选项A（由士兵首次开发）则断言是由士兵开发。原文中没有提及是由士兵开发的，只是为军队使用。因此，A是一个干扰项。"},{"time":"00:02:20,800 --> 00:02:28,800","html":"They used an insecticide called DDT, but it was later found that <mark style=\"background-color: #bbf7d0;\">this could be harmful to people<\/mark> as well as mosquitoes.","cn":"他们使用了一种名为DDT的杀虫剂，但后来发现<mark style=\"background-color: #bbf7d0;\">这种物质对人类和蚊子都有害<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题23询问20世纪中叶的蚊帐化学处理。文本明确指出，当时使用的杀虫剂DDT“could be harmful to people as well as mosquitoes”（对人类和蚊子都有害）。这与选项B（使它们对使用者具有潜在危险）直接对应。因此，B是正确答案。"},{"time":"00:02:28,800 --> 00:02:31,800","html":"[Tutor]: Is that still a problem with modern nets?","cn":"[导师]: 现代蚊帐仍然存在这个问题吗？","analysis":""},{"time":"00:02:31,800 --> 00:02:36,800","html":"[Edward]: Oh no. The chemicals used nowadays are safe, even if people sleep under them <mark style=\"background-color: #fecaca;\">every night<\/mark>.","cn":"[爱德华]: 哦不。现在使用的化学品是安全的，即使人们<mark style=\"background-color: #fecaca;\">每晚<\/mark>睡在它们下面。","analysis":"<strong>答案解析：<\/strong> 问题24询问现代蚊帐的使用者。选项B（应避免每晚使用）与爱德华的说法“safe, even if people sleep under them every night”（即使人们每晚睡在它们下面也是安全的）相矛盾。因此，B是一个干扰项。"},{"time":"00:02:36,800 --> 00:02:39,800","html":"And the nets work, and they're out of free.","cn":"蚊帐有效，而且它们是免费的。","analysis":""},{"time":"00:02:39,800 --> 00:02:45,800","html":"But they have to be treated fairly often with the chemical, which the owners need to do themselves.","cn":"但它们必须经常用化学品处理，而这需要蚊帐的主人自己动手。","analysis":""},{"time":"00:02:46,800 --> 00:02:51,800","html":"[Tutor]: Presumably, <mark style=\"background-color: #bbf7d0;\">distribution of the chemical can be a problem in remote areas<\/mark>.","cn":"[导师]: 想必，<mark style=\"background-color: #bbf7d0;\">化学品的分配在偏远地区可能是一个问题<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题24询问现代蚊帐的使用者。导师提出“distribution of the chemical can be a problem in remote areas”（化学品的分配在偏远地区可能是一个问题），并接着解释说“people may not be able to get hold of it easily”（人们可能不容易获得它）。这直接对应选项C（可能难以获得必要的化学品）。因此，C是正确答案。"},{"time":"00:02:51,800 --> 00:02:54,800","html":"I mean, <mark style=\"background-color: #bbf7d0;\">people may not be able to get hold of it easily<\/mark>.","cn":"我的意思是，<mark style=\"background-color: #bbf7d0;\">人们可能不容易获得它<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题24询问现代蚊帐的使用者。导师提出“distribution of the chemical can be a problem in remote areas”（化学品的分配在偏远地区可能是一个问题），并接着解释说“people may not be able to get hold of it easily”（人们可能不容易获得它）。爱德华也表示同意。这直接对应选项C（可能难以获得必要的化学品）。因此，C是正确答案。"},{"time":"00:02:54,800 --> 00:02:56,800","html":"[Edward]: That's right.","cn":"[爱德华]: 没错。","analysis":""},{"time":"00:02:56,800 --> 00:02:59,800","html":"[Tutor]: Okay, tell me about this net you're going to talk about.","cn":"[导师]: 好的，给我讲讲你要谈论的这种蚊帐吧。","analysis":""},{"time":"00:02:59,800 --> 00:03:05,800","html":"[Edward]: Well, the brand name is OliSet, and the product was invented by a Japanese company.","cn":"[爱德华]: 嗯，品牌名称是OliSet，这个产品是由一家日本公司发明的。","analysis":""},{"time":"00:03:05,800 --> 00:03:13,800","html":"These nets are an improvement on the alternatives, because the insecticide is contained inside the fiber, and released gradually.","cn":"这些蚊帐是对现有替代品的改进，因为杀虫剂包含在纤维内部，并逐渐释放。","analysis":""},{"time":"00:03:13,800 --> 00:03:16,800","html":"It's not coated on the outside as with ordinary nets.","cn":"它不像普通蚊帐那样涂在外表面。","analysis":""},{"time":"00:03:16,800 --> 00:03:18,800","html":"[Tutor]: So the chemicals don't have to be replaced?","cn":"[导师]: 那么化学品就不需要更换了？","analysis":""},{"time":"00:03:18,800 --> 00:03:23,800","html":"[Edward]: Right. And OliSet nets are also tougher, and don't tear as easily.","cn":"[爱德华]: 没错。OliSet蚊帐也更坚韧，不容易撕裂。","analysis":""},{"time":"00:03:23,800 --> 00:03:29,800","html":"They give protection for at least <mark style=\"background-color: #bbf7d0;\">five years<\/mark>, compared with a year or two for other nets.","cn":"它们提供至少<mark style=\"background-color: #bbf7d0;\">五年的保护<\/mark>，而其他蚊帐只有一两年。","analysis":"<strong>答案解析：<\/strong> 问题25询问根据爱德华的说法，Olyset蚊帐比其他蚊帐更好的原因。爱德华明确指出OliSet蚊帐“give protection for at least five years, compared with a year or two for other nets”（提供至少五年的保护，而其他蚊帐只有一两年）。这直接对应选项A（保持更长时间的有效性）。因此，A是正确答案。"},{"time":"00:03:29,800 --> 00:03:32,800","html":"[Tutor]: Well, it sounds interesting.","cn":"[导师]: 嗯，听起来很有趣。","analysis":""},{"time":"00:03:32,800 --> 00:03:36,800","html":"But for your seminar presentation, will you provide the bigger picture as well?","cn":"但对于你的研讨会演示，你也会提供更宏观的背景吗？","analysis":""},{"time":"00:03:36,800 --> 00:03:40,800","html":"[Edward]: Yes, it'll be a case study of product development.","cn":"[爱德华]: 是的，这将是一个产品开发的案例研究。","analysis":""},{"time":"00:03:40,800 --> 00:04:11,800","html":"[Narrator]: Before you hear the rest of the discussion, you have some time to look at questions 26 to 30.","cn":"[旁白]: 在您听到讨论的其余部分之前，您将有一些时间查看问题26至30。","analysis":""},{"time":"00:04:11,800 --> 00:04:18,800","html":"Now listen and answer questions 26 to 30.","cn":"现在请听并回答问题26至30。","analysis":""},{"time":"00:04:21,800 --> 00:04:28,800","html":"[Edward]: I thought I'd introduce my presentation by describing the background to the new product, the general context.","cn":"[爱德华]: 我想通过描述新产品的背景，即一般情境来介绍我的演示。","analysis":""},{"time":"00:04:28,800 --> 00:04:33,800","html":"[Tutor]: You mean the business context? Where the investments coming from and that sort of thing?","cn":"[导师]: 你是说商业背景吗？投资来自哪里之类的？","analysis":""},{"time":"00:04:33,800 --> 00:04:39,800","html":"[Edward]: Well, I was thinking I'd talk first about insect-borne diseases, particularly malaria,","cn":"[爱德华]: 嗯，我原以为我会先谈谈虫媒疾病，特别是疟疾，","analysis":""},{"time":"00:04:39,800 --> 00:04:42,800","html":"and why there's such an urgent need for new ways of fighting it.","cn":"以及为什么迫切需要新的防治方法。","analysis":""},{"time":"00:04:42,800 --> 00:04:45,800","html":"Some people might not know much about it.","cn":"有些人可能对此了解不多。","analysis":""},{"time":"00:04:45,800 --> 00:04:47,800","html":"[Tutor]: Yes, that's a good idea.","cn":"[导师]: 是的，这是个好主意。","analysis":""},{"time":"00:04:47,800 --> 00:04:52,800","html":"[Edward]: I've got some statistics about the numbers of people worldwide who get the disease each year.","cn":"[爱德华]: 我有一些关于每年全球患病人数的统计数据。","analysis":""},{"time":"00:04:52,800 --> 00:04:55,800","html":"I thought I'd show those. They're quite staggering.","cn":"我想我会展示那些数据。它们相当惊人。","analysis":""},{"time":"00:04:55,800 --> 00:05:00,800","html":"[Tutor]: I can imagine it's one of the world's biggest health problems after all.","cn":"[导师]: 我可以想象，毕竟这是世界上最大的健康问题之一。","analysis":""},{"time":"00:05:00,800 --> 00:05:08,800","html":"It'd also be useful if you could find some statistical information on how malaria affects <mark style=\"background-color: #bbf7d0;\">countries' economic output<\/mark>","cn":"如果你能找到一些关于疟疾如何影响<mark style=\"background-color: #bbf7d0;\">各国经济产出<\/mark>的统计信息并在演示中呈现，那也会很有用。","analysis":"<strong>答案解析：<\/strong> 问题26询问疟疾对哪方面的影响。导师建议爱德华“find some statistical information on how malaria affects countries' economic output”（找到一些关于疟疾如何影响各国经济产出的统计信息）。“countries' economic output”（各国经济产出）直接对应选项G（national economies，国民经济）。因此，G是正确答案。"},{"time":"00:05:08,800 --> 00:05:10,800","html":"and present that too.","cn":"并将其呈现出来。","analysis":""},{"time":"00:05:10,800 --> 00:05:12,800","html":"[Edward]: Okay, I'm sure I can find something.","cn":"[爱德华]: 好的，我肯定能找到一些。","analysis":""},{"time":"00:05:12,800 --> 00:05:15,800","html":"After that, I'll talk about mosquito nets.","cn":"之后，我将谈论蚊帐。","analysis":""},{"time":"00:05:15,800 --> 00:05:21,800","html":"First, the historical development, just briefly, and then I'll introduce the Oleset mosquito net.","cn":"首先，简要介绍其历史发展，然后我将介绍Oleset蚊帐。","analysis":""},{"time":"00:05:21,800 --> 00:05:27,800","html":"[Tutor]: Yes, keep it simple. You could just present a bulleted list of its <mark style=\"background-color: #bbf7d0;\">characteristics<\/mark>,","cn":"[导师]: 是的，保持简单。你可以只列出它的<mark style=\"background-color: #bbf7d0;\">特点<\/mark>，","analysis":"<strong>答案解析：<\/strong> 问题27询问在历史部分之后，演讲中将涉及什么。爱德华说他会先讲历史发展，然后介绍Oleset蚊帐。导师建议“present a bulleted list of its characteristics, the things that make it different from other types of net”（列出它的特点，即它与其他类型蚊帐的不同之处）。“characteristics”和“things that make it different”直接对应选项D（unique features of the product，产品的独特特性）。因此，D是正确答案。"},{"time":"00:05:27,800 --> 00:05:31,800","html":"<mark style=\"background-color: #bbf7d0;\">the things that make it different from other types of net<\/mark> and talk that through.","cn":"<mark style=\"background-color: #bbf7d0;\">它与其他类型蚊帐的不同之处<\/mark>，并详细讲解。","analysis":"<strong>答案解析：<\/strong> 问题27询问在历史部分之后，演讲中将涉及什么。爱德华说他会先讲历史发展，然后介绍Oleset蚊帐。导师建议“present a bulleted list of its characteristics, the things that make it different from other types of net”（列出它的特点，即它与其他类型蚊帐的不同之处）。“characteristics”和“things that make it different”直接对应选项D（unique features of the product，产品的独特特性）。因此，D是正确答案。"},{"time":"00:05:31,800 --> 00:05:34,800","html":"[Edward]: Right. Then I thought I'd outline the production process.","cn":"[爱德华]: 好的。然后我想我会概述生产过程。","analysis":""},{"time":"00:05:34,800 --> 00:05:35,800","html":"[Tutor]: Fine.","cn":"[导师]: 好的。","analysis":""},{"time":"00:05:35,800 --> 00:05:39,800","html":"[Edward]: Should I give some information about where the <mark style=\"background-color: #bbf7d0;\">money for the project has come from<\/mark>?","cn":"[爱德华]: 我应该提供一些关于<mark style=\"background-color: #bbf7d0;\">项目资金来源<\/mark>的信息吗？","analysis":"<strong>答案解析：<\/strong> 问题28询问生产部分的信息。爱德华询问“Should I give some information about where the money for the project has come from?”（我应该提供一些关于项目资金来源的信息吗？）导师回答“Definitely. That's a very important aspect of any product development.”（当然。那是任何产品开发非常重要的一方面。）“where the money for the project has come from”直接对应选项B（sources of funding，资金来源）。因此，B是正确答案。"},{"time":"00:05:39,800 --> 00:05:42,800","html":"There are lots of government and private sponsors.","cn":"有很多政府和私人赞助商。","analysis":""},{"time":"00:05:42,800 --> 00:05:47,800","html":"[Tutor]: Definitely. That's a very important aspect of any product development.","cn":"[导师]: 当然。那是任何产品开发非常重要的一方面。","analysis":""},{"time":"00:05:47,800 --> 00:05:50,800","html":"Where are the nets being manufactured, by the way?","cn":"顺便问一下，这些蚊帐在哪里生产的？","analysis":""},{"time":"00:05:50,800 --> 00:05:54,800","html":"[Edward]: Over half are made in Tanzania by a company called A to Z.","cn":"[爱德华]: 超过一半是由坦桑尼亚一家名为A to Z的公司生产的。","analysis":""},{"time":"00:05:54,800 --> 00:05:58,800","html":"They got an interest-free loan to buy in the necessary machinery.","cn":"他们获得了一笔无息贷款来购买必要的机器。","analysis":""},{"time":"00:05:58,800 --> 00:06:01,800","html":"[Tutor]: Well, I'd say a bit about the company profile as well,","cn":"[导师]: 嗯，我也会提一下公司简介，","analysis":""},{"time":"00:06:01,800 --> 00:06:04,800","html":"and then present figures about <mark style=\"background-color: #bbf7d0;\">numbers of staff<\/mark>","cn":"然后提供关于<mark style=\"background-color: #bbf7d0;\">员工数量<\/mark>的数字","analysis":"<strong>答案解析：<\/strong> 问题29询问制造商简介中应描述什么。导师建议爱德华“present figures about numbers of staff and the kinds of people they're employing on the Oleset project”（提供关于员工数量以及他们在Oleset项目上雇佣的各类人员的数字）。“numbers of staff”和“kinds of people they're employing”直接对应选项A（workforce，劳动力）。因此，A是正确答案。"},{"time":"00:06:04,800 --> 00:06:07,800","html":"and the <mark style=\"background-color: #bbf7d0;\">kinds of people they're employing<\/mark> on the Oleset project","cn":"以及他们在Oleset项目上<mark style=\"background-color: #bbf7d0;\">雇佣的各类人员<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题29询问制造商简介中应描述什么。导师建议爱德华“present figures about numbers of staff and the kinds of people they're employing on the Oleset project”（提供关于员工数量以及他们在Oleset项目上雇佣的各类人员的数字）。“numbers of staff”和“kinds of people they're employing”直接对应选项A（workforce，劳动力）。因此，A是正确答案。"},{"time":"00:06:07,800 --> 00:06:09,800","html":"if you can find the details.","cn":"如果你能找到详细信息的话。","analysis":""},{"time":"00:06:09,800 --> 00:06:13,800","html":"[Edward]: Okay. I haven't included any information about marketing.","cn":"[爱德华]: 好的。我还没有包括任何关于营销的信息。","analysis":""},{"time":"00:06:13,800 --> 00:06:17,800","html":"I've got a lot of notes about it, but I'm not sure how to present them.","cn":"我有很多关于它的笔记，但我不知道如何展示它们。","analysis":""},{"time":"00:06:17,800 --> 00:06:20,800","html":"[Tutor]: I wouldn't mention that if I were you.","cn":"[导师]: 如果是我，我就不会提那个。","analysis":""},{"time":"00:06:20,800 --> 00:06:23,800","html":"You've only got a short time for your presentation,","cn":"你演示的时间很短，","analysis":""},{"time":"00:06:23,800 --> 00:06:26,800","html":"and you've got quite a lot of material here already.","cn":"而且你这里已经有很多材料了。","analysis":""},{"time":"00:06:26,800 --> 00:06:29,800","html":"But you should provide some <mark style=\"background-color: #bbf7d0;\">figures about output<\/mark>.","cn":"但你应该提供一些关于<mark style=\"background-color: #bbf7d0;\">产出<\/mark>的数字。","analysis":"<strong>答案解析：<\/strong> 问题30询问根据网站的什么信息。导师建议爱德华“provide some figures about output”（提供一些关于产出的数字），并询问“Have you found out from the company's website how many nets they actually produce?”（你从公司网站上查到他们实际生产了多少蚊帐吗？）“figures about output”和“how many nets they actually produce”直接对应选项F（production figures，生产数据）。因此，F是正确答案。"},{"time":"00:06:29,800 --> 00:06:33,800","html":"Have you found out from the company's website how many nets they actually produce?","cn":"你从公司网站上查到他们实际生产了多少蚊帐吗？","analysis":""},{"time":"00:06:33,800 --> 00:06:36,800","html":"[Edward]: Yes, it's over 30 million a year.","cn":"[爱德华]: 是的，每年超过3000万。","analysis":""},{"time":"00:06:36,800 --> 00:06:37,800","html":"[Tutor]: Right.","cn":"[导师]: 好的。","analysis":""},{"time":"00:06:37,800 --> 00:06:40,800","html":"[Edward]: Then I'm not sure how to finish off.","cn":"[爱德华]: 然后我不确定如何收尾。","analysis":""},{"time":"00:06:40,800 --> 00:06:43,800","html":"What do you think about including something on potential?","cn":"你觉得加入一些关于潜力的内容怎么样？","analysis":""},{"time":"00:06:46,800 --> 00:06:48,800","html":"[Narrator]: That is the end of part three.","cn":"[旁白]: 第三部分到此结束。","analysis":""},{"time":"00:06:48,800 --> 00:06:53,800","html":"You now have 30 seconds to check your answers to part three.","cn":"现在你有30秒时间检查第三部分的答案。","analysis":""},{"time":"00:06:59,800 --> 00:07:01,800","html":"Thank you.","cn":"谢谢。","analysis":""},{"time":"00:07:29,800 --> 00:07:31,800","html":"Thank you.","cn":"谢谢。","analysis":""}],"transcriptHighlights":[{"qid":"21","text":"an administrator.","answer":"A"},{"qid":"22","text":"Egypt.","answer":"C"},{"qid":"23","text":"made them potentially dangerous to users.","answer":"B"},{"qid":"24","text":"may have difficulty obtaining the necessary chemical.","answer":"C"},{"qid":"25","text":"remain effective for longer.","answer":"A"},{"qid":"26","text":"national economies","answer":"G"},{"qid":"27","text":"unique features of the product","answer":"D"},{"qid":"28","text":"sources of funding","answer":"B"},{"qid":"29","text":"workforce","answer":"A"},{"qid":"30","text":"production figures","answer":"F"}],"ownerInfo":"此内容由🍠@Listening 永不虾滑整理，仅作为分享供个人使用；禁止商用、倒卖和引流。有问题请先仔细看🍠这个账号的置顶和分享贴。没有团队，不是机构，纯个人分享。督学和其他相关课程请咨询主页另一个号@心情有点虾滑（不回任何机经相关消息）。"}</script>
<script>
const DATA=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const RENDER_VERSION=5;
let secs=0,review=false,timer=setInterval(()=>{secs++;drawTimer();if(secs%5===0)save(false)},1000),drag=null,currentCue=-1,loopCue=false,slowCue=false,showCn=true,showAnalysis=true,dictationMode=false,showOriginal=true,dictationAnswers={};const storeKey='ielts_v4_'+DATA.title.replace(/\W+/g,'_');
const CONFIG_DATA={answerKey:DATA.answerKey,questionList:DATA.questionIds.map(q=>Number(q)||q),localStorageKey:storeKey};window.localStorageKey=storeKey;window.DATA=DATA;window.CONFIG_DATA=CONFIG_DATA;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function matchingRepeatAttr(g){return (g.questions||[]).length>(g.options||[]).length?' data-repeat="true"':''}
function flowQuestionMap(g){let map={};(g.questions||[]).forEach(q=>map[q[0]]=q[1]);return map}
function renderFlowText(raw,qid){let html=esc(String(raw||'')).replace(new RegExp(`(?<!\\d)${qid}(?!\\d)`),`<span class="flow-num">${qid}</span>`);html=html.replace(/(?:_{2,}|…{2,}|\.{4,})/,`<span class="slot" data-q="${qid}"></span>`);if(!/<span class="slot"/.test(html))html+=` <span class="slot" data-q="${qid}"></span>`;return html}
function renderFlowSteps(g){let qmap=flowQuestionMap(g),used=new Set(),lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:[]);if(lines.length){return lines.map(line=>{let raw=String((typeof line==='object'&&line?line.text:line)||''),qid=Object.keys(qmap).find(id=>new RegExp(`(?<!\\d)${id}(?!\\d)`).test(raw));if(qid){used.add(qid);return `<div class="flow-step flow-step-full"><div class="flow-text">${renderFlowText(raw,qid)}</div></div>`}return `<div class="flow-note">${esc(raw)}</div>`}).join('')+(g.questions||[]).filter(q=>!used.has(q[0])).map(q=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>`).join('')}return g.questions.map((q,idx)=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>${idx<g.questions.length-1?'<div class="flow-arrow">↓</div>':''}`).join('')}
function groupHTML(g){if(g.type==='matching'&&g.layout==='flow')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="flow-layout"><div class="flow-steps">${renderFlowSteps(g)}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='matching')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='map')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'map.png')}" alt="Map"></div><div class="map-grid"><div class="map-answer-list">${g.questions.map(q=>`<div class="map-row"><div class="map-row-label"><strong>${q[0]}</strong> ${esc(q[1]||'')}</div><div class="map-options">${(g.options||['A','B','C','D','E','F','G','H','I']).map(o=>`<div class="choice map-choice" data-name="q${q[0]}" data-value="${o}">${o}</div>`).join('')}</div></div>`).join('')}</div></div></div></section>`;
if(g.type==='single')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div>${g.questions.map(q=>`<p><strong>${q.id}</strong> ${esc(q.text)}</p>${q.options.map(o=>`<div class="choice single-choice" data-name="q${q.id}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}`).join('')}</section>`;
if(g.type==='multiple')return `<section class="group" data-limit="${g.limit}" data-id="${g.id}"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><p><strong>${esc(g.id)}</strong> ${esc(g.questionText)}</p>${g.options.map(o=>`<div class="choice multi-choice" data-name="q${g.id.replace('-','_')}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</section>`;
return `<section class="group"><h3>${esc(g.title)}</h3>${renderFillGroup(g)}</section>`}
function renderFillGroup(g){let qids=(g.questions||[]).map(q=>String(q.id));let used=new Set();let lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:g.questions.map(q=>`${q.id} ${q.text} _____`));let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFillTable(chunk,qids,used);continue}html+=renderFillLine(lines[i++],qids,used)}return html||`<div class="instruction">${esc(g.instruction||'Complete the notes below.')}</div>`}
function renderFillTable(lines,qids,used){let rows=[];lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0;if(!rows[row])rows[row]=[];rows[row][col]=renderFillLine(line,qids,used,true)});return `<div class="fill-table-wrap"><table class="fill-table">${rows.map((cells,idx)=>`<tr>${(cells||[]).map(cell=>idx===0?`<th>${cell}</th>`:`<td>${cell}</td>`).join('')}</tr>`).join('')}</table></div>`}
function fillInput(qid,lead=''){return `<span class="blank-q">${esc(qid)}</span>${esc(lead)}<input class="blank" name="q${esc(qid)}" type="text" autocomplete="off" inputmode="text">`}
function fillLineAttrs(meta,isHeading){let cls=['doc-line'];if(isHeading)cls.push('fill-heading');if(meta.list)cls.push('is-list');let rawLevel=Math.max(0,Math.min(6,Number(meta.level)||0)),level=rawLevel>0?rawLevel+1:rawLevel;let style=meta.list?` style="--indent:${level*30}px"`:'';return `class="${cls.join(' ')}"${style}`}
function fillLineContent(meta,body){let level=Math.max(0,Number(meta.level)||0),bullet=level>0?'◦':'•';return meta.list?`<span class="doc-bullet">${bullet}</span><span class="doc-line-content">${body}</span>`:body}
function isFillHeading(raw,meta,hit){return !hit&&!meta.list&&!/(?:_{2,}|…{2,}|\.{4,})/.test(raw)&&!/^\d+\.?\s+/.test(raw)&&!/^(?:Complete|Write|Choose)\b/i.test(raw)}
function renderFillLine(line,qids,used,inner=false){let meta=typeof line==='object'&&line?line:{},raw=String(meta.text??line),html=esc(raw),hit=false;html=html.replace(/(^|[^\d])(\d{1,2})\.?\s*((?:£\s*)?)(?:_{2,}|…{2,}|\.{4,})/g,(m,prefix,qid,lead)=>{if(!qids.includes(qid))return m;used.add(qid);hit=true;return prefix+fillInput(qid,lead)});let m=raw.match(/^(\d+)\.?\s+(.+)$/);if(!hit&&m&&qids.includes(m[1])){used.add(m[1]);let body=esc(m[2]);let input=fillInput(m[1]);body=/(?:_+|…{2,}|\.{4,})/.test(body)?body.replace(/(?:_+|…{2,}|\.{4,})/,input):`${body} ${input}`;return inner?fillLineContent(meta,body):`<p ${fillLineAttrs(meta,false)}>${fillLineContent(meta,body)}</p>`}return inner?html:`<p ${fillLineAttrs(meta,isFillHeading(raw,meta,hit))}>${fillLineContent(meta,html)}</p>`}
function hardResetAnswers(){$$('input').forEach(i=>{i.value='';i.defaultValue=''});$$('.choice').forEach(c=>c.classList.remove('selected'));$$('.slot').forEach(s=>s.innerHTML='');refreshPool();updateNav()}
function render(){document.title=DATA.title;$('#ownerMeta').textContent=DATA.ownerInfo||'';$('#audio').src=DATA.audio||'audio.mp3';$('#content').innerHTML=DATA.groups.map(groupHTML).join('');$('#nav').innerHTML=DATA.questionIds.map(q=>`<div data-q="${q}">${q}</div>`).join('');bindDynamic();hardResetAnswers();load();updateNav()}
function bindDynamic(){
  $$('#content input').forEach(i=>{i.oninput=()=>{updateNav();save(false)};i.onchange=()=>{updateNav();save(false)}});
  $$('.single-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;$$(`.single-choice[data-name="${btn.dataset.name}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateNav();save(false)});
  $$('.map-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;$$(`.map-choice[data-name="${btn.dataset.name}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateNav();save(false)});
  $$('.multi-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;let group=btn.closest('.group'),limit=Number(group?.dataset.limit||99),name=btn.dataset.name,selected=$$(`.multi-choice[data-name="${name}"].selected`);if(!btn.classList.contains('selected')&&selected.length>=limit)return;btn.classList.toggle('selected');updateNav();save(false)});
  $$('#nav [data-q]').forEach(n=>n.onclick=()=>scrollToQuestion(n.dataset.q));
}
function bindGlobal(){
  document.addEventListener('dragstart',e=>{let d=e.target.closest('.drag,.tag');if(!d||review)return;drag={value:d.dataset.value,text:d.textContent,from:d.closest('.slot')};});

  document.addEventListener('mouseup',handleSelection);
  $('#selbar').onclick=handleToolbar;
}

function questionInText(q,text){let n=Number(String(q).replace(/\D/g,""));if(!n||!text)return false;let raw=String(text).replace(/&nbsp;/g," ");let direct=new RegExp("(?:问题|Question|Q)\\s*0?"+n+"(?!\\d)|第\\s*0?"+n+"\\s*题|(?<!\\d)0?"+n+"\\s*题","i").test(raw)||new RegExp("(?:data-question=[\"']?|class=[\"'][^\"']*q)0?"+n+"(?!\\d)","i").test(raw);if(direct)return true;let re=/(?:问题|Question|Q|第)?\s*(\d+)\s*(?:-|–|—|至|到|and)\s*(\d+)\s*题?/gi,m;while((m=re.exec(raw))){let a=Number(m[1]),b=Number(m[2]);if(n>=Math.min(a,b)&&n<=Math.max(a,b))return true}return false}

function bestCueNearAnalyses(q,predicate){let lines=studyLines(),analysisIdxs=[];lines.forEach((x,i)=>{if(questionInText(q,String(x.analysis||'')))analysisIdxs.push(i)});let best={idx:-1,score:-1e9};for(let a of analysisIdxs){let prev=a-1;while(prev>=0&&!lines[prev].analysis)prev--;let next=a+1;while(next<lines.length&&!lines[next].analysis)next++;let from=Math.max(0,prev+1),to=Math.min(lines.length-1,next-1);for(let i=from;i<=to;i++){if(predicate(lines[i])){let score=evidenceScore(q,i,a);if(score>best.score)best={idx:i,score}}}}return best.idx}

function highlightTerms(){let terms=[];for(let item of DATA.transcriptHighlights||[]){let text=typeof item==='string'?item:item.text;if(text){terms.push(String(text));String(text).split(/\s+/).map(w=>w.replace(/[^A-Za-z0-9'-]/g,'')).filter(w=>w.length>=5&&!/^(which|three|answer|letter|about|their|there|would|could|should)$/i.test(w)).forEach(w=>terms.push(w))}}return [...new Set(terms.map(t=>t.trim()).filter(t=>t.length>1))].sort((a,b)=>b.length-a.length)}

function save(show=false){let data={secs,answers:collectAnswers(),contentHtml:contentSnapshot(),layoutSignature:layoutSignature(),notes:notesSnapshot(),dark:document.body.classList.contains('dark'),font:document.documentElement.style.fontSize,dictationAnswers,studyState:{currentCue,loopCue,slowCue,showCn,showAnalysis,dictationMode,showOriginal},audioTime:audio?.currentTime||0};localStorage.setItem(storeKey,JSON.stringify(data));if(show)showToast()}
function load(){let raw=localStorage.getItem(storeKey);if(!raw)return;let d;try{d=JSON.parse(raw)}catch(err){console.warn('Saved progress could not be read.',err);return}secs=d.secs||0;if(d.contentHtml&&d.layoutSignature===layoutSignature()){try{$('#content').innerHTML=d.contentHtml;bindDynamic()}catch(err){console.warn('Saved question view could not be restored.',err)}}if(d.answers){try{restoreAnswers(d.answers)}catch(err){console.warn('Saved answers could not be restored.',err)}}if(d.dictationAnswers)dictationAnswers=d.dictationAnswers;if(d.studyState)try{({currentCue=currentCue,loopCue=loopCue,slowCue=slowCue,showCn=showCn,showAnalysis=showAnalysis,dictationMode=dictationMode,showOriginal=showOriginal}=d.studyState)}catch(err){console.warn('Study state could not be restored.',err)}if(d.notes){try{$('#notesList').innerHTML=d.notes;$$('#notesList textarea').forEach(t=>{t.value=t.dataset.value||t.textContent||''})}catch(err){console.warn('Saved notes could not be restored.',err)}}if(d.dark)document.body.classList.add('dark');setFontSize(d.font||DEFAULT_FONT_SIZE,false);if(d.audioTime)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=d.audioTime},{once:true});bindNoteDeletes();drawTimer()}
function handleSelection(e){if(e.target.closest('#selbar,#notes,.bottom-bar'))return;let sel=window.getSelection();let hl=e.target.closest?.('.hl-brown,.hl-rose,.hl-blue');let bar=$('#selbar');if(hl&&sel.isCollapsed){bar.targetElem=hl;placeBar(bar,hl.getBoundingClientRect())}else if(sel&&!sel.isCollapsed&&$('#content').contains(sel.anchorNode)){bar.targetElem=null;placeBar(bar,sel.getRangeAt(0).getBoundingClientRect())}else{bar.hidden=true}}
function placeBar(bar,rect){bar.hidden=false;bar.style.left=Math.max(8,window.scrollX+rect.left+rect.width/2-95)+'px';bar.style.top=Math.max(8,window.scrollY+rect.top-46)+'px'}
function highlightedFromSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let node=sel.anchorNode?.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode;return node?.closest?.('.hl-brown,.hl-rose,.hl-blue')||null}
function handleToolbar(e){let act=e.target.closest('button')?.dataset.act;if(!act)return;let bar=$('#selbar'),target=bar.targetElem||highlightedFromSelection(),sel=window.getSelection();if(act==='del'&&target){unwrap(target);removeNote(target.dataset.hid)}else if(act==='hl'){if(target){if(target.classList.contains('hl-brown'))target.className='hl-rose';else if(target.classList.contains('hl-rose'))target.className='hl-rose';else target.className='hl-brown'}else{let span=wrapSelection('hl-brown');if(span)span.dataset.hid='h_'+Date.now()}}else if(act==='note'){let span=target||wrapSelection('hl-blue');if(span){span.className='hl-blue';if(!span.dataset.hid)span.dataset.hid='n_'+Date.now();createNote(span);document.body.classList.add('notes-open')}}bar.hidden=true;sel.removeAllRanges();save(false)}
function wrapSelection(cls){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let range=sel.getRangeAt(0);if(!$('#content').contains(range.commonAncestorContainer))return null;let span=document.createElement('span');span.className=cls;try{range.surroundContents(span)}catch{return null}return span}
function unwrap(el){let p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize()}
function clearUserHighlights(){$$('.hl-brown,.hl-rose,.hl-blue').forEach(unwrap)}
function createNote(span){let id=span.dataset.hid;if($(`.note-card[data-hid="${id}"]`))return;let card=document.createElement('div');card.className='note-card';card.dataset.hid=id;card.innerHTML=`<div class="note-quote">${esc(span.textContent.slice(0,120))}</div><textarea placeholder="Write note here..."></textarea><button class="delete-note" type="button">Delete</button>`;$('#notesList').prepend(card);bindNoteDeletes()}
function bindNoteDeletes(){$$('#notesList textarea').forEach(t=>t.oninput=()=>save(false));$$('.delete-note').forEach(btn=>btn.onclick=()=>{let card=btn.closest('.note-card'),id=card.dataset.hid,span=$(`[data-hid="${id}"]`);if(span)unwrap(span);card.remove();save(false)})}
function removeNote(id){if(!id)return;$(`.note-card[data-hid="${id}"]`)?.remove()}
function drawTimer(){let m=Math.floor(secs/60),s=secs%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
const DEFAULT_FONT_SIZE=16,MIN_FONT_SIZE=14,MAX_FONT_SIZE=22;
function currentFontSize(){return Number.parseInt(document.documentElement.style.fontSize,10)||DEFAULT_FONT_SIZE}
function setFontSize(size,persist=true){let n=Math.max(MIN_FONT_SIZE,Math.min(MAX_FONT_SIZE,Number(size)||DEFAULT_FONT_SIZE));document.documentElement.style.fontSize=n===DEFAULT_FONT_SIZE?'':n+'px';updateSizeButtons();if(persist)save(false)}
function adjustFontSize(delta){setFontSize(currentFontSize()+delta,true)}
function updateSizeButtons(){let size=currentFontSize(),dark=document.body.classList.contains('dark');$('#fontMinus')?.toggleAttribute('disabled',size<=MIN_FONT_SIZE);$('#fontPlus')?.toggleAttribute('disabled',size>=MAX_FONT_SIZE);$('#fontDefault')?.classList.toggle('active',size===DEFAULT_FONT_SIZE);$('#lightBtn')?.classList.toggle('active',!dark);$('#darkBtn')?.classList.toggle('active',dark)}
function resetAppearance(persist=true){document.body.classList.remove('dark');setFontSize(DEFAULT_FONT_SIZE,false);updateSizeButtons();if(persist)save(false)}
function clearAllProgress(){localStorage.removeItem(storeKey)}
$('#finish').onclick=finish;$('#save').onclick=()=>save(true);$('#clear').onclick=()=>{if(confirm('Clear all progress?')){window.resetTest();showToast('Clear complete')}};$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-open');save(false)};$('#closeNotes').onclick=()=>{document.body.classList.remove('notes-open');save(false)};$('#toggleIntensive').onclick=()=>{toggleIntensive();save(false)};$('#settingsBtn').onclick=()=>{$('#settings').classList.toggle('open');updateSizeButtons()};$('#lightBtn').onclick=()=>{document.body.classList.remove('dark');updateSizeButtons();save(false)};$('#darkBtn').onclick=()=>{document.body.classList.add('dark');updateSizeButtons();save(false)};$('#appearanceReset').onclick=()=>resetAppearance(true);$('#fontMinus').onclick=()=>adjustFontSize(-1);$('#fontPlus').onclick=()=>adjustFontSize(1);$('#fontDefault').onclick=()=>setFontSize(DEFAULT_FONT_SIZE,true);$('#settings').addEventListener('wheel',e=>{e.preventDefault();adjustFontSize(e.deltaY>0?-1:1)},{passive:false});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey)return;let key=e.key;if(key==='+'||key==='='){e.preventDefault();adjustFontSize(1)}else if(key==='-'||key==='_'){e.preventDefault();adjustFontSize(-1)}else if(key==='0'){e.preventDefault();resetAppearance(true)}});
const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
</script>
