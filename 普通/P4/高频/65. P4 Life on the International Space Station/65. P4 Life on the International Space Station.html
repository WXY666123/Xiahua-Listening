],"bodyLines":[{"text":"Complete the notes below.","list":false,"level":0},{"text":"Write ONE WORD ONLY for each answer.","list":false,"level":0},{"text":"Life on the International Space Station","list":false,"level":0},{"text":"Background","list":false,"level":0},{"text":"Station was occupied by international teams of scientists over several months.","list":true,"level":0},{"text":"Research was done on living conditions.","list":true,"level":0},{"text":"Early impressions","list":false,"level":0},{"text":"The air smelt 31. ______","list":true,"level":0},{"text":"The temperature was easy to adjust.","list":true,"level":0},{"text":"The food had enough 32. ______","list":true,"level":0},{"text":"33. ______ was efficient.","list":true,"level":0},{"text":"Problems","list":false,"level":0},{"text":"Difficulties with air filters caused lack of 34. ______","list":true,"level":0},{"text":"It was difficult to keep cabin objects secure.","list":true,"level":0},{"text":"Systems were incompatible","list":true,"level":0},{"text":"e.g. there were problems when mixing 35. ______ because of the preservatives","list":true,"level":1},{"text":"The 36. ______ available were not always suitable for their purpose","list":true,"level":0},{"text":"It was difficult to access the 37. ______ for equipment maintenance","list":true,"level":0},{"text":"Suggested improvements","list":false,"level":0},{"text":"Systems and equipment should undergo more extensive 38. ______","list":true,"level":0},{"text":"In language training, astronauts needed practice in understanding the controller’s 39. ______","list":true,"level":0},{"text":"There should be less emphasis on 40. ______ and more on other issues","list":true,"level":0}]}],"answerKey":{"text":{"q31":"fresh","q32":"variety","q33":"communication","q34":"sleep","q35":"water","q36":"tools","q37":"instructions","q38":"testing","q39":"accent","q40":"safety"},"single":{},"multiple":{},"multipleMap":{},"matching":{},"map":{}},"transcriptLines":[{"time":"00:00:00,000 --> 00:00:13,000","html":"You will hear an engineering student giving a presentation about a research project on","cn":"你将听到一位工科学生正在就一项研究项目进行演讲，该项目内容是","analysis":""},{"time":"00:00:13,000 --> 00:00:17,000","html":"design features of the International Space Station.","cn":"国际空间站的设计特点。","analysis":""},{"time":"00:00:17,000 --> 00:00:21,500","html":"First, you have some time to look at questions 31 to 40.","cn":"首先，你有一些时间来查看问题31到40。","analysis":""},{"time":"00:00:30,000 --> 00:00:32,500","html":"You","cn":"你","analysis":""},{"time":"00:01:00,000 --> 00:01:20,000","html":"Now listen carefully and answer questions 31 to 40.","cn":"现在请仔细听并回答问题31到40。","analysis":""},{"time":"00:01:20,000 --> 00:01:25,000","html":"For my presentation, I'm going to summarize the findings of a research project on","cn":"在我的演讲中，我将总结一项关于","analysis":""},{"time":"00:01:25,000 --> 00:01:30,000","html":"the International Space Station in the early days of its operation.","cn":"国际空间站在运行初期的研究项目的发现。","analysis":""},{"time":"00:01:30,000 --> 00:01:32,000","html":"It's teething problems as it were.","cn":"可以说，这是它早期遇到的问题。","analysis":""},{"time":"00:01:32,000 --> 00:01:36,000","html":"I'll start by giving a little background information.","cn":"我将首先介绍一些背景信息。","analysis":""},{"time":"00:01:36,000 --> 00:01:41,000","html":"The Space Station crew were essentially a constantly changing team of scientists","cn":"空间站的宇航员本质上是一个不断变化的科学家团队，","analysis":""},{"time":"00:01:41,000 --> 00:01:46,000","html":"from different countries who lived on the Space Station for several months at a time.","cn":"他们来自不同的国家，每次在空间站上居住几个月。","analysis":""},{"time":"00:01:46,000 --> 00:01:52,000","html":"And they conducted a number of experiments including some studies of living conditions in space","cn":"他们进行了许多实验，包括一些对太空生活条件的研究，","analysis":""},{"time":"00:01:52,000 --> 00:01:55,000","html":"which is what I'm going to be looking at now.","cn":"这也是我接下来要关注的。","analysis":""},{"time":"00:01:55,000 --> 00:02:01,000","html":"So, what was life like on board in the very confined conditions of the Space Station?","cn":"那么，在空间站非常有限的条件下，船上的生活是怎样的呢？","analysis":""},{"time":"00:02:01,000 --> 00:02:08,000","html":"Well, the early impressions recorded by the astronauts were very different from what people had expected.","cn":"嗯，宇航员记录的早期印象与人们预期的非常不同。","analysis":""},{"time":"00:02:08,000 --> 00:02:12,000","html":"They'd expected that the air would smell <mark style=\"background-color: #fecaca;\">stale or artificial<\/mark>.","cn":"他们曾预期空气会闻起来<mark style=\"background-color: #fecaca;\">不新鲜或人工合成<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题31询问空气闻起来怎么样。原文提到人们预期空气会不新鲜或人工合成，但实际情况与预期不同，因此“stale or artificial”是干扰项。"},{"time":"00:02:12,000 --> 00:02:18,000","html":"But the astronauts found that it was <mark style=\"background-color: #bbf7d0;\">fresh<\/mark>, so that was one very positive finding.","cn":"但宇航员发现它是<mark style=\"background-color: #bbf7d0;\">新鲜的<\/mark>，这是一个非常积极的发现。","analysis":"<strong>答案解析：<\/strong> 问题31的正确答案是“fresh”。原文明确指出宇航员发现空气是“fresh”，这与人们的预期（stale or artificial）相反，是一个积极的发现。"},{"time":"00:02:18,000 --> 00:02:24,000","html":"And although they were in such a confined space and people worried that it would get very hot,","cn":"尽管他们身处如此狭小的空间，人们担心会非常热，","analysis":""},{"time":"00:02:24,000 --> 00:02:32,000","html":"in fact, they found that it was very easy to turn the temperature up or down in order to keep it within a comfortable range.","cn":"事实上，他们发现调节温度非常容易，可以保持在舒适的范围内。","analysis":""},{"time":"00:02:32,000 --> 00:02:35,000","html":"The feedback on the food was also positive.","cn":"对食物的反馈也很好。","analysis":""},{"time":"00:02:35,000 --> 00:02:40,000","html":"Astronauts on previous Space stations had described the meals as <mark style=\"background-color: #fecaca;\">boring<\/mark>.","cn":"以前空间站的宇航员曾形容饭菜很<mark style=\"background-color: #fecaca;\">无聊<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题32询问国际空间站的食物有什么特点。原文提到“以前空间站的宇航员曾形容饭菜很无聊”，但这是指过去的太空站，而不是国际空间站，因此“boring”是干扰项。"},{"time":"00:02:40,000 --> 00:02:45,000","html":"But the International Space Station meals were praised for their <mark style=\"background-color: #bbf7d0;\">variety<\/mark>.","cn":"但国际空间站的饭菜因其<mark style=\"background-color: #bbf7d0;\">多样性<\/mark>而受到称赞。","analysis":"<strong>答案解析：<\/strong> 问题32的正确答案是“variety”。原文明确指出“国际空间站的饭菜因其多样性而受到称赞”。"},{"time":"00:02:45,000 --> 00:02:49,000","html":"So, that was another good piece of feedback.","cn":"所以，这是另一个很好的反馈。","analysis":""},{"time":"00:02:49,000 --> 00:02:54,000","html":"And something, which is taken for granted today, but was a key morale booster in those days,","cn":"今天被认为是理所当然的事情，但在那时却是士气的重要推动力，","analysis":""},{"time":"00:02:54,000 --> 00:02:58,000","html":"was <mark style=\"background-color: #bbf7d0;\">communication<\/mark> between the Space Station and Earth,","cn":"那就是空间站与地球之间的<mark style=\"background-color: #bbf7d0;\">通讯<\/mark>，","analysis":"<strong>答案解析：<\/strong> 问题33询问什么很高效。原文提到空间站与地球之间的“communication”是“clear and reliable”，意即高效，因此“communication”是正确答案。"},{"time":"00:02:58,000 --> 00:03:01,000","html":"which the astronaut said was <mark style=\"background-color: #fecaca;\">clear and reliable<\/mark>.","cn":"宇航员说这<mark style=\"background-color: #fecaca;\">清晰可靠<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题33的答案应为名词，描述“什么”很高效。原文指出通讯“清晰可靠”，所以“clear and reliable”是通讯的描述词，而不是通讯本身，因此是干扰项。"},{"time":"00:03:01,000 --> 00:03:08,000","html":"So, in the early days, it seems that the mood was overall very positive.","cn":"所以，在早期，气氛总体上似乎非常积极。","analysis":""},{"time":"00:03:08,000 --> 00:03:17,000","html":"However, after a few days, the difficulties and frustrations became clearer.","cn":"然而，几天后，困难和挫折变得更加明显。","analysis":""},{"time":"00:03:17,000 --> 00:03:22,000","html":"Above all, the crew complained about the constant <mark style=\"background-color: #fecaca;\">noise<\/mark> caused by the air filters,","cn":"最重要的是，宇航员抱怨空气过滤器发出的持续<mark style=\"background-color: #fecaca;\">噪音<\/mark>，","analysis":"<strong>答案解析：<\/strong> 问题34询问空气过滤器的问题导致了什么缺乏。原文提到空气过滤器发出噪音，但噪音是“原因”，而不是“结果”或“缺乏”的东西，因此“noise”是干扰项。"},{"time":"00:03:22,000 --> 00:03:28,000","html":"which used to rattle and buzz 24 hours a day, interrupting their <mark style=\"background-color: #bbf7d0;\">sleep<\/mark>.","cn":"它们24小时不停地嘎嘎作响、嗡嗡作响，打断了他们的<mark style=\"background-color: #bbf7d0;\">睡眠<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题34的正确答案是“sleep”。原文明确指出噪音“interrupting their sleep”，即导致了睡眠的缺乏。"},{"time":"00:03:28,000 --> 00:03:32,000","html":"As well as that, the astronauts complained that the Velcro fasteners,","cn":"除此之外，宇航员们还抱怨魔术贴固定器，","analysis":""},{"time":"00:03:32,000 --> 00:03:36,000","html":"which were positioned all over the station, didn't work well.","cn":"这些遍布整个空间站的固定器效果不佳。","analysis":""},{"time":"00:03:36,000 --> 00:03:42,000","html":"And so, a lot of the time, objects weren't secure in the cabin, but floated about.","cn":"因此，很多时候，舱内的物品都固定不住，而是四处漂浮。","analysis":""},{"time":"00:03:42,000 --> 00:03:47,000","html":"A particularly serious problem was that the systems used on the Space Station","cn":"一个特别严重的问题是，空间站上使用的系统","analysis":""},{"time":"00:03:47,000 --> 00:03:50,000","html":"had been developed in a number of different countries,","cn":"是由不同国家开发的，","analysis":""},{"time":"00:03:50,000 --> 00:03:53,000","html":"and they didn't always work well together.","cn":"它们并不总是能很好地协同工作。","analysis":""},{"time":"00:03:53,000 --> 00:03:58,000","html":"For example, it was impossible to mix the <mark style=\"background-color: #bbf7d0;\">water<\/mark> produced from different systems,","cn":"例如，不同系统产生的<mark style=\"background-color: #bbf7d0;\">水<\/mark>无法混合，","analysis":"<strong>答案解析：<\/strong> 问题35询问在混合什么时出现了问题。原文明确指出“it was impossible to mix the water produced from different systems”，因此“water”是正确答案。"},{"time":"00:03:58,000 --> 00:04:01,000","html":"because it contained different sorts of <mark style=\"background-color: #fecaca;\">preservatives<\/mark>,","cn":"因为它含有不同种类的<mark style=\"background-color: #fecaca;\">防腐剂<\/mark>，","analysis":"<strong>答案解析：<\/strong> 问题35询问在混合什么时出现了问题。原文提到“preservatives”是水无法混合的“原因”，而不是被混合的物体，因此“preservatives”是干扰项。"},{"time":"00:04:01,000 --> 00:04:04,000","html":"and these reacted together and blocked the pipes.","cn":"这些防腐剂会相互反应并堵塞管道。","analysis":""},{"time":"00:04:04,000 --> 00:04:08,000","html":"Another problem was connected to repairs.","cn":"另一个问题与维修有关。","analysis":""},{"time":"00:04:08,000 --> 00:04:13,000","html":"At the best of times, these took up an inordinate amount of time on the station,","cn":"在最好的情况下，这些维修也占用了空间站上过多的时间，","analysis":""},{"time":"00:04:13,000 --> 00:04:18,000","html":"and the crew complained that many of the <mark style=\"background-color: #bbf7d0;\">tools<\/mark> that they'd been provided with","cn":"宇航员抱怨他们得到的许多<mark style=\"background-color: #bbf7d0;\">工具<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题36询问什么不总是适合其目的。原文明确指出“many of the tools that they'd been provided with weren't suitable for the jobs they had to do”，因此“tools”是正确答案。"},{"time":"00:04:18,000 --> 00:04:21,000","html":"weren't suitable for the <mark style=\"background-color: #fecaca;\">jobs<\/mark> they had to do.","cn":"不适合他们必须完成的<mark style=\"background-color: #fecaca;\">工作<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题36询问什么不总是适合其目的。原文提到工具不适合“jobs”，但“jobs”是工具的目的，而不是工具本身，因此“jobs”是干扰项。"},{"time":"00:04:21,000 --> 00:04:28,000","html":"So, they had to improvise, which meant that jobs took a lot longer than they needed to.","cn":"所以，他们不得不即兴发挥，这意味着工作花费的时间比所需的长得多。","analysis":""},{"time":"00:04:28,000 --> 00:04:34,000","html":"Another related problem was to do with access to equipment that needed maintaining.","cn":"另一个相关问题是难以接触到需要维护的设备。","analysis":""},{"time":"00:04:34,000 --> 00:04:38,000","html":"Because the <mark style=\"background-color: #bbf7d0;\">instructions<\/mark> on the equipment were often located in places,","cn":"因为设备上的<mark style=\"background-color: #bbf7d0;\">说明书<\/mark>经常放在一些地方，","analysis":"<strong>答案解析：<\/strong> 问题37询问难以接触到什么以便设备维护。原文提到“the instructions on the equipment were often located in places, where they were difficult to read”，说明是说明书难以接触，因此“instructions”是正确答案。"},{"time":"00:04:38,000 --> 00:04:42,000","html":"where they were difficult to read, like on the <mark style=\"background-color: #fecaca;\">back of equipment<\/mark>,","cn":"在那里很难阅读，比如在<mark style=\"background-color: #fecaca;\">设备的背面<\/mark>，","analysis":"<strong>答案解析：<\/strong> 问题37询问难以接触到什么以便设备维护。原文提到“back of equipment”是说明书所在的位置，而不是说明书本身，因此“back of equipment”是干扰项。"},{"time":"00:04:42,000 --> 00:04:46,000","html":"it was often difficult or impossible to read them.","cn":"通常很难或不可能阅读它们。","analysis":""},{"time":"00:04:46,000 --> 00:04:52,000","html":"So, having identified these problems, the researchers came up with a number of suggestions","cn":"因此，在确定了这些问题后，研究人员提出了一些建议，","analysis":""},{"time":"00:04:52,000 --> 00:04:56,000","html":"about how conditions could be improved on subsequent missions.","cn":"关于如何在后续任务中改善条件。","analysis":""},{"time":"00:04:56,000 --> 00:05:02,000","html":"First, it became clear that although there had been a great deal of <mark style=\"background-color: #fecaca;\">consultation<\/mark> with the crews,","cn":"首先，很明显，尽管与宇航员进行了大量的<mark style=\"background-color: #fecaca;\">咨询<\/mark>，","analysis":"<strong>答案解析：<\/strong> 问题38询问系统和设备应该接受更广泛的什么。原文提到“consultation”已经进行过，但发现不足，因此“consultation”是干扰项，因为它不是建议进行的更广泛的活动。"},{"time":"00:05:02,000 --> 00:05:08,000","html":"the systems and equipment on the space station needed much more wide-ranging <mark style=\"background-color: #bbf7d0;\">testing<\/mark>.","cn":"空间站的系统和设备需要进行更广泛的<mark style=\"background-color: #bbf7d0;\">测试<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题38的正确答案是“testing”。原文明确指出“the systems and equipment on the space station needed much more wide-ranging testing”，即需要进行更广泛的测试。"},{"time":"00:05:08,000 --> 00:05:13,000","html":"Then, the whole issue of language training came under review.","cn":"然后，语言训练的整个问题也受到了审查。","analysis":""},{"time":"00:05:13,000 --> 00:05:20,000","html":"Astronauts from different countries had to be able to talk to the controllers on Earth and to understand them.","cn":"来自不同国家的宇航员必须能够与地球上的控制员对话并理解他们。","analysis":""},{"time":"00:05:20,000 --> 00:05:26,000","html":"Now, although they'd had extensive language training, the astronauts sometimes had problems","cn":"尽管他们接受了广泛的语言训练，但宇航员有时仍有问题","analysis":""},{"time":"00:05:26,000 --> 00:05:32,000","html":"comprehending what was said because they weren't familiar with the <mark style=\"background-color: #bbf7d0;\">accent<\/mark> of the <mark style=\"background-color: #fecaca;\">speaker<\/mark>.","cn":"理解所说内容，因为他们不熟悉<mark style=\"background-color: #fecaca;\">说话者<\/mark>的<mark style=\"background-color: #bbf7d0;\">口音<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题39询问宇航员需要练习理解控制员的什么。原文明确指出宇航员有问题是因为“they weren't familiar with the accent of the speaker”，因此“accent”是正确答案。而“speaker”是发出口音的人，不是宇航员需要理解的特定技能点，因此是干扰项。"},{"time":"00:05:32,000 --> 00:05:37,000","html":"And this sometimes led to quite dangerous misunderstandings.","cn":"这有时会导致相当危险的误解。","analysis":""},{"time":"00:05:37,000 --> 00:05:41,000","html":"Finally, and this is the point I found most surprising,","cn":"最后，这也是我发现最令人惊讶的一点，","analysis":""},{"time":"00:05:41,000 --> 00:05:47,000","html":"the researchers felt that the designers of the space station were paying too much attention to <mark style=\"background-color: #bbf7d0;\">safety<\/mark>,","cn":"研究人员认为空间站的设计者过于关注<mark style=\"background-color: #bbf7d0;\">安全<\/mark>，","analysis":"<strong>答案解析：<\/strong> 问题40询问应该减少对什么的强调。原文指出设计者“paying too much attention to safety”，因此“safety”是正确答案。"},{"time":"00:05:47,000 --> 00:05:50,000","html":"rather than considering <mark style=\"background-color: #fecaca;\">operating issues<\/mark>.","cn":"而不是考虑<mark style=\"background-color: #fecaca;\">操作问题<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题40询问应该减少对什么的强调，而不是应该增加对什么的强调。原文提到“operating issues”是他们应该更多考虑的，因此它是干扰项。"},{"time":"00:05:50,000 --> 00:05:54,000","html":"That is, how the station could be run comfortably and smoothly.","cn":"也就是说，空间站如何才能舒适顺利地运行。","analysis":""},{"time":"00:05:54,000 --> 00:05:59,000","html":"And the recommendation was to make changes here at quite a fundamental level.","cn":"建议在此进行相当根本性的改变。","analysis":""},{"time":"00:05:59,000 --> 00:06:03,000","html":"So, those were the main points I covered in the...","cn":"所以，这些就是我涵盖的主要内容……","analysis":""},{"time":"00:06:05,000 --> 00:06:07,000","html":"That is the end of part four.","cn":"第四部分到此结束。","analysis":""},{"time":"00:06:07,000 --> 00:06:11,000","html":"You now have one minute to check your answers to part four.","cn":"你现在有一分钟时间来检查第四部分的答案。","analysis":""},{"time":"00:06:17,000 --> 00:06:19,000","html":"Thank you.","cn":"谢谢。","analysis":""},{"time":"00:06:47,000 --> 00:07:14,000","html":"That is the end of the listening test.","cn":"听力测试到此结束。","analysis":""},{"time":"00:07:14,000 --> 00:07:21,000","html":"In the IELTS test, you would now have ten minutes to transfer your answers to the answer sheet. 69&lt;","cn":"在雅思考试中，你现在将有十分钟时间将答案转写到答题卡上。","analysis":""},{"time":"00:07:44,000 --> 00:07:46,000","html":"Thank you.","cn":"谢谢。","analysis":""}],"transcriptHighlights":[{"qid":"31","text":"fresh","answer":"fresh"},{"qid":"32","text":"variety","answer":"variety"},{"qid":"33","text":"communication","answer":"communication"},{"qid":"34","text":"sleep","answer":"sleep"},{"qid":"35","text":"water","answer":"water"},{"qid":"36","text":"tools","answer":"tools"},{"qid":"37","text":"instructions","answer":"instructions"},{"qid":"38","text":"testing","answer":"testing"},{"qid":"39","text":"accent","answer":"accent"},{"qid":"40","text":"safety","answer":"safety"}],"ownerInfo":"此内容由🍠@Listening 永不虾滑整理，仅作为分享供个人使用；禁止商用、倒卖和引流。有问题请先仔细看🍠这个账号的置顶和分享贴。没有团队，不是机构，纯个人分享。督学和其他相关课程请咨询主页另一个号@心情有点虾滑（不回任何机经相关消息）。"}</script>

function highlightTerms(){let terms=[];for(let item of DATA.transcriptHighlights||[]){let text=typeof item==='string'?item:item.text;if(text){terms.push(String(text));String(text).split(/\s+/).map(w=>w.replace(/[^A-Za-z0-9'-]/g,'')).filter(w=>w.length>=5&&!/^(which|three|answer|letter|about|their|there|would|could|should)$/i.test(w)).forEach(w=>terms.push(w))}}return [...new Set(terms.map(t=>t.trim()).filter(t=>t.length>1))].sort((a,b)=>b.length-a.length)}
function markTranscript(text){let raw=String(text??''),lower=raw.toLowerCase(),ranges=[];for(let term of highlightTerms()){let needle=term.toLowerCase(),start=0;while(needle&&start<lower.length){let idx=lower.indexOf(needle,start);if(idx<0)break;let end=idx+needle.length,before=idx===0?' ':lower[idx-1],after=end>=lower.length?' ':lower[end];let bounded=!/[a-z0-9]/i.test(before)&&!/[a-z0-9]/i.test(after);if(bounded&&!ranges.some(r=>idx<r.end&&end>r.start))ranges.push({start:idx,end});start=end}}ranges.sort((a,b)=>a.start-b.start);let out='',pos=0;for(let r of ranges){out+=esc(raw.slice(pos,r.start));out+=`<span class="answer-highlight">${esc(raw.slice(r.start,r.end))}</span>`;pos=r.end}return out+esc(raw.slice(pos))}
function markStyle(el){let m=String(el.getAttribute('style')||'').match(/background-color\s*:\s*(#[0-9a-fA-F]{3,8})/);return m?`background-color: ${m[1]};`:''}
function sanitizeTranscriptHtml(html){let t=document.createElement('template');t.innerHTML=String(html||'');t.content.querySelectorAll('*').forEach(el=>{let tag=el.tagName.toLowerCase();if(tag!=='mark'&&tag!=='span'&&tag!=='strong'){el.replaceWith(document.createTextNode(el.textContent));return}let cls=[...el.classList].filter(c=>c==='hl'||/^q\\d+$/.test(c)||c==='answer-highlight'||c==='q-label').join(' '),style=tag==='mark'?markStyle(el):'';[...el.attributes].forEach(a=>el.removeAttribute(a.name));if(tag==='mark'&&!cls&&!style)cls='answer-highlight';if(cls)el.setAttribute('class',cls);if(style)el.setAttribute('style',style)});return t.innerHTML}
function formatCueTime(time){return String(time||'').replace(/,000\b/g,'')}
function parseStamp(t){let m=String(t||'').match(/(?:(\d{1,3}):)?(\d{2}):(\d{2})[,:.](\d{1,3})/);return m?+(m[1]||0)*3600+ +m[2]*60+ +m[3]+ +(m[4]||0)/1000:0}
function cueRange(x){let parts=String(x?.time||'').split(/\s*-->\s*/);return {start:parseStamp(parts[0]),end:parseStamp(parts[1])}}
function transcriptLineHTML(x){if(x&&typeof x==='object'&&x.html!==undefined){let html=sanitizeTranscriptHtml(x.html),hit=/<mark\b|class="[^"]*(hl|answer-highlight)/.test(html),cn=x.cn?`<div class="cue-cn">${sanitizeTranscriptHtml(x.cn)}</div>`:'',analysis=x.analysis?`<div class="cue-analysis">${sanitizeTranscriptHtml(x.analysis)}</div>`:'';return `<section class="cue ${hit?'has-hit':''}"><div class="cue-time">${esc(formatCueTime(x.time))}</div><div><p>${html}</p>${cn}${analysis}</div></section>`}return `<p>${markTranscript(Array.isArray(x)?(x[2]||x.join(' ')):x)}</p>`}
function buildTranscript(){let lines=DATA.transcriptLines||[];$('#transcript').classList.remove('hide-cn','hide-analysis');$('#transcript').innerHTML=lines.length?`<h3>Listening Transcript</h3>${lines.map(transcriptLineHTML).join('')}<p>&nbsp;</p>`:'<h3>Listening Transcript</h3><p>No transcript was provided in the source file.</p><p>&nbsp;</p>'}
function studyLines(){return (DATA.transcriptLines||[]).filter(x=>x&&typeof x==='object'&&x.html!==undefined)}
function studyCueHTML(x,i){let html=sanitizeTranscriptHtml(x.html),cn=x.cn?`<div class="cue-cn">${sanitizeTranscriptHtml(x.cn)}</div>`:'',analysis=x.analysis?`<div class="cue-analysis">${sanitizeTranscriptHtml(x.analysis)}</div>`:'',saved=esc(dictationAnswers[i]||''),box=dictationMode?`<textarea class="dictation-box" data-idx="${i}" placeholder="输入你听到的内容..." onclick="event.stopPropagation()">${saved}</textarea>`:'';return `<button class="study-cue" type="button" data-idx="${i}"><span class="cue-time">${esc(formatCueTime(x.time))}</span><p>${html}</p>${cn}${analysis}${box}</button>`}
function buildIntensive(){let lines=studyLines(),panel=$('#transcript');panel.classList.toggle('hide-cn',!showCn);panel.classList.toggle('hide-analysis',!showAnalysis);panel.classList.toggle('dictation-mode',dictationMode);panel.classList.toggle('show-original',showOriginal);panel.innerHTML=lines.length?`<div class="study-head"><h3>原文和精听</h3><div class="study-controls"><button id="prevCue" type="button">上一句</button><button id="playCue" type="button">播放 / 暂停</button><button id="nextCue" type="button">下一句</button><button id="loopCue" type="button" class="${loopCue?'active':''}">循环当前句</button><button id="slowCue" type="button" class="${slowCue?'active':''}">0.8x 慢速</button></div><div class="study-controls"><button id="dictationCue" type="button" class="${dictationMode?'active':''}">听写模式</button><button id="originalCue" type="button" class="${showOriginal?'active':''}">显示原文</button><button id="cnCue" type="button" class="${showCn?'active':''}">显示中文</button><button id="analysisCue" type="button" class="${showAnalysis?'active':''}">显示解析</button></div></div><div class="study-list">${lines.map(studyCueHTML).join('')}</div><p>&nbsp;</p>`:'<h3>原文和精听</h3><p>No timed transcript was provided.</p><p>&nbsp;</p>';bindStudyControls();setActiveCue(currentCue)}
function toggleIntensive(){let main=$('#main');if(main.classList.contains('split')&&$('#transcript .study-head')){main.classList.remove('split');return}main.classList.add('split');buildIntensive()}
function bindStudyControls(){let panel=$('#transcript');panel.querySelectorAll('.study-cue').forEach(btn=>btn.onclick=e=>{if(e.target.closest('.dictation-box'))return;playCue(Number(btn.dataset.idx))});panel.querySelectorAll('.dictation-box').forEach(box=>{box.oninput=()=>{dictationAnswers[box.dataset.idx]=box.value;save(false)}});$('#prevCue')?.addEventListener('click',()=>playCue(Math.max(0,(currentCue<0?0:currentCue-1))));$('#nextCue')?.addEventListener('click',()=>playCue(Math.min(studyLines().length-1,(currentCue<0?0:currentCue+1))));$('#playCue')?.addEventListener('click',()=>audio.paused?audio.play():audio.pause());$('#loopCue')?.addEventListener('click',()=>{loopCue=!loopCue;buildIntensive();save(false)});$('#slowCue')?.addEventListener('click',()=>{slowCue=!slowCue;audio.playbackRate=slowCue ? 0.8 : +$('#speed').value;buildIntensive();save(false)});$('#cnCue')?.addEventListener('click',()=>{showCn=!showCn;buildIntensive();save(false)});$('#analysisCue')?.addEventListener('click',()=>{showAnalysis=!showAnalysis;buildIntensive();save(false)});$('#dictationCue')?.addEventListener('click',()=>{dictationMode=!dictationMode;if(dictationMode){showOriginal=false;showCn=false;showAnalysis=false}else{showOriginal=true;showCn=true;showAnalysis=true}buildIntensive();save(false)});$('#originalCue')?.addEventListener('click',()=>{showOriginal=!showOriginal;buildIntensive();save(false)})}
function playCue(i){let lines=studyLines();if(!lines.length)return;currentCue=Math.max(0,Math.min(i,lines.length-1));let r=cueRange(lines[currentCue]);audio.currentTime=r.start||0;if(slowCue)audio.playbackRate=.8;audio.play();setActiveCue(currentCue);save(false)}
function setActiveCue(i){$$('.study-cue').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.idx)===i));let active=$(`.study-cue[data-idx="${i}"]`);active?.scrollIntoView({block:'nearest'})}
function maintainCueLoop(){if(currentCue<0||!loopCue)return;let line=studyLines()[currentCue],r=cueRange(line);if(r.end&&audio.currentTime>=r.end-.05){audio.currentTime=r.start||0;audio.play()}}
function showToast(msg='Progress saved!'){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1400)}
function collectAnswers(){let answers={text:{},single:{},multiple:{},matching:{},map:{}};$$('#content input[name^="q"]').forEach(i=>answers.text[i.name]=i.value);$$('.single-choice.selected').forEach(c=>answers.single[c.dataset.name]=c.dataset.value);$$('.map-choice.selected').forEach(c=>answers.map[c.dataset.name]=c.dataset.value);let names=[...new Set($$('.multi-choice').map(c=>c.dataset.name))];names.forEach(name=>answers.multiple[name]=$$(`.multi-choice[data-name="${name}"].selected`).map(c=>c.dataset.value));$$('.slot').forEach(s=>{let tag=s.querySelector('.tag');if(tag)answers.matching[s.dataset.q]=tag.dataset.value});return answers}
function restoreAnswers(a={}){hardResetAnswers();Object.entries(a.text||{}).forEach(([name,val])=>{let el=$(`input[name="${name}"]`);if(el)el.value=val});Object.entries(a.single||{}).forEach(([name,val])=>{let el=$(`.single-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.map||{}).forEach(([name,val])=>{let el=$(`.map-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.multiple||{}).forEach(([name,vals])=>(vals||[]).forEach(val=>{let el=$(`.multi-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')}));Object.entries(a.matching||{}).forEach(([qid,val])=>{let opt=$(`.drag[data-value="${val}"]`),slot=$(`.slot[data-q="${qid}"]`);if(opt&&slot)slot.innerHTML=`<span class="tag" draggable="true" data-value="${val}">${esc(opt.textContent)}</span>`});refreshPool();restoreDragging();updateNav()}
function contentSnapshot(){let clone=$('#content').cloneNode(true);clone.querySelectorAll('.review').forEach(r=>r.remove());clone.querySelectorAll('input').forEach(i=>{i.setAttribute('value',i.value);i.removeAttribute('disabled')});clone.querySelectorAll('.choice').forEach(c=>c.classList.remove('disabled'));return clone.innerHTML}
function notesSnapshot(){$$('#notesList textarea').forEach(t=>{t.textContent=t.value;t.setAttribute('data-value',t.value)});return $('#notesList').innerHTML}
function layoutSignature(){return JSON.stringify([RENDER_VERSION,(DATA.groups||[]).map(g=>[g.type,g.layout||'',g.id||'',g.title||'',(g.questions||[]).map(q=>String(q.id||q[0]||''))])])}
function save(show=false){let data={secs,answers:collectAnswers(),contentHtml:contentSnapshot(),layoutSignature:layoutSignature(),notes:notesSnapshot(),dark:document.body.classList.contains('dark'),font:document.documentElement.style.fontSize,dictationAnswers,studyState:{currentCue,loopCue,slowCue,showCn,showAnalysis,dictationMode,showOriginal},audioTime:audio?.currentTime||0};localStorage.setItem(storeKey,JSON.stringify(data));if(show)showToast()}
function load(){let raw=localStorage.getItem(storeKey);if(!raw)return;let d;try{d=JSON.parse(raw)}catch(err){console.warn('Saved progress could not be read.',err);return}secs=d.secs||0;if(d.contentHtml&&d.layoutSignature===layoutSignature()){try{$('#content').innerHTML=d.contentHtml;bindDynamic()}catch(err){console.warn('Saved question view could not be restored.',err)}}if(d.answers){try{restoreAnswers(d.answers)}catch(err){console.warn('Saved answers could not be restored.',err)}}if(d.dictationAnswers)dictationAnswers=d.dictationAnswers;if(d.studyState)try{({currentCue=currentCue,loopCue=loopCue,slowCue=slowCue,showCn=showCn,showAnalysis=showAnalysis,dictationMode=dictationMode,showOriginal=showOriginal}=d.studyState)}catch(err){console.warn('Study state could not be restored.',err)}if(d.notes){try{$('#notesList').innerHTML=d.notes;$$('#notesList textarea').forEach(t=>{t.value=t.dataset.value||t.textContent||''})}catch(err){console.warn('Saved notes could not be restored.',err)}}if(d.dark)document.body.classList.add('dark');setFontSize(d.font||DEFAULT_FONT_SIZE,false);if(d.audioTime)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=d.audioTime},{once:true});bindNoteDeletes();drawTimer()}
function handleSelection(e){if(e.target.closest('#selbar,#notes,.bottom-bar'))return;let sel=window.getSelection();let hl=e.target.closest?.('.hl-brown,.hl-rose,.hl-blue');let bar=$('#selbar');if(hl&&sel.isCollapsed){bar.targetElem=hl;placeBar(bar,hl.getBoundingClientRect())}else if(sel&&!sel.isCollapsed&&$('#content').contains(sel.anchorNode)){bar.targetElem=null;placeBar(bar,sel.getRangeAt(0).getBoundingClientRect())}else{bar.hidden=true}}
function placeBar(bar,rect){bar.hidden=false;bar.style.left=Math.max(8,window.scrollX+rect.left+rect.width/2-95)+'px';bar.style.top=Math.max(8,window.scrollY+rect.top-46)+'px'}
function highlightedFromSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let node=sel.anchorNode?.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode;return node?.closest?.('.hl-brown,.hl-rose,.hl-blue')||null}
function handleToolbar(e){let act=e.target.closest('button')?.dataset.act;if(!act)return;let bar=$('#selbar'),target=bar.targetElem||highlightedFromSelection(),sel=window.getSelection();if(act==='del'&&target){unwrap(target);removeNote(target.dataset.hid)}else if(act==='hl'){if(target){if(target.classList.contains('hl-brown'))target.className='hl-rose';else if(target.classList.contains('hl-rose'))target.className='hl-rose';else target.className='hl-brown'}else{let span=wrapSelection('hl-brown');if(span)span.dataset.hid='h_'+Date.now()}}else if(act==='note'){let span=target||wrapSelection('hl-blue');if(span){span.className='hl-blue';if(!span.dataset.hid)span.dataset.hid='n_'+Date.now();createNote(span);document.body.classList.add('notes-open')}}bar.hidden=true;sel.removeAllRanges();save(false)}
function wrapSelection(cls){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let range=sel.getRangeAt(0);if(!$('#content').contains(range.commonAncestorContainer))return null;let span=document.createElement('span');span.className=cls;try{range.surroundContents(span)}catch{return null}return span}
function unwrap(el){let p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize()}
function clearUserHighlights(){$$('.hl-brown,.hl-rose,.hl-blue').forEach(unwrap)}
function createNote(span){let id=span.dataset.hid;if($(`.note-card[data-hid="${id}"]`))return;let card=document.createElement('div');card.className='note-card';card.dataset.hid=id;card.innerHTML=`<div class="note-quote">${esc(span.textContent.slice(0,120))}</div><textarea placeholder="Write note here..."></textarea><button class="delete-note" type="button">Delete</button>`;$('#notesList').prepend(card);bindNoteDeletes()}
function bindNoteDeletes(){$$('#notesList textarea').forEach(t=>t.oninput=()=>save(false));$$('.delete-note').forEach(btn=>btn.onclick=()=>{let card=btn.closest('.note-card'),id=card.dataset.hid,span=$(`[data-hid="${id}"]`);if(span)unwrap(span);card.remove();save(false)})}
function removeNote(id){if(!id)return;$(`.note-card[data-hid="${id}"]`)?.remove()}
function drawTimer(){let m=Math.floor(secs/60),s=secs%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
const DEFAULT_FONT_SIZE=16,MIN_FONT_SIZE=14,MAX_FONT_SIZE=22;
function currentFontSize(){return Number.parseInt(document.documentElement.style.fontSize,10)||DEFAULT_FONT_SIZE}
function setFontSize(size,persist=true){let n=Math.max(MIN_FONT_SIZE,Math.min(MAX_FONT_SIZE,Number(size)||DEFAULT_FONT_SIZE));document.documentElement.style.fontSize=n===DEFAULT_FONT_SIZE?'':n+'px';updateSizeButtons();if(persist)save(false)}
function adjustFontSize(delta){setFontSize(currentFontSize()+delta,true)}
function updateSizeButtons(){let size=currentFontSize(),dark=document.body.classList.contains('dark');$('#fontMinus')?.toggleAttribute('disabled',size<=MIN_FONT_SIZE);$('#fontPlus')?.toggleAttribute('disabled',size>=MAX_FONT_SIZE);$('#fontDefault')?.classList.toggle('active',size===DEFAULT_FONT_SIZE);$('#lightBtn')?.classList.toggle('active',!dark);$('#darkBtn')?.classList.toggle('active',dark)}
function resetAppearance(persist=true){document.body.classList.remove('dark');setFontSize(DEFAULT_FONT_SIZE,false);updateSizeButtons();if(persist)save(false)}
function clearAllProgress(){localStorage.removeItem(storeKey)}
$('#finish').onclick=finish;$('#save').onclick=()=>save(true);$('#clear').onclick=()=>{if(confirm('Clear all progress?')){window.resetTest();showToast('Clear complete')}};$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-open');save(false)};$('#closeNotes').onclick=()=>{document.body.classList.remove('notes-open');save(false)};$('#toggleIntensive').onclick=()=>{toggleIntensive();save(false)};$('#settingsBtn').onclick=()=>{$('#settings').classList.toggle('open');updateSizeButtons()};$('#lightBtn').onclick=()=>{document.body.classList.remove('dark');updateSizeButtons();save(false)};$('#darkBtn').onclick=()=>{document.body.classList.add('dark');updateSizeButtons();save(false)};$('#appearanceReset').onclick=()=>resetAppearance(true);$('#fontMinus').onclick=()=>adjustFontSize(-1);$('#fontPlus').onclick=()=>adjustFontSize(1);$('#fontDefault').onclick=()=>setFontSize(DEFAULT_FONT_SIZE,true);$('#settings').addEventListener('wheel',e=>{e.preventDefault();adjustFontSize(e.deltaY>0?-1:1)},{passive:false});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey)return;let key=e.key;if(key==='+'||key==='='){e.preventDefault();adjustFontSize(1)}else if(key==='-'||key==='_'){e.preventDefault();adjustFontSize(-1)}else if(key==='0'){e.preventDefault();resetAppearance(true)}});
const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
