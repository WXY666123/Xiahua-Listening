":false,"level":0},{"text":"Natural","list":true,"level":0},{"text":"Harvests may be affected by storms and destructive 38. __________","list":true,"level":1},{"text":"Climate change may also affect sap production.","list":true,"level":1},{"text":"Social","list":true,"level":0},{"text":"Maple syrup is expensive and faces considerable 39. __________","list":true,"level":1},{"text":"The obesity issue is affecting sales.","list":true,"level":1},{"text":"Reasons for optimism","list":false,"level":0},{"text":"Maple syrup is an important export.","list":true,"level":0},{"text":"It is quite 40. __________ compared with other sweeteners.","list":true,"level":0},{"text":"Its taste is the main reason for its popularity.","list":true,"level":0},{"text":"","list":false,"level":0},{"text":"","list":false,"level":0}]}],"answerKey":{"text":{"q31":"different","q32":"meat","q33":"tradition","q34":"steam","q35":"ice","q36":"medicine","q37":"tax","q38":"insects","q39":"competition","q40":"healthy"},"single":{},"multiple":{},"multipleMap":{},"matching":{},"map":{}},"transcriptLines":[{"time":"00:00:00,000 --> 00:00:08,200","html":"Section 4.","cn":"第四部分。","analysis":""},{"time":"00:00:08,200 --> 00:00:14,040","html":"You will hear a lecture on a very popular Canadian food product called maple syrup.","cn":"你将听到一场关于加拿大非常受欢迎的食品——枫糖浆的讲座。","analysis":""},{"time":"00:00:14,040 --> 00:00:19,720","html":"First, you have some time to look at questions 31 to 40 on page 7.","cn":"首先，你有一些时间查看第七页的第31至40题。","analysis":""},{"time":"00:00:31,000 --> 00:00:33,000","html":"You","cn":"你","analysis":""},{"time":"00:00:33,000 --> 00:00:38,000","html":"will hear a lecture on a very popular Canadian food product called maple syrup.","cn":"将听到一场关于加拿大非常受欢迎的食品——枫糖浆的讲座。","analysis":""},{"time":"00:01:00,000 --> 00:01:18,000","html":"Now listen carefully and answer questions 31 to 40.","cn":"现在请仔细听并回答第31至40题。","analysis":""},{"time":"00:01:18,000 --> 00:01:22,000","html":"Maple syrup can be described as very sweet.","cn":"枫糖浆可以被描述为非常甜。","analysis":""},{"time":"00:01:22,000 --> 00:01:26,000","html":"Canadians pour it generously over things like pancakes for breakfast.","cn":"加拿大人早餐时会把枫糖浆大量地淋在煎饼之类的食物上。","analysis":""},{"time":"00:01:26,000 --> 00:01:32,000","html":"The syrup is produced from the maple tree and it actually comes from the tree's sap,","cn":"枫糖浆产自枫树，它实际上来自树的树液，","analysis":""},{"time":"00:01:32,000 --> 00:01:38,000","html":"which is the watery substance that comes out of the trunk of the tree when this is cut.","cn":"树液是当树干被割开时流出的水状物质。","analysis":""},{"time":"00:01:38,000 --> 00:01:44,000","html":"In order for enough sap to be produced, very special climate conditions are needed.","cn":"为了产生足够的树液，需要非常特殊的气候条件。","analysis":""},{"time":"00:01:44,000 --> 00:01:50,000","html":"In spring, the temperatures need to drop to well below zero at night,","cn":"在春天，夜间温度需要降到远低于零度，","analysis":""},{"time":"00:01:50,000 --> 00:01:59,000","html":"but then they need to rise sharply during the day, so they're <mark style=\"background-color: #bbf7d0;\">hugely different<\/mark> over a 24-hour period.","cn":"但白天又需要急剧上升，因此24小时内的温差巨大。","analysis":"<strong>答案解析：<\/strong> 第31题问的是制作枫糖浆所需气候中，昼夜温度的特点。原文提到 \"temperatures need to drop to well below zero at night, but then they need to rise sharply during the day, so they're <mark style=\"background-color: #bbf7d0;\">hugely different<\/mark> over a 24-hour period\" (夜间温度需要降到远低于零度，但白天又需要急剧上升，因此24小时内的温差巨大)。因此，正确答案是 \"different\" (不同的)。"},{"time":"00:01:59,000 --> 00:02:05,000","html":"And that's exactly what happens in Northeastern Canada every spring.","cn":"这正是每年春天加拿大东北部发生的情况。","analysis":""},{"time":"00:02:05,000 --> 00:02:16,000","html":"The indigenous peoples of North America, known as the First Nations, discovered the maple secret long before the Europeans arrived.","cn":"北美原住民，被称为第一民族，早在欧洲人到来之前就发现了枫树的秘密。","analysis":""},{"time":"00:02:16,000 --> 00:02:22,000","html":"Early folk stories say it was first discovered by a chief, who threw his tomahawk,","cn":"早期的民间故事说，它最初是由一位酋长发现的，他把他的战斧，","analysis":""},{"time":"00:02:22,000 --> 00:02:27,000","html":"which is similar to an axe, into the trunk of a tree.","cn":"一种类似于斧头的工具，扔进了树干。","analysis":""},{"time":"00:02:27,000 --> 00:02:30,000","html":"Clear sap started to run from the cut.","cn":"清澈的树液从切口流出。","analysis":""},{"time":"00:02:30,000 --> 00:02:40,000","html":"His wife used this sap to boil <mark style=\"background-color: #bbf7d0;\">meat<\/mark>, and the heat turned it into a sweet syrup, which they found delicious.","cn":"他的妻子用这种树液煮<mark style=\"background-color: #bbf7d0;\">肉<\/mark>，热量使其变成了甜美的糖浆，他们觉得非常美味。","analysis":"<strong>答案解析：<\/strong> 第32题问民间故事中枫糖浆最初是用来煮什么。原文提到 \"His wife used this sap to boil <mark style=\"background-color: #bbf7d0;\">meat<\/mark>\" (他的妻子用这种树液煮肉)。因此，正确答案是 \"meat\" (肉)。"},{"time":"00:02:41,000 --> 00:02:50,000","html":"Whether or not that story is true, we do know that the maple tree was very important to First Nations peoples for hundreds of years.","cn":"无论这个故事是否真实，我们确实知道枫树对第一民族人民来说非常重要，持续了数百年。","analysis":""},{"time":"00:02:50,000 --> 00:02:55,000","html":"Collecting the sap each spring became a <mark style=\"background-color: #bbf7d0;\">tradition<\/mark> among them.","cn":"每年春天收集树液成为他们之间的一种<mark style=\"background-color: #bbf7d0;\">传统<\/mark>。","analysis":"<strong>答案解析：<\/strong> 第33题问春天收集树液发展成了第一民族的一种什么。原文提到 \"Collecting the sap each spring became a <mark style=\"background-color: #bbf7d0;\">tradition<\/mark> among them\" (每年春天收集树液成为他们之间的一种传统)。因此，正确答案是 \"tradition\" (传统)。"},{"time":"00:02:55,000 --> 00:03:02,000","html":"Whole families would migrate to the areas where the maple trees grew, and set up camp there.","cn":"整个家庭会迁徙到枫树生长的地区，并在那里安营扎寨。","analysis":""},{"time":"00:03:02,000 --> 00:03:06,000","html":"They collected the sap from the trees using buckets.","cn":"他们用桶从树上收集树液。","analysis":""},{"time":"00:03:06,000 --> 00:03:13,000","html":"Then they needed to concentrate the sap, removing some of the water from it to create syrup.","cn":"然后他们需要浓缩树液，从中去除一部分水来制作糖浆。","analysis":""},{"time":"00:03:13,000 --> 00:03:16,000","html":"They had two ways of doing this.","cn":"他们有两种方法。","analysis":""},{"time":"00:03:16,000 --> 00:03:23,000","html":"One way was to drop <mark style=\"background-color: #fecaca;\">hot stones<\/mark> from a <mark style=\"background-color: #fecaca;\">fire<\/mark> into the buckets to create <mark style=\"background-color: #bbf7d0;\">steam<\/mark>.","cn":"一种方法是将<mark style=\"background-color: #fecaca;\">火中<\/mark>的<mark style=\"background-color: #fecaca;\">热石<\/mark>放入桶中产生<mark style=\"background-color: #bbf7d0;\">蒸汽<\/mark>。","analysis":"<strong>答案解析：<\/strong> 第34题问通过使用热石产生什么来浓缩树液。原文提到 \"One way was to drop hot stones from a fire into the buckets to create <mark style=\"background-color: #bbf7d0;\">steam<\/mark>\" (一种方法是将火中的热石放入桶中产生蒸汽)。因此，正确答案是 \"steam\" (蒸汽)。 “hot stones” 和 “fire” 是产生蒸汽的工具或来源，而不是直接用于浓缩树液的产物，故为干扰项。"},{"time":"00:03:23,000 --> 00:03:29,000","html":"If repeated often enough, this would eventually concentrate the syrup.","cn":"如果重复足够多次，这最终会浓缩糖浆。","analysis":""},{"time":"00:03:29,000 --> 00:03:38,000","html":"Another method that they used to concentrate the syrup was to leave the sap outside overnight, exposed to <mark style=\"background-color: #fecaca;\">freezing temperatures<\/mark>.","cn":"他们用来浓缩糖浆的另一种方法是将树液整夜留在室外，暴露在<mark style=\"background-color: #fecaca;\">冰冻温度<\/mark>下。","analysis":""},{"time":"00:03:38,000 --> 00:03:47,000","html":"This would mean that a thick layer of <mark style=\"background-color: #bbf7d0;\">ice<\/mark> would form on top, which could be discarded, leaving the sugary sap below.","cn":"这将意味着上面会形成一层厚厚的<mark style=\"background-color: #bbf7d0;\">冰<\/mark>，可以将其丢弃，留下下面的含糖树液。","analysis":"<strong>答案解析：<\/strong> 第35题问通过将树液在夜间留在室外，然后去除顶层的什么来浓缩树液。原文提到 \"a thick layer of <mark style=\"background-color: #bbf7d0;\">ice<\/mark> would form on top, which could be discarded\" (上面会形成一层厚厚的冰，可以将其丢弃)。因此，正确答案是 \"ice\" (冰)。 “freezing temperatures” (冰冻温度) 是产生冰的条件，而不是被去除的层，故为干扰项。"},{"time":"00:03:47,000 --> 00:03:56,000","html":"Again, this process could be repeated over several days, and eventually a sweet brown syrup was produced.","cn":"同样，这个过程可以重复几天，最终产生甜美的棕色糖浆。","analysis":""},{"time":"00:03:56,000 --> 00:04:01,000","html":"The First Nations people had various uses for the sap and syrup.","cn":"第一民族的人们对树液和糖浆有各种用途。","analysis":""},{"time":"00:04:01,000 --> 00:04:08,000","html":"They drank the sap fresh from the tree as a tonic, knowing that it was an important source of energy.","cn":"他们直接饮用新鲜的树液作为补品，知道它是重要的能量来源。","analysis":""},{"time":"00:04:08,000 --> 00:04:16,000","html":"But for the most part, they reduced the syrup further, and then cooled it, so that it crystallized into sugar.","cn":"但大多数情况下，他们进一步浓缩糖浆，然后冷却，使其结晶成糖。","analysis":""},{"time":"00:04:16,000 --> 00:04:21,000","html":"This was easy to carry, and kept indefinitely.","cn":"这便于携带，并可无限期保存。","analysis":""},{"time":"00:04:21,000 --> 00:04:31,000","html":"European settlers who arrived in Canada began to learn about the syrup from First Nations peoples, and further expanded its uses.","cn":"来到加拿大的欧洲定居者开始从第一民族人民那里了解糖浆，并进一步扩大了其用途。","analysis":""},{"time":"00:04:31,000 --> 00:04:36,000","html":"For example, they incorporated it into <mark style=\"background-color: #bbf7d0;\">medicine<\/mark> of different kinds.","cn":"例如，他们将其用于各种<mark style=\"background-color: #bbf7d0;\">药物<\/mark>中。","analysis":""},{"time":"00:04:36,000 --> 00:04:42,000","html":"They also discovered that by adding yeast to the sap, they could make a <mark style=\"background-color: #fecaca;\">maple drink<\/mark>.","cn":"他们还发现，通过在树液中加入酵母，可以制作<mark style=\"background-color: #fecaca;\">枫树饮料<\/mark>。","analysis":""},{"time":"00:04:42,000 --> 00:04:48,000","html":"And by throwing the hot syrup into the snow, they could make a <mark style=\"background-color: #fecaca;\">toffee-like candy<\/mark>.","cn":"通过将热糖浆倒入雪中，他们可以制作出<mark style=\"background-color: #fecaca;\">太妃糖状的糖果<\/mark>。","analysis":"<strong>答案解析：<\/strong> 第36题问欧洲定居者将糖浆用于各种什么。原文提到 \"they incorporated it into <mark style=\"background-color: #bbf7d0;\">medicine<\/mark> of different kinds\" (他们将其用于各种药物中)。因此，正确答案是 \"medicine\" (药物)。 “maple drink” (枫树饮料) 和 “toffee-like candy” (太妃糖状的糖果) 也是欧洲定居者的用途，但问题是关于 \"various types of\"，而 \"medicine\" 作为一个类别更符合语境，且在原文中首先提及，故前两者是干扰项。"},{"time":"00:04:48,000 --> 00:04:54,000","html":"But, like the First Nations, they turned most of their sap into maple sugar.","cn":"但是，和第一民族一样，他们将大部分树液制成了枫糖。","analysis":""},{"time":"00:04:54,000 --> 00:05:07,000","html":"For most people, it was the only type of sugar they could afford, since the only alternative was the sugar imported from the <mark style=\"background-color: #fecaca;\">Caribbean<\/mark>, which was made from sugar cane, and this was very expensive.","cn":"对于大多数人来说，这是他们唯一能负担得起的糖，因为唯一的替代品是从<mark style=\"background-color: #fecaca;\">加勒比地区<\/mark>进口的糖，这种糖是由甘蔗制成的，非常昂贵。","analysis":""},{"time":"00:05:07,000 --> 00:05:17,000","html":"However, after 1880, the Canadian government decided to stop charging <mark style=\"background-color: #bbf7d0;\">tax<\/mark> on Caribbean sugar, and this made it much cheaper.","cn":"然而，1880年后，加拿大政府决定停止对加勒比糖征收<mark style=\"background-color: #bbf7d0;\">税<\/mark>，这使得它便宜得多。","analysis":"<strong>答案解析：<\/strong> 第37题问1880年后，当对加勒比糖的什么被取消时，其制糖用途下降。原文提到 \"after 1880, the Canadian government decided to stop charging <mark style=\"background-color: #bbf7d0;\">tax<\/mark> on Caribbean sugar\" (1880年后，加拿大政府决定停止对加勒比糖征收税)。因此，正确答案是 \"tax\" (税)。 “Caribbean” (加勒比地区) 是糖的来源地，而不是被取消的费用，故为干扰项。"},{"time":"00:05:17,000 --> 00:05:30,000","html":"That meant it was no longer cost-effective to produce maple sugar, and so syrup-making became the only viable industry remaining for Canadians, and that's what we've been doing ever since.","cn":"这意味着生产枫糖不再划算，因此制作糖浆成为加拿大人唯一可行的产业，我们从那时起就一直在这样做。","analysis":""},{"time":"00:05:30,000 --> 00:05:43,000","html":"At present, maple syrup is enjoying a boom. In the last two decades, production has doubled in Canada.","cn":"目前，枫糖浆正经历繁荣。在过去的二十年里，加拿大的产量翻了一番。","analysis":""},{"time":"00:05:43,000 --> 00:05:58,000","html":"However, serious threats remain. Like any agricultural product, the harvest is subject to such things as <mark style=\"background-color: #fecaca;\">major storms<\/mark>, or the arrival of invasive <mark style=\"background-color: #bbf7d0;\">insects<\/mark>, both of which have happened,","cn":"然而，严重的威胁依然存在。与任何农产品一样，收成受到<mark style=\"background-color: #fecaca;\">大风暴<\/mark>或入侵性<mark style=\"background-color: #bbf7d0;\">昆虫<\/mark>到来等因素的影响，这两种情况都发生过，","analysis":"<strong>答案解析：<\/strong> 第38题问收成可能受到风暴和破坏性什么的影响。原文提到 \"the harvest is subject to such things as major storms, or the arrival of invasive <mark style=\"background-color: #bbf7d0;\">insects<\/mark>\" (收成受到大风暴或入侵性昆虫到来等因素的影响)。由于问题中已经提到了 \"storms\" (风暴)，所以需要填入的是另一个破坏性因素。因此，正确答案是 \"insects\" (昆虫)。 “major storms” (大风暴) 是问题中已经提及的威胁之一，因此是干扰项。"},{"time":"00:05:58,000 --> 00:06:11,000","html":"and these could destroy everything. It is predicted with some certainty that, in the longer term, climate change will also have an adverse effect on the sap run.","cn":"这些都可能摧毁一切。可以肯定地预测，从长远来看，气候变化也将对树液的流动产生不利影响。","analysis":""},{"time":"00:06:11,000 --> 00:06:14,000","html":"Then there are the social factors.","cn":"然后是社会因素。","analysis":""},{"time":"00:06:14,000 --> 00:06:22,000","html":"Producing maple syrup is a very labor-intensive process, making it an expensive purchase.","cn":"生产枫糖浆是一个劳动密集型过程，使其成为昂贵的商品。","analysis":""},{"time":"00:06:22,000 --> 00:06:30,000","html":"And of equal concern is the fact that nowadays there's a lot of <mark style=\"background-color: #bbf7d0;\">competition<\/mark> from cheaper, artificially flavored brands.","cn":"同样令人担忧的是，如今面临着来自更便宜、人工调味品牌的激烈<mark style=\"background-color: #bbf7d0;\">竞争<\/mark>。","analysis":""},{"time":"00:06:30,000 --> 00:06:41,000","html":"Furthermore, we're at a time when <mark style=\"background-color: #fecaca;\">obesity<\/mark> is a major issue, making a product that is 67% sugar increasingly difficult to sell.","cn":"此外，我们正处于一个肥胖症成为主要问题的时代，使得含糖量高达67%的产品越来越难以销售。","analysis":"<strong>答案解析：<\/strong> 第39题问枫糖浆昂贵并面临巨大的什么。原文提到 \"there's a lot of <mark style=\"background-color: #bbf7d0;\">competition<\/mark> from cheaper, artificially flavored brands\" (面临着来自更便宜、人工调味品牌的激烈竞争)。因此，正确答案是 \"competition\" (竞争)。 “obesity” (肥胖症) 是另一个社会因素，影响销售，但并非枫糖浆因其昂贵而直接面临的“竞争”问题，故为干扰项。"},{"time":"00:06:41,000 --> 00:06:45,000","html":"Nevertheless, there are reasons to be optimistic.","cn":"尽管如此，我们仍有理由保持乐观。","analysis":""},{"time":"00:06:45,000 --> 00:06:53,000","html":"Producers are developing markets abroad. Our syrup is currently being exported to over 50 countries.","cn":"生产商正在开发海外市场。我们的糖浆目前出口到50多个国家。","analysis":""},{"time":"00:06:53,000 --> 00:07:04,000","html":"Back here at home, chefs use it enthusiastically. It's certainly <mark style=\"background-color: #fecaca;\">high in calories<\/mark>, but it also contains proteins, minerals, and antioxidants.","cn":"在国内，厨师们热情地使用它。它当然<mark style=\"background-color: #fecaca;\">热量很高<\/mark>，但它也含有蛋白质、矿物质和抗氧化剂。","analysis":""},{"time":"00:07:04,000 --> 00:07:11,000","html":"As such, it is still relatively <mark style=\"background-color: #bbf7d0;\">healthy<\/mark> when you compare it with sugar or corn syrup.","cn":"因此，与糖或玉米糖浆相比，它仍然相对<mark style=\"background-color: #bbf7d0;\">健康<\/mark>。","analysis":"<strong>答案解析：<\/strong> 第40题问与其他甜味剂相比，枫糖浆相当什么。原文提到 \"it is still relatively <mark style=\"background-color: #bbf7d0;\">healthy<\/mark> when you compare it with sugar or corn syrup\" (与糖或玉米糖浆相比，它仍然相对健康)。因此，正确答案是 \"healthy\" (健康)。 “high in calories” (热量很高) 是枫糖浆的一个特点，但与问题中的“与其他甜味剂相比”的“健康”属性是不同的概念，在比较中，“healthy”是更积极且贴切的描述，故“high in calories”是干扰项。"},{"time":"00:07:11,000 --> 00:07:18,000","html":"Canadians are proud of maple syrup and its deep roots in our history and geography.","cn":"加拿大人为枫糖浆及其在我国历史和地理中的深厚根基感到自豪。","analysis":""},{"time":"00:07:18,000 --> 00:07:29,000","html":"However, the primary reason for maple syrup success around the world remains its taste. There's nothing quite like it.","cn":"然而，枫糖浆在全球取得成功的主要原因仍然是它的味道。没有什么能比得上它。","analysis":""},{"time":"00:07:29,000 --> 00:07:36,000","html":"That is the end of section 4. You now have half a minute to check your answers.","cn":"第四部分到此结束。你现在有半分钟时间检查答案。","analysis":""},{"time":"00:07:59,000 --> 00:08:02,000","html":"You","cn":"你","analysis":""},{"time":"00:08:29,000 --> 00:08:31,000","html":"You","cn":"你","analysis":""}],"transcriptHighlights":[{"qid":"31","text":"different","answer":"different"},{"qid":"32","text":"meat","answer":"meat"},{"qid":"33","text":"tradition","answer":"tradition"},{"qid":"34","text":"steam","answer":"steam"},{"qid":"35","text":"ice","answer":"ice"},{"qid":"36","text":"medicine","answer":"medicine"},{"qid":"37","text":"tax","answer":"tax"},{"qid":"38","text":"insects","answer":"insects"},{"qid":"39","text":"competition","answer":"competition"},{"qid":"40","text":"healthy","answer":"healthy"}],"ownerInfo":"此内容由🍠@Listening 永不虾滑整理，仅作为分享供个人使用；禁止商用、倒卖和引流。有问题请先仔细看🍠这个账号的置顶和分享贴。没有团队，不是机构，纯个人分享。督学和其他相关课程请咨询主页另一个号@心情有点虾滑（不回任何机经相关消息）。"}</script>

function buildTranscript(){let lines=DATA.transcriptLines||[];$('#transcript').classList.remove('hide-cn','hide-analysis');$('#transcript').innerHTML=lines.length?`<h3>Listening Transcript</h3>${lines.map(transcriptLineHTML).join('')}<p>&nbsp;</p>`:'<h3>Listening Transcript</h3><p>No transcript was provided in the source file.</p><p>&nbsp;</p>'}
function studyLines(){return (DATA.transcriptLines||[]).filter(x=>x&&typeof x==='object'&&x.html!==undefined)}
function studyCueHTML(x,i){let html=sanitizeTranscriptHtml(x.html),cn=x.cn?`<div class="cue-cn">${sanitizeTranscriptHtml(x.cn)}</div>`:'',analysis=x.analysis?`<div class="cue-analysis">${sanitizeTranscriptHtml(x.analysis)}</div>`:'',saved=esc(dictationAnswers[i]||''),box=dictationMode?`<textarea class="dictation-box" data-idx="${i}" placeholder="输入你听到的内容..." onclick="event.stopPropagation()">${saved}</textarea>`:'';return `<button class="study-cue" type="button" data-idx="${i}"><span class="cue-time">${esc(formatCueTime(x.time))}</span><p>${html}</p>${cn}${analysis}${box}</button>`}
function buildIntensive(){let lines=studyLines(),panel=$('#transcript');panel.classList.toggle('hide-cn',!showCn);panel.classList.toggle('hide-analysis',!showAnalysis);panel.classList.toggle('dictation-mode',dictationMode);panel.classList.toggle('show-original',showOriginal);panel.innerHTML=lines.length?`<div class="study-head"><h3>原文和精听</h3><div class="study-controls"><button id="prevCue" type="button">上一句</button><button id="playCue" type="button">播放 / 暂停</button><button id="nextCue" type="button">下一句</button><button id="loopCue" type="button" class="${loopCue?'active':''}">循环当前句</button><button id="slowCue" type="button" class="${slowCue?'active':''}">0.8x 慢速</button></div><div class="study-controls"><button id="dictationCue" type="button" class="${dictationMode?'active':''}">听写模式</button><button id="originalCue" type="button" class="${showOriginal?'active':''}">显示原文</button><button id="cnCue" type="button" class="${showCn?'active':''}">显示中文</button><button id="analysisCue" type="button" class="${showAnalysis?'active':''}">显示解析</button></div></div><div class="study-list">${lines.map(studyCueHTML).join('')}</div><p>&nbsp;</p>`:'<h3>原文和精听</h3><p>No timed transcript was provided.</p><p>&nbsp;</p>';bindStudyControls();setActiveCue(currentCue)}
function toggleIntensive(){let main=$('#main');if(main.classList.contains('split')&&$('#transcript .study-head')){main.classList.remove('split');return}main.classList.add('split');buildIntensive()}
function bindStudyControls(){let panel=$('#transcript');panel.querySelectorAll('.study-cue').forEach(btn=>btn.onclick=e=>{if(e.target.closest('.dictation-box'))return;playCue(Number(btn.dataset.idx))});panel.querySelectorAll('.dictation-box').forEach(box=>{box.oninput=()=>{dictationAnswers[box.dataset.idx]=box.value;save(false)}});$('#prevCue')?.addEventListener('click',()=>playCue(Math.max(0,(currentCue<0?0:currentCue-1))));$('#nextCue')?.addEventListener('click',()=>playCue(Math.min(studyLines().length-1,(currentCue<0?0:currentCue+1))));$('#playCue')?.addEventListener('click',()=>audio.paused?audio.play():audio.pause());$('#loopCue')?.addEventListener('click',()=>{loopCue=!loopCue;buildIntensive();save(false)});$('#slowCue')?.addEventListener('click',()=>{slowCue=!slowCue;audio.playbackRate=slowCue ? 0.8 : +$('#speed').value;buildIntensive();save(false)});$('#cnCue')?.addEventListener('click',()=>{showCn=!showCn;buildIntensive();save(false)});$('#analysisCue')?.addEventListener('click',()=>{showAnalysis=!showAnalysis;buildIntensive();save(false)});$('#dictationCue')?.addEventListener('click',()=>{dictationMode=!dictationMode;if(dictationMode){showOriginal=false;showCn=false;showAnalysis=false}else{showOriginal=true;showCn=true;showAnalysis=true}buildIntensive();save(false)});$('#originalCue')?.addEventListener('click',()=>{showOriginal=!showOriginal;buildIntensive();save(false)})}
function playCue(i){let lines=studyLines();if(!lines.length)return;currentCue=Math.max(0,Math.min(i,lines.length-1));let r=cueRange(lines[currentCue]);audio.currentTime=r.start||0;if(slowCue)audio.playbackRate=.8;audio.play();setActiveCue(currentCue);save(false)}
function setActiveCue(i){$$('.study-cue').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.idx)===i));let active=$(`.study-cue[data-idx="${i}"]`);active?.scrollIntoView({block:'nearest'})}
function maintainCueLoop(){if(currentCue<0||!loopCue)return;let line=studyLines()[currentCue],r=cueRange(line);if(r.end&&audio.currentTime>=r.end-.05){audio.currentTime=r.start||0;audio.play()}}
function showToast(msg='Progress saved!'){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1400)}
function collectAnswers(){let answers={text:{},single:{},multiple:{},matching:{},map:{}};$$('#content input[name^="q"]').forEach(i=>answers.text[i.name]=i.value);$$('.single-choice.selected').forEach(c=>answers.single[c.dataset.name]=c.dataset.value);$$('.map-choice.selected').forEach(c=>answers.map[c.dataset.name]=c.dataset.value);let names=[...new Set($$('.multi-choice').map(c=>c.dataset.name))];names.forEach(name=>answers.multiple[name]=$$(`.multi-choice[data-name="${name}"].selected`).map(c=>c.dataset.value));$$('.slot').forEach(s=>{let tag=s.querySelector('.tag');if(tag)answers.matching[s.dataset.q]=tag.dataset.value});return answers}
function restoreAnswers(a={}){hardResetAnswers();Object.entries(a.text||{}).forEach(([name,val])=>{let el=$(`input[name="${name}"]`);if(el)el.value=val});Object.entries(a.single||{}).forEach(([name,val])=>{let el=$(`.single-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.map||{}).forEach(([name,val])=>{let el=$(`.map-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.multiple||{}).forEach(([name,vals])=>(vals||[]).forEach(val=>{let el=$(`.multi-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')}));Object.entries(a.matching||{}).forEach(([qid,val])=>{let opt=$(`.drag[data-value="${val}"]`),slot=$(`.slot[data-q="${qid}"]`);if(opt&&slot)slot.innerHTML=`<span class="tag" draggable="true" data-value="${val}">${esc(opt.textContent)}</span>`});refreshPool();restoreDragging();updateNav()}
function contentSnapshot(){let clone=$('#content').cloneNode(true);clone.querySelectorAll('.review').forEach(r=>r.remove());clone.querySelectorAll('input').forEach(i=>{i.setAttribute('value',i.value);i.removeAttribute('disabled')});clone.querySelectorAll('.choice').forEach(c=>c.classList.remove('disabled'));return clone.innerHTML}
function notesSnapshot(){$$('#notesList textarea').forEach(t=>{t.textContent=t.value;t.setAttribute('data-value',t.value)});return $('#notesList').innerHTML}
function layoutSignature(){return JSON.stringify([RENDER_VERSION,(DATA.groups||[]).map(g=>[g.type,g.layout||'',g.id||'',g.title||'',(g.questions||[]).map(q=>String(q.id||q[0]||''))])])}
function save(show=false){let data={secs,answers:collectAnswers(),contentHtml:contentSnapshot(),layoutSignature:layoutSignature(),notes:notesSnapshot(),dark:document.body.classList.contains('dark'),font:document.documentElement.style.fontSize,dictationAnswers,studyState:{currentCue,loopCue,slowCue,showCn,showAnalysis,dictationMode,showOriginal},audioTime:audio?.currentTime||0};localStorage.setItem(storeKey,JSON.stringify(data));if(show)showToast()}
function load(){let raw=localStorage.getItem(storeKey);if(!raw)return;let d;try{d=JSON.parse(raw)}catch(err){console.warn('Saved progress could not be read.',err);return}secs=d.secs||0;if(d.contentHtml&&d.layoutSignature===layoutSignature()){try{$('#content').innerHTML=d.contentHtml;bindDynamic()}catch(err){console.warn('Saved question view could not be restored.',err)}}if(d.answers){try{restoreAnswers(d.answers)}catch(err){console.warn('Saved answers could not be restored.',err)}}if(d.dictationAnswers)dictationAnswers=d.dictationAnswers;if(d.studyState)try{({currentCue=currentCue,loopCue=loopCue,slowCue=slowCue,showCn=showCn,showAnalysis=showAnalysis,dictationMode=dictationMode,showOriginal=showOriginal}=d.studyState)}catch(err){console.warn('Study state could not be restored.',err)}if(d.notes){try{$('#notesList').innerHTML=d.notes;$$('#notesList textarea').forEach(t=>{t.value=t.dataset.value||t.textContent||''})}catch(err){console.warn('Saved notes could not be restored.',err)}}if(d.dark)document.body.classList.add('dark');setFontSize(d.font||DEFAULT_FONT_SIZE,false);if(d.audioTime)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=d.audioTime},{once:true});bindNoteDeletes();drawTimer()}
function handleSelection(e){if(e.target.closest('#selbar,#notes,.bottom-bar'))return;let sel=window.getSelection();let hl=e.target.closest?.('.hl-brown,.hl-rose,.hl-blue');let bar=$('#selbar');if(hl&&sel.isCollapsed){bar.targetElem=hl;placeBar(bar,hl.getBoundingClientRect())}else if(sel&&!sel.isCollapsed&&$('#content').contains(sel.anchorNode)){bar.targetElem=null;placeBar(bar,sel.getRangeAt(0).getBoundingClientRect())}else{bar.hidden=true}}
function placeBar(bar,rect){bar.hidden=false;bar.style.left=Math.max(8,window.scrollX+rect.left+rect.width/2-95)+'px';bar.style.top=Math.max(8,window.scrollY+rect.top-46)+'px'}
function highlightedFromSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let node=sel.anchorNode?.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode;return node?.closest?.('.hl-brown,.hl-rose,.hl-blue')||null}
function handleToolbar(e){let act=e.target.closest('button')?.dataset.act;if(!act)return;let bar=$('#selbar'),target=bar.targetElem||highlightedFromSelection(),sel=window.getSelection();if(act==='del'&&target){unwrap(target);removeNote(target.dataset.hid)}else if(act==='hl'){if(target){if(target.classList.contains('hl-brown'))target.className='hl-rose';else if(target.classList.contains('hl-rose'))target.className='hl-rose';else target.className='hl-brown'}else{let span=wrapSelection('hl-brown');if(span)span.dataset.hid='h_'+Date.now()}}else if(act==='note'){let span=target||wrapSelection('hl-blue');if(span){span.className='hl-blue';if(!span.dataset.hid)span.dataset.hid='n_'+Date.now();createNote(span);document.body.classList.add('notes-open')}}bar.hidden=true;sel.removeAllRanges();save(false)}
function wrapSelection(cls){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let range=sel.getRangeAt(0);if(!$('#content').contains(range.commonAncestorContainer))return null;let span=document.createElement('span');span.className=cls;try{range.surroundContents(span)}catch{return null}return span}
function unwrap(el){let p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize()}
function clearUserHighlights(){$$('.hl-brown,.hl-rose,.hl-blue').forEach(unwrap)}
function createNote(span){let id=span.dataset.hid;if($(`.note-card[data-hid="${id}"]`))return;let card=document.createElement('div');card.className='note-card';card.dataset.hid=id;card.innerHTML=`<div class="note-quote">${esc(span.textContent.slice(0,120))}</div><textarea placeholder="Write note here..."></textarea><button class="delete-note" type="button">Delete</button>`;$('#notesList').prepend(card);bindNoteDeletes()}
function bindNoteDeletes(){$$('#notesList textarea').forEach(t=>t.oninput=()=>save(false));$$('.delete-note').forEach(btn=>btn.onclick=()=>{let card=btn.closest('.note-card'),id=card.dataset.hid,span=$(`[data-hid="${id}"]`);if(span)unwrap(span);card.remove();save(false)})}
function removeNote(id){if(!id)return;$(`.note-card[data-hid="${id}"]`)?.remove()}
function drawTimer(){let m=Math.floor(secs/60),s=secs%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
const DEFAULT_FONT_SIZE=16,MIN_FONT_SIZE=14,MAX_FONT_SIZE=22;
function currentFontSize(){return Number.parseInt(document.documentElement.style.fontSize,10)||DEFAULT_FONT_SIZE}
function setFontSize(size,persist=true){let n=Math.max(MIN_FONT_SIZE,Math.min(MAX_FONT_SIZE,Number(size)||DEFAULT_FONT_SIZE));document.documentElement.style.fontSize=n===DEFAULT_FONT_SIZE?'':n+'px';updateSizeButtons();if(persist)save(false)}
function adjustFontSize(delta){setFontSize(currentFontSize()+delta,true)}
function updateSizeButtons(){let size=currentFontSize(),dark=document.body.classList.contains('dark');$('#fontMinus')?.toggleAttribute('disabled',size<=MIN_FONT_SIZE);$('#fontPlus')?.toggleAttribute('disabled',size>=MAX_FONT_SIZE);$('#fontDefault')?.classList.toggle('active',size===DEFAULT_FONT_SIZE);$('#lightBtn')?.classList.toggle('active',!dark);$('#darkBtn')?.classList.toggle('active',dark)}
function resetAppearance(persist=true){document.body.classList.remove('dark');setFontSize(DEFAULT_FONT_SIZE,false);updateSizeButtons();if(persist)save(false)}
function clearAllProgress(){localStorage.removeItem(storeKey)}
$('#finish').onclick=finish;$('#save').onclick=()=>save(true);$('#clear').onclick=()=>{if(confirm('Clear all progress?')){window.resetTest();showToast('Clear complete')}};$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-open');save(false)};$('#closeNotes').onclick=()=>{document.body.classList.remove('notes-open');save(false)};$('#toggleIntensive').onclick=()=>{toggleIntensive();save(false)};$('#settingsBtn').onclick=()=>{$('#settings').classList.toggle('open');updateSizeButtons()};$('#lightBtn').onclick=()=>{document.body.classList.remove('dark');updateSizeButtons();save(false)};$('#darkBtn').onclick=()=>{document.body.classList.add('dark');updateSizeButtons();save(false)};$('#appearanceReset').onclick=()=>resetAppearance(true);$('#fontMinus').onclick=()=>adjustFontSize(-1);$('#fontPlus').onclick=()=>adjustFontSize(1);$('#fontDefault').onclick=()=>setFontSize(DEFAULT_FONT_SIZE,true);$('#settings').addEventListener('wheel',e=>{e.preventDefault();adjustFontSize(e.deltaY>0?-1:1)},{passive:false});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey)return;let key=e.key;if(key==='+'||key==='='){e.preventDefault();adjustFontSize(1)}else if(key==='-'||key==='_'){e.preventDefault();adjustFontSize(-1)}else if(key==='0'){e.preventDefault();resetAppearance(true)}});
const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
</script>
