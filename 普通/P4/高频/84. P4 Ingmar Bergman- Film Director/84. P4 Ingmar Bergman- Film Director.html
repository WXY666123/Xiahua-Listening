rt of a lecture on the Swedish film director, Ingmar Bergman, given","cn":"4. 您将听到关于瑞典电影导演英格玛·伯格曼讲座的一部分内容，该讲座由","analysis":""},{"time":"00:00:08,640 --> 00:00:14,840","html":"to media study students by a film critic. First, you have some time to look at questions","cn":"一位影评人面向媒体研究学生进行。首先，您将有一些时间查看问题","analysis":""},{"time":"00:00:14,840 --> 00:01:00,000","html":"31 to 40.","cn":"31至40。","analysis":""},{"time":"00:01:00,000 --> 00:01:14,520","html":"Now listen carefully and answer questions 31 to 40.","cn":"现在请仔细聆听并回答问题31至40。","analysis":""},{"time":"00:01:14,520 --> 00:01:20,240","html":"You can read a great novel, listen to a great symphony, or go to see a painting by a great","cn":"你可以阅读一部伟大的小说，聆听一部伟大的交响乐，或者去欣赏一幅伟大","analysis":""},{"time":"00:01:20,240 --> 00:01:26,800","html":"artist, and you'll want to experience it again and again. And every time you do, you'll","cn":"艺术家的画作，你会想一遍又一遍地体验它。每一次体验，你都会","analysis":""},{"time":"00:01:26,800 --> 00:01:34,520","html":"learn something new from it. Very few films achieve this. Most of them are mere <mark style=\"background-color: #fecaca;\">entertainment<\/mark>","cn":"从中学习到新的东西。很少有电影能做到这一点。它们大多只是纯粹的<mark style=\"background-color: #fecaca;\">娱乐<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题31询问大多数电影缺乏什么，而文本提到“Most of them are mere entertainment” （它们大多只是纯粹的娱乐），“entertainment”是电影的特点而非缺乏的东西，故为干扰项。"},{"time":"00:01:34,520 --> 00:01:40,400","html":"and very few of them could be said to be <mark style=\"background-color: #fecaca;\">works of art<\/mark>. They simply don't have the <mark style=\"background-color: #bbf7d0;\">depth<\/mark>","cn":"很少有电影能被称为<mark style=\"background-color: #fecaca;\">艺术品<\/mark>。它们根本不具备艺术品所拥有的<mark style=\"background-color: #bbf7d0;\">深度<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题31询问大多数电影缺乏什么以成为伟大的艺术品。文本明确指出“They simply don't have the depth that a work of art has”，因此“depth”是正确答案。 “works of art”是问题上下文提到的概念，但不是所缺乏的特质，故为干扰项。"},{"time":"00:01:40,400 --> 00:01:45,320","html":"that a work of art has, and this means that you may see them once, but you won't want","cn":"这意味着你可能只看一次，但不会想再看","analysis":""},{"time":"00:01:45,320 --> 00:01:48,080","html":"to watch them again.","cn":"一遍。","analysis":""},{"time":"00:01:48,080 --> 00:01:55,000","html":"Why is it that so many commercial films today have such a limited shelf life? One problem","cn":"为什么如今这么多商业电影的保质期如此有限？一个问题是","analysis":""},{"time":"00:01:55,000 --> 00:01:59,920","html":"is that for many films, once you've seen them once and you know what happens, that's","cn":"许多电影一旦你看过一次并知道了情节，就完了。","analysis":""},{"time":"00:01:59,920 --> 00:02:06,160","html":"it. They rely on the element of surprise to keep you interested, and once that's lost,","cn":"它们依靠惊喜元素来保持你的兴趣，一旦惊喜消失，","analysis":""},{"time":"00:02:06,160 --> 00:02:10,960","html":"that feeling of what's going to happen next, there's nothing left.","cn":"那种接下来会发生什么的感觉也随之消失，就什么也不剩了。","analysis":""},{"time":"00:02:10,960 --> 00:02:16,520","html":"In addition, the commercial nature of filmmaking means that rather than focusing on the development","cn":"此外，电影制作的商业性质意味着，电影不是专注于角色的发展，","analysis":""},{"time":"00:02:16,520 --> 00:02:22,920","html":"of characters in the film, many films are just becoming vehicles for <mark style=\"background-color: #bbf7d0;\">actors<\/mark>, <mark style=\"background-color: #fecaca;\">box office<\/mark>","cn":"许多电影只是成功<mark style=\"background-color: #bbf7d0;\">演员<\/mark>的载体，<mark style=\"background-color: #fecaca;\">票房<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题32询问现代商业电影依赖于使用成功的什么。文本指出“many films are just becoming vehicles for actors, box office successes”，所以“actors”是正确答案。 “box office successes”描述的是成功的结果，而非电影依赖于使用的人，故为干扰项。"},{"time":"00:02:22,920 --> 00:02:29,400","html":"<mark style=\"background-color: #fecaca;\">successes<\/mark>, who essentially play the same part each time. Then, as well as this, many critics","cn":"<mark style=\"background-color: #fecaca;\">成功<\/mark>的演员每次都扮演同样的角色。此外，许多评论家","analysis":"<strong>答案解析：<\/strong> 问题32询问现代商业电影依赖于使用成功的什么。文本指出“many films are just becoming vehicles for actors, box office successes”，所以“actors”是正确答案。 “box office successes”描述的是成功的结果，而非电影依赖于使用的人，故为干扰项。"},{"time":"00:02:29,400 --> 00:02:34,800","html":"would argue that the greatest black and white films had their own special world with","cn":"会认为最伟大的黑白电影拥有自己独特的氛围世界，","analysis":""},{"time":"00:02:34,800 --> 00:02:40,960","html":"its own <mark style=\"background-color: #fecaca;\">special atmosphere<\/mark>, and that nowadays it's harder to create this because the director","cn":"有其独特的<mark style=\"background-color: #fecaca;\">特殊氛围<\/mark>，而如今很难再创造出这种氛围，因为导演","analysis":"<strong>答案解析：<\/strong> 问题33询问导演不会使用什么来创造氛围。文本提到“greatest black and white films had their own special world with its own special atmosphere”，但“special atmosphere”是结果而非创造氛围的工具，故为干扰项。"},{"time":"00:02:40,960 --> 00:02:44,760","html":"is unable to play with <mark style=\"background-color: #bbf7d0;\">light<\/mark> in the same way.","cn":"无法再像以前那样运用<mark style=\"background-color: #bbf7d0;\">光线<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题33询问导演不会使用什么来创造氛围。文本指出“it's harder to create this because the director is unable to play with light in the same way”，表明“light”是创造氛围的关键要素，故为正确答案。"},{"time":"00:02:44,760 --> 00:02:50,040","html":"Another problem is that many directors lack the ability to focus the camera on the important","cn":"另一个问题是许多导演缺乏将镜头聚焦于重要点的能力。","analysis":""},{"time":"00:02:50,040 --> 00:02:56,240","html":"points. There may be impressive visual images, but they don't contribute to the meaning","cn":"可能有令人印象深刻的视觉画面，但它们对电影的意义没有贡献。","analysis":""},{"time":"00:02:56,240 --> 00:03:02,320","html":"of the film. 。","cn":"","analysis":""},{"time":"00:03:02,320 --> 00:03:10,120","html":"Which brings me on to Ingmar Bergman, the great Swedish film director who died in 2007.","cn":"这让我联想到英格玛·伯格曼，这位伟大的瑞典电影导演于2007年去世。","analysis":""},{"time":"00:03:10,120 --> 00:03:16,760","html":"No other director has equaled Bergman in his ability to convey <mark style=\"background-color: #bbf7d0;\">emotion<\/mark>. His films have","cn":"在传达<mark style=\"background-color: #bbf7d0;\">情感<\/mark>的能力上，没有其他导演能与伯格曼媲美。他的电影拥有","analysis":"<strong>答案解析：<\/strong> 问题34询问伯格曼独特的表现能力。文本明确指出“No other director has equaled Bergman in his ability to convey emotion”，因此“emotion”是正确答案。"},{"time":"00:03:16,760 --> 00:03:23,720","html":"the <mark style=\"background-color: #fecaca;\">dramatic force<\/mark> of a work by the world's greatest playwrights such as Ibsen or Shakespeare.","cn":"世界上最伟大剧作家（如易卜生或莎士比亚）作品的<mark style=\"background-color: #fecaca;\">戏剧张力<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题34询问伯格曼独特的表现能力。文本提到“His films have the dramatic force”，但这指的是电影的特点而非伯格曼独特表现的能力，故为干扰项。"},{"time":"00:03:23,720 --> 00:03:31,080","html":"Watching Bergman's films is an enriching experience. Nothing is immediately obvious or predictable,","cn":"观看伯格曼的电影是一种丰富的体验。没有什么是显而易见或可预测的，","analysis":""},{"time":"00:03:31,080 --> 00:03:35,480","html":"but gradually it becomes clear where he is taking you.","cn":"但你逐渐会明白他要带你去往何方。","analysis":""},{"time":"00:03:35,480 --> 00:03:42,560","html":"If you study a film such as Wild Strawberries, you'll see that every little <mark style=\"background-color: #fecaca;\">detail<\/mark> is <mark style=\"background-color: #fecaca;\">significant<\/mark>.","cn":"如果你研究像《野草莓》这样的电影，你会发现每一个小<mark style=\"background-color: #fecaca;\">细节<\/mark>都<mark style=\"background-color: #fecaca;\">意义重大<\/mark>。","analysis":"<strong>答案解析：<\/strong> 问题35询问每一个图像有什么，并对整体意义做出贡献。文本提到“every little detail is significant”， “detail”和“significant”是描述性的词语，而不是图像本身所拥有的东西，故为干扰项。"},{"time":"00:03:42,560 --> 00:03:48,680","html":"Each image on the screen is there for a <mark style=\"background-color: #bbf7d0;\">purpose<\/mark>, and gradually builds up an understanding","cn":"屏幕上的每一个图像都有其<mark style=\"background-color: #bbf7d0;\">目的<\/mark>，并逐渐建立起对","analysis":"<strong>答案解析：<\/strong> 问题35询问每一个图像有什么，并对整体意义做出贡献。文本明确指出“Each image on the screen is there for a purpose”，因此“purpose”是正确答案。"},{"time":"00:03:48,680 --> 00:03:55,400","html":"of the central <mark style=\"background-color: #fecaca;\">meaning<\/mark>. With Bergman too, you know that a small <mark style=\"background-color: #fecaca;\">gesture<\/mark> made by a character","cn":"中心<mark style=\"background-color: #fecaca;\">意义<\/mark>的理解。对于伯格曼的电影，你也知道角色做的一个小<mark style=\"background-color: #fecaca;\">手势<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题35询问每一个图像有什么，并对整体意义做出贡献。文本提到“builds up an understanding of the central meaning”，这里的“meaning”是图像所贡献的结果，而非图像本身拥有的东西，故为干扰项。 问题36询问角色的手势或面部表情与什么同样重要。文本提到“a small gesture made by a character”，这是手势本身，而不是空白处需要填写的与手势同等重要的内容，故为干扰项。"},{"time":"00:03:55,400 --> 00:04:02,400","html":"or the <mark style=\"background-color: #fecaca;\">expression on a character's face<\/mark> can tell you just as much as the <mark style=\"background-color: #bbf7d0;\">words<\/mark> uttered.","cn":"或<mark style=\"background-color: #fecaca;\">角色脸上的表情<\/mark>所传达的信息，可能与说出的<mark style=\"background-color: #bbf7d0;\">话语<\/mark>一样多。","analysis":"<strong>答案解析：<\/strong> 问题36询问角色的手势或面部表情与什么同样重要。文本明确指出“expression on a character's face can tell you just as much as the words uttered”，因此“words”是正确答案。“expression on a character's face”是问题中提到的一个要素，但不是空白处需要填写的与其同等重要的内容，故为干扰项。"},{"time":"00:04:02,400 --> 00:04:07,800","html":"In his film Persona, the central character says nothing, but meaning is conveyed by","cn":"在他的电影《假面》中，中心角色一言不发，但意义通过","analysis":""},{"time":"00:04:07,800 --> 00:04:10,840","html":"what we see on the screen.","cn":"我们所看到的屏幕画面传达。","analysis":""},{"time":"00:04:10,840 --> 00:04:16,840","html":"But Bergman wasn't just a great cinematographer. He was also a great storyteller.","cn":"但伯格曼不只是一位伟大的电影摄影师，他也是一位伟大的故事讲述者。","analysis":""},{"time":"00:04:16,840 --> 00:04:23,280","html":"Each of his films follows a similar pattern in that the story is organized on two levels.","cn":"他的每部电影都遵循相似的模式，故事被组织在两个层面。","analysis":""},{"time":"00:04:23,280 --> 00:04:29,520","html":"Firstly, on the level of a straightforward, <mark style=\"background-color: #fecaca;\">dramatic narrative<\/mark>. But secondly, on the level","cn":"首先，是直接的<mark style=\"background-color: #fecaca;\">戏剧叙事<\/mark>层面。其次，是","analysis":"<strong>答案解析：<\/strong> 问题37询问他的故事在两个层面运作，一是戏剧，二是别的什么。文本指出“Firstly, on the level of a straightforward, dramatic narrative”，这指的是第一个层面，不是问题中空白处所要填写的第二个层面，故为干扰项。"},{"time":"00:04:29,520 --> 00:04:35,640","html":"of <mark style=\"background-color: #bbf7d0;\">myth<\/mark>, and the story works throughout the film on both these levels.","cn":"<mark style=\"background-color: #bbf7d0;\">神话<\/mark>层面，故事在这两个层面贯穿整部电影。","analysis":"<strong>答案解析：<\/strong> 问题37询问他的故事在两个层面运作，一是戏剧，二是别的什么。文本明确指出“But secondly, on the level of myth”，因此“myth”是正确答案。"},{"time":"00:04:35,640 --> 00:04:41,080","html":"In Bergman's film Wild Strawberries, an old man travels back to the places he knew as","cn":"在伯格曼的电影《野草莓》中，一位老人回到了他小时候和年轻时熟悉的地方。","analysis":""},{"time":"00:04:41,080 --> 00:04:48,240","html":"a child and a young man. In the film, we can identify themes that occur again and again","cn":"在电影中，我们可以识别出伯格曼作品中反复出现的主题。","analysis":""},{"time":"00:04:48,240 --> 00:04:54,960","html":"in Bergman's work. First of all, we have the idea of the <mark style=\"background-color: #fecaca;\">journey<\/mark>. Part of the <mark style=\"background-color: #fecaca;\">journey<\/mark>","cn":"首先，我们有<mark style=\"background-color: #fecaca;\">旅程<\/mark>的理念。部分<mark style=\"background-color: #fecaca;\">旅程<\/mark>","analysis":"<strong>答案解析：<\/strong> 问题38询问旅程与什么之间的联系。文本提到“we have the idea of the journey”，虽然“journey”是主题之一，但问题问的是旅程与另一个主题的联系，因此“journey”本身是问题的一部分而不是答案，故为干扰项。"},{"time":"00:04:54,960 --> 00:05:01,720","html":"is a <mark style=\"background-color: #fecaca;\">real one<\/mark>, but linked with that is the theme of <mark style=\"background-color: #bbf7d0;\">dreams<\/mark>, where they can take us and","cn":"是<mark style=\"background-color: #fecaca;\">真实的<\/mark>，但与之相关联的是<mark style=\"background-color: #bbf7d0;\">梦境<\/mark>的主题，梦境能带我们去向何方以及我们能从中学习到什么。","analysis":"<strong>答案解析：<\/strong> 问题38询问旅程与什么之间的联系。文本指出“linked with that is the theme of dreams”，因此“dreams”是正确答案。“real one”是描述旅程的，而非与旅程相关的另一个主题，故为干扰项。"},{"time":"00:05:01,720 --> 00:05:06,360","html":"what we can learn from them. Another theme, which was to be central","cn":"。另一个贯穿","analysis":""},{"time":"00:05:06,360 --> 00:05:12,120","html":"to Bergman's work throughout his life, is that of <mark style=\"background-color: #fecaca;\">relationships<\/mark>, and in particular,","cn":"伯格曼一生作品的核心主题是<mark style=\"background-color: #fecaca;\">关系<\/mark>，尤其是","analysis":"<strong>答案解析：<\/strong> 问题39询问何种关系。文本提到“is that of relationships”，但问题需要更具体的类型。因此“relationships”是更宽泛的主题，不是最具体的答案，故为干扰项。"},{"time":"00:05:12,120 --> 00:05:19,000","html":"the ties that join the members of a <mark style=\"background-color: #bbf7d0;\">family<\/mark> together. And finally, as the old man in Wild","cn":"维系一个<mark style=\"background-color: #bbf7d0;\">家庭<\/mark>成员的纽带。最后，正如《野草莓》中的老人在","analysis":"<strong>答案解析：<\/strong> 问题39询问何种关系。文本明确指出“in particular, the ties that join the members of a family together”，因此“family”是正确答案。"},{"time":"00:05:19,000 --> 00:05:24,680","html":"Strawberries struggles to make sense of his life, we have another theme which underlies all","cn":"挣扎着理解自己的人生时，我们看到了另一个贯穿他所有作品的主题。","analysis":""},{"time":"00:05:24,680 --> 00:05:31,560","html":"his work. No matter how <mark style=\"background-color: #fecaca;\">anxious<\/mark> or <mark style=\"background-color: #fecaca;\">unhappy<\/mark> his characters may appear to be, and that","cn":"无论他的角色看起来多么<mark style=\"background-color: #fecaca;\">焦虑<\/mark>或<mark style=\"background-color: #fecaca;\">不快乐<\/mark>，这个主题就是，","analysis":"<strong>答案解析：<\/strong> 问题40询问需要如何对待生活中提供的一切。文本中“anxious”和“unhappy”描述的是角色的情绪状态，而不是空白处需要填写的动词，故为干扰项。"},{"time":"00:05:31,560 --> 00:05:39,000","html":"is, that we have to <mark style=\"background-color: #bbf7d0;\">accept<\/mark> everything t function studyLines(){return (DATA.transcriptLines||[]).filter(x=>x&&typeof x==='object'&&x.html!==undefined)}
function studyCueHTML(x,i){let html=sanitizeTranscriptHtml(x.html),cn=x.cn?`<div class="cue-cn">${sanitizeTranscriptHtml(x.cn)}</div>`:'',analysis=x.analysis?`<div class="cue-analysis">${sanitizeTranscriptHtml(x.analysis)}</div>`:'',saved=esc(dictationAnswers[i]||''),box=dictationMode?`<textarea class="dictation-box" data-idx="${i}" placeholder="输入你听到的内容..." onclick="event.stopPropagation()">${saved}</textarea>`:'';return `<button class="study-cue" type="button" data-idx="${i}"><span class="cue-time">${esc(formatCueTime(x.time))}</span><p>${html}</p>${cn}${analysis}${box}</button>`}
function buildIntensive(){let lines=studyLines(),panel=$('#transcript');panel.classList.toggle('hide-cn',!showCn);panel.classList.toggle('hide-analysis',!showAnalysis);panel.classList.toggle('dictation-mode',dictationMode);panel.classList.toggle('show-original',showOriginal);panel.innerHTML=lines.length?`<div class="study-head"><h3>原文和精听</h3><div class="study-controls"><button id="prevCue" type="button">上一句</button><button id="playCue" type="button">播放 / 暂停</button><button id="nextCue" type="button">下一句</button><button id="loopCue" type="button" class="${loopCue?'active':''}">循环当前句</button><button id="slowCue" type="button" class="${slowCue?'active':''}">0.8x 慢速</button></div><div class="study-controls"><button id="dictationCue" type="button" class="${dictationMode?'active':''}">听写模式</button><button id="originalCue" type="button" class="${showOriginal?'active':''}">显示原文</button><button id="cnCue" type="button" class="${showCn?'active':''}">显示中文</button><button id="analysisCue" type="button" class="${showAnalysis?'active':''}">显示解析</button></div></div><div class="study-list">${lines.map(studyCueHTML).join('')}</div><p>&nbsp;</p>`:'<h3>原文和精听</h3><p>No timed transcript was provided.</p><p>&nbsp;</p>';bindStudyControls();setActiveCue(currentCue)}
function toggleIntensive(){let main=$('#main');if(main.classList.contains('split')&&$('#transcript .study-head')){main.classList.remove('split');return}main.classList.add('split');buildIntensive()}
function bindStudyControls(){let panel=$('#transcript');panel.querySelectorAll('.study-cue').forEach(btn=>btn.onclick=e=>{if(e.target.closest('.dictation-box'))return;playCue(Number(btn.dataset.idx))});panel.querySelectorAll('.dictation-box').forEach(box=>{box.oninput=()=>{dictationAnswers[box.dataset.idx]=box.value;save(false)}});$('#prevCue')?.addEventListener('click',()=>playCue(Math.max(0,(currentCue<0?0:currentCue-1))));$('#nextCue')?.addEventListener('click',()=>playCue(Math.min(studyLines().length-1,(currentCue<0?0:currentCue+1))));$('#playCue')?.addEventListener('click',()=>audio.paused?audio.play():audio.pause());$('#loopCue')?.addEventListener('click',()=>{loopCue=!loopCue;buildIntensive();save(false)});$('#slowCue')?.addEventListener('click',()=>{slowCue=!slowCue;audio.playbackRate=slowCue ? 0.8 : +$('#speed').value;buildIntensive();save(false)});$('#cnCue')?.addEventListener('click',()=>{showCn=!showCn;buildIntensive();save(false)});$('#analysisCue')?.addEventListener('click',()=>{showAnalysis=!showAnalysis;buildIntensive();save(false)});$('#dictationCue')?.addEventListener('click',()=>{dictationMode=!dictationMode;if(dictationMode){showOriginal=false;showCn=false;showAnalysis=false}else{showOriginal=true;showCn=true;showAnalysis=true}buildIntensive();save(false)});$('#originalCue')?.addEventListener('click',()=>{showOriginal=!showOriginal;buildIntensive();save(false)})}
function playCue(i){let lines=studyLines();if(!lines.length)return;currentCue=Math.max(0,Math.min(i,lines.length-1));let r=cueRange(lines[currentCue]);audio.currentTime=r.start||0;if(slowCue)audio.playbackRate=.8;audio.play();setActiveCue(currentCue);save(false)}
function setActiveCue(i){$$('.study-cue').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.idx)===i));let active=$(`.study-cue[data-idx="${i}"]`);active?.scrollIntoView({block:'nearest'})}
function maintainCueLoop(){if(currentCue<0||!loopCue)return;let line=studyLines()[currentCue],r=cueRange(line);if(r.end&&audio.currentTime>=r.end-.05){audio.currentTime=r.start||0;audio.play()}}
function showToast(msg='Progress saved!'){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1400)}
function collectAnswers(){let answers={text:{},single:{},multiple:{},matching:{},map:{}};$$('#content input[name^="q"]').forEach(i=>answers.text[i.name]=i.value);$$('.single-choice.selected').forEach(c=>answers.single[c.dataset.name]=c.dataset.value);$$('.map-choice.selected').forEach(c=>answers.map[c.dataset.name]=c.dataset.value);let names=[...new Set($$('.multi-choice').map(c=>c.dataset.name))];names.forEach(name=>answers.multiple[name]=$$(`.multi-choice[data-name="${name}"].selected`).map(c=>c.dataset.value));$$('.slot').forEach(s=>{let tag=s.querySelector('.tag');if(tag)answers.matching[s.dataset.q]=tag.dataset.value});return answers}
function restoreAnswers(a={}){hardResetAnswers();Object.entries(a.text||{}).forEach(([name,val])=>{let el=$(`input[name="${name}"]`);if(el)el.value=val});Object.entries(a.single||{}).forEach(([name,val])=>{let el=$(`.single-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.map||{}).forEach(([name,val])=>{let el=$(`.map-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.multiple||{}).forEach(([name,vals])=>(vals||[]).forEach(val=>{let el=$(`.multi-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')}));Object.entries(a.matching||{}).forEach(([qid,val])=>{let opt=$(`.drag[data-value="${val}"]`),slot=$(`.slot[data-q="${qid}"]`);if(opt&&slot)slot.innerHTML=`<span class="tag" draggable="true" data-value="${val}">${esc(opt.textContent)}</span>`});refreshPool();restoreDragging();updateNav()}
function contentSnapshot(){let clone=$('#content').cloneNode(true);clone.querySelectorAll('.review').forEach(r=>r.remove());clone.querySelectorAll('input').forEach(i=>{i.setAttribute('value',i.value);i.removeAttribute('disabled')});clone.querySelectorAll('.choice').forEach(c=>c.classList.remove('disabled'));return clone.innerHTML}
function notesSnapshot(){$$('#notesList textarea').forEach(t=>{t.textContent=t.value;t.setAttribute('data-value',t.value)});return $('#notesList').innerHTML}
function layoutSignature(){return JSON.stringify([RENDER_VERSION,(DATA.groups||[]).map(g=>[g.type,g.layout||'',g.id||'',g.title||'',(g.questions||[]).map(q=>String(q.id||q[0]||''))])])}
function save(show=false){let data={secs,answers:collectAnswers(),contentHtml:contentSnapshot(),layoutSignature:layoutSignature(),notes:notesSnapshot(),dark:document.body.classList.contains('dark'),font:document.documentElement.style.fontSize,dictationAnswers,studyState:{currentCue,loopCue,slowCue,showCn,showAnalysis,dictationMode,showOriginal},audioTime:audio?.currentTime||0};localStorage.setItem(storeKey,JSON.stringify(data));if(show)showToast()}
function load(){let raw=localStorage.getItem(storeKey);if(!raw)return;let d;try{d=JSON.parse(raw)}catch(err){console.warn('Saved progress could not be read.',err);return}secs=d.secs||0;if(d.contentHtml&&d.layoutSignature===layoutSignature()){try{$('#content').innerHTML=d.contentHtml;bindDynamic()}catch(err){console.warn('Saved question view could not be restored.',err)}}if(d.answers){try{restoreAnswers(d.answers)}catch(err){console.warn('Saved answers could not be restored.',err)}}if(d.dictationAnswers)dictationAnswers=d.dictationAnswers;if(d.studyState)try{({currentCue=currentCue,loopCue=loopCue,slowCue=slowCue,showCn=showCn,showAnalysis=showAnalysis,dictationMode=dictationMode,showOriginal=showOriginal}=d.studyState)}catch(err){console.warn('Study state could not be restored.',err)}if(d.notes){try{$('#notesList').innerHTML=d.notes;$$('#notesList textarea').forEach(t=>{t.value=t.dataset.value||t.textContent||''})}catch(err){console.warn('Saved notes could not be restored.',err)}}if(d.dark)document.body.classList.add('dark');setFontSize(d.font||DEFAULT_FONT_SIZE,false);if(d.audioTime)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=d.audioTime},{once:true});bindNoteDeletes();drawTimer()}
function handleSelection(e){if(e.target.closest('#selbar,#notes,.bottom-bar'))return;let sel=window.getSelection();let hl=e.target.closest?.('.hl-brown,.hl-rose,.hl-blue');let bar=$('#selbar');if(hl&&sel.isCollapsed){bar.targetElem=hl;placeBar(bar,hl.getBoundingClientRect())}else if(sel&&!sel.isCollapsed&&$('#content').contains(sel.anchorNode)){bar.targetElem=null;placeBar(bar,sel.getRangeAt(0).getBoundingClientRect())}else{bar.hidden=true}}
function placeBar(bar,rect){bar.hidden=false;bar.style.left=Math.max(8,window.scrollX+rect.left+rect.width/2-95)+'px';bar.style.top=Math.max(8,window.scrollY+rect.top-46)+'px'}
function highlightedFromSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let node=sel.anchorNode?.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode;return node?.closest?.('.hl-brown,.hl-rose,.hl-blue')||null}
function handleToolbar(e){let act=e.target.closest('button')?.dataset.act;if(!act)return;let bar=$('#selbar'),target=bar.targetElem||highlightedFromSelection(),sel=window.getSelection();if(act==='del'&&target){unwrap(target);removeNote(target.dataset.hid)}else if(act==='hl'){if(target){if(target.classList.contains('hl-brown'))target.className='hl-rose';else if(target.classList.contains('hl-rose'))target.className='hl-rose';else target.className='hl-brown'}else{let span=wrapSelection('hl-brown');if(span)span.dataset.hid='h_'+Date.now()}}else if(act==='note'){let span=target||wrapSelection('hl-blue');if(span){span.className='hl-blue';if(!span.dataset.hid)span.dataset.hid='n_'+Date.now();createNote(span);document.body.classList.add('notes-open')}}bar.hidden=true;sel.removeAllRanges();save(false)}
function wrapSelection(cls){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let range=sel.getRangeAt(0);if(!$('#content').contains(range.commonAncestorContainer))return null;let span=document.createElement('span');span.className=cls;try{range.surroundContents(span)}catch{return null}return span}
function unwrap(el){let p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize()}
function clearUserHighlights(){$$('.hl-brown,.hl-rose,.hl-blue').forEach(unwrap)}
function createNote(span){let id=span.dataset.hid;if($(`.note-card[data-hid="${id}"]`))return;let card=document.createElement('div');card.className='note-card';card.dataset.hid=id;card.innerHTML=`<div class="note-quote">${esc(span.textContent.slice(0,120))}</div><textarea placeholder="Write note here..."></textarea><button class="delete-note" type="button">Delete</button>`;$('#notesList').prepend(card);bindNoteDeletes()}
function bindNoteDeletes(){$$('#notesList textarea').forEach(t=>t.oninput=()=>save(false));$$('.delete-note').forEach(btn=>btn.onclick=()=>{let card=btn.closest('.note-card'),id=card.dataset.hid,span=$(`[data-hid="${id}"]`);if(span)unwrap(span);card.remove();save(false)})}
function removeNote(id){if(!id)return;$(`.note-card[data-hid="${id}"]`)?.remove()}
function drawTimer(){let m=Math.floor(secs/60),s=secs%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
const DEFAULT_FONT_SIZE=16,MIN_FONT_SIZE=14,MAX_FONT_SIZE=22;
function currentFontSize(){return Number.parseInt(document.documentElement.style.fontSize,10)||DEFAULT_FONT_SIZE}
function setFontSize(size,persist=true){let n=Math.max(MIN_FONT_SIZE,Math.min(MAX_FONT_SIZE,Number(size)||DEFAULT_FONT_SIZE));document.documentElement.style.fontSize=n===DEFAULT_FONT_SIZE?'':n+'px';updateSizeButtons();if(persist)save(false)}
function adjustFontSize(delta){setFontSize(currentFontSize()+delta,true)}
function updateSizeButtons(){let size=currentFontSize(),dark=document.body.classList.contains('dark');$('#fontMinus')?.toggleAttribute('disabled',size<=MIN_FONT_SIZE);$('#fontPlus')?.toggleAttribute('disabled',size>=MAX_FONT_SIZE);$('#fontDefault')?.classList.toggle('active',size===DEFAULT_FONT_SIZE);$('#lightBtn')?.classList.toggle('active',!dark);$('#darkBtn')?.classList.toggle('active',dark)}
function resetAppearance(persist=true){document.body.classList.remove('dark');setFontSize(DEFAULT_FONT_SIZE,false);updateSizeButtons();if(persist)save(false)}
function clearAllProgress(){localStorage.removeItem(storeKey)}
$('#finish').onclick=finish;$('#save').onclick=()=>save(true);$('#clear').onclick=()=>{if(confirm('Clear all progress?')){window.resetTest();showToast('Clear complete')}};$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-open');save(false)};$('#closeNotes').onclick=()=>{document.body.classList.remove('notes-open');save(false)};$('#toggleIntensive').onclick=()=>{toggleIntensive();save(false)};$('#settingsBtn').onclick=()=>{$('#settings').classList.toggle('open');updateSizeButtons()};$('#lightBtn').onclick=()=>{document.body.classList.remove('dark');updateSizeButtons();save(false)};$('#darkBtn').onclick=()=>{document.body.classList.add('dark');updateSizeButtons();save(false)};$('#appearanceReset').onclick=()=>resetAppearance(true);$('#fontMinus').onclick=()=>adjustFontSize(-1);$('#fontPlus').onclick=()=>adjustFontSize(1);$('#fontDefault').onclick=()=>setFontSize(DEFAULT_FONT_SIZE,true);$('#settings').addEventListener('wheel',e=>{e.preventDefault();adjustFontSize(e.deltaY>0?-1:1)},{passive:false});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey)return;let key=e.key;if(key==='+'||key==='='){e.preventDefault();adjustFontSize(1)}else if(key==='-'||key==='_'){e.preventDefault();adjustFontSize(-1)}else if(key==='0'){e.preventDefault();resetAppearance(true)}});
const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
</script>
