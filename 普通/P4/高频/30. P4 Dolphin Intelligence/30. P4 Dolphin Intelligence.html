{"text":{"q31":"nets","q32":"smile","q33":"rats","q34":"aware","q35":"instinctive","q36":"walking","q37":"newspaper","q38":"social","q39":"whistle","q40":"fight"},"single":{},"multiple":{},"multipleMap":{},"matching":{},"map":{}},"transcriptLines":[{"time":"00:00:00,000 --> 00:00:18,280","html":"You will hear part of a biology lecture about dolphins and have views divide over their","cn":"您将听到一段关于海豚的生物学讲座，其中关于海豚的观点分歧在于它们的","analysis":""},{"time":"00:00:18,280 --> 00:00:25,280","html":"level of intelligence. First, you have some time to look at questions 31 to 40.","cn":"智力水平。首先，您有时间查看问题31至40。","analysis":""},{"time":"00:00:48,280 --> 00:01:18,120","html":"Now listen carefully and answer questions","cn":"现在请仔细聆听并回答问题","analysis":""},{"time":"00:01:18,120 --> 00:01:23,120","html":"31 to 40.","cn":"31至40。","analysis":""},{"time":"00:01:48,120 --> 00:01:55,120","html":"And certain species, like bottlenose dolphins, have brains even bigger than humans. However,","cn":"某些物种，例如宽吻海豚，它们的大脑甚至比人类的还要大。然而，","analysis":""},{"time":"00:01:55,120 --> 00:02:02,120","html":"some current tests suggest that they do not possess the same cognitive abilities as humans,","cn":"一些当前的测试表明，尽管它们的大脑尺寸与人类相似，但它们不具备与人类相同的认知能力，","analysis":""},{"time":"00:02:02,120 --> 00:02:09,120","html":"despite having a similar brain size. For instance, dolphins are often trapped in gill <mark style=\"background-color: #bbf7d0;\">nets<\/mark>,","cn":"尽管大脑尺寸相似。例如，海豚经常被困在刺网中，","analysis":"<strong>答案解析：<\/strong>问题31询问海豚无法逃脱的渔网屏障。原文提到“dolphins are often trapped in gill nets”，其中“nets”是正确的答案。"},{"time":"00:02:09,120 --> 00:02:16,120","html":"originally intended for <mark style=\"background-color: #fecaca;\">tunifying<\/mark>. These entanglement cases have led to unnecessary injury","cn":"这些刺网最初是用于捕捞金枪鱼的。这些缠绕事件导致了不必要的伤害","analysis":"<strong>答案解析：<\/strong>原文提到渔网是“intended for tunifying”（用于捕捞金枪鱼），“tunifying”描述了渔网的目的，但并非渔网的类型，因此是干扰项。"},{"time":"00:02:16,120 --> 00:02:23,120","html":"or deaths of dolphins, gradually depleting their numbers. Clearly, dolphins don't realize","cn":"或海豚死亡，逐渐减少了它们的数量。显然，海豚没有意识到","analysis":""},{"time":"00:02:23,120 --> 00:02:29,120","html":"that they could just jump over these vertical <mark style=\"background-color: #fecaca;\">barriers<\/mark> and swim to safety.","cn":"它们可以跳过这些垂直的障碍物游到安全的地方。","analysis":"<strong>答案解析：<\/strong>问题31询问海豚无法逃脱的“fishing _______ for catching tuna”类型的屏障。原文提及“jump over these vertical barriers”，但“barriers”是问题中已给出的更广义的词，并非需要填写的具体屏障类型，因此是干扰项。"},{"time":"00:02:29,120 --> 00:02:36,120","html":"People often mistakenly view dolphins' eternal <mark style=\"background-color: #bbf7d0;\">smile<\/mark> as signs of intelligence and joy.","cn":"人们常错误地将海豚永恒的微笑视为智慧和快乐的标志。","analysis":"<strong>答案解析：<\/strong>问题32询问人们错误地认为海豚聪明快乐的原因，因为它们经常有“a _______”。原文“People often mistakenly view dolphins' eternal smile as signs of intelligence and joy”指出“smile”是人们误解的原因，因此“smile”是正确答案。"},{"time":"00:02:36,120 --> 00:02:42,120","html":"Actually, this is not a facial <mark style=\"background-color: #fecaca;\">expression<\/mark> at all, but a fixed design of their head.","cn":"实际上，这根本不是面部表情，而是它们头部的一种固定形态。","analysis":"<strong>答案解析：<\/strong>原文紧接着解释说“this is not a facial expression at all”，澄清了海豚的“微笑”并非真正的“expression”，因此“expression”在这里是与正确答案“smile”相对的干扰项。"},{"time":"00:02:42,120 --> 00:02:49,120","html":"Unlike human beings with greater than 40 facial muscles, dolphins have no such powers","cn":"与拥有40多块面部肌肉的人类不同，海豚没有这样的能力","analysis":""},{"time":"00:02:49,120 --> 00:02:56,120","html":"with which to form an expression. On the other hand, small-brained animals are sometimes","cn":"来形成表情。另一方面，小脑动物有时会","analysis":""},{"time":"00:02:56,120 --> 00:03:04,120","html":"underrated for their level of intelligence. <mark style=\"background-color: #bbf7d0;\">Pigeons<\/mark> and <mark style=\"background-color: #bbf7d0;\">rats<\/mark> are typical examples of small-brained animals","cn":"它们的智力水平被低估。鸽子和老鼠是小脑动物的典型例子","analysis":"<strong>答案解析：<\/strong>问题33询问能执行复杂任务的小脑动物，例如鸽子和什么动物。原文“Pigeons and rats are typical examples of small-brained animals”直接给出了答案“rats”。"},{"time":"00:03:04,120 --> 00:03:10,120","html":"which can perform tasks so complex that most humans would have trouble with them.","cn":"它们可以完成人类都难以完成的复杂任务。","analysis":""},{"time":"00:03:10,120 --> 00:03:15,120","html":"Over the last few decades, scientists have conducted countless studies","cn":"在过去的几十年里，科学家们进行了无数次研究","analysis":""},{"time":"00:03:15,120 --> 00:03:21,120","html":"on the cognitive abilities of these overlooked animals with quite surprising results.","cn":"这些被忽视的动物的认知能力，结果相当令人惊讶。","analysis":""},{"time":"00:03:21,120 --> 00:03:26,120","html":"Pigeons are <mark style=\"background-color: #bbf7d0;\">aware<\/mark> of their bodies when they see their reflections in the mirror.","cn":"鸽子在镜子中看到自己的倒影时，会意识到自己的身体。","analysis":"<strong>答案解析：<\/strong>问题34询问鸽子对自身状态的认知。原文“Pigeons are aware of their bodies when they see their reflections in the mirror”指出“aware”是正确答案。"},{"time":"00:03:26,120 --> 00:03:33,120","html":"Pigeons are also trained under specific conditions and gradually form <mark style=\"background-color: #bbf7d0;\">instinctive<\/mark> reactions.","cn":"鸽子还在特定条件下接受训练，并逐渐形成本能反应。","analysis":"<strong>答案解析：<\/strong>问题35询问鸽子被训练后形成的反应类型。原文“Pigeons are also trained under specific conditions and gradually form instinctive reactions”指出“instinctive”是正确答案。"},{"time":"00:03:34,120 --> 00:03:42,120","html":"In an experiment in 2009, a group of 12 pigeons was given a reward like food and water","cn":"在2009年的一项实验中，一组12只鸽子每次啄击笔记本电脑上的一个按键，就会得到食物和水等奖励。","analysis":""},{"time":"00:03:42,120 --> 00:03:48,120","html":"every time they pecked a key on a laptop. All birds successfully performed the trick.","cn":"所有鸟类都成功完成了这个技巧。","analysis":""},{"time":"00:03:48,120 --> 00:03:56,120","html":"These test results indicate that brain size is probably not the sole factor in determining intelligence.","cn":"这些测试结果表明，大脑尺寸可能不是决定智力的唯一因素。","analysis":""},{"time":"00:03:57,120 --> 00:04:04,120","html":"Another argument steers the attention to the correlation between intelligence and the constituents of brains","cn":"另一个论点将注意力转向智力与大脑组成部分之间的关联","analysis":""},{"time":"00:04:04,120 --> 00:04:11,120","html":"rather than their sheer sizes. It's been found that dolphin brains are comprised chiefly of fatty cells","cn":"而非其单纯的大小。研究发现，海豚的大脑主要由脂肪细胞组成","analysis":""},{"time":"00:04:11,120 --> 00:04:18,120","html":"which serve as a protective barrier between the systemic blood and the extra cellular environment","cn":"这些脂肪细胞在全身血液和中枢神经系统的细胞外环境之间起到保护屏障的作用","analysis":""},{"time":"00:04:18,120 --> 00:04:24,120","html":"of the central nervous system. They are also essential components of nerve cell membranes","cn":"它们也是神经细胞膜的重要组成部分","analysis":""},{"time":"00:04:24,120 --> 00:04:27,120","html":"affecting problem-solving skills performance.","cn":"影响解决问题的能力表现。","analysis":""},{"time":"00:04:32,120 --> 00:04:37,120","html":"Now, the second mainstream view is that dolphins are highly intelligent.","cn":"现在，第二个主流观点是海豚具有高度智慧。","analysis":""},{"time":"00:04:37,120 --> 00:04:42,120","html":"Research into the behavior of dolphins in the wild and in captivity","cn":"对野生和圈养海豚行为的研究","analysis":""},{"time":"00:04:42,120 --> 00:04:47,120","html":"has yielded incredible data on the intelligence of these marine mammals.","cn":"为这些海洋哺乳动物的智力提供了令人难以置信的数据。","analysis":""},{"time":"00:04:47,120 --> 00:04:53,120","html":"Studies show that dolphins not only have the ability to learn as individuals","cn":"研究表明，海豚不仅能作为个体学习","analysis":""},{"time":"00:04:53,120 --> 00:04:59,120","html":"but those individuals can then pass their new knowledge on to others.","cn":"而且这些个体还能将新知识传授给其他海豚。","analysis":""},{"time":"00:04:59,120 --> 00:05:05,120","html":"Let's take a look at some typical examples. Among these are tested with Billy,","cn":"我们来看一些典型例子。其中包括对比利（Billy）的测试，","analysis":""},{"time":"00:05:05,120 --> 00:05:12,120","html":"a dolphin trapped in a sea lock and rescued. Billy spent three weeks in rehabilitation","cn":"一只被困在海闸中并被救出的海豚。比利在康复中心度过了三周","analysis":""},{"time":"00:05:12,120 --> 00:05:19,120","html":"and was released back into the wild. There, researchers noticed that Billy had started <mark style=\"background-color: #fecaca;\">tailwalking<\/mark>","cn":"并被放归野外。在那里，研究人员注意到比利开始用尾巴“走路”了","analysis":"<strong>答案解析：<\/strong>问题36询问比利模仿饲养员的什么“技能”（through other dolphins）。原文提到“Billy had started tailwalking”，这是比利学会的技能。但问题问的是“keepers' _______”，即饲养员的什么动作被模仿。饲养员本身不会“tailwalk”（尾巴走路），而是“walk”（走路）。因此，“tailwalking”是干扰项，因为它是海豚模仿后表现出的技能，而不是饲养员本身的行为。"},{"time":"00:05:19,120 --> 00:05:25,120","html":"a skill only mastered by captive dolphins who imitated the keepers. <mark style=\"background-color: #bbf7d0;\">walking<\/mark>","cn":"这是一种只有模仿饲养员的圈养海豚才能掌握的技能。","analysis":"<strong>答案解析：<\/strong>问题36询问比利通过其他海豚模仿饲养员的什么技能。原文提到“a skill only mastered by captive dolphins who imitated the keepers”，紧接着提到比利开始“tailwalking”。虽然海豚学会的是“tailwalking”（尾巴走路），但这是对饲养员“walking”（走路）这一动作的模仿和转化。考虑到“ONE WORD ONLY”的限制，且问题指向“keepers’”，因此“walking”是正确答案。"},{"time":"00:05:25,120 --> 00:05:34,120","html":"Billy had not been trained to tailwalk but had learned the skills simply by observing other dolphins in the rehab centre.","cn":"比利并未被训练尾巴走路，而是通过观察康复中心的其他海豚学会了这项技能。","analysis":""},{"time":"00:05:34,120 --> 00:05:39,120","html":"Another study involves a female dolphin named Karen.","cn":"另一项研究涉及一只名叫凯伦的雌性海豚。","analysis":""},{"time":"00:05:39,120 --> 00:05:45,120","html":"Karen was given a test in which she was rewarded with a fish for every piece of <mark style=\"background-color: #fecaca;\">litter<\/mark>","cn":"凯伦接受了一项测试，每当她带来一块垃圾，就会得到一条鱼作为奖励","analysis":"<strong>答案解析：<\/strong>问题37询问凯伦藏匿什么以获得更多食物。原文提到“rewarded with a fish for every piece of litter”，其中“litter”是垃圾的通用词，但凯伦具体藏匿的是“newspaper”，因此“litter”是一个广义的干扰项。"},{"time":"00:05:45,120 --> 00:05:52,120","html":"she brought to researchers to maximise its bounty. She quickly learnt to take a <mark style=\"background-color: #bbf7d0;\">newspaper<\/mark>","cn":"她带给研究人员以最大化奖励。她很快学会了拿一份报纸","analysis":"<strong>答案解析：<\/strong>问题37询问凯伦藏匿什么以获得更多食物。原文“She quickly learnt to take a newspaper keep it at the bottom of a tank and tear off smaller pieces to get more fish”明确指出凯伦藏匿的是“newspaper”，这是正确答案。"},{"time":"00:05:52,120 --> 00:05:58,120","html":"keep it at the bottom of a tank and tear off smaller pieces to get more fish.","cn":"把它放在水箱底部，撕成小块以获得更多的鱼。","analysis":""},{"time":"00:05:58,120 --> 00:06:06,120","html":"Over the past hundred years, researchers have proven that dolphins are extremely <mark style=\"background-color: #bbf7d0;\">social<\/mark> species","cn":"在过去的一百年里，研究人员已经证明海豚是极度社会化的物种","analysis":"<strong>答案解析：<\/strong>问题38询问在一个世纪以来，海豚被视为是哪种动物。原文“Over the past hundred years, researchers have proven that dolphins are extremely social species”明确指出“social”是正确答案。"},{"time":"06:06:06,000 --> 06:10:00,000","html":"and have evolved to have highly developed brains.","cn":"并且已经进化出高度发达的大脑。","analysis":""},{"time":"06:10:00,000 --> 06:19:00,000","html":"These factors are the most significant contributors to their intelligence and become the means of survival for dolphins.","cn":"这些因素是它们智力的最重要贡献者，并成为海豚的生存手段。","analysis":""},{"time":"06:19:00,000 --> 06:25:00,000","html":"In 2008, researchers tracked a group of around 400 dolphins.","cn":"2008年，研究人员追踪了一个约400只海豚的群体。","analysis":""},{"time":"06:25:00,000 --> 06:32:00,000","html":"One female dolphin in the group was having a lot of trouble swimming and kept flipping upside down","cn":"群体中有一只雌性海豚游泳非常吃力，总是翻来覆去","analysis":""},{"time":"06:32:00,000 --> 06:37:00,000","html":"or sinking into the water. The other dolphins crowded around it.","cn":"或沉入水中。其他海豚围拢过来。","analysis":""},{"time":"06:37:00,000 --> 06:42:00,000","html":"They paddled side by side with the injured female on their backs.","cn":"它们背着受伤的雌性海豚，并排划水。","analysis":""},{"time":"06:42:00,000 --> 06:49:00,000","html":"By keeping the wounded female above water, they may have helped it to breathe avoiding drowning.","cn":"通过让受伤的雌性海豚保持在水面上，它们可能帮助它呼吸，避免溺水。","analysis":""},{"time":"06:49:00,000 --> 06:53:00,000","html":"So how do they communicate with each other?","cn":"那么它们是如何相互交流的呢？","analysis":""},{"time":"06:53:00,000 --> 07:01:00,000","html":"Well, scientists have discovered through observation and meticulous testing that every dolphin has a different <mark style=\"background-color: #fecaca;\">sound<\/mark>","cn":"科学家们通过观察和细致的测试发现，每只海豚都有不同的声音","analysis":"<strong>答案解析：<\/strong>问题39询问每只海豚产生独特的什么声音，像什么一样。原文提到“every dolphin has a different sound”，但此处“sound”是更广义的词，而非问题所求的具体像什么一样。因此“sound”是干扰项。"},{"time":"07:01:00,000 --> 07:06:00,000","html":"resembling the <mark style=\"background-color: #bbf7d0;\">whistle<\/mark> that other dolphins recognise as a particular individual.","cn":"类似于其他海豚能识别为特定个体的哨声。","analysis":"<strong>答案解析：<\/strong>问题39询问每只海豚产生独特的什么声音，像什么一样。原文“every dolphin has a different sound resembling the whistle that other dolphins recognise as a particular individual”指出“whistle”是正确答案。"},{"time":"07:06:00,000 --> 07:16:00,000","html":"Dolphins can emit a wide variety of sounds. The frequency levels range ten times beyond what humans can hear.","cn":"海豚可以发出各种各样的声音。其频率范围是人类能听到的十倍以上。","analysis":""},{"time":"07:16:00,000 --> 07:22:00,000","html":"But of course, there are other means of communication for dolphins besides sound.","cn":"当然，除了声音，海豚还有其他交流方式。","analysis":""},{"time":"07:22:00,000 --> 07:32:00,000","html":"During mating season, male dolphins stroke females with flippers after a <mark style=\"background-color: #bbf7d0;\">fight<\/mark> to affirm social bonds.","cn":"在繁殖季节，雄性海豚在打架后会用鳍状肢轻抚雌性海豚，以确认社会联系。","analysis":"<strong>答案解析：<\/strong>问题40询问海豚在什么之后会通过触摸彼此来和解。原文“male dolphins stroke females with flippers after a fight to affirm social bonds”明确指出是“after a fight”，因此“fight”是正确答案。"},{"time":"07:32:00,000 --> 07:39:00,000","html":"That is the end of part four. You now have one minute to check your answers to part four.","cn":"第四部分到此结束。您现在有一分钟时间检查第四部分的答案。","analysis":""}],"transcriptHighlights":[{"qid":"31","text":"nets","answer":"nets"},{"qid":"32","text":"smile","answer":"smile"},{"qid":"33","text":"rats","answer":"rats"},{"qid":"34","text":"aware","answer":"aware"},{"qid":"35","text":"instinctive","answer":"instinctive"},{"qid":"36","text":"walking","answer":"walking"},{"qid":"37","text":"newspaper","answer":"newspaper"},{"qid":"38","text":"social","answer":"social"},{"qid":"39","text":"whistle","answer":"whistle"},{"qid":"40","text":"fight","answer":"fight"}],"ownerInfo":"此内容由🍠@Listening 永不虾滑整理，仅作为分享供个人使用；禁止商用、倒卖和引流。有问题请先仔细看🍠这个账号的置顶和分享贴。没有团队，不是机构，纯个人分享。督学和其他相关课程请咨询主页另一个号@心情有点虾滑（不回任何机经相关消息）。"}</script>

function groupHTML(g){if(g.type==='matching'&&g.layout==='flow')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="flow-layout"><div class="flow-steps">${g.questions.map((q,idx)=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>${idx<g.questions.length-1?'<div class="flow-arrow">↓</div>':''}`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='matching')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;

if(g.type==='single')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div>${g.questions.map(q=>`<p><strong>${q.id}</strong> ${esc(q.text)}</p>${q.options.map(o=>`<div class="choice single-choice" data-name="q${q.id}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}`).join('')}</section>`;

function bindStudyControls(){let panel=$('#transcript');panel.querySelectorAll('.study-cue').forEach(btn=>btn.onclick=e=>{if(e.target.closest('.dictation-box'))return;playCue(Number(btn.dataset.idx))});panel.querySelectorAll('.dictation-box').forEach(box=>{box.oninput=()=>{dictationAnswers[box.dataset.idx]=box.value;save(false)}});$('#prevCue')?.addEventListener('click',()=>playCue(Math.max(0,(currentCue<0?0:currentCue-1))));$('#nextCue')?.addEventListener('click',()=>playCue(Math.min(studyLines().length-1,(currentCue<0?0:currentCue+1))));$('#playCue')?.addEventListener('click',()=>audio.paused?audio.play():audio.pause());$('#loopCue')?.addEventListener('click',()=>{loopCue=!loopCue;buildIntensive();save(false)});$('#slowCue')?.addEventListener('click',()=>{slowCue=!slowCue;audio.playbackRate=slowCue ? 0.8 : +$('#speed').value;buildIntensive();save(false)});$('#cnCue')?.addEventListener('click',()=>{showCn=!showCn;buildIntensive();save(false)});$('#analysisCue')?.addEventListener('click',()=>{showAnalysis=!showAnalysis;buildIntensive();save(false)});$('#dictationCue')?.addEventListener('click',()=>{dictationMode=!dictationMode;if(dictationMode){showOriginal=false;showCn=false;showAnalysis=false}else{showOriginal=true;showCn=true;showAnalysis=true}buildIntensive();save(false)});$('#originalCue')?.addEventListener('click',()=>{showOriginal=!showOriginal;buildIntensive();save(false)})}
function playCue(i){let lines=studyLines();if(!lines.length)return;currentCue=Math.max(0,Math.min(i,lines.length-1));let r=cueRange(lines[currentCue]);audio.currentTime=r.start||0;if(slowCue)audio.playbackRate=.8;audio.play();setActiveCue(currentCue);save(false)}
function setActiveCue(i){$$('.study-cue').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.idx)===i));let active=$(`.study-cue[data-idx="${i}"]`);active?.scrollIntoView({block:'nearest'})}
function maintainCueLoop(){if(currentCue<0||!loopCue)return;let line=studyLines()[currentCue],r=cueRange(line);if(r.end&&audio.currentTime>=r.end-.05){audio.currentTime=r.start||0;audio.play()}}
function showToast(msg='Progress saved!'){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1400)}
function collectAnswers(){let answers={text:{},single:{},multiple:{},matching:{},map:{}};$$('#content input[name^="q"]').forEach(i=>answers.text[i.name]=i.value);$$('.single-choice.selected').forEach(c=>answers.single[c.dataset.name]=c.dataset.value);$$('.map-choice.selected').forEach(c=>answers.map[c.dataset.name]=c.dataset.value);let names=[...new Set($$('.multi-choice').map(c=>c.dataset.name))];names.forEach(name=>answers.multiple[name]=$$(`.multi-choice[data-name="${name}"].selected`).map(c=>c.dataset.value));$$('.slot').forEach(s=>{let tag=s.querySelector('.tag');if(tag)answers.matching[s.dataset.q]=tag.dataset.value});return answers}
function restoreAnswers(a={}){hardResetAnswers();Object.entries(a.text||{}).forEach(([name,val])=>{let el=$(`input[name="${name}"]`);if(el)el.value=val});Object.entries(a.single||{}).forEach(([name,val])=>{let el=$(`.single-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.map||{}).forEach(([name,val])=>{let el=$(`.map-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.multiple||{}).forEach(([name,vals])=>(vals||[]).forEach(val=>{let el=$(`.multi-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')}));Object.entries(a.matching||{}).forEach(([qid,val])=>{let opt=$(`.drag[data-value="${val}"]`),slot=$(`.slot[data-q="${qid}"]`);if(opt&&slot)slot.innerHTML=`<span class="tag" draggable="true" data-value="${val}">${esc(opt.textContent)}</span>`});refreshPool();restoreDragging();updateNav()}
function contentSnapshot(){let clone=$('#content').cloneNode(true);clone.querySelectorAll('.review').forEach(r=>r.remove());clone.querySelectorAll('input').forEach(i=>{i.setAttribute('value',i.value);i.removeAttribute('disabled')});clone.querySelectorAll('.choice').forEach(c=>c.classList.remove('disabled'));return clone.innerHTML}
function notesSnapshot(){$$('#notesList textarea').forEach(t=>{t.textContent=t.value;t.setAttribute('data-value',t.value)});return $('#notesList').innerHTML}
function layoutSignature(){return JSON.stringify((DATA.groups||[]).map(g=>[g.type,g.layout||'',g.id||'',g.title||'',(g.questions||[]).map(q=>String(q.id||q[0]||''))]))}
function save(show=false){let data={secs,answers:collectAnswers(),contentHtml:contentSnapshot(),layoutSignature:layoutSignature(),notes:notesSnapshot(),dark:document.body.classList.contains('dark'),font:document.documentElement.style.fontSize,dictationAnswers,studyState:{currentCue,loopCue,slowCue,showCn,showAnalysis,dictationMode,showOriginal},audioTime:audio?.currentTime||0};localStorage.setItem(storeKey,JSON.stringify(data));if(show)showToast()}
function load(){let raw=localStorage.getItem(storeKey);if(!raw)return;let d;try{d=JSON.parse(raw)}catch(err){console.warn('Saved progress could not be read.',err);return}secs=d.secs||0;if(d.contentHtml&&d.layoutSignature===layoutSignature()){try{$('#content').innerHTML=d.contentHtml;bindDynamic()}catch(err){console.warn('Saved question view could not be restored.',err)}}if(d.answers){try{restoreAnswers(d.answers)}catch(err){console.warn('Saved answers could not be restored.',err)}}if(d.dictationAnswers)dictationAnswers=d.dictationAnswers;if(d.studyState)try{({currentCue=currentCue,loopCue=loopCue,slowCue=slowCue,showCn=showCn,showAnalysis=showAnalysis,dictationMode=dictationMode,showOriginal=showOriginal}=d.studyState)}catch(err){console.warn('Study state could not be restored.',err)}if(d.notes){try{$('#notesList').innerHTML=d.notes;$$('#notesList textarea').forEach(t=>{t.value=t.dataset.value||t.textContent||''})}catch(err){console.warn('Saved notes could not be restored.',err)}}if(d.dark)document.body.classList.add('dark');setFontSize(d.font||DEFAULT_FONT_SIZE,false);if(d.audioTime)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=d.audioTime},{once:true});bindNoteDeletes();drawTimer()}
function handleSelection(e){if(e.target.closest('#selbar,#notes,.bottom-bar'))return;let sel=window.getSelection();let hl=e.target.closest?.('.hl-brown,.hl-rose,.hl-blue');let bar=$('#selbar');if(hl&&sel.isCollapsed){bar.targetElem=hl;placeBar(bar,hl.getBoundingClientRect())}else if(sel&&!sel.isCollapsed&&$('#content').contains(sel.anchorNode)){bar.targetElem=null;placeBar(bar,sel.getRangeAt(0).getBoundingClientRect())}else{bar.hidden=true}}
function placeBar(bar,rect){bar.hidden=false;bar.style.left=Math.max(8,window.scrollX+rect.left+rect.width/2-95)+'px';bar.style.top=Math.max(8,window.scrollY+rect.top-46)+'px'}
function highlightedFromSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let node=sel.anchorNode?.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode;return node?.closest?.('.hl-brown,.hl-rose,.hl-blue')||null}
function handleToolbar(e){let act=e.target.closest('button')?.dataset.act;if(!act)return;let bar=$('#selbar'),target=bar.targetElem||highlightedFromSelection(),sel=window.getSelection();if(act==='del'&&target){unwrap(target);removeNote(target.dataset.hid)}else if(act==='hl'){if(target){if(target.classList.contains('hl-brown'))target.className='hl-rose';else if(target.classList.contains('hl-rose'))target.className='hl-rose';else target.className='hl-brown'}else{let span=wrapSelection('hl-brown');if(span)span.dataset.hid='h_'+Date.now()}}else if(act==='note'){let span=target||wrapSelection('hl-blue');if(span){span.className='hl-blue';if(!span.dataset.hid)span.dataset.hid='n_'+Date.now();createNote(span);document.body.classList.add('notes-open')}}bar.hidden=true;sel.removeAllRanges();save(false)}
function wrapSelection(cls){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let range=sel.getRangeAt(0);if(!$('#content').contains(range.commonAncestorContainer))return null;let span=document.createElement('span');span.className=cls;try{range.surroundContents(span)}catch{return null}return span}
function unwrap(el){let p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize()}
function clearUserHighlights(){$$('.hl-brown,.hl-rose,.hl-blue').forEach(unwrap)}
function createNote(span){let id=span.dataset.hid;if($(`.note-card[data-hid="${id}"]`))return;let card=document.createElement('div');card.className='note-card';card.dataset.hid=id;card.innerHTML=`<div class="note-quote">${esc(span.textContent.slice(0,120))}</div><textarea placeholder="Write note here..."></textarea><button class="delete-note" type="button">Delete</button>`;$('#notesList').prepend(card);bindNoteDeletes()}
function bindNoteDeletes(){$$('#notesList textarea').forEach(t=>t.oninput=()=>save(false));$$('.delete-note').forEach(btn=>btn.onclick=()=>{let card=btn.closest('.note-card'),id=card.dataset.hid,span=$(`[data-hid="${id}"]`);if(span)unwrap(span);card.remove();save(false)})}
function removeNote(id){if(!id)return;$(`.note-card[data-hid="${id}"]`)?.remove()}
function drawTimer(){let m=Math.floor(secs/60),s=secs%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
const DEFAULT_FONT_SIZE=16,MIN_FONT_SIZE=14,MAX_FONT_SIZE=22;
function currentFontSize(){return Number.parseInt(document.documentElement.style.fontSize,10)||DEFAULT_FONT_SIZE}
function setFontSize(size,persist=true){let n=Math.max(MIN_FONT_SIZE,Math.min(MAX_FONT_SIZE,Number(size)||DEFAULT_FONT_SIZE));document.documentElement.style.fontSize=n===DEFAULT_FONT_SIZE?'':n+'px';updateSizeButtons();if(persist)save(false)}
function adjustFontSize(delta){setFontSize(currentFontSize()+delta,true)}
function updateSizeButtons(){let size=currentFontSize(),dark=document.body.classList.contains('dark');$('#fontMinus')?.toggleAttribute('disabled',size<=MIN_FONT_SIZE);$('#fontPlus')?.toggleAttribute('disabled',size>=MAX_FONT_SIZE);$('#fontDefault')?.classList.toggle('active',size===DEFAULT_FONT_SIZE);$('#lightBtn')?.classList.toggle('active',!dark);$('#darkBtn')?.classList.toggle('active',dark)}
function resetAppearance(persist=true){document.body.classList.remove('dark');setFontSize(DEFAULT_FONT_SIZE,false);updateSizeButtons();if(persist)save(false)}
function clearAllProgress(){localStorage.removeItem(storeKey)}
$('#finish').onclick=finish;$('#save').onclick=()=>save(true);$('#clear').onclick=()=>{if(confirm('Clear all progress?')){window.resetTest();showToast('Clear complete')}};$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-open');save(false)};$('#closeNotes').onclick=()=>{document.body.classList.remove('notes-open');save(false)};$('#toggleIntensive').onclick=()=>{toggleIntensive();save(false)};$('#settingsBtn').onclick=()=>{$('#settings').classList.toggle('open');updateSizeButtons()};$('#lightBtn').onclick=()=>{document.body.classList.remove('dark');updateSizeButtons();save(false)};$('#darkBtn').onclick=()=>{document.body.classList.add('dark');updateSizeButtons();save(false)};$('#appearanceReset').onclick=()=>resetAppearance(true);$('#fontMinus').onclick=()=>adjustFontSize(-1);$('#fontPlus').onclick=()=>adjustFontSize(1);$('#fontDefault').onclick=()=>setFontSize(DEFAULT_FONT_SIZE,true);$('#settings').addEventListener('wheel',e=>{e.preventDefault();adjustFontSize(e.deltaY>0?-1:1)},{passive:false});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey)return;let key=e.key;if(key==='+'||key==='='){e.preventDefault();adjustFontSize(1)}else if(key==='-'||key==='_'){e.preventDefault();adjustFontSize(-1)}else if(key==='0'){e.preventDefault();resetAppearance(true)}});
const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
</script>
